name: Indonesia V2 integrity and complete offline edition

on:
  push:
    branches:
      - research/encyclopedia-v2-rebuild-20261124
    paths:
      - .github/workflows/encyclopedia-v2-build.yml
      - research/indonesia-1965/briefs/readable-history/encyclopedia-v2/**
      - research/indonesia-1965/archive/records/claim-ledger.csv
      - research/indonesia-1965/archive/records/source-register.csv
      - research/indonesia-1965/archive/records/coverage-matrix.csv

permissions:
  contents: write

concurrency:
  group: indonesia-encyclopedia-v2-full
  cancel-in-progress: false

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh canonical records and curated entity inlines
        run: |
          python3 research/indonesia-1965/briefs/readable-history/encyclopedia-v2/generate.py
          python3 research/indonesia-1965/briefs/readable-history/encyclopedia-v2/sync_curated.py
      - name: Verify generated evidence and entity graph
        run: python3 research/indonesia-1965/briefs/readable-history/encyclopedia-v2/validate_v2.py
      - name: Build exact full single-file edition
        run: |
          python3 research/indonesia-1965/briefs/readable-history/encyclopedia-v2/build_standalone.py
          python3 research/indonesia-1965/briefs/readable-history/encyclopedia-v2/build_standalone.py --check
      - name: Verify JavaScript syntax
        run: |
          node --check research/indonesia-1965/briefs/readable-history/encyclopedia-v2/app.js
          for f in research/indonesia-1965/briefs/readable-history/encyclopedia-v2/data/*.js; do node --check "$f"; done
      - name: Run Chromium offline smoke
        run: |
          python3 -m pip install --quiet playwright==1.56.0
          python3 research/indonesia-1965/briefs/readable-history/encyclopedia-v2/browser_smoke.py
      - name: Commit reproducible full edition (branch only)
        shell: bash
        run: |
          set -euo pipefail
          d="research/indonesia-1965/briefs/readable-history/encyclopedia-v2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A research commit can land while this job is auditing an earlier SHA.
          # Rebuild against the current remote HEAD, never force-push a stale HTML.
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"
            remote_sha="$(git rev-parse FETCH_HEAD)"
            local_sha="$(git rev-parse HEAD)"
            if [ "$remote_sha" != "$local_sha" ]; then
              echo "Research branch advanced; revalidate fresh checkout (attempt $attempt)"
              git reset --hard "$remote_sha"
              python3 "$d/generate.py"
              python3 "$d/sync_curated.py"
              python3 "$d/validate_v2.py"
              python3 "$d/build_standalone.py"
              python3 "$d/build_standalone.py" --check
              node --check "$d/app.js"
              for f in "$d"/data/*.js; do node --check "$f"; done
              python3 "$d/browser_smoke.py"
            fi

            git add -A -- "$d/standalone-full.html" "$d/standalone.html" "$d"/data/claims-*.js "$d/data/sources.js" "$d/data/coverage.js"
            if git diff --cached --quiet; then
              echo "Latest checked branch already has reproducible complete HTML"
              exit 0
            fi
            git commit -m "build(indonesia): refresh complete V2 offline encyclopedia"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Full HTML committed against checked source HEAD"
              exit 0
            fi
            echo "Concurrent remote update detected; discarding stale artifact and retrying"
          done
          echo "::error::Research branch continued changing; cannot safely deliver current HTML after four fully validated attempts"
          exit 1
