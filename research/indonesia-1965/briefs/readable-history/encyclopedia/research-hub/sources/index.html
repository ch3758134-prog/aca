-11-19; operative clauses and signature/date read.","href":"s1401-1600.html#S1480"},{"id":"S1481","title":"Mayor Jenderal Anumerta D.I. Panjaitan","author":"Mardanas Safwan; Directorate of History and Traditional Values, National Historical Documentation and Inventory Project, Ministry of Education and Culture","year":"1981/1982","status":"Full repository PDF opened; printed pp.59–78, the 28 Aug 1965 expanded-Politburo narrative, and its notes/bibliography were read on 2026-11-19.","href":"s1401-1600.html#S1481"},{"id":"S1482","title":"Menyibak Tirai Hitam Mahmilub","author":"Hukumonline editorial team","year":"2003-09-30","status":"Full article opened on 2026-11-19; tribunal summary table and its stated source were reviewed.","href":"s1401-1600.html#S1482"},{"id":"S1483","title":"Kebangkitan Parti Komunis Malaya (PKM), 1968–1989: Penelitian Terhadap Kegiatan Komunis di Semenanjung Malaysia [The Rise of the Communist Party of Malaya (CPM), 1968–1989]","author":"Ho Hui Ling; Jebat: Malaysian Journal of History, Politics & Strategic Studies 42(1), pp.23–56","year":"2015-07","status":"Full 34-page journal PDF opened on 2026-11-19; abstract and printed pp.23–30 on 1948–60 retreat, 1968 decision/first attack, south Thai border base, regiments, reported force estimates and China links reviewed.","href":"s1401-1600.html#S1483"},{"id":"S1484","title":"Lessons of 40 Years [D.N. Aidit speech excerpt]","author":"Dipa Nusantara Aidit; reprinted in New Age, 19 June 1960, p.12; scan hosted by Marxists Internet Archive","year":"Speech 1960-05-23; excerpt publication 1960-06-19","status":"Scanned issue opened on 2026-11-19; issue/date/page metadata and printed p.12 excerpt read, including three forms of struggle and National Front / mass-party line.","href":"s1401-1600.html#S1484"},{"id":"S1485","title":"The Resurgence of Armed Communism in West Malaysia","author":"Government of Malaysia, Department of Information; foreword by Tun Dr. Ismail Abdul Rahman, Deputy Prime Minister and t leaf, apparent reference 1181/65. ANRI gallery caption dates the speech 17 Oct 1965 and attributes it to inventory item No.817.","href":"s1401-1600.html#S1488"},{"id":"S1489","title":"Inventaris van het archief van de Nederlandse Ambassade in Indonesië, 1962–1974, item 761","author":"Nationaal Archief (Netherlands), archive 2.05.188","year":"Inventory published 2010; item describes 1965 folder","status":"Full inventory PDF opened; printed p.58/item 761 read. It describes a folder concerning KIAPMA in Jakarta, 17–21 Oct 1965.","href":"s1401-1600.html#S1489"},{"id":"S1490","title":"International Conference for Liquidation of Foreign Military Bases, Peking Review No.45","author":"Peking Review; Chinese-language foreign-affairs/party periodical","year":"1965-11-05, pp.16–18","status":"Full issue text opened; the KIAPMA report on pp.16–18 read, including dates, attendance figures, security conditions, the commercial-counsellor-office incident and descriptions of the opening.","href":"s1401-1600.html#S1490"},{"id":"S1491","title":"Eyewitness Account of Indonesian Military Take-Over","author":"Rewi Alley; transcription hosted by Marxists Internet Archive; originally The People’s Voice (New Zealand)","year":"1965-12-15","status":"Full hosted transcription read; author says he attended the KIAPMA conference in Jakarta 13–23 Oct 1965.","href":"s1401-1600.html#S1491"},{"id":"S1492","title":"Indonesian Army Illegally Inspects Chinese Embassy Personnel’s Living Quarters, Peking Review No.44","author":"Peking Review","year":"1965-10-29","status":"Full issue opened; report on alleged Oct.16 and Oct.21 incidents read.","href":"s1401-1600.html#S1492"},{"id":"S1493","title":"Peking Review No.46","author":"Peking Review","year":"1965-11-12","status":"Full issue opened; read the passages quoting the Army Strategic Reserve Command’s public statement and an Indonesian Foreign Ministry note dated Oct.30.","href":"s1401-1600.html#S1493"},{"id":"S1494","title":"The Straits Times, 19 October 1965, issue page and Reuters item “Peking warns Jakarta”","author":"The Straits Times / Reuters; NewspaperSG, National Library Board Singapore","year":"1965-10-19","status":"Issue-level metadata and visible article preview/snippet checked; Reuters item reports a Chinese protest over an alleged Indonesian troop search of the Commercial Counsellor’s Office.","href":"s1401-1600.html#S1494"},{"id":"S1495","title":"The Attempted Coup in Indonesia","author":"Arthur J. Dommen; The China Quarterly 25 (January 1966), pp.144–168","year":"1966-01","status":"Publisher abstract and footnote 16 directly opened; footnote says the Commercial Counsellor’s house and office were not officially listed as Embassy property at the Indonesian Foreign Ministry.","href":"s1401-1600.html#S1495"},{"id":"S1496","title":"Global reporting from the Third World: the Afro-Asian Journalists’ Association, 1963–1974","author":"Taomo Zhou; Critical Asian Studies 51(2), 2019, pp.166–197","year":"2019","status":"Full author-hosted PDF read, including the 1963 origin, 1965 office/arrest account, Beijing relocation, 1966–74 organizational history and cited archival/interview source chain.","href":"s1401-1600.html#S1496"},{"id":"S1497","title":"U.S. Embassy file containing AAJA January 15 statement and press-conference account","author":"U.S. Embassy Jakarta; NARA RG84, Entry P339, Box 24, “8-POL3 Organizations-conferences-a-z-1966”","year":"1966-01-15 statement and conference; digitized file 2017","status":"Full 11-page scan/OCR opened; opening pages include the statement protesting Joesoef’s arrest and a transcript/report of the Beijing press conference about communications, the Jakarta withdrawal and Chinese Journalists’ Association facilities.","href":"s1401-1600.html#S1497"},{"id":"S1498","title":"World Outlook, Vol.3 No.31, 23 October 1965","author":"World Outlook (Trotskyist publication), article quoting J. Jacquet-Francillon of Le Figaro","year":"1965-10-23","status":"Full PDF/OCR opened; read the ty Authority, and Diminishing Exilic Options: The Dilemma of Indonesian Political Exiles in China after 1965","author":"Vannessa Hearman; Bijdragen tot de Taal-, Land- en Volkenkunde 176(2–3), 2020, pp.338–372","year":"2020","status":"Full PDF read across pages 338–372; checked 1965 return/communication decisions, Adjitorop’s delegation, exile reorganization, PRC host mechanisms, party divisions, BPKK conflict and comparative Nanjing training note.","href":"s1401-1600.html#S1503"},{"id":"S1504","title":"Feasibility Study on the Renovation of Cipadung/Banjaran Mills, P.T. Industri Sandang I","author":"Japan International Cooperation Agency (JICA); team led by Masayoshi Wada","year":"1991-12; field study 1991-02-04 to 1991-03-05","status":"Full PDF opened; title/date, survey scope, printed pp.25–26 and equipment table checked. JICA reports Japanese reparations contributed partly but the 1965 First Mill was mainly financed by China; operation from 1967 and full operation by 1968; China-made machines remained in use.","href":"s1401-1600.html#S1504"},{"id":"S1505","title":"Build the PKI Along the Marxist-Leninist Line to Lead the People’s Democratic Revolution in Indonesia: Five Important Documents of the Political Bureau of the CC PKI","author":"Delegation of the Central Committee of the PKI; printed compilation","year":"1971-09","status":"Full searchable PDF opened; 1971 introduction and the August 17 1966 statement / September 1966 self-criticism were read, especially pp.83–99. Texts criticize “adventurism,” reliance on Sukarno, the prior parliamentary line and call for armed peasant struggle and rural bases.","href":"s1401-1600.html#S1505"},{"id":"S1506","title":"人民日报电子版 1966年4月25日第3版：亚非记协书记处第四次全体会议公报及决议","author":"《人民日报》; 新华社关于亚非新闻工作者协会书记处会议的报道和公报","year":"1966-04-25","status":"Full page text opened; the communiqué lists 19 country/region delegations, reports the Apr.20–24 Beijing meeting, its support for the Jakarta secretariat’s temporary withdrawal, decision to k
