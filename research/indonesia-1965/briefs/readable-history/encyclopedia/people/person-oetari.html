<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西蒂·奥塔里（Siti Oetari）｜印度尼西亚历史百科</title><link rel="stylesheet" href="../style.css"></head><body><header><small>印尼近代史 · 人物条目</small><h1>西蒂·奥塔里（Siti Oetari）</h1></header><div class="wrap"><nav class="nav"><a href="../index.html">人物与事件总索引</a><a href="../../indonesia-left-history-continuous-1830-2026.html">连续历史正文</a><a href="../1965-focus.html">1965年重点阅读</a></nav><div class="cols"><article><h2>生平与政治位置</h2><p>西蒂·奥塔里是乔克罗阿米诺托的女儿，也是苏加诺早年的妻子。两人婚姻年份在资料中有差异；现有叙述能确认这段关系与苏加诺寄居乔克罗阿米诺托家中的政治生活相连。</p><h2>相关人物与事件</h2><div class="related"><span class="small">可从总索引浏览其他条目。</span></div><h2>史料与参照</h2><p class="note">相关历史论证可继续查阅详细档案的原始来源注释与研究争议。本页面所含材料并不代表全部原件已获核实。</p><p><a href="../../indonesia-left-history-detailed-archive-1830-2026.html">详细档案与来源注释</a>　<a href="../../indonesia-left-history-continuous-1830-2026.html#p-oetari">正文中的相关位置</a></p></article><aside><strong>阅读关联</strong><a href="../index.html">条目索引</a><a href="../../indonesia-left-history-continuous-1830-2026.html#p-oetari">正文中的相关位置</a><a href="../../indonesia-left-history-research-companion-1830-2026.html">研究伴读与来源</a></aside></div><footer>历史事实、当时宣称、后来的研究解释应分别核对。</footer></div></body></html>
