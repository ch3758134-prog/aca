(function(){"use strict";
const data=Array.isArray(window.INDO_FULLTEXT)?window.INDO_FULLTEXT:[],q=document.getElementById("q"),type=document.getElementById("group"),out=document.getElementById("results"),stat=document.getElementById("stat");
const names={people:"人物",events:"事件",organizations:"组织",regions:"地区"};const lower=s=>String(s||"").toLocaleLowerCase();const el=(tag,cls,text)=>{let node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node};
