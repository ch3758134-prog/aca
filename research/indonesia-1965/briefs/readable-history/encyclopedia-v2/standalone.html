<script>
window.HIST=window.HIST||{claims:[],sources:[],coverage:[],people:[],events:[],organizations:[],roles:[],chapters:[]};
window.HIST.chapters=[{"id":"chapter-01","title":"一、殖民统治、土地与公共生活（1830—1914年）","html":"\n<h2>一、殖民统治、土地与公共生活（1830—1914年）</h2>\n<h3 id=\"e-colonial\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-colonial\">强制种植、土地租赁与劳动迁移</a></h3>\n<p>1830年爪哇战争结束后，荷兰总督府在爪哇推行强制种植制度（Cultivation System）。殖民官员通过村长和地方贵族，把村庄土地、劳力和作物生产纳入咖啡、糖等出口生产；村民仍须种粮、纳税并承担地方徭役。制度纸面规定以部分土地或劳动承担义务，实际负担随村庄作物、土地、官员征派和家庭劳力而变。1830—1870年代，出口作物将殖民财政与国际商品市场直接接入乡村日常生活。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n01\">[殖民土地与劳动]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n144\">[爪哇强制劳动与人口史]</a></sup></p>\n<p>荷兰殖民政权沿不同的地方进程扩张。爪哇较早形成密集的行政、港口和交通网络；19世纪后期至20世纪初，荷兰军队和官员继续以战争与行政扩张控制亚齐、巴厘、龙目、苏拉威西等地。外岛的土地权利由地方社群习惯、王权和殖民租约共同塑造。东苏门答腊烟草和橡胶园、锡矿与港口建立了不同于爪哇小农农业的劳动市场；企业跨岛招工，以短期合同、工头管理和债务关系约束劳工。铁路、轮船和城市人口增长把各区连入出口经济，也加深了地区间土地制度和劳动条件的差别。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n01\">[殖民土地与劳动]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n131\">[种植园与劳动关系]</a></sup></p>\n<p>1870年《农业法》（Agrarische Wet）为荷兰企业取得长期租地建立法律框架；同年颁布的《农业法令》（Agrarisch Besluit）第一条规定，爪哇和马都拉岛上无法依殖民法律证明为个人所有的土地，原则上归入国家领域（domein）。殖民政府据此向企业发放最长可达75年的土地租约。法律把无法登记为个人所有的土地划入国家领域，村民的耕作、共同使用和习惯权利仍延续，企业租地、村庄使用和地方王权主张因而会在同一片土地上交叠。不同岛屿的权利制度各异，土地争端牵涉农民、佃户、种植园工人、村级权力和行政机关。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n182\">[1870年《农业法》与国家领域条款]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n142\">[土地占有结构与地区差异]</a></sup></p>\n<h3 id=\"e-formation\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-formation\">学校、报刊、协会与民族主义网络</a></h3>\n<p>20世纪初，殖民政府实施所谓“伦理政策”，有限扩大荷兰语教育、交通和行政体系；教育机会仍按族群、家庭资源和社会身份分配。学校、印尼语与荷兰语报刊以及跨岛城市网络，使受教育者、商人、宗教人士和工人更容易建立协会。1908年，巴达维亚医学院学生建立布迪·乌托莫（Budi Utomo，常译“至善社”），以教育和爪哇社会改革为主要议题。梭罗的穆斯林商人约在1911年建立伊斯兰商人联盟（Sarekat Dagang Islam）；乔克罗阿米诺托等人于1912年前后推动其扩展为伊斯兰联盟（Sarekat Islam），会员进入职员、宗教人士和乡村网络。布迪·乌托莫以受教育者和爪哇文化改革为中心，伊斯兰联盟则从商贸团体成长为跨地区群众组织，各地支部形成自己的成员基础和行动方式。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n130\">[革命前的伊斯兰政治]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n135\">[印度尼西亚近代政治史]</a></sup></p>\n<p><a id=\"p-sukarno\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sukarno\">苏加诺（Sukarno）</a>1901年6月6日出生。父亲<a id=\"p-soekemi\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-soekemi\">拉登·苏克米·苏苏罗哈迪约（Raden Soekemi Sosrodihardjo）</a>是爪哇小学教师，母亲<a id=\"p-nyoman-rai\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-nyoman-rai\">伊达·阿尤·尼奥曼·莱（Ida Ayu Nyoman Rai）</a>来自巴厘岛。关于他的出生地，后来的传记记有泗水和勿里达两说。苏加诺童年在泗水长大，进入欧洲小学（ELS）就读；在殖民教育按族群、身份和家庭条件分层的制度中，能够接受荷兰语教育者仍是少数。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n02\">[苏加诺家庭与早年教育]</a></sup></p>\n","years":[1830,1914]},{"id":"chapter-02","title":"二、工人组织、伊斯兰联盟与民族主义政党（1914—1927年）","html":"\n<h2>二、工人组织、伊斯兰联盟与民族主义政党（1914—1927年）</h2>\n<p>这一时期的政治组织扩展时，苏加诺也从学生进入公开政治。1916年前后，他在泗水就读高级中学（HBS），寄居于伊斯兰联盟领袖<a id=\"p-tjokroaminoto\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-tjokroaminoto\">乔克罗阿米诺托（H.O.S. Tjokroaminoto）</a>家中，接触演讲、报刊以及来往于该家的活动者。1917年前后，他参加青年社团并开始发表文章；1921年赴万隆进入高等技术学校（THS，今万隆理工学院）学习土木工程，1926年取得工程师学位。<a id=\"p-oetari\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-oetari\">西蒂·奥塔里（Siti Oetari）</a>是乔克罗阿米诺托的女儿，也是苏加诺早年的妻子；苏加诺之后与<a id=\"p-inggit\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-inggit\">英吉特·加纳西（Inggit Garnasih）</a>结婚。传记对前一段婚姻的年份记载不一；英吉特则在他求学、演讲、入狱和流放期间承担家庭生计并支持其政治活动。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n02\">[苏加诺生平、教育与私人关系]</a></sup></p>\n<p>1914年5月，荷属东印度社会民主联盟（Indische Sociaal-Democratische Vereeniging，ISDV）成立，早期成员主要是荷兰社会主义者；研究者对成立地记有泗水、三宝垄两种说法。铁路与电车职工协会（VSTP）早在1908年已于三宝垄成立，最初会员以欧洲铁路雇员为主。<a id=\"p-sneevliet\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sneevliet\">亨克·斯内夫利特（Henk Sneevliet）</a>等社会主义活动者从1913年前后开始招募本地铁路工人；到1915年前后，印尼籍成员已占多数。<a id=\"p-semaun\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-semaun\">塞马温（Semaun）</a>、<a id=\"p-darsono\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-darsono\">达尔索诺（Darsono）</a>等工人和组织者由此进入工会政治。车站支部、工会报刊、夜校和集会把不同铁路公司的职工联系起来，工资、工时、解雇与纪律争议也进入跨地区政治网络。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n193\">[ISDV成立地点的记载]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-research-companion-1830-2026.html#n118\">[工会与冷战国际主义]</a></sup></p>\n<p>1917—1919年，ISDV成员在伊斯兰联盟地方支部、VSTP和人民议会（Volksraad）中展开组织工作。塞马温（Semaun）成为三宝垄伊斯兰联盟的重要地方领导人；社会主义者借支部会议和工会争取成员、发展报刊并组织罢工。VSTP支部把不同铁路线路和车站的职工联系起来，工资、解雇与纪律争议也进入伊斯兰联盟内部的政治分歧。中央领导层与亲社会主义支部在党纪、共产国际和跨党合作问题上意见不同。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n136\">[马克思主义与工会网络]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-research-companion-1830-2026.html#n118\">[伊斯兰联盟与早期左翼组织]</a></sup></p>\n<p>1920年，ISDV改组为印度群岛共产党（Perserikatan Komunis di Hindia），1924年改名印度尼西亚共产党（Partai Komunis Indonesia，PKI）。共产党人在伊斯兰联盟支部、VSTP和马来语报刊中组织活动，讨论殖民统治、阶级关系与社会主义和伊斯兰思想的关系。伊斯兰联盟中央领导层反对共产党成员接受共产国际党纪并争夺支部领导权；1921年中央大会决定排除共产党成员，亲共支部陆续分离，人民联盟（Sarekat Rakyat）等组织随之形成。塞马温署名的三宝垄支部声明体现地方领导层坚持政治合作的主张；中央大会的决定则推动组织分裂。<sup class=\"ref\"><a href=\"../indonesia-left-history-research-companion-1830-2026.html#n118\">[早期左翼组织关系]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-research-companion-1830-2026.html#n119\">[1920—1921年左翼报刊]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n136\">[马克思主义在马来语中的传播]</a></sup></p>\n<p>《人民之声》（Soeara Ra’jat）等马来语报刊报道罢工，也刊载政治教育文章。1920年，三宝垄印刷工人和克里安糖厂工人的停工进入报纸，工会与党支部为罢工者募捐。1921年，<a id=\"p-tan-malaka\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-tan-malaka\">丹·马拉卡（Tan Malaka）</a>在三宝垄伊斯兰联盟学校任教；课程包括读写、算术、地理和语言，学生组成图书、卫生和体育社团，选举负责人、制定规则，并参加成人集会。学校把识字、实用知识和学生自治放入工人和贫民的政治教育之中；殖民官员限制筹款、审查公开集会，并调查演唱《国际歌》是否违反法律。<sup class=\"ref\"><a href=\"../indonesia-left-history-research-companion-1830-2026.html#n120\">[马拉卡与三宝垄学校]</a></sup></p>\n<p>1923年5月8日，VSTP领袖塞马温被捕；次日，罢工沿爪哇多条铁路线路展开，成为当时规模很大的跨地区停工。工人反对减薪和福利削减，要求生活津贴、八小时工作制及仲裁。罢工前，塞马温等工会领导人已遭逮捕；停工后，警察和军队沿铁路巡逻并守卫车站、铁路设施与国家财产。殖民政府5月10日颁布刑法第161bis条，5月中旬限制集会并逮捕工会领导人；铁路公司解雇大批罢工者，工会组织受到重创。1926年爪哇和1927年西苏门答腊的起事随后在不同地方网络中展开，路线、准备和指挥过程各有具体脉络。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n183\">[1923年爪哇铁路罢工与镇压机制]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n33\">[1926—1927年殖民政府报告]</a></sup></p>\n<p>民族主义政党沿着另一条组织路线发展。苏加诺1926年发表《民族主义、伊斯兰主义与马克思主义》，主张反殖民力量可以在民族解放目标上合作。1927年，他与同伴成立的组织名为印度尼西亚民族联合会（Perserikatan Nasional Indonesia，缩写PNI）；1928年5月27日至30日第一次代表大会期间，组织改名为印度尼西亚民族党（Partai Nasional Indonesia），仍沿用PNI缩写。它以独立建国和全国动员为中心，与PKI反对同一殖民政权，却有不同的组织基础、领导关系和社会变革设想。民族主义、伊斯兰政治、工人运动和共产主义在报刊、师友与群众网络中相互接触，也持续争夺政治领导权。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n183\">[PNI创立名称与1928年改名]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n136\">[马克思主义传播与组织网络]</a></sup></p>\n<h3 id=\"e-uprising\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-uprising\">1926—1927年起事与殖民镇压</a></h3>\n<p>1926年11月，起事在西爪哇和巴达维亚等地展开，参与者包括PKI地方组织成员、工人和乡村支持者；中央领导人与各地组织的准备、联络和行动并不同步。1927年初，西苏门答腊的起事由当地党员和地方支持网络推动，与爪哇行动分头发展。丹·马拉卡在海外反对准备不足时发动起事，党内干部围绕行动时机和革命路线发生分裂。荷兰殖民机关调动警察、军队和地方行政力量搜捕，随后进行军事审判、处决、监禁、驱逐和行政流放；首批被流放者于1927年送往博文迪古尔，之后的运输也把家属、口粮和通信纳入殖民行政管理。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n33\">[1926—1927年殖民政府报告]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n35\">[起事后的流放和报刊记录]</a></sup></p>\n","years":[1914,1927]},{"id":"chapter-03","title":"三、殖民流放、民族主义重组与战前政治（1927—1942年）","html":"\n<h2>三、殖民流放、民族主义重组与战前政治（1927—1942年）</h2>\n<h3 id=\"e-bovendigoel\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-bovendigoel\">博文迪古尔：法律、运输与营地生活</a></h3>\n<p>1926—1927年起事镇压后，殖民政府把部分政治活动者送往新几内亚南部的博文迪古尔（Boven-Digoel）。殖民政府运用总督的行政流放权，把政治活动者未经普通刑事审判送到偏远地区；殖民政府以安全和治安理由说明这套权力，殖民议会和受流放者则质疑其法律依据与程序。被流放者须接受守卫、点名、出入限制和地方官员报告。殖民政府称营地不实行强迫劳动，但口粮供应、工作安排、通信和释放审查都由行政机关控制；居民的营地生活因此持续受当局支配。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n33\">[1928年殖民政府报告]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n36\">[流放法律与议会争论]</a></sup></p>\n<p>被流放者和家属分批运抵营地。首批45名被拘者和43名家属于1927年2月1日从丹戎不碌港出发，经安汶前往丹那美拉（Tanah Merah）；此后，更多政治流放者和家属从三宝垄、泗水及安汶出发。配偶和子女随行，殖民行政因而把家庭住处、探访、口粮和迁移一并纳入管理；营地人口也随着运输、疾病、出生、死亡和释放而变化。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n34\">[博文迪古尔运输与档案目录]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n37\">[人数、家庭与释放审查]</a></sup></p>\n<h3 id=\"e-sukarno-exile\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-sukarno-exile\">政党分化、逮捕与流放后的政治生活</a></h3>\n<p>苏加诺1929年被捕，1930年在审判中发表《印度尼西亚控诉》（Indonesia Menggugat），1931年底获释后又参与民族主义活动。殖民政府持续逮捕PNI领导人，党内决定解散原有组织，活动者随后建立路线不同的新组织：印度尼西亚党（Partindo）侧重公开群众动员，国民教育协会（Pendidikan Nasional Indonesia，PNI Baru）强调政治教育、纪律和长期干部培养。苏加诺加入Partindo；<a id=\"p-hatta\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-hatta\">穆罕默德·哈达（Mohammad Hatta）</a>和<a id=\"p-sjahrir\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sjahrir\">苏丹·夏赫里尔（Sutan Sjahrir）</a>参加PNI Baru。政党机关受限后，教育、出版、私人通信和小规模干部网络成为不同派别维持政治活动的方式。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n02\">[苏加诺履历与组织关系]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n35\">[苏加诺信件和组织分化]</a></sup></p>\n<p>1933年苏加诺再次被捕，随后被流放到弗洛勒斯岛恩德（Ende），1938年转往明古鲁（Bengkulu）；他在两地继续写作并与地方社会接触。穆罕默德·哈达（Mohammad Hatta）和苏丹·夏赫里尔（Sutan Sjahrir）于1934年被捕，1935年被送往博文迪古尔，1936年迁至班达海的班达尼拉（Banda Neira）。殖民政府把领导人分送到不同岛屿和营地，家属探访、通信和迁移都受行政程序约束；夏赫里尔在博文迪古尔的信件记录营区分隔、劳动、物资和释放条件。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n02\">[苏加诺与哈达的流放履历]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n38\">[夏赫里尔1935年营地书信]</a></sup></p>\n<p>博文迪古尔的劳动和生活安排随时间改变。营地医生<a id=\"p-schoonheyt\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-schoonheyt\">斯洪海特（L. J. A. Schoonheyt）</a>1936年的记录称，早期实行强制劳动和晨间点名，1927年中殖民政府要求停止强迫劳动；居民随后分为受雇劳工、自营者、病残者和拒绝工作的群体。医生记录了农务工资和工作时间；夏赫里尔则写到劳动、生活供应与官员对被拘者是否“改变态度”及能否获释之间的联系。工作安排、口粮、家属照料和健康状况因个人和时期而异。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n39\">[营地医生的现场记述]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n38\">[夏赫里尔的营地书信]</a></sup></p>\n<p>流放也把通信变成一种受监控的政治行动。被拘者借船员传递信件和刊物，殖民行政机关要求检查海上邮件；家庭探访、个人请愿和议会发言成为公开政党活动收缩后的渠道。1934年底，丹那丁吉（Tanah Tinggi）的45名被拘者向殖民议会请愿，反对住宅区管理和卫生规定处罚，并质疑总督指定流放地点的权限。1938年议会讨论将他们的申诉与殖民政府“到达后享有与自由居民相同权利”的答复并列记录。流放地由此不仅是关押地点，也成为殖民法律、行政管制、劳动安排和政治申诉发生冲突的地方。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n41\">[1934年请愿与1938年议会记录]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n39\">[营地通信检查记录]</a></sup></p>\n<p>到1930年代，民族主义政治由不同路线构成。苏加诺以“马尔哈恩”（Marhaen）概念动员普通劳动者和小生产者，推动反殖民力量合作；哈达和夏赫里尔重视政治教育、纪律和干部培养；丹·马拉卡继续主张革命组织和基层行动。政党机关受限后，政治活动沿着营地学校、报刊、家庭通信、人民议会（Volksraad）和城市小组等不同路径继续。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n02\">[民族主义路线与师友网络]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n136\">[民族主义与左翼思想网络]</a></sup></p>\n<h3 id=\"e-prewar-parliament\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-prewar-parliament\">1936—1941年：自治请愿与“印度尼西亚要议会”运动</a></h3>\n<p>1936年7月15日，人民议会（Volksraad）议员<a id=\"p-soetardjo\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-soetardjo\">苏达佐·卡托哈迪库苏莫（Soetardjo Kartohadikusumo）</a>提出请愿，要求由荷兰和印度尼西亚代表平等参加会议，为印度尼西亚在荷兰王国内逐步取得自治拟定方案。人民议会于9月17日至29日辩论，并以26票对20票通过；荷兰王室于1938年11月16日拒绝请愿。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n165\">[苏达佐请愿与战前议会运动]</a></sup></p>\n<p>1939年5月21日，印度尼西亚政治联合会（Gabungan Politik Indonesia，GAPI）成立，汇集民族主义、伊斯兰和地区政党。7月4日，GAPI提出“印度尼西亚要议会”（Indonesia Berparlemen），要求由印尼人选出议会并由政府向议会负责。1939年12月23日至25日，第一次印度尼西亚人民大会（Kongres Rakyat Indonesia，KRI）把印尼语、红白旗和《印度尼西亚伟大》纳入民族象征运动；<a id=\"p-thamrin\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-thamrin\">穆罕默德·胡斯尼·塔姆林（Mohammad Husni Thamrin）</a>是人民议会（Volksraad）议员和GAPI的重要领导人。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n165\">[GAPI、“印度尼西亚要议会”与KRI]</a></sup></p>\n<p>1940年，GAPI再次要求把人民议会改为民选议会，殖民政府则设立维斯曼委员会调查政治改革；GAPI代表参加接触，但认为委员会没有提出实质性的权力转移。1941年9月，KRI改组为印度尼西亚人民运动（MRI），纳入政治组织、宗教团体和工会代表。与此同时，欧洲战争导致贸易与运输受阻，殖民政府扩大价格、贸易和资源管制；日本南进后，战争动员和印尼政治代表权诉求同时加剧。请愿、政党联合、议会要求和战时经济管制彼此关联，却由不同组织和机关推进。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n165\">[GAPI、维斯曼委员会与MRI]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n166\">[1939—1942年经济转变]</a></sup></p>\n\n","years":[1927,1942]},{"id":"chapter-04","title":"四、日本占领、战时动员与共和国的形成（1942—1945年）","html":"\n<h2>四、日本占领、战时动员与共和国的形成（1942—1945年）</h2>\n<h3 id=\"e-occupation\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-occupation\">入侵、占领分区与殖民行政瓦解</a></h3>\n<p>1942年初，日本军队沿着石油产区、港口和海上交通推进。1月11日，日军在塔拉根登陆；1月24日，日军在巴厘巴板登陆。2月14日，日军空降并夺取苏门答腊巨港油区。3月1日，日军在爪哇多处登陆，3月8日荷兰殖民军投降。日军接管荷属东印度后，原有殖民机关被解散或改组，土地、粮食、劳动力、交通和新闻出版均被纳入战时管理。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n166\">[入侵经过与军政分区]</a></sup></p>\n<p>日军把群岛划入不同军种的占领区：陆军第16军负责爪哇和马都拉，第25军负责苏门答腊；婆罗洲、苏拉威西、马鲁古及东部岛屿由海军管理。各占领区有自己的行政机关、地方警察、军事司令部和军需部门，征粮、征工和资源调配因而各有安排。日本保留部分殖民时期的本地官僚，同时提拔印尼语行政人员并建立宣传和动员机关；苏加诺、哈达等人的公开演讲被日军用于战争动员，夏赫里尔则拒绝公开合作，维持地下反法西斯联系。日军借本地政治领袖扩大群众动员，也通过军令、征粮和强制劳动支配当地社会。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n166\">[日本占领行政与军种分区]</a></sup></p>\n<h3 id=\"e-wartime-mobilization\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-wartime-mobilization\">宣传机构、青年军训与强制劳动</a></h3>\n<p>1943年，日本在爪哇成立“人民力量中心”（Putera，Pusat Tenaga Rakyat），由苏加诺、哈达、<a id=\"p-ki-hadjar\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-ki-hadjar\">基·哈查尔·德宛达拉（Ki Hadjar Dewantara）</a>和<a id=\"p-ki-mas-mansyur\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-ki-mas-mansyur\">基·马斯·曼苏尔（Ki Mas Mansyur）</a>领导。Putera借民族主义演讲动员群众，也把动员活动接入日本战争体制。1944年，日军以“爪哇奉公会”（Jawa Hokokai）取代Putera，把宣传、征粮、捐献和劳动力动员直接交由军方控制。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n03\">[民族主义领袖与日本动员机构]</a></sup></p>\n<p>1943年日本建立祖国防卫军（PETA），训练印尼青年担任地方防卫部队；另有大量印尼人被编入日本军辅助队（Heiho）。苏加诺同年与<a id=\"p-fatmawati\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-fatmawati\">法特马瓦蒂（Fatmawati）</a>结婚；她后来成为共和国第一夫人，并在1945年独立宣言仪式前缝制红白国旗。这些组织服从日本军方，日军决定武器、训练和部署，但成员因此获得军事训练、指挥经验和地方人际网络。共和国成立后，部分前PETA军官和兵员进入新军队，另一些人参加地方武装、青年团体或退出军事组织；占领时期的部队没有整体转为共和国军队。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n03\">[PETA、Heiho与共和国军队干部]</a></sup></p>\n<p>征粮和劳工动员把战争负担转移给普通家庭。日军以村庄配额收取稻米，要求农户种植军需作物；强制劳工（romusha）被送去修路、筑机场、采矿和搬运军需。征募通过强迫、诱骗和地方官员征派等方式进行，许多人被送往远离家乡的工地，口粮、工资和返乡交通常无法保障。爪哇1944—1945年的饥荒由征粮、交通封锁、通货膨胀、旱情和强制劳动等因素共同造成。人口学研究估计爪哇出现数百万的人口损失，其中包括过剩死亡和出生减少。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n03\">[romusha与爪哇饥荒]</a></sup></p>\n<h3 id=\"e-preparation\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-preparation\">建国讨论、宣言与共和国的最初制度</a></h3>\n<p>1945年3月，日本设立独立准备调查委员会（BPUPKI），第一次会议于5月29日至6月1日讨论国家基础和宪法原则。苏加诺6月1日提出潘查希拉（Pancasila）；6月22日，九人委员会把折衷文本写入《雅加达宪章》，其中包括穆斯林履行伊斯兰教义的文字。7月第二次会议审议宪法草案和国家结构。日本8月7日宣布设立独立准备委员会（PPKI），原定处理独立后的制度安排。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n167\">[BPUPKI与雅加达宪章]</a></sup></p>\n<p>日本于8月15日宣布投降后，青年活动者要求苏加诺和哈达立即宣布独立。8月16日，他们把两人带到冷格斯当（Rengasdengklok），希望切断与日本军政机关的协商；当晚两人返回雅加达，与青年代表和日军海军军官讨论宣言文本。8月17日上午，苏加诺和哈达宣读独立宣言。青年压力、民族主义领导层的决定与日本占领机构留下的行政和军事架构共同进入此后共和国的建立过程。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n04\">[独立宣言与革命外交]</a></sup></p>\n","years":[1942,1945]},{"id":"chapter-05","title":"五、独立革命：建国、社会动员与外交谈判（1945—1947年）","html":"\n<h2>五、独立革命：建国、社会动员与外交谈判（1945—1947年）</h2>\n<h3 id=\"e-proclamation\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-proclamation\">宣言之后：共和国如何建立权力</a></h3>\n<p>1945年8月18日，印度尼西亚独立准备委员会（PPKI）通过《1945年宪法》，选举苏加诺为总统、哈达为副总统，并决定设立中央印度尼西亚国民委员会（KNIP）协助总统。宪法草案中的《雅加达宪章》曾写入穆斯林履行伊斯兰教法的表述；最终文本改为“信仰唯一神”（Ketuhanan Yang Maha Esa）。东部非穆斯林地区军官提出异议、哈达与伊斯兰领袖协商的经过，见于哈达后来回忆。8月22日，政府决定设立人民安全机构（BKR）；各地分会由地方组织、旧殖民军人、日本训练过的印尼军人和青年武装组成，指挥权分散在地方网络。8月29日KNIP委员宣誓，10月5日BKR改组为人民安全军（TKR），地方武装与正规军围绕编制和命令权持续协商。10月16日，哈达以副总统第十号命令赋予KNIP立法和参与国家方针的职能；11月14日夏赫里尔出任政府首脑，内阁开始向KNIP负责。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n167\">[宪法、KNIP与第十号命令]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n04\">[共和国制度与革命军队]</a></sup></p>\n<h3 id=\"e-surakarta\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-surakarta\">1945—1946年：梭罗的王权、群众组织与共和国政府</a></h3>\n<p>独立后，梭罗的权力并未立即由王宫转到共和国机关。共和国最初承认苏苏胡南王朝（Kasunanan）和芒库尼加兰公国（Mangkunegaran）两套王室辖区的自治地位；同时，地方国民委员会、青年团体、政党和部队推动把王宫行政纳入共和国制度。双方围绕地方官员任命、警察和武装指挥、土地与王室特权展开竞争，政治行动者也把废除世袭权力与农民、工人诉求连在一起。1945年秋的梭罗社会革命包括群众集会、官员撤换、逮捕与地方冲突，不同辖区、王室机构和群众团体的经历并不相同。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n169\">[梭罗权力转换与社会革命]</a></sup></p>\n<p>1945年11月，梭罗的工人和农民代表大会讨论革命政府的社会政策，并争论印度尼西亚工人阵线（BBI）应作为工会联合组织继续存在，还是另建代表工人阶级的政党。印度尼西亚工人党（PBI）沿政党路线发展；农民代表随后在日惹组织全国性的印度尼西亚农民阵线（BTI）。工会、政党和农民组织分别建立自己的代表机构，并在共和国的劳动与土地政策中提出诉求。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n168\">[工农代表大会与组织分化]</a></sup></p>\n<p>1946年，共和国逐步以任命的行政机关和地方防务委员会取代两套王室的独立管辖。中央政府5月任命<a id=\"p-suryo\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-suryo\">苏尔约（Suryo）</a>为驻地代表；梭罗市政机关6月16日开始运作，7月15日的第16/SD号政府决定确认市政建制。6月28日公布的地方文件列出由<a id=\"p-soetarto\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-soetarto\">苏塔托（Soetarto）</a>主持的地方防务委员会，成员包括民族委员会、工党和马斯友美党代表。梭罗特别区紧急状态、地方委员会权限和全爪哇行政安排分别由不同决定规定，市政机关、特别区和王室辖区按各自程序转入共和国行政体系。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n168\">[梭罗地方行政与紧急状态]</a></sup></p>\n<h3 id=\"e-surabaya\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-surabaya\">1945年10—11月：泗水冲突与英国进攻</a></h3>\n<p>1945年10月25日，英国第49印度步兵旅约四千人由准将<a id=\"p-mallaby\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-mallaby\">奥伯廷·马拉比（Aubertin W. S. Mallaby）</a>率领，在泗水登陆。部队负责接收日军投降、解除日军武装并撤出盟国被拘人员。英军进入城市并占据关键建筑后，印尼青年和共和国武装要求其承认当地共和国机关与武装力量。10月27日起冲突扩大；10月29日，苏加诺、哈达和夏赫里尔抵达斡旋，双方达成停火。10月30日，马拉比在红桥附近死亡；英印和印尼记录对枪击、车辆爆炸及其死亡责任的叙述不一。英国随后增派第5印度师，由少将<a id=\"p-mansergh\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-mansergh\">罗伯特·曼塞尔格（Robert Mansergh）</a>指挥。11月9日，英军要求印尼武装次日清晨前缴械；11月10日，陆、海、空部队发动进攻。泗水居民、共和国部队和青年武装在城内抵抗，英军于11月下旬控制主要城区，战斗、疏散、拘捕和破坏仍在当地延续。英军执行盟军接收任务，荷兰民政署（NICA）随其返回并准备恢复殖民行政；印尼居民面对的是英军进攻和荷兰殖民机关重返两种力量。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n168\">[泗水冲突、马拉比之死与英军进攻]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n169\">[盟军任务与荷兰复归]</a></sup></p>\n<h3 id=\"e-labor-revolution\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-labor-revolution\">革命时期的工会与劳工组织</a></h3>\n<p>1945年9月，雅加达工人代表建立印度尼西亚工人阵线（BBI），试图把铁路、港口、印刷和其他行业工人组织起来。BBI内部干部分别推动工会联合与工人政党路线；地方工会继续处理工资和粮食问题，部分干部11月推动成立印度尼西亚工人党（PBI），BBI则继续以劳工联合组织形式活动。1946年11月29日，铁路、港口、印刷、种植园等行业工会成立印度尼西亚工人中央组织（SOBSI），并于1947年加入世界工会联合会（WFTU）。SOBSI与PKI及其他左翼力量建立政治合作，同时保有行业工会和会员组织结构。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n169\">[BBI、PBI与革命时期的劳工政治]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-research-companion-1830-2026.html#n118\">[SOBSI与国际工会联系]</a></sup></p>\n\n<h3 id=\"e-three-july\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-three-july\">1946年6月27日—7月6日：夏赫里尔被带走与七三事件</a></h3>\n<p>总理苏丹·夏赫里尔主张通过谈判争取国际承认；丹·马拉卡推动的“斗争联盟”（Persatuan Perjuangan）则以“百分之百独立”为最低要求，集合政治立场不同的政党和武装团体。1946年6月27日夜，军方人员在梭罗带走夏赫里尔；苏加诺随后暂时接管政府权力，夏赫里尔于7月1日回到日惹。冲突牵涉谈判政策、军队指挥和内阁权力，不只是一次个人绑架。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n162\">[斗争联盟与七三事件]</a></sup></p>\n<p>7月3日，<a id=\"p-sudarsono\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sudarsono\">苏达尔索诺（Sudarsono）</a>带领军政人员和先前被拘留者进入总统府，递交由<a id=\"p-yamin\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-yamin\">穆罕默德·亚明（Mohammad Yamin）</a>起草的改组方案，要求解散夏赫里尔内阁、调整国防指挥并另设政治经济委员会。苏加诺拒绝签署并下令拘押来人。<a id=\"p-sudirman\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sudirman\">苏迪尔曼（Sudirman）</a>是否授权行动，当事人说法相互冲突；现存审讯、判决与参与者陈述也没有形成一致的指挥责任叙述。事件把总统、内阁、军队和地方武装的权力边界推到台前。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n162\">[七三事件研究]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n163\">[国家档案馆审讯卷宗目录]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n164\">[最高军事法院判决书目录]</a></sup></p>\n\n<h3 id=\"e-diplomacy-revolution\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-diplomacy-revolution\">1946—1947年：协议、荷兰军事行动与联合国调停</a></h3>\n<p>1946年11月，荷兰和共和国签署《林牙椰蒂协定》，荷兰承认共和国对爪哇、马都拉和苏门答腊的事实管辖，并规划建立荷印联邦和荷兰—印度尼西亚联盟。共和国议会于1947年3月批准协定，双方对领土范围、联邦组成和主权移交时限仍有不同解释。荷兰于1947年7月21日发动第一次大规模军事行动，称其为“警察行动”；行动夺取种植园、铁路、港口和工业区，迫使共和国武装撤退。联合国安理会8月1日要求停火，美国提出斡旋，澳大利亚和比利时进入联合国斡旋委员会。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n04\">[林牙椰蒂协定与第一次军事行动]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n195\">[联合国调停委员会]</a></sup></p>\n\n","years":[1945,1947]},{"id":"chapter-06","title":"六、茉莉芬冲突、第二次荷兰攻势与主权移交（1948—1950年）","html":"\n<h2>六、茉莉芬冲突、第二次荷兰攻势与主权移交（1948—1950年）</h2>\n<p>1948年1月17日，共和国与荷兰在美国军舰“伦维尔号”上签署停战协定。协定划定停火线，并要求共和国部队撤出荷兰控制线以西的飞地；西爪哇的苏里扬加师等部队因此向共和国控制区东撤。撤军、部队编制和驻防同哈达内阁的整军计划交织：正规军、地方师、日本训练部队、青年武装和革命民兵要纳入统一编制，裁军与复员也改变军官职位、军费和地方权力。1948年2月，阿米尔·谢里夫丁的社会党、印度尼西亚社会主义青年（Pesindo）、工人党（PBI）及其他左翼团体组成人民民主阵线（FDR），共同反对哈达政府的整军和经济政策；联盟成员仍保有各自政党、青年组织和地方部队。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n170\">[整军、FDR与茉莉芬冲突]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n158\">[伦维尔协定和军队撤线]</a></sup></p>\n<h3 id=\"e-madiun\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-madiun\">1948年9月：茉莉芬事件</a></h3>\n<p>1948年8月，曾在莫斯科流亡的共产党人<a id=\"p-musso\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-musso\">穆索（Musso）</a>回到印度尼西亚，推动PKI重组和左翼政党联合。此前，梭罗正规军与左翼部队已围绕缴械、指挥权和地方行政发生冲突；地方部队调动、军官遭捕和组织关系恶化，为茉莉芬的升级埋下条件。9月18日，与FDR和左翼部队有关的人员控制茉莉芬政府机关和通信设施，并通过广播宣布由人民阵线管理政务。9月19日，苏加诺广播要求民众在共和国政府与穆索领导的革命委员会之间作出选择；共和国军队从多条路线进攻，9月30日收复茉莉芬。穆索10月31日在追捕中被杀，<a id=\"p-amir\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-amir\">阿米尔·谢里夫丁（Amir Sjarifuddin）</a>12月被捕并遭处决。共和国政府称事件为FDR—PKI叛乱；FDR和PKI的后续叙述则强调裁军、地方军队冲突、哈达政府的整军政策以及其领导人不在现场等情况。史家对是否存在事前夺权计划、地方行动如何升级和各地指挥关系仍有争论；荷兰和共和国政府也都把事件用于对外争取支持。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n170\">[茉莉芬冲突的行动顺序与责任争议]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n158\">[联合国调停与停战机制]</a></sup></p>\n<h3 id=\"e-dutch-offensive\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-dutch-offensive\">1948年12月—1949年：共和国政府转入游击战与PDRI</a></h3>\n<p>1948年12月19日，荷兰发动第二次大规模军事行动，空降并占领日惹，拘捕苏加诺、哈达、夏赫里尔和多名共和国领导人。共和国军队此前准备过游击战，陆军总司令苏迪尔曼（Sudirman）离开日惹后继续巡回指挥；各地军区、县级行政与电台维持分散抵抗。苏加诺和哈达被流放到邦加岛，雅加达和荷兰军方宣称共和国政府已不存在。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n170\">[第二次荷兰攻势与共和国领导人被捕]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n170\">[共和国领导层被捕后的国际反应]</a></sup></p>\n<p>进攻前，苏加诺和哈达曾向苏门答腊的繁荣部长<a id=\"p-sjafruddin\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sjafruddin\">沙弗鲁丁·普拉维拉内加拉（Sjafruddin Prawiranegara）</a>发送授权电报，要求在中央政府无法履职时成立紧急政府。12月22日，沙弗鲁丁在西苏门答腊哈拉班宣布成立印度尼西亚共和国紧急政府（PDRI），由他兼任政府主席和临时国防、外交、宣传负责人。PDRI通过电台和地方官员与军区及海外代表保持联系，令共和国政府在雅加达和日惹领导人被捕后仍持续运作。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n170\">[PDRI授权、成立与通信]</a></sup></p>\n<p>1949年3月1日，共和国军队发动日惹总攻，一度进入主要城区并向外广播，展示游击部队仍能进入被荷兰占领的首都。日惹苏丹<a id=\"p-sultan-hb-ix\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sultan-hb-ix\">哈孟库布沃诺九世（Sri Sultan Hamengku Buwono IX）</a>、第三师指挥官<a id=\"p-bambang-sugeng\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-bambang-sugeng\">班邦·苏根（Bambang Sugeng）</a>、日惹第三师第十区指挥官<a id=\"p-suharto\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-suharto\">苏哈托（Suharto）</a>以及苏迪尔曼的指挥体系都出现在行动筹划和执行叙述中；回忆录和后来的官方叙事对谁首先倡议、谁批准计划及总指挥职责强调不同。苏哈托指挥日惹突击是多种叙述中的共同部分，具体命令链仍须对照当时军令。攻势持续数小时，时间有限，但与PDRI的外交通信和联合国讨论同步发生。美国对荷兰施加停止军事行动、释放被捕领导人和恢复谈判的压力，联合国安理会要求荷兰撤出日惹。5月7日，印尼代表<a id=\"p-roem\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-roem\">穆罕默德·鲁姆（Mohammad Roem）</a>和荷兰代表<a id=\"p-van-roijen\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-van-roijen\">范罗延（Jan Herman van Roijen）</a>达成声明；苏加诺、哈达等人获释并于6月底返回日惹，7月13日沙弗鲁丁把PDRI职权交还苏加诺。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n196\">[3月1日总攻、鲁姆—范罗延声明与PDRI终结]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n158\">[安理会和斡旋委员会行动]</a></sup></p>\n<p>1949年8月至11月，荷兰与印度尼西亚在海牙举行圆桌会议，讨论主权移交、联邦宪制、荷印联盟、债务和武装力量整编。12月27日，荷兰将主权移交给印度尼西亚联邦共和国（RIS），但西新几内亚仍由荷兰控制，归属留待谈判。联邦内部由多个成员邦组成；1950年各邦相继并入共和国，8月17日恢复单一制共和国。主权移交结束荷兰对印度尼西亚大部分领土的正式统治，却没有解决军队整合、地区财政、土地关系和群众组织如何进入新国家的问题。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n170\">[圆桌会议、主权移交与联邦解体]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n04\">[1949—1950年宪制变化]</a></sup></p>\n","years":[1948,1950]},{"id":"chapter-07","title":"七、议会共和国、工会政治与军队扩权（1949—1957年）","html":"\n<h2>七、议会共和国、工会政治与军队扩权（1949—1957年）</h2>\n<p>1950年临时宪法确立议会内阁制。总统是国家元首，内阁总理依赖议会多数支持；民族主义党（PNI）、马斯友美党、伊斯兰教师联合会（NU）、印度尼西亚社会党（PSI）、PKI和地方政党在议会与选举中竞争。各党连接着不同的社会、宗教和地区组织。内阁更迭、制宪议会讨论、革命武装整编、财政恢复、地区自治和西新几内亚归属，构成1950年代共和国政府持续处理的议题。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n07\">[议会政治与1955年选举]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n135\">[印度尼西亚近代政治史]</a></sup></p>\n<p>1949年，西爪哇的<a id=\"p-kartosuwiryo\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-kartosuwiryo\">卡尔托苏维约（Kartosuwiryo）</a>宣布成立印度尼西亚伊斯兰国（NII）；1950年，安汶的南马鲁古共和国（Republik Maluku Selatan）宣布脱离共和国。西爪哇运动以建立伊斯兰国家为目标，南马鲁古运动则与联邦解体、当地军人和地区政治冲突相连。共和国军队通过军事行动、地方情报和部队整编应对两地冲突。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n184\">[独立后地方武装与国家整合]</a></sup></p>\n<p>南苏拉威西的<a id=\"p-kahar\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-kahar\">卡哈尔·穆扎卡尔（Kahar Muzakkar）</a>自1950年起围绕革命军人并编、安置和指挥权同中央军队发生冲突，1953年宣布加入达鲁伊斯兰运动。亚齐的冲突沿另一条地方政治路线发展：中央政府1950年取消亚齐省建制并将其并入北苏门答腊，乌理玛领袖<a id=\"p-daud-beureueh\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-daud-beureueh\">达乌德·贝乌雷（Daud Beureueh）</a>于1953年宣布亚齐加入NII。中央政府与亚齐地方力量1959年达成特别地区安排，承诺在宗教、习惯法和教育方面给予自治，冲突此后逐步缓和。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n184\">[达鲁伊斯兰运动的地区差异]</a></sup></p>\n<p>港口工人的罢工让独立后的阶级关系变得具体。1949年底，北苏门答腊勿拉湾港约500名长期工人和相近数量的临时工围绕加班工资和配给停工，经过谈判形成集体协议。1950年，其他港口工人继续争取工资、医疗、膳食和工会代表权；荷兰企业仍经营部分港口与运输业务，临时工常通过工头受雇，雇主也拒绝承认工会代表。1951年政府先以紧急规定限制港口罢工，随后改用劳动争议委员会和事前通知程序处理停工。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n154\">[港口工人与劳动争议]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n155\">[1951年劳动争议法]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n157\">[北苏门答腊工会与劳动统计]</a></sup></p>\n<h3 id=\"e-1952\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-1952\">1952年10月17日：军政危机</a></h3>\n<p>1952年10月17日，<a id=\"p-nasution\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-nasution\">纳苏蒂安（A. H. Nasution）</a>等陆军军官与支持者带着部队和装甲车辆前往议会与总统府一带，要求苏加诺解散议会，并反对议会调查军队重组。苏加诺拒绝解散议会。纳苏蒂安和陆军领导层随后离职，军队并未退出政治；军官的组织能力、地方指挥和对总统施压的方式由此成为全国政治公开议题。同期美国使馆电报记录了危机。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n06\">[1952年军政危机]</a></sup></p>\n<p>PKI在1948年镇压后遭到严重削弱。1951年起，<a id=\"p-aidit\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-aidit\">艾地（D. N. Aidit）</a>、<a id=\"p-lukman\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-lukman\">卢克曼（M. H. Lukman）</a>等新领导人重建中央委员会、地方支部和干部教育，并在工会、农民、青年与文化组织中开展工作。党通过合法选举、议会和群众组织扩大影响，也与苏加诺及其他民族主义者合作。工会、农民和文化团体拥有各自的会员网络；PKI与群众组织之间存在组织联系，但群众组织会员并不因此自动成为PKI党员。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n07\">[PKI重建与1955年选举]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n145\">[PKI的组织策略]</a></sup></p>\n\n<p>1953年，苏加诺与<a id=\"p-hartini\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-hartini\">哈蒂妮（Hartini）</a>结婚，法特马瓦蒂随后离开总统府。苏加诺的婚姻与家庭生活进入国家礼仪、媒体报道和家族记忆。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n02\">[苏加诺家庭与婚姻]</a></sup></p>\n<h3 id=\"e-election\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-election\">1954—1956年：Gerwis更名、全国选举与哈达辞职</a></h3>\n<p>1954年，觉醒妇女运动（Gerwis）在第二次代表大会上更名为印度尼西亚妇女运动（Gerwani）。大会和刊物讨论就业、婚姻、教育、农村生活和妇女参政；它与PKI联系增加，但也发展自身妇女权利议题。SOBSI连接行业工会，印度尼西亚农民阵线（BTI）组织农村成员，人民文化协会（Lekra）组织作家、演员和艺术活动者，人民青年连接青年网络。这些团体与PKI存在联盟和人员交往，分别在工厂、村庄、文化和家庭问题上开展工作。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n10\">[政党与群众组织]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n125\">[Gerwani大会与妇女议程]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n153\">[PKI关联群众组织]</a></sup></p>\n<p>1955年4月，印度尼西亚在万隆召开亚非会议，来自亚洲和非洲的政府代表讨论反殖民、主权平等和冷战压力。第一次全国选举分两次投票：9月29日选出众议院（DPR）议员，12月15日选出制宪议会议员。民族主义党（PNI）、马斯友美党、伊斯兰教师联合会（NU）和PKI得票领先，分别约占22%、21%、18%和16%，没有一党取得多数；PKI获得39个众议院席位。1956年哈达辞去副总统；外岛军政力量对财政分配和雅加达集权的不满继续扩大，制宪议会仍未能就新宪法达成一致。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n07\">[1955年选举与哈达辞职]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n135\">[印度尼西亚近代政治史]</a></sup></p>\n","years":[1949,1957]},{"id":"chapter-08","title":"八、荷兰企业接管、地区叛乱与指导民主（1957—1969年）","html":"\n<h2>八、荷兰企业接管、地区叛乱与指导民主（1957—1969年）</h2>\n<h3 id=\"e-takeover\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-takeover\">西新几内亚争端与荷兰企业接管</a></h3>\n<p>荷兰将西新几内亚排除在1949年主权移交之外，印度尼西亚政府持续要求该地区并入共和国。1957年11月，联合国大会未通过印度尼西亚提出的决议后，工会和青年组织者于12月在雅加达、泗水等城市占领荷兰企业、种植园、港口和交通设施。政府随后宣布戒严，军方接管许多企业的监管与经营。1958年第86号法律授权将荷兰企业收归国有，1959年又设立国有化协调机关；占领行动、军事管理、行政经营和产权转移依次推进，企业工人也通过新管理机构与国家部门继续交涉。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n171\">[工人接管、军方监管与国有化]</a></sup></p>\n<h3 id=\"e-rebellion\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-rebellion\">PRRI、Permesta与美国秘密援助</a></h3>\n<p>西苏门答腊军官于1956年成立“班腾委员会”（Dewan Banteng），要求调整中央与地区的财政分配、军队指挥和地方行政权限。1957年3月，苏拉威西军官发表“全体人民斗争宪章”（Permesta），要求重组中央—地方关系。1958年2月15日，西苏门答腊军政领袖宣布成立印度尼西亚共和国革命政府（PRRI），Permesta领导层随后与之结盟。美国中央情报局（CIA）秘密提供武器、弹药、飞机、补给和政治支持，并由美国承包飞行员驾驶B-26轰炸机；5月18日，美籍飞行员<a id=\"p-allen-pope\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-allen-pope\">艾伦·波普（Allen Pope）</a>在安汶附近被击落并俘获。共和国军队于1958年夏秋夺回叛乱中心，此后各地抵抗经由军事追捕、谈判、特赦和部队整编陆续结束。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n184\">[美国对地区叛乱的秘密支持]</a></sup></p>\n<h3 id=\"e-guided\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-guided\">1959—1963年：指导民主与军方扩权</a></h3>\n<p>1957年的军政危机、地区叛乱、军事戒严和制宪议会僵局共同改变国家制度。制宪议会未能取得通过新宪法所需的多数，1959年7月5日苏加诺发布总统令，解散制宪议会并恢复《1945年宪法》。在“指导民主”制度下，总统成为国家政治中心；“纳沙贡”（Nasakom，即民族主义、宗教与共产主义）把不同政治力量纳入共同政府框架。1955年选出的众议院（DPR）于1960年3月因拒绝政府预算而被解散，苏加诺随后任命互助众议院（DPR-GR），并安排政党和军方席位。1960年8月，马斯友美党和印度尼西亚社会党（PSI）因部分领导人与地区叛乱有关而被禁。军方掌握戒严、地方行政和企业管理职权；PKI及其群众组织在这一制度框架中扩大工会、农会、妇女和文化活动。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n178\">[指导民主的制度转变]</a></sup></p>\n<p>1962年，苏加诺与日本出生的<a id=\"p-dewi\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-dewi\">黛薇（Ratna Sari Dewi；原名根本七保子，Naoko Nemoto）</a>结婚。她进入总统家庭并参与公开礼仪生活；两人的私人关系和国家外交各有其政治脉络。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n02\">[苏加诺家庭与婚姻]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n21\">[印尼对外关系与地区外交]</a></sup></p>\n<h3 id=\"e-westpapua\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-westpapua\">1957—1969年：西新几内亚争端与巴布亚人的政治要求</a></h3>\n<p>1949年主权移交时，西新几内亚仍由荷兰控制，双方同意以后谈判解决归属。1957年，印度尼西亚提出的联合国决议未获通过，国内随即出现占领荷兰企业和要求收回该地区的群众行动。与此同时，荷兰政府推动本地自治制度：1961年成立的新几内亚议会（New Guinea Council）有由当地选出的巴布亚成员。议会成员支持以西巴布亚为名的政治共同体，并于1961年12月1日举行仪式，升起晨星旗、演唱巴布亚国歌。仪式表达当地政治精英的自决要求；荷兰当局仍控制行政。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n185\">[西新几内亚争端与巴布亚政治行动]</a></sup></p>\n<p>1961年12月19日，苏加诺宣布“三项人民命令”（Trikora），要求阻止荷兰建立独立国家并将西伊里安并入印度尼西亚。印尼军方随后加强渗透、伞兵行动和海上军事部署，荷兰也增派兵力。美国通过国务院、雅加达与海牙使馆、罗伯特·肯尼迪的直接接触和埃尔斯沃思·邦克的调停推动谈判。华盛顿的目标包括避免印尼与荷兰开战、保持冷战影响，并推动由联合国过渡管理后移交印尼的方案；这条外交渠道不同于1958年美国对地区叛乱的秘密援助，也不同于1965年的秘密政治行动。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n185\">[美国调停与1962年谈判机制]</a></sup></p>\n<p>1962年8月15日，印度尼西亚与荷兰在联合国签署《纽约协定》。协定规定先由联合国临时行政机构（UNTEA）接管，再把行政权移交印度尼西亚；第十八条要求在1969年底前举行“自由选择行动”。1969年7月至8月，印尼政府组织约1,026名经选定的代表分批投票，各地代表团均表态留在印度尼西亚。这不是全体成年居民参加的一人一票直接公投，而是依《纽约协定》第十八条所设代表会议与协商程序（musyawarah）表达选择。联合国代表报告了投票程序以及当地行政和军事压力下的条件；联合国大会辩论中，加纳、圭亚那等国代表质疑参与范围与自由表达程度。11月，大会以84票赞成、0票反对、30票弃权通过第2504号决议，决议文字“注意到”秘书长报告和协定履行情况。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n185\">[《纽约协定》、UNTEA与1969年选择程序]</a></sup></p>\n","years":[1957,1969]},{"id":"chapter-09","title":"九、土地改革、群众组织与农村政治（1960—1965年）","html":"\n<h2>九、土地改革、群众组织与农村政治（1960—1965年）</h2>\n<h3 id=\"e-land\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-land\">土地法、行政执行与农民行动</a></h3>\n<p>1960年第5号《基本农业法》试图以统一的国家土地制度取代殖民时期按族群身份区分的法律，确认土地具有社会功能，并确立土地改革原则。同年第2号《分益法》规定地主与佃农怎样分收成、分担种子和生产成本，第56号紧急条例设定土地占有上限。法律规定的可分配土地包括超过上限的土地、缺席地主土地、部分传统王室土地和国家控制土地；每一类都需要确认权属与受益资格。行政机关必须调查地界、登记土地、列出受益户、估算补偿并办理移交，法律通过并没有自动改变村庄土地关系。地籍缺失、地主拆分或转让土地、村长和农民对地块及耕作者的不同认定，都可能使分地程序停滞。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n09\">[土地改革法与执行]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n142\">[地区土地结构]</a></sup></p>\n<p>印度尼西亚农民阵线（BTI）把土地改革作为农村组织工作的核心，推动土地清查、减租、佃耕法执行和占有上限；农民干部还组织生产合作、灌溉、灭鼠和农资互助。各地干部与农户围绕合法耕作者、超额地块、合作社土地登记和受益户资格展开交涉。BTI通过地方支部、会议、互助劳动和具体地块纠纷开展农村工作，各村会员和行动参加者随地区组织与土地关系而变化。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n11\">[土地争议与地方劳动]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n138\">[BTI与土地行动]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n150\">[农民运动与农村政治]</a></sup></p>\n<p>地籍调查和分配程序迟缓，加上地主转让或拆分土地、村级名册争议和租佃冲突，使部分地区在1963年前后出现“单方面行动”（aksi sepihak）。无地农民和租佃者进入他们认为依法应分配的土地，要求委员会执行法律；有些行动由印度尼西亚农民阵线（BTI）干部组织，有些则来自农户对土地和劳动关系的直接诉求。地方官员、军人、地主和农会对哪些土地属于法定分配范围并无一致认定。苏加诺在纳沙贡框架内支持土地改革，也要求停止部分强制占地和乡村冲突；总统、农会、地方行政和军方对如何执行法律没有统一路线。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n143\">[单方面行动与中央政策]</a></sup></p>\n<h3 id=\"e-land-court\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-land-court\">1964年：土地改革法院与村庄执行</a></h3>\n<p>1964年第21号法律设立土地改革法院，开始审理与土地改革有关的争议。法院合议庭包括由农民群众组织推荐、再经国家程序任命的成员，地主、农民和行政机关可就地权登记、受益资格和土地分配提出申诉。裁决之后，地籍测量、补偿和地方机关办理构成土地实际移交的后续程序。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n11\">[土地改革法院与执行记录]</a></sup></p>\n<p>其他群众组织把国家政治带入工厂、村庄和家庭。SOBSI行业工会谈判工资、福利和国营企业管理；Gerwani推动女性参加村会、担任村级职务和独立持有土地，要求提高农业工资并改善女工保障，还组织扫盲、托幼和教育活动；人民文化协会（Lekra）组织文学、戏剧和艺术工作，人民青年和农民组织开展学习与集体行动。这些组织同PKI存在联盟、人员交叉和政治合作，也各自围绕工作场所、性别关系、土地和文化提出诉求。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n10\">[政党与群众组织]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n148\">[Gerwani与妇女权利议程]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n153\">[PKI关联群众组织]</a></sup></p>\n<h3 id=\"e-wangunwati\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-wangunwati\">1965年6月：万贡瓦蒂的土地分配与合作社</a></h3>\n<p>中爪哇万贡瓦蒂（Wangunwati）显示土地改革如何经过工人组织、地方协商和国家机关落地。当地原橡胶园合同工于1946年占据旧殖民种植园；1950年，政府允许他们定居并经营园地，农业部1951年的决定给予临时土地权利。1952年，工人把管理机构改组为合作社，分配家庭耕地并共同经营橡胶园。1965年6月4日，西爪哇省土地事务监察机关以第LR.249/D/VIII/60/1965号决定，将468.15公顷土地分给240户，并把280.2公顷保留为合作社经营的橡胶园。地方农民组织GTI帮助社群与政府及军方联系，使土地分配经由协商、行政决定与合作经营推进。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n172\">[万贡瓦蒂村土地分配与合作社]</a></sup></p>\n","years":[1960,1965]},{"id":"chapter-10","title":"十、印马对抗、国内联盟与外国介入渠道（1963—1965年9月）","html":"\n<h2>十、印马对抗、国内联盟与外国介入渠道（1963—1965年9月）</h2>\n\n<h3 id=\"e-konfrontasi\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-konfrontasi\">对抗马来西亚与婆罗洲边境战争</a></h3>\n<p>1961年5月27日，马来亚总理东姑·阿都拉曼提出把马来亚、新加坡、砂拉越、北婆罗洲和文莱合并为新联邦。文莱于1962年12月爆发北加里曼丹国民军起事，英国军队迅速镇压，文莱最终没有加入。马来西亚协定于1963年7月9日签署，9月16日生效，成员为马来亚、新加坡、砂拉越和北婆罗洲。新加坡于1965年8月9日脱离联邦，成为独立共和国。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n190\">[马来西亚成立、文莱起事与新加坡分离]</a></sup></p><p>苏加诺政府把新联邦视为英国在北婆罗洲延续势力的安排，发动“对抗”（Konfrontasi），通过外交、广播、群众动员和渗透行动反对其成立。印尼军队把部队和渗透小组派往加里曼丹边境；英国则秘密授权部队越境打击印尼基地，行动代号“克莱特”（Operation Claret），并对外否认越境作战。澳大利亚依据马来西亚防务协定派兵参与防务。1964年曼谷会谈、东京和雅加达间的接触及美国斡旋一度推动停火谈判，双方对马来西亚的组成和印尼军事行动仍未达成解决。外交谈判、边境军事行动和国内政治宣传并行。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n21\">[英澳日政策渠道]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n115\">[澳大利亚广播指导]</a></sup></p>\n<p>苏加诺把对抗马来西亚置于反殖民外交和国家动员中心；印尼陆军同时处理边境部署、外岛戒备和与英军交战风险。PKI及其关联群众组织支持反马来西亚集会和宣传，军方与政党分别沿各自的组织体系开展动员和争取政治影响。通货膨胀、外汇短缺、进口限制和财政开支也压迫政府，苏加诺政府继续寻求军备、贷款、粮食和外交支持。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n17\">[印马对抗时期的美国政策]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n22\">[国际关系与国内政治]</a></sup></p>\n<h3 id=\"e-foreign-channels\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-foreign-channels\">美国、英国、澳大利亚、日本、中国与苏联的不同渠道</a></h3>\n<p>美国对印尼的政策由国务院、雅加达使馆、国防部门、军事援助机构、美国新闻署和中央情报局分别执行。军方训练、警务援助、武器供给和外交接触使用公开或半公开渠道；贷款与经济援助经使馆谈判、国会授权和对印尼预算政策的讨论推进。1965年2月23日提交给303委员会的备忘录回顾，自1964年夏季起进行的秘密政治活动，包括与反共力量联络、支持政治接触、向政治机构渗透以及散发匿名传单和黑色、灰色宣传。备忘录随后提出削弱PKI与北京联系、为苏加诺离任后的非共产党继任者创造条件；303委员会于3月4日批准该方案。备忘录把已进行的活动、获批计划和未来建议分别列明。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n173\">[美国303委员会政治行动计划]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n80\">[美国军事与警务援助]</a></sup></p>\n<p>英国以军事支持、外交和情报行动参与对抗。克莱特行动由军方秘密规划并经政府授权，地面部队在加里曼丹边境执行越境行动；外交官对外避免承认。英国外交部信息研究部（IRD）在1965年准备匿名反共宣传材料，经新加坡联络和外国媒体散发。澳大利亚派兵参加马来西亚防务，部署情报人员，并由广播主管机关向印尼语广播传递内容指导；广播机关也把印尼陆军的反应反馈给政府。日本通过贸易、紧急贷款、债务协商和特使接触苏加诺政府、印尼陆军与地区调停方；中国和苏联则通过外交支持、贷款、军售和军事培训与印尼往来。上述行动由不同政府机关、审批渠道和受援对象推进。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n21\">[英国、澳大利亚与日本]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n22\">[中国、苏联与军购交付]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n67\">[英国IRD宣传行动]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n115\">[澳大利亚广播指导]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n120\">[日本使馆与东京渠道]</a></sup></p>\n<p>到1965年9月，印马对抗、国家经济危机和国内政治联盟已经交织。苏加诺仍试图让民族主义者、宗教力量、军方和PKI留在同一政治框架中；军队和政党对群众组织扩张、土地改革、军队在国家中的地位以及外交方向各有判断。共同出现在政府和政治联盟内，没有解除各方围绕指挥权、企业、土地与组织空间的竞争。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n17\">[1963—1965年美国政策与印尼政治]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n22\">[国际关系与国内政治]</a></sup></p>\n","years":[1963,1965]},{"id":"chapter-11","title":"十一、九三〇运动与雅加达军权变化（1965年9月30日—10月初）","html":"\n<h2>十一、九三〇运动与雅加达军权变化（1965年9月30日—10月初）</h2>\n<h3 id=\"e-movement\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-movement\">绑架行动、广播与陆军反应</a></h3>\n<p>1965年9月30日深夜至10月1日凌晨，一支自称“九三〇运动”（Gerakan 30 September）的武装队伍在雅加达试图绑架陆军高级将领。三名将领在住宅遭枪杀，另一些将领被带往哈利姆空军基地附近的卢邦布亚（Lubang Buaya）后遇害；尸体被投入一口废井。六名遇害将领为陆军司令<a id=\"p-ahmad-yani\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-ahmad-yani\">艾哈迈德·亚尼（Ahmad Yani）</a>、<a id=\"p-suprapto\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-suprapto\">拉登·苏普拉普托（R. Suprapto）</a>、<a id=\"p-haryono\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-haryono\">M.T.哈里约诺（M.T. Haryono）</a>、<a id=\"p-parman\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-parman\">西斯翁多·帕尔曼（S. Parman）</a>、<a id=\"p-panjaitan\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-panjaitan\">唐纳德·伊萨克·潘贾伊坦（D.I. Panjaitan）</a>和<a id=\"p-sutoyo\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sutoyo\">苏托约·西斯沃米哈尔佐（Sutoyo Siswomiharjo）</a>。总统卫队副官<a id=\"p-tendean\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-tendean\">皮埃尔·滕代安（Pierre Tendean）</a>也被捕杀。后来官方纪念把七人合称“七名英雄”。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n12\">[九三〇运动原始文书和研究]</a></sup></p><p>国防与安全部长纳苏蒂安逃脱，女儿<a id=\"p-ade-irma\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-ade-irma\">阿德·伊尔玛（Ade Irma Suryani）</a>遭枪击后死亡；滕代安被误认为纳苏蒂安而遭捕。行动者在广播中称要阻止所谓“将军委员会”政变，并试图控制广播电台和首都战略地点。各行动单位对广播命令的响应不一，广播宣布的革命委员会没有建立稳定的全国指挥。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n12\">[九三〇运动原始文书和研究]</a></sup></p>\n<p>苏哈托（Suharto）当时是陆军战略后备司令部（KOSTRAD）司令，10月1日召集仍在首都的陆军单位，调动部队夺回广播电台和战略地点。陆军公告把运动定性为PKI发动的政变；军事通信和新闻系统把这一说法传向各军区。苏加诺留在首都外围并试图掌握部队指挥、任命临时陆军领导人，苏哈托的指挥系统却迅速取得首都军力和公共广播的实际控制。总统与陆军之间的命令权竞争随即从雅加达传向全国各地。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n13\">[苏加诺与苏哈托的指挥权变化]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n139\">[陆军指挥与地方行动研究]</a></sup></p>\n<p>公开广播由总统卫队中校<a id=\"p-untung\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-untung\">翁东（Untung）</a>署名；行动中还有陆军准将<a id=\"p-supardjo\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-supardjo\">苏帕尔佐（Supardjo）</a>和PKI特别局负责人<a id=\"p-sjam\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sjam\">夏姆·卡马鲁扎曼（Sjam Kamaruzaman）</a>等人。PKI领导层与部分军官之间的接触、行动组织者的身份和指挥范围，后来成为军事法庭、党内文件及历史研究争论的中心。军方把行动定性为PKI发动的政变，苏加诺则反对未经调查便把责任归给一个政党，并要求恢复其总统指挥权。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n12\">[事件材料与责任争议]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n13\">[首都指挥链与地方军令]</a></sup></p>\n","years":[1965,1965]},{"id":"chapter-12","title":"十二、反共镇压、外国行动与苏加诺失权（1965—1968年）","html":"\n<h2>十二、反共镇压、外国行动与苏加诺失权（1965—1968年）</h2>\n<h3 id=\"e-purge\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-purge\">杀戮、拘押与群众组织清除</a></h3>\n<p>10月初，陆军各级单位开始拘捕PKI干部和被认定与左翼组织有关的人。10月10日，陆军参谋长<a id=\"p-pranoto\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-pranoto\">普拉诺托（Pranoto Reksosamodra）</a>发出第Kep-1146/10/1965号命令；最高作战司令部（KOTI）同日发出第T-0265/G-5/1965号文件，要求中央和地方成立调查队。10月12日，KOTI第T-0269 A/G.5/1965号文件要求对9月30日后缺勤的公务人员暂予停职并每日点名。10月20日，内阁主席团以第47a/D/Instr/1965号和第48a/D/Instr/1965号指令要求设立特别小组、清查资产并审查政府人员和组织的忠诚。11月20日，苏加诺批评职权重叠，主张普通文官由内阁处理、国防与安全部门由军方主管。军令、总统内阁指示和地区拘捕随不同机关的部署向外展开。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n174\">[10月的KOTI与内阁清查指令]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n14\">[镇压的区域差异]</a></sup></p>\n<p>地方军区、警察、情报机关以及反共青年团体和宗教组织随后以不同方式参与拘捕和杀戮。中爪哇跨军种联合安全参谋组于10月23日成立，由陆军上校<a id=\"p-sarwo-edhie\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-sarwo-edhie\">萨尔沃·埃迪·维博沃（Sarwo Edhie Wibowo）</a>指挥；他率领陆军伞兵突击团（RPKAD）。10月19日，RPKAD进入三宝垄；10月22日，空军配合RPKAD进入梭罗并实施武力展示。地方部队、警察、政治组织与宗教团体分别参与名单收集、逮捕、运输和拘押。亚齐、中爪哇、东爪哇、巴厘、南苏门答腊、南苏拉威西和弗洛勒斯的暴力时间与方式各有地方脉络，旧有乡村冲突和社会关系也影响追捕、庇护与拒绝参与。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n14\">[镇压的区域差异]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n139\">[军方协调与地方执行]</a></sup></p>\n<p>遇害、拘捕和失踪者不只包括PKI党员。SOBSI、BTI、Gerwani、Lekra和青年组织成员，以及被当局视为组织关联者的人，都可能遭到逮捕和清除。临时监所、军营和监狱用于集中拘押，之后有人被转移、失踪或死于狱中。妇女组织成员遭受性化宣传和审讯暴力，配偶、子女也可能因家庭关系失业、迁居或被列入身份审查；一些地区的华人商铺和社区受到攻击并被迫迁离。这些行动针对党籍、工会和群众组织联系，也扩展到家庭成员、配偶、子女与被当局按政治关系分类的人。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n151\">[Gerwani与性化宣传]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n152\">[Gerwani幸存者与政治恢复]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n26\">[西加里曼丹驱逐与土地变化]</a></sup></p>\n<p>对1965—1966年被杀者人数的研究估计从数十万到约一百万；“约50万”是常见概数。研究所覆盖的地区、时段和材料各有不同，拘押、失踪、死亡和被迫迁离分别记录。美国驻棉兰使馆1965年12月关于古突士、巴蒂等地的电报，转述当地军方和地方人士报告；地区研究和幸存者证言另有自己的时间、地点和统计来源。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n15\">[古突士与巴蒂地方报告]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n16\">[死亡估算与统计范围]</a></sup></p>\n<h3 id=\"e-foreign-1965\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-foreign-1965\">美国名单、资金、药品与通信设备</a></h3>\n<p>1965年12月，美国驻雅加达使馆人员向华盛顿发出PKI中央领导干部名单。1966年8月，<a id=\"p-green\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-green\">马歇尔·格林（Marshall Green）</a>大使签署的电报回顾，一份删去美国使馆来源标记的A-398名单副本已交给印尼政府，安全机关似乎正在使用。使馆人员<a id=\"p-martens\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-martens\">罗伯特·马滕斯（Robert J. Martens）</a>后来称，他把PKI高层名单交给“非共产党力量”，没有先征得大使同意。名单编制、去除来源标记和转交对象分别出现在同期电报与后来的个人陈述中；两者对授权程序的叙述不完全相同。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n18\">[A-398名单及交接记录]</a></sup></p>\n<p>1965年末，美国大使馆为反共组织“九三〇行动委员会”（KAP-Gestapu）安排5,000万印尼盾活动资金。外交电报记载格林大使同意方案、经费渠道和受款联络。印尼陆军另向美国提出药品、便携通信设备和远距离电台需求；美国官员分别讨论政策审批、采购、隐去来源和秘密运送，部分最初提出的通信设备没有按原方案交付。宣传经费、医疗物资和通信器材分别通过不同项目处理。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n18\">[A-398名单与交接记录]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n19\">[美国通信器材和交付阶段]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n20\">[药品、资金与陆军援助]</a></sup></p>\n<p>英国外交部信息研究部（IRD）于1965年10月准备匿名反共宣传材料，经新加坡联络并借外国媒体渠道散发；澳大利亚政府机关指导对印尼广播的内容，广播主管机关并将印尼陆军的反应反馈给政府。英军在婆罗洲的克莱特行动沿边境军事指挥链推进；日本政府和大使馆通过贷款、贸易、特使与苏加诺政府、印尼陆军及地区调停方接触。英国宣传、澳大利亚广播、日本外交和美国名单、资金及军方援助由不同机关审批，面向不同对象。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n67\">[英国IRD宣传行动]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n115\">[澳大利亚广播指导]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n120\">[日本使馆与东京渠道]</a></sup></p>\n<p>1965年末至1967年，美国及其他债权国把大米、药品、棉花、贷款和债务重组纳入对印尼新领导层的接触。印尼军方提出紧急粮食需求，美国政府讨论援助授权、国会审批、PL-480粮食销售和运送；援助国在东京和巴黎会议上协商债务安排和对印尼的财政支持。政府宣布承诺、批准采购、货物发运、到港与地方分配是不同环节；现存美国文件对美方审批和谈判记录较多，对物资在印尼各地的实际分配记录较少。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n20\">[粮食与药品援助]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n43\">[紧急大米融资渠道]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n47\">[东京—巴黎债务安排]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n68\">[政府间援助协调机制]</a></sup></p>\n<h3 id=\"e-sukarno-dewi-letters\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-sukarno-dewi-letters\">苏加诺与德维：私人通信与外交往来</a></h3>\n<p>印度尼西亚国家档案馆公布的1965年10月通信包括九封标注当月日期的苏加诺英文信和两封未标日期的信，记录总统与日本出生的妻子黛薇（Ratna Sari Dewi）的私人往来。同月，日本政府继续与雅加达交涉贸易、贷款和地区外交。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n194\">[苏加诺—德维通信档案]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n120\">[日本政府与雅加达的外交渠道]</a></sup></p>\n<h3 id=\"e-supersemar\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-supersemar\">“三月十一日命令”与总统权力转移</a></h3>\n<p>1966年3月11日，苏加诺签署“三月十一日命令”（Supersemar），授权苏哈托采取恢复秩序的措施。现存抄本不止一种，文本形成、传递方式和授权范围仍有档案争议。苏哈托随后宣布取缔PKI、改组政府并扩大治安控制；军方行政命令、议会决议和地方人事变更持续压缩苏加诺的实际权力。1967年临时人民协商会议撤销苏加诺总统职权并任命苏哈托为代总统；1968年苏哈托正式就任总统。权力转移通过军队控制、法律措施和政治机关的决定逐步完成。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n23\">[Supersemar与禁党令]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n24\">[1967年总统权力变化]</a></sup></p>\n","years":[1965,1968]},{"id":"chapter-13","title":"十三、新秩序：政治清除、劳动管制与家庭身份审查（1966—1998年）","html":"\n<h2>十三、新秩序：政治清除、劳动管制与家庭身份审查（1966—1998年）</h2>\n<p>1966年，军方把1965年危机转为一套新的国家制度。临时人民协商会议第25号决议解散PKI、禁止其组织，并禁止公开传播和发展共产主义、马克思列宁主义思想。军队以“军队双重职能”（Dwifungsi ABRI）为依据，既承担国防，也进入政府、议会、地方行政和国有企业。左翼政党及群众组织被取缔或强制解散，成员和家属遭到逮捕、身份登记与职业审查；工会、农会、妇女组织、文化团体和校园组织此后都在更严密的许可与安全管理下活动。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n175\">[新秩序法律与军队政治角色]</a></sup></p>\n<h3 id=\"e-new-order-economy\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-new-order-economy\">1967—1970年：外资、森林管理与土地机构重组</a></h3>\n<p>1967年《外国投资法》为外国企业进入矿业、种植园和制造业设立制度渠道；同年《基本林业法》把森林划分和开发许可纳入中央国家管理，同时规定习惯权利须受国家规划限制。新政府逐步恢复对外贷款和投资关系，国家机关、军方经营网络与外资企业进入采矿、林业、农业和基础设施领域。法律改变资源管理的审批结构，实际地权变化仍随地区机关、企业和村社的交涉而异。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n175\">[新秩序经济与资源法制]</a></sup></p>\n<p>1967年西加里曼丹的驱逐发生在印尼军方清剿砂拉越人民游击队／北加里曼丹人民军（PGRS/Paraku）的边境战争背景下。武装组织中有从砂拉越进入印度尼西亚的华人和左翼人员，迁离对象还包括没有参加武装行动的边境华人村民。1967年秋，军方、地方官员和达雅克政治组织发动边境清剿与迁移，数万名华人村民被迫离开原居地，前往山口洋等城镇和集中安置点；沿途发生死亡，村庄、农田和橡胶园被弃置。研究对迁离人数和死亡规模有不同估算；一项回顾估计超过五万五千人被迁离、约三百人死亡。当地达雅克社群有的参与攻击和接收土地，有的保护邻居、协助藏匿财物或拒绝接收土地。Bagak一带调查记录约150公顷原由华人家庭经营的橡胶园和农地后来重新分配。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n175\">[1967年西加里曼丹驱逐、安置与土地变化]</a></sup></p>\n<h3 id=\"e-buru\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-buru\">1969—1979年：布鲁岛政治拘押与强制劳动</a></h3>\n<p>1969年2月，安全行动司令部以第009/KOPKAM/2/1969号决定把一批被列为B类政治拘押者的人送往马鲁古群岛的布鲁岛，交由总检察机关管理和“使用”。B类是国家安全机关的行政分类，不是法院判决。营地居民被编组开垦土地、修路、建房和种植粮食，住处、口粮、通信、探视与迁移受营地管理者控制；配偶和子女经许可探访或随行后，承担生活、照料与教育压力。1970年代末拘押者陆续获释，但回乡并未自动恢复就业、迁居、选举和公共职务权利。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n175\">[布鲁岛拘押令、营地劳动与家属生活]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n27\">[布鲁岛与拘押家庭]</a></sup></p>\n<h3 id=\"e-landafter\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-landafter\">1970年：土地改革法院废止</a></h3>\n<p>1970年第7号法律废止1964年设立的土地改革法院，并把未结案件转交普通法院。原有特别法院允许农民群众组织推荐部分审判成员；废止理由明确指向其组织构成和“纳沙贡”政治基础。土地争议此后由普通法院、土地行政机关和地方官员处理，农民组织通过法律取得的参与位置随之缩小。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n175\">[土地改革法院废止与案件移交]</a></sup></p>\n<h3 id=\"e-new-order-politics\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-new-order-politics\">1971—1973年：选举、政党合并与行政控制</a></h3>\n<p>1971年大选有九个政党和政府支持的功能团体戈尔卡（Golkar）参选。1973年，政府推动九个政党合并为两党：四个伊斯兰政党组建设团结党（PPP），五个民族主义、基督教及其他非伊斯兰政党组印度尼西亚民主党（PDI）；戈尔卡继续以功能团体参选。1975年第3号法律确立两个政党和一个戈尔卡的选举制度。行政机关和安全机构控制候选名单、文官组织、新闻媒体、地方行政和群众组织；公职人员经常被动员支持戈尔卡，军官则继续担任政府、议会和地方职务。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n179\">[新秩序政党体系与选举]</a></sup></p>\n<h3 id=\"e-union-structure\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-union-structure\">1973—1985年：全国工会合并与产业劳动</a></h3>\n<p>1973年，政府推动多个行业工会合并为印尼全体工人联合会（FBSI）；劳动部登记工会、认可谈判代表并规范劳动争议程序。工会没有因此停止工作场所组织：基层工人围绕工资、欠薪、工伤、工时、住宿和工头管理继续谈判、请愿和停工。1985年，FBSI改组为印尼工人联合会（SPSI），中央组织改以单一全国工会体系代表劳动者；政府与安全机关对独立组织的登记和活动设限，出口制造业、建筑业和城市就业扩张则使更多工人进入新的生产单位。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n181\">[官方工会体系与产业劳动]</a></sup></p>\n<h3 id=\"e-malari\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-malari\">1974年1月：马拉里事件（1月15日灾难）</a></h3>\n<p>1974年1月14日至17日，日本首相田中角荣访问雅加达。1月15日，学生游行批评腐败、物价上涨、总统顾问集团权力和外国资本影响；当日和次日，示威与城市骚乱交织，商店、汽车和办公场所遭到破坏、焚烧和抢掠。军方逮捕<a id=\"p-hariman-siregar\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-hariman-siregar\">哈里曼·西雷加尔（Hariman Siregar）</a>等学生领袖，并关闭多家报刊。马拉里（Malari，印尼语“1月15日灾难”）涉及学生的政治问责与反腐要求、民众对日本投资的抗议，以及军政高层间的权力竞争；参与者、指挥关系和各项诉求在事后报告与研究中各有叙述。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n176\">[1974年马拉里事件]</a></sup></p>\n<h3 id=\"e-surveillance\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-surveillance\">1975—1992年：前政治拘押者与家庭身份审查</a></h3>\n<p>1975年第28号总统令规定对九三〇／PKI案件中列为“C类”的人员进行行政甄别，允许符合条件者释放并分列C1、C2、C3；这套国家安全分类与后续公务员处分、释放和待遇程序相连。1976年第20号总统令另规定部分C类人员的选举权审查。地方安全机关随后把政治身份审查用于工作、升学、迁居和公共职务；各地使用“ET”（前政治犯）身份证标记的做法有具体记录。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n180\">[1975年C类分类令与后续审查]</a></sup></p>\n<h3 id=\"e-malari-nkk\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-malari-nkk\">1977—1979年：学生运动与校园管制</a></h3>\n<p>1977—1978年，大学生发表《学生斗争白皮书》，要求总统承担政治责任、召开人民协商会议特别会议，并批评腐败与军方政治地位。1978年4月，教育部长第0156/U/1978号决定规定“校园生活正常化”（NKK），限制校园政治活动；同年5月，教育部高等教育总局发出第002/DJ/Inst/1978号指示，把学生事务交由大学副校长和院系副院长管理，并设立学生事务协调机构（BKK）。1979年第037/U/1979号决定进一步规定高校学生组织形式，取代具有独立政治代表功能的大学学生会。教育部和大学行政体系执行校园制度，军方另以逮捕和封校限制学生行动。校外读书会、法律援助和人权团体随后成为学生参与社会政治的组织渠道。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n181\">[1978—1979年白皮书与校园管制]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n181\">[校园管制与政治行动研究]</a></sup></p>\n<h3 id=\"e-offcampus\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-offcampus\">1980年代：校外学生网络与地方抗争</a></h3>\n<p>校园组织受到限制后，日惹帕拉甘研究会（Palagan Study Club）等读书会与法律援助团体同工人、农民和人权活动者建立联系。1988年前后，帕拉甘成员因政治活动被捕并按颠覆罪起诉；另一些学生参与反对克东翁博水库建设造成的农户迁移。1990年代的民主团体、独立工会和农民组织中有校外活动者参与，议题与人际联系延续到新的组织网络。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n181\">[校外学生网络与克东翁博行动]</a></sup></p>\n<h3 id=\"e-sbsi\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-sbsi\">1992年：独立工会与SBSI</a></h3>\n<p>1992年，工会活动者<a id=\"p-pakpahan\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-pakpahan\">穆赫塔尔·帕克帕汉（Muchtar Pakpahan）</a>与多省工人建立印度尼西亚繁荣工人联合会（SBSI），在SPSI体系外组织独立工会。SBSI围绕最低工资、结社权、工厂安全和工会登记发动集会、谈判和罢工；政府动用安全机关、行政登记程序和刑事案件回应其活动。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n176\">[SBSI与独立工会]</a></sup></p>\n<h3 id=\"e-marsinah\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-marsinah\">1993年5月：马西娜案</a></h3>\n<p>1993年5月3日至4日，东爪哇西多阿佐（Sidoarjo）的Catur Putera Surya（CPS）钟表厂工人罢工，要求支付法定最低工资并承认工人代表。5月5日，部分工人被军方人员叫去，工会和人权组织后来指称他们被要求签署辞职文件；活动者<a id=\"p-marsinah\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-marsinah\">马西娜（Marsinah）</a>随后失踪，5月8日，她的遗体在恩甘朱（Nganjuk）被发现。初审判决曾判数人有罪，1995年最高法院撤销有关定罪；国际劳工组织后来记录，政府调查没有查明杀害经过。关于绑架和杀害的具体责任，工会及人权调查提出过军方涉入的指控，但法院没有确认凶手或完整案情。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n176\">[马西娜案与国际劳工组织记录]</a></sup></p>\n<h3 id=\"e-prd-1996\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-prd-1996\">1994—1998年：PRD、民主党总部袭击与新秩序危机</a></h3>\n<p>1990年代，学生、工人、农民和人权组织围绕工资、土地征用、政治拘押、选举和新闻自由建立公开或半公开网络。民主学生团结组织（SMID）、印度尼西亚工人斗争中心（PPBI）和全国农民联盟（STN）与人民民主联盟（PRD）建立组织联盟；1996年，PRD以人民民主党名义公开提出多党政治、独立工会、结束军方政治特权和反垄断等要求。政府把这些团体称作“新共产党”，以颠覆罪逮捕活动者。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n176\">[PRD及其关联组织]</a></sup></p>\n<p>1996年7月27日，一批亲政府支持者冲击雅加达民主党（PDI）总部，将支持梅加瓦蒂·苏加诺普特丽的人赶出；警察和军队在现场的处置及是否预先纵容冲击，成为后续调查和争议焦点。随后雅加达发生骚乱。军方称人民民主党（PRD）策划了骚乱；1997年PRD主席<a id=\"p-budiman\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-budiman\">布迪曼·苏贾特马科（Budiman Sudjatmiko）</a>被判十三年，1998年上诉后刑期增至十五年。工会活动者<a id=\"p-dita-sari\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-dita-sari\">迪塔·英达·萨丽（Dita Indah Sari）</a>等人也因独立工会与反政府活动被判刑。审判中的定罪与事后对暴乱起因的调查结论必须分别记录。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n176\">[PDI总部袭击与PRD审判]</a></sup></p>\n<p>1997年亚洲金融危机使印尼盾急剧贬值，企业融资、就业和家庭购买力受到冲击；国际货币基金组织的救助协议要求政府关闭部分银行并削减补贴，物价和权贵资本主义问题进入抗议。1998年5月12日，雅加达三一一大学（Trisakti）示威中四名学生遭枪击身亡。5月13日至15日，雅加达和其他城市发生大规模骚乱，商店、住宅遭纵火和抢掠，华人社区受到集中攻击。联合事实调查组（TGPF）报告将调查材料分列为85名性暴力受害者：52宗强奸、14宗伴有殴打的强奸、10宗性攻击或殴打、9宗性骚扰。报告记载，多数已报告强奸受害者是华裔女性；骚乱中的袭击对象还包括其他族群。5月21日，苏哈托辞职，哈比比接任总统。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n176\">[1997—1998年危机、骚乱与政权更替]</a></sup></p>\n","years":[1966,1998]},{"id":"chapter-14","title":"十四、改革时代：工会复归、权利诉求与历史记忆（1998—2026年）","html":"\n<h2>十四、改革时代：工会复归、权利诉求与历史记忆（1998—2026年）</h2>\n<h3 id=\"e-reformasi\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-reformasi\">1998—2004年：政治开放、工会复归与法律权利</a></h3>\n<p>苏哈托辞职后，工会、新闻媒体、农民组织、学生团体和新政党重新进入公开活动空间。1999年举行多党选举，宪法随后经四轮修订，确立总统任期限制、直接选举总统和副总统、建立宪法法院，并扩大地方自治。总统选举仍由人民协商会议选出，直到2004年首次举行全民直接总统选举。行政权力下放改变了地方政府处理土地、投资和劳动争议的方式，中央政治控制减弱后，地方军政网络与地方资本仍能影响资源分配。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n178\">[1999—2004年宪制改革与选举]</a></sup></p>\n<p>1998年6月，哈比比政府批准国际劳工组织第87号《结社自由和保护组织权公约》；2000年第21号《工会法》允许工人建立多个独立工会。1999年，工会活动者迪塔·英达·萨丽获释。工会由秘密联络、街头抗议扩展到工厂组织、集体谈判、劳动法诉讼和国际劳工组织申诉。2003年《劳动法》设定新的劳动关系和雇佣规则，围绕临时合同、外包、解雇和工资的争议持续进入工厂行动和议会政治。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n31\">[结社自由公约与工会法]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n32\">[迪塔·英达·萨丽获释]</a></sup></p>\n<p>前政治拘押者和家属通过选举与宪法诉讼挑战政治资格限制。2003年选举法第60(g)条限制与九三〇事件及被禁组织相关的若干群体竞选众议院（DPR）、地区代表理事会（DPD）和地方众议院（DPRD）；2004年宪法法院裁定该条违宪并失去法律效力。2008年总统选举法另设总统候选人限制，2017年选举法也保留相关条款；总统候选人与立法机关候选人的资格规则分别由不同法律规定。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n29\">[前政治拘押者的身份诉讼与选举资格]</a></sup></p>\n<h3 id=\"e-komnas\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-komnas\">2008—2012年：国家人权委员会调查</a></h3>\n<p>幸存者和家属通过口述史、地方调查、纪念活动、身份诉讼和民间档案重新进入公共记录。国家人权委员会（Komnas HAM）于2008—2012年调查1965—1966年事件，并把材料作为严重人权侵害案件提交总检察机关。调查报告提交、总检察机关审查、刑事起诉、赔偿与行政救济分属不同程序；报告提交本身没有启动审判。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n30\">[国家调查与法律程序]</a></sup></p>\n<h3 id=\"e-memory\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-memory\">2015—2022年：公共记忆与国家调查</a></h3>\n<p>2015年以后，幸存者、家属、历史学者和民间团体公开举行纪念活动、发布口述史，并推动恢复被禁政治身份者的公民权利。2016年4月18日至19日，“剖析1965年悲剧”全国研讨会由总统顾问委员会、国家人权委员会、新闻委员会、数所大学、和平与民主研究所和民族联谊论坛共同举办。国家人权委员会2012年提交的调查材料仍在总检察机关审查程序中；公共纪念、调查报告和刑事起诉沿各自制度渠道推进。禁书、校园教学和纪念活动继续引发公开争论。2022年第17号总统决定设立非司法处理工作组；2023年第4号决定设立执行监测组，3月第2号总统指示要求跨部门落实建议。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n187\">[2016年全国研讨会及国家调查]</a></sup><sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n186\">[2022—2023年非司法处理机制]</a></sup></p>\n<h3 id=\"e-recognition\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-recognition\">2023—2025年：政府承认与非司法救济</a></h3>\n<p>2023年1月11日，<a id=\"p-widodo\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-widodo\">佐科·维多多（Joko Widodo）</a>总统代表政府承认包括1965—1966年事件在内的十二类严重人权侵害，并表达遗憾。3月发布的第2号总统指示要求十九名部长及同级官员协调落实非司法处理建议，包括核对受害者名册、提供社会与医疗服务、教育和住房支持，并采取预防再发生措施；指示同时保留司法处理的可能。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n186\">[2023年总统承认与部门执行指示]</a></sup></p>\n<p>国家保护证人和受害者机构（LPSK）2025年度报告于2026年2月发布，记载重大人权侵害案件中有1,521名受保护人，其中1,424人关联1965—1966年事件。报告按服务项目另列医疗、心理社会、丧葬和心理援助。国家人权委员会2024年签发受害者身份确认书，属于另一项行政程序。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n191\">[受害者身份确认与行政服务数据]</a></sup></p>\n<h3 id=\"e-election-2024\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-election-2024\">2024年：工党参加全国选举</a></h3>\n<p>改革后成立的工党（Partai Buruh）由工会、农民组织、劳动者团体和其他社会组织联合组建，参加2024年众议院（DPR）选举。印度尼西亚选举委员会（KPU）第1204号决定记载，工党获得972,898张全国有效票，占约0.64%，未达到4%的议席门槛，没有取得众议院席位。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n177\">[2024年工党选举结果]</a></sup></p>\n<h3 id=\"e-marsinah-suharto-heroes\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-marsinah-suharto-heroes\">2025—2026年：国家英雄授勋与公共记忆</a></h3>\n<p>2025年11月10日，政府向十人追授国家英雄称号，其中包括前总统苏哈托、工人活动者马西娜和萨尔沃·埃迪。总统令第116/TK/2025号于11月6日签署；政府把苏哈托列入“斗争事业”类别，把马西娜列入“社会与人道主义斗争”类别，把萨尔沃·埃迪列入“武装斗争”类别。国家妇女委员会同日表示，授予苏哈托称号可能伤害人权侵害受害者和印度尼西亚妇女运动；这一评价与政府授勋说明并列，显示国家纪念叙事仍有公开争议。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n188\">[2025年国家英雄授勋与公共回应]</a></sup></p>\n<p>2026年11月10日，政府再向19人授予国家英雄称号，其中包括曾任印马对抗时期国防参谋长的<a id=\"p-maraden-panggabean\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-maraden-panggabean\">马拉登·庞加贝安</a>和泗水战役指挥者<a id=\"p-soengkono\" class=\"entity-link\" href=\"../people-events-reference-1830-2026.html#person-soengkono\">苏恩科诺</a>。官方授勋把不同年代的军政人物纳入同一国家纪念体系。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n188\">[2026年国家英雄授勋]</a></sup></p>\n<h3 id=\"e-criminal-code-2026\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-criminal-code-2026\">2026年：新刑法生效</a></h3>\n<p>2023年第1号《刑法典》于2026年1月2日生效。第188条规定，公开传播或发展共产主义、马克思列宁主义及其他被认定与潘查希拉相冲突的思想可处刑罚，同条明确将科学研究排除在处罚之外。第189条规定，以传播上述思想为宗旨建立组织，以及为改变国家基础或推翻政府而同相关组织联系、提供或接受援助的刑罚。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n192\">[2026年《刑法典》第188—189条]</a></sup></p>\n<h3 id=\"e-victim-protection-2026\"><a class=\"event-link\" href=\"../people-events-reference-1830-2026.html#event-victim-protection-2026\">2026年：证人和受害者保护法更新</a></h3>\n<p>2026年5月20日，第3号《证人和受害者保护法》生效，取代2006年第13号法及其2014年修正案。新法把证人、受害者、作为证人的犯罪参与者、举报人、线人和专家纳入保护范围，并规定受害者长期基金、返还、赔偿及中央和地方政府职责。<sup class=\"ref\"><a href=\"../indonesia-left-history-detailed-archive-1830-2026.html#n189\">[2026年证人和受害者保护法]</a></sup></p>\n","years":[1998,2026]}];

window.HIST.processes.push(...[{"id":"pr-001","period":"1830年代—1870年代","title":"爪哇土地、强制种植与村社劳力安排","body":"1830年爪哇战争结束后，殖民政府扩大由官员、地方贵族和村长执行的强制种植制度。村民在维持粮食生产的同时，还须按地方行政安排种植咖啡、甘蔗等出口作物或提供劳动；殖民政府与贸易公司由出口取得收入。纸面规定的土地比例并不能说明各村真实承受的负担，种植地点、收成、赋役与征派方式存在差别。此时尚不存在后来意义上的印尼共产党，但土地与劳动如何被国家及企业组织，已经是后来各类群众政治活动所发生的具体社会环境。","orgs":[],"people":[],"claims":["C040"],"note":"按旧历史正文的殖民史章节复原；各地区村级征派记录仍应继续补齐。"},{"id":"pr-002","period":"1870年代—1900年代","title":"企业长期租地、种植园劳动与城市交通的发展","body":"1870年《农业法》及相关法令改变企业取得长期土地租赁的法律条件，但农民原有习惯土地权利、村社共同使用与殖民政府认定的国家领地并非一致。东苏门答腊种植园的招工和债务约束，与爪哇小农、糖厂季节劳动、铁路职工的生活条件不同。随着运输、印刷、教育和城市就业扩大，劳动者、商人、宗教教师、学生和政府雇员建立跨地区联系。后来的政治组织是在这些彼此不同、持续变化的社会关系中活动，而不是预先存在一个统一的阶级阵营。","orgs":["vstp"],"people":[],"claims":["C040"],"note":"旧正文有相应殖民经济史料注释；不能用爪哇一地代表整个群岛。"},{"id":"pr-003","period":"1908—1914年","title":"铁路职工协会、商业伊斯兰网络与新的政治协会同时出现","body":"铁路与电车职工协会VSTP在20世纪第一个十年出现，早期欧洲职工在其中有重要位置，之后逐步发展印尼籍会员。梭罗的穆斯林商人围绕经营、互助及社会联系组织Sarekat Dagang Islam，活动又向更广泛的伊斯兰联盟（SI）展开。三宝垄在1913年前后形成自己的SI地方机构。几个组织的会员资格、活动场所、刊物与经济基础各不相同；在此时不能把铁路工会、SI地方分会和后来共产党写成同一套组织。","orgs":["vstp","si","sisemarang"],"people":["person-samanhudi","person-mohammad-joesoep","person-raden-soedjono"],"claims":["C1476"],"note":"VSTP成立年份在资料中有1908/1909的差异，须以工会章程和年报核定。"},{"id":"pr-004","period":"1914年—1918年","title":"斯内夫利特等人的ISDV同工会、SI地方人员发生实际联系","body":"1914年5月，斯内夫利特等社会主义活动者建立东印度社会民主联盟ISDV。最初组织人数不多，以欧洲社会主义者为主。通过在VSTP铁路工会、报刊和本地SI活动中的工作，社会主义者才逐渐与印尼籍组织人员发生持续联系。塞马温从青年时期的铁路和SI活动进入这些网络；达尔索诺等人逐渐成为地方政治活动者。一个人可能同时是工会会员、地方SI干部和ISDV成员，不能把这种跨组织关系简写成某党对其他机构的正式隶属。","orgs":["isdv","si","vstp","sisemarang"],"people":["person-sneevliet","person-semaun","person-darsono","person-baars"],"claims":["C1575"],"note":"原始ISDV及VSTP历年会员名册尚未完整取得。"},{"id":"pr-004a","period":"1915年—1919年前后（刊物起点待核）","title":"荷兰文和马来文报刊使欧洲社会主义者与当地活动者逐渐建立语言联系","body":"斯内夫利特与巴尔斯1915年创办荷兰文《Het Vrije Woord》，首先面向能够阅读荷兰文的社会主义者。通过铁路工会、学校及三宝垄SI地方关系，一部分政治写作逐渐转向马来文读者。巴尔斯、塞马温等参与马来文出版活动；《Sinar Hindia》和《Si Tetap》在1918年前后分别同三宝垄SI、VSTP铁路职工组织相关。‘欧洲理论传入印尼’不是一本书被翻译就自动发生：要有会两种语言的编辑、写稿者、印刷工、售报渠道和能够阅读及讨论这些文字的人。不同报刊各有发行机构和目标读者，也可能就议会、罢工与宗教问题发生分歧。至于《Soeara Ra’jat》的首次刊行年份，学术研究有1918、1919两种说法；1921年4月同期刊头标‘第4年’，提供了追查早期刊号的证据，却尚不足以完整重建其创刊及改组。","orgs":["isdv","vstp","sisemarang","presssinar","presssitetap","presssoeara"],"people":["person-sneevliet","person-baars","person-semaun"],"claims":["C1575","C1581","C1582"],"note":"研究来源S889（Oliver Crawford，2020年论文）、2021年报刊原件S891。研究直接核读《Soeara Ra'jat》1921第8号p.1；1918/1919创刊争议须查1918年刊物首号及IISH机构目录。此段不把后来PKI成立倒写为1915年报刊必然终点。"},{"id":"pr-005","period":"1917年—1919年","title":"三宝垄劳动争议、SI政治路线分歧与工会联合","body":"三宝垄的家具、印刷、机械维修及其他企业出现劳动争议。塞马温等地方活动者把工人停工、提高待遇和募捐活动带入SI的报刊与集会。SI全国领导层和三宝垄社会主义者又就殖民地防卫计划、人民议会等问题形成不同意见。这些分歧并非简单的宗教和社会主义两种思想自动相撞，而是发生在具体殖民政策、地方组织活动与工会资源之中。1919年前后，多个行业工会尝试建立PPKB联合机关，但它的组织代表权并不由某一个政党自动取得。","orgs":["sisemarang","sicentral","vstp","ppkb","isdv"],"people":["person-semaun","person-tjokroaminoto","person-agus-salim"],"claims":["C1476"],"note":"逐厂雇主、工资与职工名册仍不足；此处不合并不同罢工为同一统一行动。"},{"id":"pr-005b","period":"1912年—1925年：纺织劳动、商人资本、铁路矿工和学校不断构成地方社会","title":"锡伦康妇女织布、巴东商人学校与沙哇伦多煤矿：共产主义政治进入之前，社会组织已经在那里","body":"西苏门答腊各地的政治行动并非来自一个从爪哇送来命令便立即建立的地下共产党。沿铁路连接的锡伦康是一座靠纺织闻名的小镇；男性商人携布料外出经商，织布妇女则在当地劳动，并形成采购原料、按议定价格向行商及市场出售成品的合作安排。1919年的殖民百科条目已经注意到这种组织，Kahin引述了这一记录；但这些妇女的姓名、合作社法律形式和她们自己的政治态度尚未核得。把她们仅仅写成后来起义者的家属，反而抹掉了早已存在的生产和集体行动。锡伦康的苏莱曼·拉拜是商人，也是能够以宗教故事和演讲吸引年轻人的地方人物；他据后出回忆于1914年建立当地伊斯兰联盟分会。附近沙哇伦多的Ombilin煤矿雇工、铁路和工会则提供另一种社会联系。1920年代初，《Suara Tambang》（矿山之声）等刊物报道矿工与管理人员发生的工资和待遇争议；编辑纳瓦维·阿里夫于1924年遭逮捕。巴东港口的政治活动又有另一条路径：1914年成立的商人联盟Sarikat Usaha，书记穆罕默德·塔赫尔·马拉·苏丹来自航运业，学校教师苏丹·赛义德·阿里也是执行成员；商人阿卜杜拉·巴萨·班达罗资助Adabiah学校与地方报刊，同时在商业上保持与荷兰官员往来。马加斯·阿卜杜勒·马吉德曾被派到巴东开展共产党与人民联盟活动，其最初并未取得广泛成功，1923—1924年殖民机关的拘捕和教师、商人、青年流动才持续改变当地组织力量。上述纺织合作、学校和商人机构、矿区刊物有各自的经济条件、人员和目标，不能因日后部分人参加左翼政治，就倒改为共产党早已建立的统一支部。政治史必须从他们实际做什么、靠什么生活、钱与消息怎样流转以及镇压怎样改变这些关系谈起。","orgs":["si","sr","pki","vstp","sarikat-usaha-padang-1914","silungkang-weavers-coop-1919","press-suara-tambang-1924","pki-padang-1926"],"people":["person-sulaiman-labai-1926","person-taher-marah-sutan","person-sutan-said-ali","person-abdullah-basa-bandaro","person-magas-abdul-madjid","person-nawawi-arief"],"claims":[],"evidence_urls":[{"label":"Kahin 1996 pp.22—29，脚注34—50；引1919殖民百科与1924报刊","url":"https://ecommons.cornell.edu/server/api/core/bitstreams/82df2449-7ab5-4cbb-b5a5-0ded2207169b/content"}],"note":"妇女织布合作组织仅有1919条目经后出论文转述；尚未读1919全篇或原始章程。政治组织关系仅指经记录的人际与商贸联系，不推定纺织合作社直接参与起义或妇女均属某党。"},{"id":"pr-006","period":"1920年4月10日—5月23日","title":"《人民之声》记录了ISDV实际活动，组织随后作出改组决定","body":"1920年4月10日，《Soeara Ra’jat》第3号自称ISDV机关刊物，并列达尔索诺、J. A. Dengah为编辑。刊物报道工人罢工与募款事项，说明组织已经通过出版与地方劳动行动保持联系。5月，ISDV代表会议决定采用共产主义政党名称并与共产国际建立正式联系，塞马温等人成为新的领导人员。这里需要同时查五种不同记录：会议出席者、当选领导、正式党籍、原SI分会职位以及VSTP工会职位。这些名单不能因人员重叠而互相替代。","orgs":["isdv","pki","sisemarang","vstp"],"people":["person-semaun","person-darsono","person-dengah","person-bergsma","person-dekker"],"claims":["C1579","C039","C1576"],"note":"1920建党领导的后出名单可查，但尚无完整原始签到和全体创党党员名册。"},{"id":"pr-007","period":"1921年4月30日","title":"三宝垄SI地方机关公开反对中央的双重党籍限制","body":"1921年4月30日《Soeara Ra’jat》第8号第4—5页刊登《三宝垄SI关于党纪的考虑》，末尾署名为布迪苏齐特罗（BOEDISOETJITRO），主张不应以中央党纪阻断SI与共产党人之间的合作。这是地方SI争议公开化的同期文本，而非全国各地支部已经完成的统一决议。报纸第5—6页另起一篇涉及创办学校及筹集资金的文告，末尾明确写有‘A.n. Bestuur S.I. Semarang’，署名塞马温为主席、布迪苏齐特罗为书记。这两组署名分属不同文章，不能合并成二人共同签署党纪声明。地方讨论、SI中央决议、其他支部实际执行及会员改换组织，必须分别考察。","orgs":["sisemarang","sicentral","si","pki","sr"],"people":["person-semaun","person-boedisoetjitro","person-agus-salim","person-abdoel-moeis"],"claims":["C1583","C1576","C2891"],"note":"已直接逐页复核1921-04-30《Soeara Ra'jat》第8号p.4—6原扫描（S891），发现现行原C1583曾混同前后文章，现已在正式claim-ledger分拆修正为C1583与C2891。"},{"id":"pr-008","period":"1921年5月—10月","title":"丹·马拉卡的出版、学校和学生组织作为现实活动展开","body":"1921年5月16日《人民之声》刊载丹·马拉卡《苏维埃还是议会？》第一篇文章；后续连载和小册子出版有可查期号。6月21日前后，他在三宝垄SI分会会堂开始办学。教育包括算术、读写、语言、地理和学生自治活动；学生人数在不同日期分别被记为约50、64、80与123，不能拼成一次招生总数。地方学校经费和筹款活动受到殖民机关限制，殖民官员还审查学生演唱《国际歌》等活动。学校既是教育机关，也是地方组织者与家庭建立长期联系的具体场所。","orgs":["sisemarang","sischool","si","pki"],"people":["person-tan-malaka","person-semaun"],"claims":["C1585","C1586","C1588","C1589","C1591","C2891"],"note":"具体学生人数与月份存在原著正文/注释差异；需以校务及同期报刊核对。 另1921-04-30第8号第5—6页的SI分会学校募款通告可证明当月仍在筹备与募集资助，但不能单靠它证明6月21日确已开学；“6月6日／6月21日”的相异叙述需同时查同期6月各期报刊。"},{"id":"pr-008a","period":"1921年4月—1923年（编辑、阅读与翻译不断变化）","title":"报纸的一期中同时出现党纪、学校与政治传播，印刷网络并不等同统一组织","body":"1921年4月30日，三宝垄《Soeara Ra’jat》明确标为共产党机关报，封面列编辑Partondo、行政H. W. Dekker及VSTP三宝垄办公地址。这三个信息意味着刊物有公开的政治归属、具体办报岗位和使用的工作地点，却不能推出同一人员必然兼任党、工会与SI全国机关。第4—5页布迪苏齐特罗署名讨论SI双重党籍，第5—6页另外刊载面向居民的学校筹办与募款呼吁，并由塞马温和布迪苏齐特罗以三宝垄SI分会职务署名。随后丹·马拉卡的《苏维埃还是议会？》在该报连载，后来又印成小册子。1923年前后，马来文《共产党宣言》翻译在刊物上连载并通过印刷渠道传播。报纸与学校不是两种互不相干的‘宣传方式’：前者把组织讨论、劳动者要求和办学筹资介绍给读者，后者将儿童、家长、教师和地方筹资联结起来。真正需要调查的是谁付钱、谁审稿、谁排印、谁买报或捐款、哪些学生和家庭参与；目前原刊可确认署名和文本，不能证明实际印数、阅读人数或每个人的党籍。","orgs":["presssoeara","presssinar","vstp","sisemarang","sischool","pki"],"people":["person-partondo","person-dekker","person-semaun","person-boedisoetjitro","person-tan-malaka"],"claims":["C1581","C1582","C1583","C1585","C1586","C2891"],"note":"S891同期扫描p.1与p.4—6已经直接核验；正式C1583/C2891已分别校正党纪文章与学校文告署名。1923年印刷与翻译参照S889学术研究，印数/读者分布需查企业账簿和原报全套；特别不能把捐款倡议当作已收到款项。"},{"id":"pr-009","period":"1921年—1923年","title":"行业工会联合体分化，地方群众组织也逐渐重新归属","body":"1919年形成的工会联合网络在1921年前后分化，三宝垄方面形成革命工会联合会RVC，日惹等地仍有原PPKB相关机关。塞马温、布迪苏齐特罗等人在RVC中活动，另一侧则有阿卜杜勒·穆伊斯、阿古斯·萨利姆等人员。工会分化涉及不同产业代表、罢工策略与对SI、PKI关系的立场。与此同时，部分亲共SI地方组织后来以Sarekat Rakyat（人民联盟）等名义活动，但普通人民联盟会员不是PKI正式党员。 1921年10月塞马温离开荷属东印度，后出研究记丹·马拉卡在同年12月的PKI大会当选主席；这是一项具体组织人事变化，不能因为他此前参与学校教育便推断学校在正式制度上直接隶属PKI。关于大会确切日期、完整候选人名单和选票，仍需从同期党报、会议公报和殖民监察材料核验。","orgs":["ppkb","rvc","si","sr","pki"],"people":["person-semaun","person-boedisoetjitro","person-abdoel-moeis","person-agus-salim","person-tan-malaka"],"claims":["C1476","C1576"],"note":"已知不同联合会领导线索，正式成员名单及具体工会代表资格仍需原报刊核实。 补充的1921年主席交接据Crawford 2020与Jarvis 1987后出研究，不据未经查阅的原始党大会记录；相关原始任职尚缺正式C编号。"},{"id":"pr-010","period":"1923年4月—5月","title":"铁路职工要求、塞马温被捕、停工和政府干预接续发生","body":"VSTP围绕工资、生活费用、工作时间和劳动争议解决机制与铁路管理机关交涉。不同地方分会讨论是否采取停工。5月8日工会负责人塞马温被捕；5月9日罢工沿爪哇多条铁路线路展开。铁路企业及殖民政府使用解雇、警察和军事守卫等方式应对。对VSTP而言，重要的后果不只是罢工是否‘成功’，还包括原有车站联系人、干部工资来源、工会财政和会员组织能力如何受到影响。不能把所有参与铁路停工的职工都写成PKI党员。","orgs":["vstp","pki"],"people":["person-semaun"],"claims":["C1610"],"note":"具体车站、参加人数、交涉条件和被解雇名单应回读公司及工会原件。"},{"id":"pr-011","period":"1924年6月—12月","title":"党名、中央驻地和当期领导人员继续发生变化","body":"1924年6月代表大会前后，党使用Partai Komunis Indonesia这一名称，组织重心由早先三宝垄向巴达维亚转移。后出组织史列阿里巴萨·维南塔为主席，布迪苏齐特罗为书记，阿里阿尔查姆、阿里敏、穆索为中央领导成员。12月又记萨尔佐诺接替维南塔担任主席；同一时期党与人民联盟记录的是不同的会员数量。这里首先应分开讨论中央委员、各级地方代表、人民联盟会员以及实际负责铁路工会的人，不能只用‘PKI领导人’笼统指代。","orgs":["pki","sr","vstp"],"people":["person-winanta","person-sardjono","person-boedisoetjitro","person-aliarcham","person-alimin","person-musso"],"claims":["C039"],"note":"具体当选名册主要来自后出组织史，党代会原始文本需进一步校勘。"},{"id":"pr-012","period":"1925年—1926年","title":"公开组织受限，国内秘密会议与海外不同路线并存","body":"殖民政府限制公开集会、出版与工会活动，并继续逮捕政治干部。1925年末，萨尔佐诺等人员在普兰巴南秘密讨论武装行动。丹·马拉卡在海外反对在组织和群众准备不足时仓促行动，阿里敏、穆索则继续同海外共产主义网络联系。会议参加者、实际中央委员、发往地方支部的通知以及参与军事准备的人员，必须分别核查。更不能用后来起义失败证明所有当事人当时都知道行动会失败。","orgs":["pki","pari"],"people":["person-sardjono","person-boedisoetjitro","person-alimin","person-musso","person-tan-malaka"],"claims":["C2186","C2159"],"note":"普兰巴南会议的全部原始出席与表决记录尚未取得；不同后出名单不自动等于正式中央委员会名册。 新补1928殖民调查报告与共产国际后出研究记录相互矛盾的不同会议、签署与参与人员，不应将所有记述自动合并为12月25日唯一大会。见notes/1925-1926-prambanan-participants-local-orders-evidence.md。"},{"id":"pr-012a","period":"1925年末，若干秘密讨论与签署日期待区分","title":"秘密会议不是一张既定名单：中央备忘录、不同参会者和工会聚会相互交叠","body":"1925年间各地罢工、殖民行政的集会限制及共产党内部财政困难并行发展。1928年西苏门答腊殖民调查报告（1960年英译出版）称12月在索洛／普兰巴南地区举行秘密会议，由阿里敏主持，列有苏丹·赛义德·阿里、布迪苏齐特罗、阿里阿尔查姆、Jahja、Sugono、Surat Hardjomartojo等人；又称12月16日有萨尔佐诺、维南塔、布迪苏齐特罗三人署名的中央备忘录，提出次年行动的准备。1960年印尼共产党回顾的名单却包含萨尔佐诺、苏普罗佐、纳约安、马斯·马尔科等不同名字；其他档案研究还涉及12月22日三宝垄VSTP总部会议，另有回忆以12月25日为节点。‘出席会议’‘签署文件’‘被后世党史列为领导’绝不是同一种身份。既存材料足以看见讨论、组织财政与跨地区通讯，但无法把所有会议及签字合并成一个确定的全体出席名单；1928殖民报告和1960党史各自带有形成时的政治条件。","orgs":["pki","vstp","pki-solok-1926"],"people":["person-alimin","person-sardjono","person-winanta","person-boedisoetjitro","person-aliarcham","person-sutan-said-ali"],"claims":[],"evidence_urls":[{"label":"Cornell 1960殖民调查报告英译p116—118","url":"https://pustaka.taratsa.id/download/746/pdf/746.pdf"},{"label":"后出共产国际档案史研究","url":"https://filedn.eu/lpwTKmJuSKCLNjzDCWvh2dm/arsiv/mete-tuncay-arsivi/MT_67.3.3.pdf"}],"note":"直接核读Cornell译本可检索文字p116—118，网页扫描截图因PDF体积报错；原始1925-12-16备忘录、各会原签到未取。此段暂不冒用旧C编号，先以直接引用和专门研究档案支持，等正式claim-ledger能安全更新再逐条登记。"},{"id":"pr-012b","period":"1926年1月—2月：代表指令经过怀疑、越级派人、再回复","title":"苏门答腊的地方小组没有自动服从：索洛克、沙哇伦多与锡伦康要求重新确认命令","body":"西苏门答腊的实际组织关系比‘中央计划传达给地方’更复杂。1928年殖民调查报告（1960年由Benda与McVey编译）说，苏丹·赛义德·阿里返回巴东后向索洛克地方负责人伊德鲁斯传达此前秘密会议的决定，并要求转给锡伦康和沙哇伦多。几处地方小组质疑他的正式代表资格，派萨伦越过这位地区代表赴爪哇求证；萨伦据报未获中央正式接见，却由达兰私下通报。报告还引1926年2月1日中央第59号回信，确认阿里的代表资格，并拒绝接待绕过他的人。然而这份殖民报告自身存在重要日期问题：它写阿里到1926年‘1月末’才回巴东，却又写伊德鲁斯已在‘1月21日’致信中央解释因阿里传令引发的争议。若两日期都准确，原文所叙事件的先后便不成立；在取得1月21日原信、返程记录及2月1日回函以前，不能照报告的行文顺序填成确定的‘返乡—传令—质疑—发信’时间线。报告另说伊德鲁斯在回信送达前被判入狱，地方组织因干部失散而衰弱；这同样是待与警察、地方党组织和家属档案交叉核查的叙述，而非原信已在本研究中验明。","orgs":["pki","pki-solok-1926","pki-sawahlunto-1926","pki-silungkang-1926"],"people":["person-sutan-said-ali","person-idrus-solok","person-sarun-1926","person-dahlan-1926"],"claims":[],"evidence_urls":[{"label":"1928西苏门答腊殖民调查报告英译p116—118","url":"https://pustaka.taratsa.id/download/746/pdf/746.pdf"}],"note":"1928调查报告英译pp.116—118的内部时间矛盾：‘1926年1月末返巴东’与‘1926年1月21日伊德鲁斯致信’不可直接串成前后因果；原来稿件把该矛盾忽略，现已修正。需核原函、交通及同日报道；报告有殖民行政立场。"},{"id":"pr-012c","period":"1923年—1926年12月：西苏门答腊地方组织各自转变","title":"巴东、巴东班让、锡伦康并没有接受同一张行动命令：教师、商人、地方干部与使者的选择","body":"西苏门答腊的左翼运动并非从1925年爪哇秘密会议才突然出现。巴东和巴东班让早已有伊斯兰学校、商人社团、人民联盟和报纸相互联系，苏丹·赛义德·阿里曾在巴东的Adabiah学校任教，并参与商人团体；锡伦康的苏莱曼·拉拜则在宗教演讲及地方社会活动中积累人际联系。不同城市里，教师、青年学生、商人和职工并不自动拥有相同党籍。1924年前后殖民政府的逮捕改变了干部结构，党地方机关与人民联盟的力量也并不等量。到1926年，命令如何传达和地方干部实际愿意做什么之间的距离更加明显。Kahin引资料称，西苏门答腊代表苏丹·赛义德·阿里在5月到棉兰时被拘；9月，丹·马拉卡在新加坡主持会议，反对爪哇方面仓促发动的武装行动，巴东班让新任地方负责人阿里夫·法德利拉参加后返回当地，继续反对行动。与此同时，来自爪哇的巴哈鲁丁·萨莱赫在10月初尝试传播新计划，巴东和锡伦康部分人员一度愿意配合；10月13日锡伦康地方领导苏莱曼·拉拜被捕，改变了当地的判断和干部层级。巴东10月20日改组后由穆罕默德·努尔·易卜拉欣主持；他11月14日被拘、笔记落入殖民当局手中，使地方联络遭到进一步打击。12月20日锡伦康仍有人员开会讨论是否行动，卡马鲁丁（称号Manggulung）对会议的影响，在殖民资料和印尼政治叙述中评价明显冲突。正是这些差异、逮捕、逃亡、地方会议与消息的延迟，而非一纸中央指令，构成1926年末到1927年初西苏门答腊不同选择的历史过程。上述人物与日期主要来自Kahin对殖民档案、当时报刊、回忆及既有研究的综合重建；目前尚未把每份当期原件单独核完，也不把某一作者推断直接升格为正式已证实的中央命令。","orgs":["pki","sr","pki-padang-1926","pki-padangpanjang-1926","pki-silungkang-1926"],"people":["person-sutan-said-ali","person-tan-malaka","person-sulaiman-labai-1926","person-arif-fadlillah-1926","person-baharuddin-saleh-1926","person-muhammad-nur-ibrahim-1926","person-kamaruddin-manggulung-1926"],"claims":[],"evidence_urls":[{"label":"Audrey R. Kahin，《The 1927 Communist Uprising in Sumatra: A Reappraisal》，1996，pp.26—32","url":"https://ecommons.cornell.edu/server/api/core/bitstreams/82df2449-7ab5-4cbb-b5a5-0ded2207169b/content"}],"note":"后出学术综合不等于逐份当期原件已核；民族主义/殖民行政对12月会议者的评价相反。没有用1927年结果倒推1926年全体党员一致同意起义。"},{"id":"pr-012e","period":"1926年6月28日及之后：巴东班让地震、通信中断与组织生活条件","title":"1926年巴东班让遭遇的是大地震，不应仅据后出政治史写成火山喷发","body":"1926年6月28日，巴东班让及西苏门答腊周边地区遭到破坏性地震。印尼国家减灾机构BNPB收藏的1926年6月29日《De Maasbode》与6月30日《Nieuwe Haarlemsche Courant》报刊报道，讲到学校、车站、邮局、药房以及民居损坏，铁路、山谷公路和电报线路中断。当地既有学校的学生、借商路往来的商人、矿区工人与党派交通人员，并不是生活在不受灾害影响的抽象组织网络中；道路阻塞和邮政中断至少说明当时信息和援助运输具备真实物质障碍。报道还记一个未具名华人居民冒险前往巴东报告灾情、医生和警察次日尝试进入灾区，这是行动者和信息渠道的具体存在，不能擅自给他编造姓名或推断党籍。重要史料分歧：Kahin 1996年讨论1927年起义前的地区力量时，将1926年6月巴东班让大规模破坏归于Mt. Merapi火山喷发；但BNPB后来整理的同期荷兰文报刊明确称当时发生地震，而该机构收录的地质研究将1926年灾害归类为苏门答腊活动断层相关的构造地震。故当前叙事以‘1926年6月28日地震’描述破坏，并将后出论文‘火山喷发’标为有待作者文本校订的冲突，不据地震本身推断究竟哪一位当地共产党人因此改变政治主张、迁移或被拘。救援、学校停课、社团通信和地方家庭实际损失仍须通过校务、邮政、殖民行政和个人信件追踪。","orgs":["pki-padangpanjang-1926","sr","pki"],"people":[],"claims":[],"evidence_urls":[{"label":"BNPB收藏：1926-06-30《Nieuwe Haarlemsche Courant》转录","url":"https://sejarah.dibi.bnpb.go.id/koleksi-sejarah-bencana/kliping-koran/172"},{"label":"BNPB：1926-06-28巴东班让地震的同期报刊分析","url":"https://sejarah.dibi.bnpb.go.id/artikel/gempa-padang-panjang-28-juni-1926-dalam-surat-kabar-kolonial/65"},{"label":"BNPB：1926／2007巴东班让构造地震比较","url":"https://sejarah.dibi.bnpb.go.id/publikasi-ilmiah/Fenomena-Gempabumi-Merusak-Padang-Panjang-1926-dan-2007-sebagai-Panduan-Mitigasi-Risiko-Gempabumi-di-Masa-Kini-dan-di-Masa-yang-Akan-Datang/8"},{"label":"Kahin 1996，p.34：不同的‘火山喷发’描述","url":"https://ecommons.cornell.edu/server/api/core/bitstreams/82df2449-7ab5-4cbb-b5a5-0ded2207169b/content"}],"note":"强证据支持1926-06-28地震而不是单纯火山喷发解释；BNPB网页提供同期荷兰报纸的翻译／转录，本轮尚未独立读取原纸图像。关于灾害与具体PKI支部行动的因果关系没有具体成员记录，不予虚构。"}]);
