window.HIST.processes.push(...[{"id":"pr-013","period":"1926年11月—1927年1月","title":"不同地区的武装行动先后发生，地方人员与殖民军警正面冲突","body":"巴达维亚与万丹在1926年11月发生武装活动，西苏门答腊在1927年1月出现相关行动。几处地方的组织联系、动员对象和准备时间不一致；秘密会议决定与实际参加者的行为之间还隔着交通、通信、财政、武器与地方干部的判断。殖民政府通过警察、军队、行政拘押和情报名单进行镇压，被逮捕者既有行动参加者，也包括被认为属于共产主义网络的人。不能用一次笼统的‘PKI全国起义’替代各地实际行动与组织身份。","orgs":["pki","sr"],"people":["person-sardjono","person-alimin","person-musso"],"claims":["C625","C868"],"note":"地方起义者和指挥者名单及殖民机关具体命令仍需按地区档案查验。"},{"id":"pr-013a","period":"1926年12月20日—1927年1月上旬：会议决定、断联与地方实际交战","title":"锡伦康约定的行动并没有照计划实现：联络员失踪、巴东班让负责人被捕与矿区军营的不同遭遇","body":"1926年12月20日前后，锡伦康一批地方参加者仍在讨论是否采取行动。他们关心的不是一个遥远的全国时间表，而是巴东班让负责人阿里夫·法德利拉究竟支持什么、附近沙哇伦多矿区的工人和驻军会不会配合、交通与消息是否畅通。Kahin的研究指出，一名在巴东班让与锡伦康间传话、被称为‘利敏’（Limin／Alimin）的人从1926年5月起参与地方联络；他与共产党全国领导人阿里敏·普拉维罗迪尔佐不是同一人，不能因为同样出现‘Alimin’就把地方传话归到全国领导身上。地方人派他再次去寻找阿里夫·法德利拉，但他发现后者在12月28日已遭逮捕，随后未及时向锡伦康通报而离开。锡伦康参加者仍在等他的消息。当地人的计划曾设想在1927年元旦夜发动行动，争取沙哇伦多军营和矿工的支持；然而殖民当局已经提前拘捕被认为可能支持这一计划的驻军人员，计划中的主要军营行动并未发生。真实的冲突发生于锡伦康周边多个村社，参加者的人数、方向和行动各不相同。阿卜杜勒·穆卢克·纳苏蒂安带领一队人员向沙哇伦多行进，随即被拘；阿卜杜勒·穆纳普则与巴东西布苏克附近另一支队伍的袭击联系在一起，不能把这两位名字相似的人说成同一名指挥官。相关追捕、审判和人员命运持续到1927年以后。这里必须把地方会议参与、可能的驻军响应、已经执行的行动、预先拘捕及事后殖民司法分开；Kahin综合当事回忆与殖民文书，尚不能代替每一份1926—1927年原签名、通信和审判档案。","orgs":["pki","sr","pki-silungkang-1926","pki-padangpanjang-1926","pki-sawahlunto-1926"],"people":["person-arif-fadlillah-1926","person-limin-messenger-1926","person-abdul-muluk-nasution-1927","person-abdul-munap-1927","person-sulaiman-labai-1926"],"claims":[],"evidence_urls":[{"label":"Kahin 1996，印刷pp.31—34及脚注66—77","url":"https://ecommons.cornell.edu/server/api/core/bitstreams/82df2449-7ab5-4cbb-b5a5-0ded2207169b/content"}],"note":"特别注意三个陷阱：Limin与全国PKI领袖Alimin不是同一人；原计划的矿区驻军行动不能写成已完成；阿卜杜勒·穆卢克与阿卜杜勒·穆纳普不是同一人。冲突、拘押和司法数字由不同时段资料产生，不可机械相加。"},{"id":"pr-014","period":"1927年2月以后","title":"行政流放形成新的居住、劳动和家庭生活结构","body":"殖民政府把部分政治拘押者及家属运往新几内亚博文迪古尔等拘押地点。1927年2月1日有关运输记录显示首批一组45名被拘者和43名家属离开丹戎不碌。营地内划分官方管理区与流放者居住区，生活涉及配给、劳动、医疗、通信及家属安排；殖民政府建立指纹、名册和死亡登记。相同‘流放者’标签并不能说明所有人有相同党籍，更不能让随行家属自动成为政治犯。之后数年有人获释、转移或死亡，这些是实际发生的不同结果。","orgs":["pki","sr"],"people":["person-tan-malaka"],"claims":["C328","C855","C864"],"note":"营地原始人员、家属与劳动册已有具体馆藏线索，尚未全量逐人转录。"},{"id":"pr-014a","period":"1927年6月13日及之后","title":"被流放者不是抽象的集体：同时期报纸已经列出具体人员","body":"1927年6月13日《Sin Jit Po》的一份被流放者名单，经后来研究辨认出I. Makki（亦作I. Mangki）、Noeroet gelar Soetan Radja Endah、Pio、Ishak以及Mohamad Sjahmin gelar Pandji Nagara等名字。来源还描述这些人的商业、测绘、出版、新闻和其他社会活动背景。这说明‘被送去博文迪古尔的人’可以继续恢复为具体的个人生活、职业、社群与政治联系；但报纸名单本身不自动证明每人参加了1926年当地军事行动，也不能充作所有被流放者的完整名单。","orgs":["pki"],"people":[],"claims":["C855"],"note":"需查报纸原件与殖民拘押令，逐人对齐拼写、身份、押送日期和家庭记录。"},{"id":"pr-015","period":"1926年12月—1927年6月","title":"海外干部继续会谈、被拘押和建立新的组织","body":"穆索与阿里敏在1926年末到达新加坡后遭英国机关逮捕，1927年3月引渡争议经法院程序处理。与此同时，丹·马拉卡同原有共产党组织人员对国内行动条件的分歧并未消失。1927年5月，他与苏巴卡特、贾马鲁丁·塔明在曼谷商议建立新的活动网络，6月成立PARI。PARI、海外共产国际联系人以及国内残存的组织关系应分开调查，不能把它们写成同一个指挥部沿途迁移。","orgs":["pki","pari"],"people":["person-musso","person-alimin","person-tan-malaka","person-subakat","person-djamaluddin-tamin"],"claims":["C2187","C2188"],"note":"新加坡警方及法院原件仍需同研究者重建逐一核对。"},{"id":"pr-016","period":"1930—1938年","title":"博文迪古尔营地的管理、人员变更与公开政治质询","body":"1930年Hillen调查及其后的殖民政府报告，提供营地可释放人数、劳动分类和行政处置的互相不完全一致的统计。1931年部分人员获准离开拘押地，但不同统计有撤销流放命令、实际离营、家属迁移等不同口径。夏赫里尔1935年从营地的书信写到官方区域与住民社区的隔离、付费工作与食物短缺。1938年，塔姆林在殖民议会质疑政府关于‘到营后不再强制劳动’的说法。这一段并不是共产党历史的空白，而是拘押、劳动、家庭与殖民法律持续作用的具体社会史。","orgs":["pki","si"],"people":["person-sjahrir","person-thamrin"],"claims":["C857","C860","C862","C881"],"note":"营地政府和被拘者的记录相互有争议，统计口径须分开。"},{"id":"pr-017","period":"1935年—1936年","title":"穆索秘密返印、出版联系与殖民监控","body":"研究者Morriën据海外共产党及相关档案重建：穆索1935年秘密返回印尼，在泗水建立联系人和出版活动，围绕《Indonesia Berdjoang》开展宣传，并尝试用转信地址、交通人员与荷兰共产党、共产国际联系。这些活动是具体人员、经费和通信渠道共同维持的地下网络，不能同1920年代的公开PKI支部视为同一稳定机关。1936年5月他据称经巴厘、香港、上海离开印尼；现有材料并不能证明他在这次离境时已被正式逮捕或驱逐。","orgs":["pki"],"people":["person-musso"],"claims":["C2189","C2190","C2191","C2192"],"note":"需补党报、交通人、经费和殖民监视原档；后出研究不能替代网络全员名单。"},{"id":"pr-018","period":"1942年—1945年","title":"日本占领改变政党活动、生产征调与政治人员训练条件","body":"日本军方1942年进入群岛后，以不同军种和区域军政机构重组殖民行政。粮食征购、运输、工厂生产和强制劳动扩大到大量家庭，地方官员和社区领袖有时被纳入征工及配给管理。苏加诺、哈达等民族主义人士在部分官方动员组织中工作，另有政治活动者处于监禁、地下联络或地方自救状态。PETA等组织训练了一批军事人员，其后来在共和国军队中的经历并不相同。不能从1945年的某个人的党籍，倒推他在全部日占时期一定接受特定党组织的指挥。","orgs":["peta","pki","pni"],"people":["person-sukarno","person-hatta","person-sjahrir"],"claims":["C007"],"note":"日占军事和各地行政账册覆盖不均；不能只写苏加诺个人选择代替整个占领社会。"},{"id":"pr-019","period":"1945年8月—1946年11月","title":"共和国宣言后，青年、武装、劳动和政党机构在不同地方重新建立","body":"1945年8月共和国宣布独立时，印尼并未统一控制全部军队、港口和企业。青年和劳动人员组织BBI等，部分成员参与建立劳动党PBI，但政党机关与工会联合体仍有区别。不同工会讨论是否建立跨行业联合，GASBI、GSBV等联合体在1946年出现不同组织方案。11月29日，SOBSI成立，成为新的全国工会联合组织。这不是后来1951年PKI领导机关创立的‘附属工会’，其已有独立革命时期的人员、行业组织与实践。","orgs":["bbi","pbi","sobsi"],"people":["person-sukarno","person-hatta"],"claims":["C1500"],"note":"成立日期与联合脉络有研究支持，但SOBSI原始全体创始工会、代表名册尚待核实。"},{"id":"pr-019a","period":"1945年9月—1947年5月：不同劳动组织与联合机关的选择","title":"工人不是被一纸党令组织起来：BBI、GASBI和GSBV如何谈判形成SOBSI","body":"共和国宣布独立后，日占时期的工厂、铁路、邮电、学校和地方政府里，工人及雇员面临企业接管、工资、物资配给、政治忠诚和保卫共和国等不同要求。1945年9月的职工会议和BBI正式成立日期在后出史料中有差异，不能把会议日期当作同一个成立日。BBI部分干部转向建设劳动党PBI，也有地方工会不愿让工人组织变成政党机关，继续维持BBI。1946年3—5月间相关工会协商建立GASBI，但行业和职能部门的代表方式发生分歧，6月另出现GSBV。两种联合体都无法因中央声称代表工人就自动管理所有工会。在1946年11月29日日惹会议，GASBI、GSBV代表商议合并建立SOBSI；印尼文化部历史百科依据后出劳动史将Harjono列为主席、Setiadjit为副主席、Njono为总书记。资料没有附1946年签名或投票册，三人职务和各工会实际人数必须继续核查。1947年马朗第一届大会决定加入世界工会联合会WFTU；研究将其早期动机与争取国际劳动者支持共和国独立联系，不能用后来冷战分裂反推1947年全体代表必然只为某一政党行动。","orgs":["bbi","pbi","gasbi","gsbv","sobsi","wftu"],"people":["person-harjono-labor","person-setiadjit","person-njono","person-soerjono-gsbv"],"claims":["C1500","C1505","C1568","C2892","C2893"],"note":"S846是1958年知情的劳动政治人物回顾，S845是后出同行评审研究，S1536是国家历史百科；它们不是1946会议原签到。地方支持合并程度、会费、授权、1947大会表决尚需报刊和档案核对。C1505记录BBI成立日期冲突。"},{"id":"pr-019b","period":"1945年11月，梭罗—日惹；1946年初不同乡村联络继续形成","title":"农民阵线并不是既成的共产党农会：1945年劳动、土地与独立革命中的不同发起者","body":"1945年8月共和国宣告后，土地所有权、庄园接管、农村税负、工人粮食和行政权归属仍远没有落实成新的稳定制度。根据印尼文化部历史百科所引《Suara Tani》1950年回顾和后出研究，1945年11月5—7日梭罗农民与工人集会讨论共同组织，穆罕默德·陶希德（Mochammad Tauchid）、维约诺·苏尔约库苏莫、S. Sardjono、Djadi、Asmoe Tjiptosoedarsono和Sajoga被列为参加组织讨论的人员；11月22—25日日惹的农民大会则被该来源描述为BTI正式建立的会议。两次行动应当分别登记：一次为跨行业人员的初步联络，一次涉及新机构的组织决定。BTI起初不是PKI在1953年才建立的RTI，也不是后来1965年被禁令指向的所有农民群体的合称。已知这些名字仍只是后出的发起者名单，不是全体出席、会费缴纳或首届委员名单；更不能从某人1953年对合并方案的态度，倒推出他1945年就有相同政治路线。研究必须把这些人参与的村级土地争端、地方KNID、农业技术实践、工人团体和行政接管逐项恢复。","orgs":["bti","pki"],"people":["person-mochammad-tauchid","person-wijono-suryokusumo","person-asmoe-tjiptosoedarsono","person-sajoga-bti-1945"],"claims":["C2901","C2903"],"evidence_urls":[{"label":"印尼文化部BTI史条目（S1540）","url":"https://esi.kemenbud.go.id/wiki/Barisan_Tani_Indonesia"}],"note":"S1540是二手历史百科，引用1950《Suara Tani》p.6及2011农业史，原1945两次会议签到和表决册尚未取得。BTI名称及日期在报刊之间仍需比对，不将历史百科所列几人当作完整建党名册。"},{"id":"pr-019c","period":"1943年日本军政统合与1945年11月7—8日共和国独立政治建党","title":"同名Masyumi为什么不是一套从1943年延续不变的党员簿：宗教学校、社团合作与共和国政治结盟","body":"1943年11月日本占领当局创设Masyumi宗教团体协调/监管框架，取代MIAI。这个同名统合架构在军政制度下形成，其成员和职务不能不加审查地变为1945年共和国内一个政党的创党人。共和国独立后，1945年11月7—8日各伊斯兰团体代表在日惹召开会议并组建Masyumi政治党，来自NU、Muhammadiyah等不同宗教教育网络的人参与讨论；政府历史百科记Soekiman等人为早期政治领导者、Wahid Hasyim等参与宗教咨询网络。NU与Muhammadiyah有自己的宗教学校、慈善、教士、妇女、青年和地方组织，这些社会机构不是1945年由同一政党一纸命令凭空创建。作为政党‘特别成员’的社团整体与正式个人党员名册也不是一回事：某人信仰伊斯兰、在Muhammadiyah教学、协助Masyumi政治宣传，分别对应不同权利和活动。不同地区的代表名单、地方社团授权和双方实际共用资源有待1945大会报刊、章程与人事原件查证；不能把统一民族独立目标写成这些组织从此无条件服从同一中心。","orgs":["masyumi","nu","muhammadiyah","masyumi-executive","masyumi-syuro"],"people":["person-soekiman-1945","person-wahid-hasyim-1952","person-natsir-1952","person-roem"],"claims":[],"evidence_urls":[{"label":"印尼文化部：1943与1945 Masyumi组织制度","url":"https://esi.kemenbud.go.id/wiki/Majelis_Syuro_Muslimin_Indonesia_(MASYUMI)"},{"label":"Muhammadiyah自身的Masyumi参与回顾","url":"https://muhammadiyah.or.id/2021/08/kisah-partai-masyumi-pengalaman-penting-bagi-muhammadiyah/"}],"note":"官方文化部词条、后出Muhammadiyah机构史与学术研究；1943军政设置文件和1945年11月大会原始签到/章程未直接取得。新研究仍缺正式C号，因此提供来源网页，不虚构已登记C。"},{"id":"pr-020","period":"1947年—1948年8月","title":"外交停战、军队整编与政治联合同时改变共和国社会","body":"同荷兰的停战谈判、军事分界线调整与人员整编，使共和国军队和地方武装单位重新讨论部署、裁减和指挥关系。阿米尔·谢里夫丁退出总理职位后，于1948年参与组织人民民主阵线FDR，原有各党、青年组织和工会并未因联合而消除独立身份。穆索在1948年从海外返回并提出重组左翼组织的政治安排；当时存在国内干部、海外关系与共和国军事机关的多条联系，不应预设这些人从一开始就对后来发生的一切冲突拥有同样的准备和目标。","orgs":["fdr","pki","sobsi","tni"],"people":["person-amir","person-musso","person-hatta","person-sjahrir"],"claims":["C2194","C2196","C2453"],"note":"FDR各成员组织、实际联合议事与军队整编的地方档案仍需扩展。"},{"id":"pr-020a","period":"1948年5月—8月","title":"德朗古纺织及麻袋厂劳动争议进入工厂、警察和议会程序","body":"1948年5月，德朗古有关纺织与麻袋厂发生停工与劳动争议。研究记载5月26日最初行动可能是厂内约两小时停工，而不是所有工人离开厂区；有关动员规模的数字来自后出研究，不能直接当作正式工会点名册。BP-KNIP设置调查委员会，PNI政治人物萨尔托诺主持相关调查，听取地方、工会和企业方面意见。7月与8月的议会讨论提出恢复BTN与SOBSI的谈判，材料载有15比2的表决记录。工人诉求、政府企业管理、警力巡逻、议会调查和各政党立场在同一事件中同时运作，而不是FDR或PKI中央单方决定的‘局部插曲’。","orgs":["sobsi","pni","tni","fdr"],"people":["person-hatta"],"claims":["C572","C581","C582","C579"],"note":"以上部分细节来自研究者重建及档案目录，1948年议会原始会议记录和警察日志仍须直接核查。"},{"id":"pr-020b","period":"1948年7月26—28日，Solo妇女联合会议（1959年回顾）","title":"妇女组织之间也争论表决权：KOWANI、Muslimat、GPII与“Aisjah”怎样决定联合是否具有约束力","body":"1948年独立战争中的妇女活动并不只是各政治阵营之间的口号竞争。Sulami在1959年发表的组织史回顾称，KOWANI在Solo召集妇女大会，Muslimat、GPII与其拼写为“Aisjah”的团体要求把联合机关限制为协调组织，并要求每项决定必须经所有成员一致同意；据她的叙述，提案未获大会接受，三个团体随后退出。问题的核心是不同组织保留多少独立决策权，以及一个联合机构能否在少数成员反对时作出共同决议。它既关乎妇女在共和国战争中的具体组织资源，也关乎宗教和政治团体如何组织自己的女会员。当前可直接核实的是Sulami于1959年确实做出这种公开回顾，而不是1948年会议原始签到、动议全文和真实投票数字。她对穆斯林团体的政治评语属于当事阵营立场，不能移作中立历史定义。真正需要查的是KOWANI章程、三方自身会议簿、代表授权与退出手续。","orgs":["kowani-1948","muslimat-1948","gpii-women-1948","aisjah-1948"],"people":["person-sulami-women-1959"],"claims":["C804"],"evidence_urls":[{"label":"Sulami，1959年《Women of the Whole World》第3期文本","url":"https://gerwani.logosid.app/teks/14"}],"note":"既有C804/S462明确记载这是一份1959年当事参与者立场的政治回顾；Aisjah和Aisyiyah身份、三个团体当期代表姓名及实际投票尚未独立确认，不能据一方文章写成既定正式会议结果。"},{"id":"pr-020c","period":"1948年5—9月：德朗古罢工到8月22日SOBSI主席团政治决议","title":"谁替工、谁批准镇压、谁代表三十二个工会：德朗古之后的劳工联合机关没有自动一致","body":"1948年德朗古国营纺织企业的劳资冲突，同时牵涉工资与被解雇者、农业工人、政党之间的经济主张，以及使用武装力量保护或者驱离不同一方。澳大利亚驻巴达维亚外交官Eaton在9月15日向Burton汇报，称经济部长Sjafruddin指责罢工具有政治动机，而FDR公开支持罢工者；还记有罢工者及支持他们的农民与破坏罢工者和Hizbullah人员冲突。外交官自己明确承认主要根据报纸、谈话和推测，这份证据不能取代工厂停工、治安与谈判原件。外交史料现代出版编辑在脚注中另引Reid 1974记述：约17000名SARBUPRI种植园工会人员参与5月26日行动，马斯友美相关的STII（Sarekat Tani Islam Indonesia）人员替工地生产，7月16日罢工者获得有利结果。这些人数与组织归属是后出研究的转引，并不是1948年电报原正文。STII也不是1953年BTI合并争议的STI。外交报文另外完整转述一份据称1948年8月22日SOBSI在日惹召开第三次主席团会议的政治决议，文内说32个工会总委员会派代表参加，并宣布对内阁、荷兰谈判和农民土地权利的立场。我们可以研究特定机关公开宣布了什么，但不能把‘32个工会总委员会有代表’变成‘所有32个工会全体会员入党、投票一致或已经发动武装行动’。此处的研究入口是工会实际会费、代表资格、罢工后的组织议决与国家调停，不是把全部行动提前写成九月茉莉芬事件的注脚。","orgs":["sarbu","stii-1948","masyumi","sobsi","fdr","tni"],"people":["person-sjafruddin","person-hatta"],"claims":["C572","C581","C582"],"evidence_urls":[{"label":"澳大利亚政府《Eaton to Burton》，1948-09-15外交正文及后出编辑脚注3","url":"https://www.dfat.gov.au/about-us/publications/historical-documents/Pages/volume-13/242-eaton-to-burton"}],"note":"直接核读澳外交部官方历史文件网页：1948-09-15当期正文第9—10段与所载1948-08-22 SOBSI决议、后出编者脚注3/引Reid 1974分开。此档未正式分配新增C号，已有C572/C581/C582仅对德朗古已有事实提供关联，不单独验证32个总委员会代表、STII同STI差别及17000数字。须补原工会决议和劳动机关登记。"},{"id":"pr-021","period":"1948年9月18日—11月","title":"茉莉芬地方军事与行政行动、全国广播及政府军事反应","body":"1948年9月18日前后，茉莉芬的部分地方左翼武装和FDR有关人员掌握了市内部分机关，并发布地方权力安排。关于行动最初由谁指示，存在当事人后来的陈述和历史研究的不同重建。研究表明穆索、阿米尔等全国性领导人在当地行动开始时可能并不在城内，之后才经广播等得知情况。苏加诺政府发出全国广播，军队随后采取军事行动；城市控制权改变、人员被捕和死亡发生在不同阶段。‘地方武装行动’与‘中央党正式批准’需要分别证明，不能依后来的政治宣传直接画等号。","orgs":["fdr","pki","tni","sobsi"],"people":["person-musso","person-amir","person-sukarno"],"claims":["C2199","C2200","C2235","C2236","C2237"],"note":"本事件的指挥链与双方责任仍存实质争议，原始军令和会议记录是关键。"},{"id":"pr-021a","period":"1950年前后","title":"港口工人的工资与劳动条件争议并不总从党机关开始","body":"独立战争结束后的港口企业持续面临工资、雇佣、劳动时间和工作条件问题。劳动史研究者Ingleson提出，1950年前后许多港口争议出自工人自身的工作与生活要求，并非通常由PKI或SOBSI中央领导主动发起；工会与有关政治干部则可能提供谈判、声援和理论组织资源。这个区别非常重要：同一场罢工既有参与工人的直接诉求，也可能通过行业工会进入更广泛的政治关系；不能把工人的一切行动倒写成政党早已拟定的计划。","orgs":["sobsi","pki","pbi"],"people":[],"claims":["C1488"],"note":"研究者对工人主体性的解释应回到具体港口、工会会议及工厂工资文书验证。"},{"id":"pr-022","period":"1949年—1954年","title":"国家主权移交后，党组织恢复、乡村联系与妇女社团继续变化","body":"1949年底主权移交及1950年国家重组以后，工会、国家机关与政党活动进入不同于独立战争的新环境。1951年艾地、卢克曼、尼约托、苏迪斯曼等干部参与重建PKI中央机关。艾地1963年的回顾称，由于地方组织混乱和跨岛交通困难，中央一度通过指派省级特派员恢复组织联系。这是党的事后自述，不能视为已核实全国所有省份的实际部署。另一条线索是1950年成立的Gerwis：它有自己的妇女社团活动，到1954年大会又作出名称及章程变化，不能用PKI中央政治发展一句话吞没这一组织史。","orgs":["pki","gerwis","gerwani","sobsi"],"people":["person-aidit","person-lukman","person-njoto","person-sudisman"],"claims":["C2348","C1459"],"note":"1951—1954年各省干部任免、入党数、财政和原始会议尚缺系统核查。"},{"id":"pr-022a","period":"1948年—1955年：工会分立、跨国联系与劳动者日常权益","title":"SOBSI并不是所有工会：茉莉芬之后的人员损失、1950年代多种劳动政治和跨国旅行","body":"1948年茉莉芬事件及镇压对SOBSI产生重大冲击，一批领导人遭杀害或被捕，部分非共产党工会退出联合体。关于该组织在具体月份是否曾被正式禁止，不同后出资料的法律表述互相抵触，不能把政治污名、成员流失、停止活动和法定取缔写成一个事实。1949年主权转移后，工厂、学校、港口和交通部门的工资、物价、工伤、雇佣合同及仲裁制度仍持续改变工人生活。SOBSI继续参与罢工、协商和同世界工会联合会的代表往来，但不同工会另建政治关系：1951年与穆尔巴党有关的SOBRI出现，1955年NU关联的Sarbumusi成立，伊斯兰和民族主义工会也活动。Hearman援引1955年劳动部登记说当年全国、地区、地方工会超过1,500个，其中约半数未加入任何全国联合会；这是二手转引的行政统计，不能自动等于活跃工人组织或把一名工人强行归入党派。WFTU邀请、培训和访欧的机会让一些有组织的工人跨越原本难以负担的旅行成本；回国后他们的职业与政治遭遇也与国际宣传目的不完全相同。这里要分别恢复工厂部门、地方工会、全国联合体与个人跨国经历，而不是把1950年代劳动史写成PKI党史的一个附录。","orgs":["sobsi","sobri","sarbumusi","sbii","wftu","pki","masyumi","nu","tni"],"people":["person-njono","person-adam-soepardjan"],"claims":["C1500","C2893","C2894","C2895"],"note":"S845/Hearman与S846/Tedjasukmana的学术/当事政治立场需保留；1948是否法定禁止的资料冲突暂未解决。1955工会登记总数及无联合会人数尚缺劳动部原登记。国际工会成员差旅见Adam Soepardjan个人材料，不能概推所有工会成员。"},{"id":"pr-022b","period":"1953年前后，BTI与RTI、STI及各地分会讨论合并","title":"一次合并并没有消除内部异议：BTI中央干部和五个地方分会的不同选择","body":"BTI经过独立革命及共和国初期的独立组织发展后，1953年前后开始与PKI已经建立的RTI以及其他农民团体讨论合并。印尼文化部历史百科引述后出资料，称1953年的合并表决有122票赞成、8票反对；反对者包括BTI中央人物Mochammad Tauchid、Tandiono Manu、Muntalif和Ismail，以及Kuningan、Cirebon、Majalengka、Sumedang、Lampung Tengah等地方代表。票数是据报参加代表的表决数，不是全体农民会员投票，更不能把8票等同于8个地方、4名个人或8名被开除者的简单总和。该资料还称反对派被大会撤职，须查当期会议公报及地方组织财务和成员去留才知道如何执行。另一篇经同行评审的农民运动史又把RTI与BTI的合并记为1953年、STI加入记为1955年；文化部文章把Sakti放进1953年叙述，尚不足以证明STI/Sakti必然同一组织且同日合并。中央合并、新政党关联、地方支部实际活动和村民的农业生活，是彼此联系又不同步的历史过程。1953年的异议也说明BTI不只是PKI中央在1945年预先拥有的一个固定群众组织。","orgs":["bti","rti","sti","bti-kuningan-1953","bti-cirebon-1953","bti-majalengka-1953","bti-sumedang-1953","bti-lampung-tengah-1953","pki"],"people":["person-mochammad-tauchid","person-tandiono-manu","person-muntalif-1953","person-ismail-bti-1953"],"claims":["C2902","C2903"],"evidence_urls":[{"label":"印尼文化部BTI史条目","url":"https://esi.kemenbud.go.id/wiki/Barisan_Tani_Indonesia"},{"label":"White等农业运动研究","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.12506"}],"note":"投票与名单仅为历史百科据1953-09-23《Indische Courant》整理，原报尚未独立读取。STI/Sakti具体法律及人员连续关系仍是相互有差异的后出描述，不得强行合并。"},{"id":"pr-022c","period":"1950年6月—1954年3月：不同妇女团体、机构与会员规则的形成","title":"Gerwis不是从PKI中央衍生的一张名单：六个地方妇女组织如何建立共同机构","body":"1950年6月，来自三宝垄、泗水、万隆、谏义里、马都拉和巴苏鲁安的妇女组织代表在三宝垄讨论建立新的妇女运动。后出研究列出的六个前身是Rupindo、Persatuan Wanita Sedar、Isteri Sedar、Gerwindo、Wanita Madura及Perjuangan Putri Republik Indonesia。它们各自有人际联系、地方工作、独立时期经历和不同政治背景；六个组织合并并不意味着成员一夜之间拥有相同党籍或遵守一份已经成熟的全国章程。初期领导人员的后出名单有Tris Metty、Umi Sardjono、S. K. Trimurti和Sri Kusnapsiyah，但主席排序与改选时间存在不同版本，未取得1950年全体代表和签字人原件。Gerwis早期参加不同妇女组织的联络，1951年已有代表大会与公开纲领。有关‘1951年已经改称Gerwani’和‘1954年才正式更名’的材料不能简单选一个：前者出现在2010年后出论文摘要，1954年3月第二届大会采用新名称及章程则有同期大会文书。新章程规定妇女自愿加入、分级选举、会费及经费分配；1954年条款记入会费1卢比、常规会费0.25卢比，90%留在地区、10%交中央。这是明文规定而非实际账目，它提醒我们组织生命不仅是政治口号，也包括谁收钱、谁开会、儿童照料、基层联系及任职权。","orgs":["gerwis","gerwani","rupindo-semarang","pws-surabaya","isteri-sedar-bandung","gerwindo-kediri","wanita-madura","pp-ri-pasuruan","widf"],"people":["person-tris-metty","person-umi-sardjono","person-sk-trimurti","person-sri-kusnapsiyah"],"claims":["C2896","C2897","C2898","C2900","C1459","C1460","C1461"],"note":"S1537是2013年后出报道，S1538是运动内部历史自述，S1539 2010年论文摘要的更名日期与同期S828不同；优先记录1954年正式大会，不否定未经核查的1951年提出更名或非正式用法。S828章程可证明书面规则，不证明每支部已经按其实际缴费。"},{"id":"pr-022d","period":"1946年—1955年，跨越工会机关、个人书信和劳动部登记","title":"一名工会总书记的1954年入党申请，为什么不能让1946年的所有工会会员都变成党员","body":"1946年SOBSI成立之际，后出的印尼国家历史百科引用工运研究列Harjono、Setiadjid和Njono为其主席、副主席、总书记。这是共和国独立战争中跨工会联合机关的职务，不是三人各自党籍在所有年代的官方登记。同一词条引用Tedjasukmana研究称，1954年12月4日，已经担任SOBSI总书记的Njono写信给PKI总书记D.N. Aidit，请求加入共产党，并提到此前多年属于该党同情者。这份信的存在目前是研究者转引，而不是我们已经读取了签名原件；申请是否收到、是否通过、此前是否有过其他党籍记录，都不能凭二手一句话断定。重要的是，职务、政治认同、个人申请、正式党员登记、后来当选党职本来是不同的时间与档案。1955年印尼劳动部登记有超过1500个全国、地区与地方工会，后出研究称其中约半数不隶属于任何工会联合会；这一数字是组织数，不是工人总数。SOBSI与PKI有高度政治联系并不能推导所有工会属于SOBSI，也不能推导所有SOBSI会员属于PKI。要理解当时工人的生活，需要回到工资、行业集体协商、劳动法规、国家调解、罢工及入会、会费等实际关系，再把个人的不同组织身份放进这些行动里。","orgs":["sobsi","pki","sobri","sarbumusi"],"people":["person-njono","person-aidit"],"claims":["C2892","C1502"],"evidence_urls":[{"label":"印尼文化部Nyono人物条目（引1954-12-04入党申请）","url":"https://esi.kemenbud.go.id/wiki/Nyono"},{"label":"Vannessa Hearman劳动组织历史研究（1955年工会数量）","url":"https://www.cambridge.org/core/journals/international-review-of-social-history/article/from-travel-to-imprisonment-remembering-cold-war-trade-unionism-and-the-world-federation-of-trade-unions-wftu-in-adam-soepardjans-prison-notebooks/5D2B6B5169AABB43099B9D1267190C86"}],"note":"C2892仅支持SOBSI创立时干部名单的后出综述，C1502仅支持1955年工会数的后出引文；1954年12月4日入党申请未在正式库中单独分配C号，原信未取得，此处明确以文化部传记引述形式呈现，不能误作为正式通过入党的证据。"},{"id":"pr-022e","period":"1947年PSII退出、1949年机构权限调整、1952年NU退出","title":"宗教咨询委员会的权力怎样影响政党联盟：NU、Muhammadiyah与Masyumi的政治关系并非反共阵营的一块整体","body":"1945年新成立的Masyumi政治党把不同的伊斯兰社会与宗教组织放进联合政治空间，却未消除它们各自的校产、募捐、教士网络和人事程序。1947年前后，PSII退出Masyumi联盟形成另一伊斯兰政党关系；这与德朗古1948年的STII农民团体、1953年BTI合并中的STI都不是同一对象。1949年左右，Masyumi的Pengurus Besar执行领导机关与Majelis Syuro宗教咨询委员会之间的权限调整，使来自传统主义NU社群的宗教人物与现代派干部之间的内阁职位、宗教部任命及党内决策权争论更尖锐。学者Ali Munhanif研究认为这种制度地位争议是1952年NU退出的关键因素之一，但1952年各地方学校、教士与工会成员是否仍继续与Masyumi人士协作，不能由中央退出决议一笔抹去。Muhammadiyah仍有自身教育和慈善社团活动，也非所有成员自动成为Masyumi党员。于是这里真正变化的是党内管理权限、教士权威、宗教部政治资源、地方组织能否独立行动，而不是先存在一个统一‘伊斯兰反共阵营’，然后突然分裂。具体1949修章议案、1952退出决议、人事任免和基层反应仍要查各方当时文件。","orgs":["masyumi","masyumi-syuro","masyumi-executive","nu","muhammadiyah","psii-post1947"],"people":["person-wahid-hasyim-1952","person-natsir-1952","person-faqih-usman-1952"],"claims":[],"evidence_urls":[{"label":"Ali Munhanif研究：NU为何1952年退出Masyumi","url":"https://studiaislamika.ppimcensis.or.id/index.php/studia-islamika/article/view/363"},{"label":"Muhammadiyah自身组织史回顾","url":"https://muhammadiyah.or.id/2021/08/kisah-partai-masyumi-pengalaman-penting-bagi-muhammadiyah/"},{"label":"NU地方官方历史叙述","url":"https://jabar.nu.or.id/sejarah/nu-dan-masyumi-9UlJ1"}],"note":"该段依后出学术和各宗教组织自身资料进行史料分层，不意味着我们已经读到1949原始章程或1952退出会议纪要；未有独立正式C号，读者可从公开来源链接继续核。"},{"id":"pr-022f","period":"1952年4—10月：NU脱离旧政治联盟并组织新的多党协调机构","title":"退出Masyumi不是退出组织生活：NU、PSII、Perti于1952年8月30日创立Liga Muslimin Indonesia","body":"1952年，NU同Masyumi全国执行机关关于宗教咨询委员会权力、宗教部长人事及政治组织安排的争论促使其独立建立政党。NU历史资料把4月5/6日中央决议、7月前后退出职位执行及10月Palembang代表大会的追认分别记录，它们不是同一瞬间的事情。退出Masyumi之后，NU没有停止宗教学校、地方教士和政治组织工作，而是同另两个独立政党PSII和Perti建立新的跨组织协调形式。NU所引1952年9月1日《Suara Merdeka》新闻称，8月30日成立Liga Muslimin Indonesia（LMI），选瓦希德·哈希姆为主席、PSII的安瓦尔·乔克罗阿米诺托为第一副主席、Perti的西拉朱丁·阿巴斯为第二副主席。这是特定联合机关的人事安排；三党仍各有自己独立的组织章程和实际会员。后来的研究还提到DDI、PTII加入这个联合网络，但它们是否列入1952年8月30日最初签署者，需要查各自加入日期和文件。LMI的建立说明政治组织发生分化时仍可进行新的联盟与协商，不能把1952年简单写成“伊斯兰团结彻底瓦解”。1952年首届主席Wahid Hasyim已在1953年4月19日去世，所以也不能将他的这项职务移植到1955年选举。","orgs":["lmi-1952","nu","psii-post1947","perti-1952","masyumi"],"people":["person-wahid-hasyim-1952","person-anwar-tjokroaminoto-1952","person-siraadjuddin-abbas-1952"],"claims":[],"evidence_urls":[{"label":"NU组织史与1952-09-01《Suara Merdeka》原报线索","url":"https://www.nu.or.id/fragmen/hari-arafah-berdirinya-liga-muslimin-indonesia-bersatunya-nu-perti-dan-psii-UqdPr"},{"label":"NU历史：LMI加入资格与1952-08-30职务","url":"https://www.nu.or.id/fragmen/syarat-jadi-anggota-liga-muslimin-indonesia-Y1gjk"}],"note":"后出NU官方历史转载了1952当期报刊的信息，但本轮未独立打开原报完整扫描或LMI章程；没有伪造C号，依可访问来源URL注明调查边界。"},{"id":"pr-023","period":"1954年3月","title":"Gerwis第二次大会改变名称、章程与公开组织规则","body":"1954年3月下旬的妇女组织大会决定将Gerwis改名为Gerwani；相关组织自己的报告称，当时约201个分支中143个派出代表，代表和旁听人员合计约350名，并于30日正式作出改名决定。大会文本规定16岁起自愿入会、选举领导、缴纳会费、召开会议，并把组织表述为非政党妇女教育和社会活动团体。这里必须把‘章程规定’与地方实际是否如此执行分开，还需调查合并的铁路职工家属团体及万鸦老PERWIN等组织成员的具体整合过程。","orgs":["gerwis","gerwani","pki"],"people":[],"claims":["C1459","C1460","C1462"],"note":"自报大会人数与代表资格尚未以签到和地方记录独立复核。"},{"id":"pr-023a","period":"1954年3月","title":"Gerwani章程关于会费与地方经费分配的具体规定","body":"1954年大会通过的Gerwani章程，不只规定组织宗旨，还涉及现实的财政制度。第62条记有入会费1印尼盾、会费0.25盾；第63条将收入分配为地区层面90%、中央机关10%。这使我们能够继续询问：地方分会实际收取了多少会费？是否有工作人员、印刷费、活动场地和儿童照护经费？有无地区间重新转账？章程的规定不证明各省地方机关都照章执行，但比一句‘Gerwani是群众组织’更接近其实际组织模式。","orgs":["gerwani","gerwis"],"people":[],"claims":["C1461"],"note":"0.25盾会费的缴纳周期尚待比对原始印刷页，勿擅自解释为月费。"}]);

window.HIST.processes.push(...[{"id":"pr-024","period":"1955年—1957年","title":"选举使不同地方党组织的实际支持差异得以观察","body":"1955年议会选举中，PNI、Masyumi、NU和PKI分别取得重要支持。选票反映特定选区及当时的政治选择，却不能直接当作党员名单或同一阶级的人口分组。1957年地方选举资料还显示，不同爪哇地区的PKI与PNI支持率变化并不一致。研究者Chandra计算了中爪哇1955与1957年间PKI增票与PNI减票的总体关联，但这种统计关系不能自动证明每名PNI选民都转投PKI。必须继续进入县、乡、村的候选人、工会、宗教与农业关系，辨认组织怎样具体获得信任或失去支持。","orgs":["pki","pni","nu","masyumi"],"people":["person-aidit"],"claims":["C2890"],"note":"县级统计可比较但不能直接解释每个选民的个人政治动机。"},{"id":"pr-024a","period":"1957—1959年：地方培训、家庭支持与跨党派妇女组织活动","title":"Gerwani地方课程究竟教什么：章程、会议技巧、婚姻权利、扫盲及幼儿园，而非只有政治口号","body":"1959年Sulami在国际妇女运动刊物中描述，Gerwani围绕妇女儿童权利、信息文化、组织及财务设不同委员会，并在地方开办干部课程：讲解自身章程与国际民主妇女联合会、教授会议主持和演讲、讨论婚姻法与选举制度。文章还称同其他妇女组织合作扫盲、建立幼儿园和小学；这需要教师、园舍、课程、地方干部、家长及经费长期维持，不能一律用“共产党宣传”概括。文章称1957年1月有182个分会、分布16省及642460名会员，年底又宣称达到70万人，但它们是当时组织自己的统计陈述，尚未有逐县交费会员名册验证。Sulami还称Gerwani成员可以属于不同政党，部分成员作为PKI、Permai及Partai Rakjat等候选人参加选举；政治候选、Gerwani成员、正式PKI党籍本来就是不同记录。要查1957地方培训真实教学与园所经营，必须找到各分会点名册、财务账、课程表和市政教育登记，不能把中央刊物主张当成所有地方已经实施的结果。","orgs":["gerwani","widf","kowani-1948"],"people":["person-sulami-women-1959"],"claims":["C804","C2896","C1461"],"evidence_urls":[{"label":"Sulami，1959年对地方委员会和培训工作的公开报告","url":"https://gerwani.logosid.app/teks/14"}],"note":"本段1957分会人数和会员数字来自1959年Gerwani相关作者的公开自述；C804为同一1959文本的1948争议登记，C2896/C1461只支持Gerwis历史与1954章程内容，不独立证明1957数字和课程实际完成。逐县统计和办学原始资料待取得。"},{"id":"pr-024b","period":"1955年9月DPR全国议会选举，及同年不同的制宪会议选举","title":"两次投票而不是四份党籍名册：PNI、Masyumi、NU和PKI怎样在地方不同社群中争取选民","body":"1955年的共和国全国议会选举，为此前不同政党、宗教社团与工会地方工作提供一个可以观察而不能简单反推组织归属的结果。印尼全国选举委员会后来公布DPR选举统计：PNI得8,434,653票、22.32%、57席；Masyumi得7,903,886票、20.92%、57席；NU得6,955,141票、18.41%、45席；PKI得6,179,914票、16.36%、39席。这是各党候选名单取得的选票和席位，绝不是四党正式党员数。NU在1952年才从Masyumi退出，1955年的NU与Masyumi票数不能当作1945年统一政治联盟时两个现成派系的固定人口表；不同地区的教士、学校、农民、工人和商人往往同时参与更多社会组织。另一场同年的制宪议会选举有不同选票和席位计算，KPU说明Masyumi的制宪会议选票比DPR少114,267，不能将两张结果表当成同一次计票。后出研究概括Masyumi在部分爪哇外岛社会网络较强、NU在爪哇部分地区较强；这种社会地理差异要靠各县、具体党支部、宗教学校、工厂与社区宣传资料解释，而非由全国百分比直接推断每个人的党籍和选举动机。","orgs":["pni","masyumi","nu","pki","muhammadiyah"],"people":["person-natsir-1952","person-aidit"],"claims":["C2890"],"evidence_urls":[{"label":"印尼中央选举委员会KPU：1955年议会与制宪会议选举","url":"https://www.kpu.go.id/page/read/8/pemilu-"}],"note":"官方KPU汇总数字可核，但未查地区原票册。Wahid Hasyim已于1953年4月19日去世，不能列为1955年选举的当期参与人。其它人物身份也仅为党派关系的索引，而非证明其亲自竞选。"},{"id":"pr-025","period":"1957年12月—1958年","title":"工会参与接管荷兰企业，随后军方监督改变经营与劳动关系","body":"围绕西新几内亚的国家政治争端扩大以后，1957年12月起部分工人和群众组织介入荷兰企业接管。实际参与企业包括运输、贸易、种植园等行业；军方和政府机关随后取得越来越重要的企业监督与管理权限。工会能够发动员工行动，并不意味着获得企业的最终经营权。各个厂场、港口和国家机关之间对工资、人员任用、利润上缴与生产调配的安排可能不同。研究不应将其简单描述为‘PKI扩张—军方反击’，而须逐厂记录哪些工人组织、企业经理与军区干部采取了什么措施。","orgs":["sobsi","pki","tni","soksi"],"people":["person-nasution"],"claims":["C051","C250","C251"],"note":"当前主库有大量油业、国有化与工会专题；企业级完整名单仍要逐一链接。"},{"id":"pr-025a","period":"1950—1959年，泗水Ngagel机械厂和工会国际交流","title":"阿丹·苏帕尔詹从机器厂进入工会：国有化后，普通职工如何取得组织和旅行的机会","body":"阿丹·苏帕尔詹并不是从全国党机关名单中突然出现的干部。后来的回忆与学术研究记他1927年出生于松巴哇，战时随父亲被迫在西新几内亚为日军劳动；1945年回到爪哇，在独立战争期间参加青年武装，1950年进入泗水的重工业工厂。他一面工作一面补习中学和政治课程，在Ngagel的Braat机器厂成为金属工业工会SBIM厂分会主席。与厂长议事、组织工人、完成日常工作和上课，对这个人的政治经历都是具体事件。研究记1957年接管荷兰企业期间工厂更名Barata，但工厂国有化不是工人取得企业经营权，更不意味着每个同厂职工都加入共产党。1959年4月，SOBSI让他申请护照，以工人代表身份前往东德参加五一活动，又前往莱比锡和捷克斯洛伐克的国际工会会议；同行石油工会Perbum副主席哈迪·苏达尔佐也有独立的产业岗位。这段旅行既是政治交流，也是普通工人接触不同工业、翻译、饮食和家庭分离的经历。会议后的正式报刊倾向展示社会主义国家的积极面貌，而苏帕尔詹在1975—1976年于狱中写的英文回忆还记下旅途中不习惯的食物、文化隔阂和思乡。两种文本的差异表明会议声明、本人记忆和真实工资或工厂待遇必须分别核验；不能把一次访问行程当作所有SOBSI成员共同的政治经验。","orgs":["sobsi","sbim-ngagel","braat-barata-ngagel","perbum-1959","wftu"],"people":["person-adam-soepardjan","person-hadi-soedardjo-1959"],"claims":["C1504","C2911"],"evidence_urls":[{"label":"Cambridge Core：Adam Soepardjan的1959出访与工会生涯研究","url":"https://www.cambridge.org/core/journals/international-review-of-social-history/article/from-travel-to-imprisonment-remembering-cold-war-trade-unionism-and-the-world-federation-of-trade-unions-wftu-in-adam-soepardjans-prison-notebooks/5D2B6B5169AABB43099B9D1267190C86"}],"note":"1959正式代表身份见学术研究与照片、1975—1976后出狱中笔记；二者都不是全部1950年代企业人事与工会名册。Setiati的任职来自同篇研究中的独立组织说明，不意味着她参加Adam同行团。"},{"id":"pr-026","period":"1958年—1960年","title":"地区军事叛乱、中央军事行动和议会制度变化","body":"PRRI与Permesta等地区政治军事组织，在中央财政、地区权力、军队职权等冲突中形成。中央政府和军队对不同地区采取军事行动，一些外国机构提出或实施不同形式的秘密支持，必须将建议、批准、交付与战场效果分开。1959年苏加诺以总统法令恢复1945年宪法，1960年对议会机构进行调整，Masyumi与PSI被禁止。这里同时发生地区武装与国家制度的变化，各政党和群众组织原先通过国会与地方议会活动的渠道也受到改变。","orgs":["tni","pki","pni","masyumi","psi"],"people":["person-sukarno","person-nasution","person-allen-pope"],"claims":["C018","C061"],"note":"地区军政文件与实际外国援助记录须各自核查，不把所有组织关系归结为一个国家集团。"},{"id":"pr-027","period":"1960年—1964年","title":"土地法律、村庄调查与农民组织行动的不同节奏","body":"独立后的土地权利政治要先区分不同法律：1960年1月7日生效的第2号《分成佃作合同法》（Perjanjian Bagi Hasil）处理地主与耕作者分成契约；同年9月24日生效的第5号《基本土地法》（UUPA）确立全国土地权利框架。这些法规不是1959年同一部法律。土地法给村民提出新要求的依据，却没有让每户农民在公布当天自动得到地契。BTI及其他农民组织通过村社会议、申诉和生产互助要求执行法规，地方宗教组织、PNI、NU干部与乡村地主及土地委员会之间也存在合作和矛盾。White等2023学术综述把分成佃作法误写作‘1959年’，这里以印尼官方法律数据库的具体编号和生效日纠正，而不据一处错字推翻其对土地运动的整个解释。1963年后部分农民以‘单方面行动’施压，不同地点的土地争议是否发生实际占用、调解和分地仍要逐案核对。苏加诺1964年6月反对单方面行动和随后9月支持BTI大会是两种在不同场合的政治行为，不能简化为一条始终一致的全国命令。","orgs":["bti","pki","pni","nu","tni"],"people":["person-aidit","person-sukarno"],"claims":["C019","C053","C060","C2910"],"note":"法规颁布日期依据BPK JDIH官方元数据；学术二手综述1960分成佃作法误记为1959，已保留这一来源差异。法令、行政实施、土地名单、妇女个人产权并不同步。","evidence_urls":[{"label":"印尼BPK官方：UU 2/1960分成佃作合同法，1月7日生效","url":"https://peraturan.bpk.go.id/Details/51300/uu-no-2-tahun-1960"},{"label":"印尼BPK官方：UU 5/1960基本土地法，9月24日生效","url":"https://peraturan.bpk.go.id/Details/51310/uu-no-5-tahun-1960"},{"label":"White等2023农村运动研究：政策与实际村民行动区分","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.12506"}]},{"id":"pr-027c","period":"1950年代—1965年之前，基层农业实践与农民组织联系","title":"施肥、灭鼠、修水渠也是政治组织史：BTI互助小组的生产与日常信任关系","body":"1960年土地法律和中央农民大会只是BTI工作的一个层面。White、Graham和Savitri研究指出，1950年代至1960年代初，BTI在一些农村通过Regu Saling Bantu（互助工作组）帮助农民获得农业投入品，组织灭鼠、灌溉改善和生产指导。1999年，作者访谈了一名曾任日惹库隆普罗戈地区村级BTI负责人的受访者，他回忆农民愿意参加BTI的重要原因之一是能够得到肥料。这种回忆使组织的运作从抽象的‘农民支持共产党’变成可以追索的实际关系：谁供应肥料，谁组织沟渠劳动，成员如何共同解决病虫害，村庄中不持有正式党籍的人是否也参与集体生产。但这里的受访者讲的是自己的村庄经验，访谈相距数十年；不能把地方肥料援助推广为所有BTI分会共有的待遇。与此同时，国家档案馆2025年的BTI库存索引已经列出1955/1957中央财务、1957西爪哇地方会费、1958—1965雅加达与勿加泗部分支部成员记录。库存存在证明能够继续追查组织经济与会员身份，不意味着相关账簿已全文读到。研究还须比较其它农民组织、妇女农户以及政府灌溉机构的行动，让农村实际劳动者而非中央党章成为观察中心。","orgs":["bti","regu-saling-bantu","pki","gerwani"],"people":[],"claims":["C2904","C699","C700"],"evidence_urls":[{"label":"White等：农业运动与基层互助","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.12506"},{"label":"ANRI BTI 1947—1965档案目录","url":"https://anri.go.id/download/ra-112.-inventaris-arsip-barisan-tani-indonesia-19471965-1770710472"}],"note":"C2904是学者从White 2016和1999年受访者整理的地方实践，原1999访谈录音和村级BTI互助队账册未取；C699/C700为国家档案目录项目，不能据题名推出实际会费金额或逐名成员。"},{"id":"pr-027f","period":"1953—1964年：宗教农民组织的田间服务、地方会费和土地法选择","title":"Pertanu不是反土地改革阵营的缩写：农会干部、佃作合同与地方委员会的真实分歧","body":"印度尼西亚农民并不只在BTI或者地主两种身份之间选择。NU系统的农民组织Pertanu早在1950年代就建立了多级分支和农业服务联系。Luthfi研究转录了1953年NU中央与Pertanu往来信，讨论改进农业技术、生产设备、谷物加工和与农业机关合作；1954年NU全国会议确认的Pertanu干部和1955—1959年各地分支并不是一份共产党组织名单。Pertanu章程据该研究规定11人可组基层支部、五个基层支部可以成立次级分会，县、市与省级委员会之上另有中央。‘300个分会’是1958年组织自身的报告，不能据此宣称已取得逐支部名单和实收会费。1961年10月，NU全国宗教学理机构对土地改革采取附有‘紧急情形’例外的限制性判断；但各地宗教人士与农民协会对租佃、分地和私有财产的理解不相同。1962年11月6日，中爪哇Pertanu主席Imam Churmen与秘书Slamet Sardho署名信函（研究引ANRI藏卷1548），批评直葛地方分会没有积极参加分成佃作合同法和土地改革执行，要求重组领导。这是地区农会管理层的具体政治选择，而不是NU全国所有教士或农户一齐投票的结果。1964年农民节，Pertanu中央负责人Haji Mohammad Munasir呼吁落实两项1960年土地法律，反对土地分给不真正耕作的人。法令文字、教法争论、农业服务与具体分配农户之间存在连续争执；不能从1965年之后的党派敌对叙事向前倒填每个农村组织的立场。","orgs":["nu","pertanu","pertanu-tegal-1962","bti"],"people":["person-imam-churmen-pertanu","person-slamet-sardho-pertanu","person-mohammad-munasir-pertanu"],"claims":["C2913","C2918","C2919"],"evidence_urls":[{"label":"S1541：Luthfi 2017《Bhumi》pp.145—149（包括ANRI原档号）","url":"https://www.jurnalbhumi.stpn.ac.id/index.php/JB/article/view/121"}],"note":"已直接阅读2017同行评审论文的文字及其ANRI来源定位；ANRI原始1953/1962信函和1954届中央人事、全国自报分会数未经逐页独立核验。须保留1961 NU全国学理决定与地区Pertanu执行的区别。"},{"id":"pr-027d","period":"1960年8月17日法令及1960年9月13日的后续机关表态，至1962年宗教社会组织","title":"Masyumi被解散不等于宗教学校消失：政府1960年第200号决定与后续组织活动必须分开","body":"1959年共和国恢复1945年宪法，指导民主与政党管理格局发生变化，但这本身不是Masyumi党正式解散的正确日期。总统1960年8月17日通过第200号决定，明文解散Masyumi政治党及其全国地方分支；这是印尼官方法律库登记的生效时间。后来的Masyumi组织历史又记1960年9月13日党中央在法令要求下宣布停止自身政党活动，这是一个后续组织执行行为，不应将法定解散与党内组织响应当作同一张原件。另有2021年Muhammadiyah回顾文章把解散年份简化成1959，与官方1960法令相冲突，须优先采用法律日期。党被禁止以后，Muhammadiyah、NU等独立于政党而存在的学校、捐款、宗教与医疗社团不等于全部依法解散；Muhammadiyah又于1962年提出其社会宗教而非正式政党运动身份的自我定义。这里仍要逐人查原Masyumi人员进入何种教职、经商、自治、国家机关或后来的政治关系，不能因1960年党名消失而把他们从历史叙述中删除。","orgs":["masyumi","muhammadiyah","nu","masyumi-executive"],"people":["person-natsir-1952","person-roem"],"claims":[],"evidence_urls":[{"label":"印尼BPK法律资料：1960年第200号总统决定（1960-08-17生效）","url":"https://peraturan.bpk.go.id/Details/150794/keppres-no-200-tahun-1960"},{"label":"Muhammadiyah回顾与1962年组织自我定位","url":"https://muhammadiyah.or.id/2021/08/kisah-partai-masyumi-pengalaman-penting-bagi-muhammadiyah/"}],"note":"法令日期由BPK官方登记证实；原签发PDF网页影像及正式送达册、1960-09-13党中央表态原文尚未逐件检验。2021宗教组织后出回顾在年份上与官方法律不一致，保留来源纠错而非抹平。"},{"id":"pr-027b","period":"1961年1月：西爪哇Pabuaran与雅加达之间的农妇研讨会","title":"Djenab带着婴儿参加研讨会：农村家庭、土地权利与托幼设施如何进入妇女政治","body":"1961年《Api Kartini》第2期第8—9页报道了一名来自西爪哇Pabuaran的贫农妇女Djenab。刊物称她与家人依靠小块稻田、务农和出售木柴维持生活，子女教育、饥荒时期的收入、妇女生育与疾病保障都是具体困难；她在村里听到来访妇女要了解农村生活并举办全国农妇研讨会，于是同其他村民讨论并作为一名代表前往雅加达。由于无人照看幼儿，她把约十个月大的孩子带到会场。Gerwani主办的1月17—20日研讨会设了临时托幼安排，她在报道中表达希望农村也设置托儿场所。文章把妇女独立拥有土地的法律权利、1960年土地法律第9条、农作生产和农忙期间的儿童照料联系起来；这不是中央理论直接向农村复制的一条路线，而是由村庄生活、家庭劳动、公共集会、文字记者及国家法令交错形成的政治要求。但《Api Kartini》也是运动的公开刊物，记者挑选个案并赋予鲜明立场；我们现在能证明的是1961年刊物如何呈现Djenab及其诉求，不能把其中家庭收入、子女情况、村庄贫困比例当成未经核查的独立统计，也不能仅因参会便断言她有Gerwani或PKI正式成员身份。","orgs":["gerwani","bti","pki"],"people":["person-djenab-pabuaran"],"claims":["C802","C803","C1518","C801"],"evidence_urls":[{"label":"《Api Kartini》1961年第2期《Harapan Djenab》数字文本（S460）","url":"https://gerwani.logosid.app/teks/50"}],"note":"直接阅读历史文字转录S460；尚未以原纸刊与记者采访记录交叉核对，也没有Djenab的户籍、田地簿、会议签到。1961 Gerwani纲领C801属不同月份的组织正式要求，不能当作本次村庄研讨会已经落实的证明。"},{"id":"pr-027a","period":"1961年12月","title":"Gerwani把妇女独立土地权利与农业工资写入公开政治纲领","body":"Gerwani在1961年12月大会形成的政治纲领和后来公开文本中，除了主张农村妇女可以在本人名义下持有土地、参加土地改革委员会、争取农业工资和同工同酬，也希望女性能够参加村庄会议、担任村级公职，并要求将放贷人登记纳入地方治理，回应乡村妇女的债务压力。这里的‘农村民主化’既联系国家土地法，也涉及村社会议究竟给谁发言权、家中女儿或妻子的地契登记在谁名下、农业季节工的工资怎样支付。White等2023研究引用Gerwani 1962出版的纲领内容，其文本不是我们已逐页独立核验的大会签署记录。1961年西爪哇Pabuaran的农妇Djenab带着孩子到雅加达研讨会，反映托幼也是具体组织条件；但仅因同一时间存在一份全国纲领与一个农妇故事，不能推定她已取得地契或参加某县的正式分地委员会。","orgs":["gerwani","bti","pki"],"people":["person-djenab-pabuaran"],"claims":["C801"],"note":"1961大会表述与1962纲领的成文/出版时间要分开；农妇Djenab个案见C802/C803，女农民实际地契、税赋与村务代表资格尚未核。仅将地区生产小组列为同时期独立背景，不代表Djenab确曾参加互助队。","evidence_urls":[{"label":"White等2023引用1962 Gerwani农村民主化纲领","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.12506"}]},{"id":"pr-028","period":"1963年—1965年8月","title":"PNI不同干部集团公开争论党内组织程序与国家路线","body":"1960年代的PNI内部有不同领导集团，与地方政治和民族主义社会网络相联系。阿里·沙斯特罗阿米佐约、苏拉赫曼等领导的中央机关，同哈迪、奥萨·马利基等反对派围绕政策、党代会与干部任免产生争论。1965年8月上旬出现公开联署、要求特别会议与中央处分等连续行动。应该逐项记录具体发言、签署人、党章依据、决定由哪个机关执行和各支部是否服从。这既不是PKI内部权力斗争，也不应直接被塑造成某次秘密军事行动的前置情节。","orgs":["pni","pnicentral1965","pniopposition1965","pki"],"people":["person-ali-sastro","person-surachman","person-hardi","person-osa-maliki"],"claims":["C360","C453"],"note":"准确日期、联署原文及不同地方反应仍需按PNI档案和报刊复审。"},{"id":"pr-029","period":"1964年—1965年9月","title":"妇女、青年、文化与劳工组织仍在开展各自日常工作","body":"Gerwani地方分会开展母婴教育、卫生、托幼、妇女权益和社会活动；SOBSI产业工会继续处理工资与职工问题；BTI围绕土地和农村生产组织；Lekra则在文学、艺术和文化活动中建立网络。1964—1965年的KOTI档案目录保存了Gerwani有关助产工作、家庭教育、雅加达分会、妇女节纪念以及同工会大会联系的文件题名，属于研究其日常组织活动的线索，不是1965年后政治宣传所指控行为的证明。必须区分档案目录只证明存在文件名，与已经读过并独立核实文件内容。","orgs":["gerwani","sobsi","bti","lekra","pemuda","pki"],"people":[],"claims":["C308","C315"],"note":"该组KOTI材料多为目录线索，须逐份取得原始文件。"},{"id":"pr-030","period":"1965年8月—10月1日","title":"一些党干部与军官进行秘密联系，但组织层级和成员资格不同","body":"艾地联系的特别局人员夏姆、波诺，以及总统卫队、陆军和空军中的少数军官，逐渐讨论某种先发制人的军事政治行动。1968年CIA报告依据后来审讯资料重建了9月6日前后在军官住宅举行的会议，说夏姆提出有关将领委员会的威胁与革命委员会构想。但这个报告并不是当时会议纪要，也不能凭它证明全体PKI政治局或中央委员会正式授权。应当分开特别局、公开军事领导人、后加入的军官和后来被列入名单的政治人物。","orgs":["pki","pkipolitburo","special","g30s","tni"],"people":["person-aidit","person-sjam","person-pono","person-untung","person-latief","person-soejono"],"claims":["C2696"],"note":"后出审讯、当事人辩护与同期文书有不同证据权重，不能合并为单一确证叙述。"},{"id":"pr-031","period":"1965年10月1日—10月中旬","title":"首都军事行动、广播声明与国家机关权力调动相互交错","body":"10月1日，一部分军事人员对陆军高级将领采取抓捕行动，多名军官遇害。行动者通过RRI广播公布政治声明和革命委员会方案，但被列名的政治人物未必事先同意参与。与此同时，苏加诺尝试处理军队指挥事务，Kostrad司令苏哈托与雅加达军区、RPKAD等机关组织军事反击。广播、新闻审查、机场与军营控制以及总统正式任命在不同时间和不同机关发生，不是一个中心从始至终控制全国的单线过程。此时更不能把政府和军队对相关组织的后续打击倒填为9月所有参与者的共同目的。","orgs":["g30s","g30scouncil","kostrad","rpkad","tni","pkipolitburo","pki"],"people":["person-sukarno","person-suharto","person-untung","person-supardjo","person-umar-wirahadikusumah"],"claims":["C2696"],"note":"具体小时、广播原文、军令以及法医材料已有独立研究档案，应逐案引用。"},{"id":"pr-032","period":"1965年10月—1966年","title":"国家军队、地方政治机构和群众组织的实际打击行动","body":"1965年10月以后，各省市发生针对PKI党员、SOBSI或BTI工会农会成员、Gerwani妇女及其他被怀疑者的拘捕、失踪、杀害和财产剥夺。不同军区、地方行政机关和反共群众团体参与程度并不相同，地区启动日期也有差别。被拘者中的工会会员不能自动被认定为正式党员；地方人事、地籍和企业招聘规则的改变，又可持续影响家庭数十年。必须对每个县、市分别追踪谁制作名单、谁发布命令、何处拘押、财产与职业怎样处置。","orgs":["pki","sobsi","bti","gerwani","nu","ansor","tni"],"people":["person-suharto"],"claims":["C315"],"note":"全国性死亡估计不能直接当作各地区可相加的完整名册，须保持地区与材料口径。"},{"id":"pr-032a","period":"1965年10月28—29日：南苏门答腊巨港","title":"炼油厂与化肥厂工会人员被拘，企业对破坏指控有不同说法","body":"1965年10月28—29日，美国使馆劳动参赞走访巨港的Stanvac、Shell和PUSRI相关企业。随后11月1日电报报告了当地拘押情况，记载约600人被拘的地方估计，另提到多名Stanvac职工、Shell PERBUM会员和PUSRI SOBSI干部被捕。电报还反映Shell经理不承认军方对某炼油设施火灾‘蓄意破坏’的指控。此类材料说明工会和国家安全机关之间的实际冲突如何进入具体企业招聘与生产管理，但不能把外交电报所引的数字冒充已核实的拘押名册。","orgs":["sobsi","pki","tni"],"people":[],"claims":["C810","C1468"],"note":"需要企业人事、军方拘捕记录和被拘者个人证词核实人数、名单及火灾原因。"},{"id":"pr-033","period":"1966年—1968年","title":"被禁止的党、不同地下网络及海外联络的分化","body":"PKI被禁止后，不同幸存干部尝试在国内重新建立联络。1966年9月出现署名政治局的自我批评文件，对此前合法主义路线和九三〇运动参与进行反思，并承认当时镇压使全面总结十分困难；这是部分干部自己的政治文本，不是经过独立核实的全党一致意见。苏迪斯曼、雷旺等人分别参与不同网络；在北京形成的国外中央委员会代表团也与国内残存组织存在分歧。不能把这些联系拼成一个‘全国地下党中央’，更不能用海外文件宣布国内所有人员的实际归属。","orgs":["pki","pkipolitburo","tni"],"people":["person-sudisman","person-rewang","person-munir","person-islandar-subekti"],"claims":["C2860","C2861","C2862","C2863","C2851","C2852"],"note":"每支地下组织的人员、地点、会面与文件传播范围尚待单独复原。"},{"id":"pr-033a","period":"1966年4月15—24日，北亚齐地区","title":"学生游行、军警阻拦与304名被移交者：北亚齐的强制行动并非一个统一机关单向执行","body":"据Jess Melvin引述的《Perkembangan 1966》地方军方报告，4月15日Bireuen举行华裔印尼公民忠诚集会，随后出现针对中华人民共和国及华人经营场所的示威。4月18日起，部分KAPPI学生参与集会与拘人；在Lhokseumawe，地方军方一度试图制止袭店及游行，Lt.Col. Mohd. Sjakur所处指挥系统同示威者发生冲突，报告记一名叫Iskandar的中学生中枪死亡。学生反而进一步抗议军方。18日晚学生代表与北亚齐Pantja Tunggal彻夜协商，决定允许他们集中抓捕被官方记录为‘RRT Chinese’的人；报告称304人被带到县长办公室前院，再交给北亚齐军事指挥官。304是当时报告所述的集中移交人数，不是已证实死亡人数；他们的姓名、国籍、政治关系和具体生死结局都没有核清。22日Lhoksukon继续出现暴力及反军方情绪，省军事指挥官Ishak Djuarsa于23日赴Bireuen、Lhokseumawe，24日要求调查。这段行动显示地方学生组织、联合军政机构、县政府及军方并不总以同一方式行事；但共同作用于被指认为政治敌人及华人居民的生活，不能将行政许可简化为自发群众行动。","orgs":["aceh-kappi-1966","northaceh-pantja-1966","northaceh-military-1966","aceh-military-1966","aceh-baperki-1965"],"people":["person-mohd-sjakur","person-iskandar-lhokseumawe-1966","person-ishak-djuarsa"],"claims":["C2877","C2875"],"evidence_urls":[{"label":"Jess Melvin，2013年亚齐1965—1966研究全文（S612）","url":"https://journals.sagepub.com/doi/full/10.1177/186810341303200304"}],"note":"S612已全文核读，C2877登记304人被移交及结局未知；文中所引《Perkembangan 1966》p1—5、军政会议簿及完整拘押名单未直接取得。学生被击毙的个人记录仍须核医院及军方调查档；不得由全部局部行动推断全国军方一致。"},{"id":"pr-033b","period":"1966年5月8日—8月17日前后，亚齐—棉兰—Belawan","title":"离境命令怎样进入家庭与交通：从亚齐车队到棉兰港口的强制迁离","body":"Melvin根据军方报告、华人幸存者口述与Coppel的后出研究指出，1966年5月8日亚齐军事指挥官Ishak Djuarsa发布要求所谓‘外国华人’离开亚齐的命令。Ho Fui Yen与Xie Jie Fang等人回忆，家庭受到威胁后，社区联系人组织车辆，先请求军人护送一支车队沿东亚齐道路经过Meureudu，赴棉兰试探途中风险。护送成功的消息促使更多家庭启程，但被告知军方护送承诺只持续至8月17日。学术研究引述约一万人离开亚齐的估计；其中又有约四千人据称经Belawan港由Kuang Hua号多次搭载离开。这是整个迁离估计与其部分海运乘客两个不同分母，绝不能与4月交军方的304人相加，亦不能当作死亡数字。抵达棉兰后的部分迁离者又遭到新的威胁，说明迁离不是从政治生活中立刻退出。不同人可能有印尼国籍、不同华人政治社群背景、与PKI无关，官方‘外国华人’的标签本身要核户籍、移民法令与执行对象，不能反向认定所有迁离者属于某一政治组织。","orgs":["aceh-military-1966","aceh-baperki-1965","northaceh-military-1966","tni"],"people":["person-ishak-djuarsa","person-ho-fui-yen","person-xie-jie-fang","person-mokoginta-aceh"],"claims":["C2878","C2875"],"evidence_urls":[{"label":"Jess Melvin，2013年亚齐1965—1966研究全文（S612）","url":"https://journals.sagepub.com/doi/full/10.1177/186810341303200304"}],"note":"Melvin 2013 S612全文；其约一万离境、约四千乘Kuang Hua出港来自Coppel 1983二手统计，原迁出册和航次/旅客名单未核。304人本身命运未知，与离境者有无重叠尚无法逐人证明。5月8日驱逐命令签署原件未取；8月17日是期限而不是同日离境事实。"},{"id":"pr-033c","period":"1966年9月—1967年初：政治文本、被捕与领导权再安排","title":"一份政治局自我批评不等于全国地下组织一致：雅加达、万隆和临时中央的不同人事","body":"1965年后许多PKI正式机构遭打散、干部被拘捕或躲藏，政党不再能像1960年代初那样正常召开会议、收缴会费或发出可公开核对的文件。1966年8月17日与9月以后，署名为政治局的公开文件批评旧有‘国家权力两面论’及依靠合法议会斗争的路线；这是特殊环境下幸存一部分领导人自行提出的政治总结，不能因为署名政治局便认定所有此前中央委员都参与起草、批准或读到了文本。Hearman综合档案和当事人回忆指出，1966年底除政治局成员苏迪斯曼所在雅加达联系圈外，万隆还有伊斯梅尔·巴克里为中心的另一组幸存干部，雷旺与后者关系更密切。苏迪斯曼1966年12月被捕后，若干幸存干部组织临时中央委员会，鲁斯兰·维贾亚萨斯特拉被后出研究记为负责人。奥洛安·胡塔佩亚、SOBSI工会人员穆尼尔、人民青年有关的Sukatno与Tjugito等分别进入新的联系网络。在这里，同一人的旧党职、新地下任务、某篇政治声明中的署名资格及对实际交通/供给的控制必须严格区分。与此同时，海外PKI中央委员会代表团有自己的活动和政治承认过程，不能因两套组织都声称延续‘中央’就自动归并为一套指挥系统。","orgs":["pki","pkipolitburo","pki-sudisman-jakarta-1966","pki-bakri-bandung-1966","pki-emergency-cc-1967","ccpkiabroad","sobsi"],"people":["person-sudisman","person-ismail-bakri","person-rewang","person-ruslan-widjajasastra","person-munir","person-oloan-hutapea","person-sukatno-1967","person-tjugito-1967"],"claims":["C2294","C2295","C2296","C2860","C2861","C2851"],"evidence_urls":[{"label":"1966年署名政治局的两份文件公开译载（须区分译者前言和组织文件）","url":"https://www.marxists.org/history/indonesia/PKIscrit.htm"}],"note":"S1310/C2294-C2296为Hearman根据后出当事访谈与文献重建；政治局1966年文件公开译本含编辑前言，不能独立证明全部当期正式成员审批。C2851等海外资料来源独立，但实际领导权仍存争议。"},{"id":"pr-033d","period":"1967年—1968年南勿里达：迁入、生活与有限军事准备","title":"地下干部不只是秘密会议上的名字：妇女交通员、食物、村庄联系和是否武装的争论","body":"在城市躲藏和秘密联络越来越困难时，幸存领导人与地方人员讨论转往东爪哇南勿里达。雷旺后来解释，一些干部已失去法律保护和稳定住处，希望建立新的安全联系与准备基地；他自己的解释是当事人事后回忆，并不等于一份已经取得的正式会议命令。工会干部穆尼尔、临时中央人员及地方负责人苏万迪参与不同阶段的迁移和工程委员会（Kompro），有报告称他们在1967年3月开始落实当地基地计划。居住安排需要房屋、食物、水、农业工作和可靠的交通人；曾参与东爪哇Gerwani的Tuti则在危险环境中为干部传递消息、寻找联系人和临时食宿。Hearman的访谈记录还提到某些三人地下小组把组织、教育联系与有限武装工作分开。当地村民的支持、沉默、恐惧、被迫提供物资或拒绝联系并不一致，不能把整个村庄都算作PKI地下成员。军事方面，部分资料描述武装训练和有限武器，另有雷旺、穆尼尔等的后出陈述认为各地尚无稳固的群众基础或完整的人民军；原定何时发动武装行动仍在争论。1968年军方Trisula行动中发生搜捕、拘押及村庄迁移，苏万迪于6月12日被捕的研究记载可以作为逐人档案线索。军方胜利叙事与幸存者对准备不足和逃亡生活的记述必须并列核证，不能因为1968年遭镇压就倒推1967年已建立完整游击军，也不能把避难者的所有活动都解释为纯粹非政治生存。","orgs":["pki-emergency-cc-1967","pki-kompro-blitar-1967","pki-blitar-cells","gerwani","sobsi","tni","rpkad"],"people":["person-rewang","person-munir","person-ruslan-widjajasastra","person-suwandi-eastjava-1968","person-tuti-courier-1967","person-sukatno-1967","person-tjugito-1967"],"claims":["C2297","C2298","C2299","C2323","C2337","C2444","C2476","C2479","C2491","C2517","C2703"],"evidence_urls":[{"label":"Hearman，南勿里达地下重组与Trisula研究","url":"https://ecommons.cornell.edu/server/api/core/bitstreams/bd54cae9-7692-4b0b-8ffb-6ccb3fdf379d/content"}],"note":"学术研究S1310及Liem访谈S1317，军方/幸存者叙述互有争议。此前尝试读取PDF截图接口失败，仅能可靠说明可检索文本与原研究库已登记的出处；不把受访者姓名或1999以后记忆误写成同时期原始名单。"},{"id":"pr-033e","period":"1964—1968年：外南梦县土地改革后遭重新夺地时的跨农会抗争","title":"1966年外南梦的农户、Pertanu与Petani一起保护土地：谁签信、谁扣地契、谁还在耕种","body":"东爪哇外南梦县在1960年代既有大面积种植园，也有长期在原殖民租地上耕作的小农和不同政治背景的农民组织。1964年一些地方共产党关联团体以土地法执行迟缓为由采取单方面行动，NU旗下Pertanu与PNI相关的Petani在方法上有异议，并不能由此推出它们反对所有土地再分配。1965年政治镇压后，农民原先获得或被承诺分配的土地面临被企业、地方干部或军政人员重新夺取的风险。1966年6月23日，Pertanu外南梦县负责人Soehaimi向国营橡胶种植园PPN Karet XVI致信，要求停止驱赶Kaligondo一带Wadoeng West已耕地农户、停止挖毁农作物并就损失补偿与Pertanu及穆斯林工会Sarbumusi协商。存在这一封请求不等于种植园已经同意谈判。1966年11月13日，Bangorejo地方Pertanu与Petani联合要求纠正原已划为外地地主土地的地块被重新占有、据说有43户农民的土地获配证明被警方依口头命令收缴的问题；11月25日Petani分会的Djoehdi与Achmad Sanimin又作单独书面申诉。学者援引1968年文件称，在Wadoeng West有28.6404公顷列为土地改革对象，其中约26.491公顷最终通过政府决定重新分配。各种面积是不同法律用途的数字，并不能宣称每名农民已确实耕种、且从此不受威胁。真实的历史关系由地方农户、种植园、行政机关、宗教农会、民族主义农会和工会之间的多次行动构成，不是‘1965年后两派自动相互屠杀’的替代口号。","orgs":["pertanu","pertanu-banyuwangi-1966","petani-pni-banyuwangi-1966","sarbumusi","nu","pni"],"people":["person-soehaimi-pertanu-banyuwangi","person-djoehdi-petani-banyuwangi","person-achmad-sanimin-petani"],"claims":["C2914","C2915","C2916","C2920"],"evidence_urls":[{"label":"S1541：Luthfi 2017《Bhumi》pp.150—152，注明1966函件与1968土地决定","url":"https://www.jurnalbhumi.stpn.ac.id/index.php/JB/article/view/121"}],"note":"2017学术论文转录1966信函、州县行政资料和1968决定；本文未独立读完整ANRI、法院或村级地契原扫描。43份凭证、28.6404公顷标的和26.491公顷登记不能相加或等同逐人核实的实际产权。"}]);

window.HIST.processes.push(...[{"id":"pr-034","period":"1968年—1970年代","title":"南勿里达军事行动、村庄管理与被拘人员家属的生活变化","body":"1968年南勿里达地区的地下网络遭到军方Trisula行动打击。军事报告与后来的受害者研究涉及部队调动、村庄人口登记、地方行政接管、嫌疑人员和家庭调查。研究者Hearman指出行动规模约有数千军人和民兵，但这是特定来源的估计；不同人员的遭遇不能由统一数字代替。有关雷旺的后出美方材料曾误称他已被杀，后来的人物研究、拘押及获释记录说明此说不能成立。前Gerwani成员普吉·阿斯瓦蒂被拘、审判和释放的长期过程，也表明镇压的历史并未在军事行动结束时终止。","orgs":["pki","gerwani","tni"],"people":["person-rewang","person-munir"],"claims":["C2880","C2882","C2884","C2885"],"note":"必须按人的实际拘押时间、法院文书和家属经历校对；军方战果说法仅为其主张。"},{"id":"pr-035","period":"1969年—1980年代","title":"拘押、劳动安排与政治身份审查进入常态行政","body":"新秩序时期，大量被认定与被禁组织有关的人员遭到长期拘押、政治资格限制及工作审查；布鲁岛只是其中一处重要拘押地点，不能替代其他地区的监狱与行政管制史。工厂、学校、公务员系统和地方行政机关的录用、家庭户籍及背景登记逐渐形成制度性影响。部分政治犯获释后仍需报告行踪或面临就业限制，其子女和家属的教育、住房、婚姻也受到影响。研究必须把一纸命令同实际办理的证件、工资、迁移许可与日常生活逐案连接。","orgs":["pki","korpri","tni","golkar"],"people":["person-rewang","person-suharto"],"claims":["C315"],"note":"法律规定与地方执行不能混同；具体身份标记制度要结合各时期法令和个案核查。"},{"id":"pr-035a","period":"1965年10月20日—1980年代：工会成员从厂房到监狱再到语言学校","title":"同一名工人从工厂干部变成政治犯：阿丹被捕、狱中写作与出狱后重新谋生","body":"1965年10月20日，曾任泗水工厂分会主席的阿丹·苏帕尔詹被捕，被指支持三十日运动，后来在东爪哇多处监狱遭到十三年不经审判的拘押，包括泗水卡利索索克监狱。他此前参加欧洲劳工会议，并不能自动证明他参与1965年雅加达军官行动。狱中的他在1975—1976年用化名Bintang Karim写英文阅读材料，假托Arman的旅行经历，计划获释后用于教授英语。研究者如今在阿姆斯特丹国际社会史研究所见到其中第二、第三册手稿，第一册在该馆藏中缺失；不能声称全套已发现。1978年他离开监狱，已不能回到原先的泗水住所，最初在谏义里依靠兄弟姐妹生活、教授私人英语课，旅行仍受官方许可约束。1980年他重新结婚并迁回泗水，创办小型语言学校和翻译业务。这样一条个人生活链使1965年镇压后果能够落实到职业失去、住房变更、监狱中的教育计划与家庭生计，而不是只留下一个‘长期拘押’的笼统标签。该个人经历主要依据当事回忆、藏于IISH的手稿与后出学术核读，仍需逐份对照原逮捕和释放记录。","orgs":["sobsi","sbim-ngagel","braat-barata-ngagel","tni"],"people":["person-adam-soepardjan"],"claims":["C1504"],"evidence_urls":[{"label":"Cambridge Core：狱中手稿、1978年出狱与1980年再谋生","url":"https://www.cambridge.org/core/journals/international-review-of-social-history/article/from-travel-to-imprisonment-remembering-cold-war-trade-unionism-and-the-world-federation-of-trade-unions-wftu-in-adam-soepardjans-prison-notebooks/5D2B6B5169AABB43099B9D1267190C86"}],"note":"1965-10-20与1978、1980日期主要经后出回忆与学者核读；狱中教材第I册缺，不可称档案全套已得；不同政治拘押者处遇不能由单一个案外推。"},{"id":"pr-035b","period":"1965—1977年，服装、航空、教育、农会与妇女工会人员的不同拘押轨迹","title":"一份1977年逐人名单：妇女不只是‘受害者’类别，她们曾组织工会、代表农户并参加议会","body":"1977年9月23日，国际特赦组织公布一份关于印尼政治拘押者中工会人士的逐名名单。报告首先提醒读者：SOBSI的许多普通工会会员没有加入PKI，不能因为两种组织密切合作就把工会会员资格当作参与1965年军官行动的证据。随后出现的是有真实职位与生活经历的妇女。Sri Ambar自1950年代初参加工会工作，担任SOBSI妇女部门负责人，报告记她1966年被捕，1975年经过审判，被判十五年；与名单其他很多未经审判的人不同，不能把她的法律状态抹平。议会代表Kartina Kurdi同时在BTI和Gerwani活动，报告时被关在雅加达Bukit Duri；Dahliar作为BTI议会代表，据报在Plantungan女子拘押营。雅加达联合利华工厂工会成员Kusnah据报1969年被捕，在三宝垄Bulu监狱；另一位纺织厂女工Otjik据报1967或1968年被捕，在Plantungan。作为律师兼民航工会Serbaud成员的Sri Suharti，据报1969年被捕，丈夫也被拘押，五个子女成为这一变化的家庭背景。邮电工会成员Satijah、教师工会PGRI-NV成员Sedijami也列于不同拘押地点。另有工厂工会活动者Pudjijati，报告说她在苏加诺时期就因工资和物价要求参与示威并曾被逮捕；这表明她的劳动政治不是从1965年之后的受害者身份才开始。各人职位、工厂和羁押情况是1977年人权组织当时的报告，不是本研究已经查到所有法院、监狱、企业原件，后续获释、死亡或迁移不能根据1977的静态名单擅自续写。不同妇女同处一个工会体系，不意味着她们是同一工厂、同一党支部，或因为共同遭拘押就曾执行同一中央命令。","orgs":["sobsi","sobsi-women-division","gerwani","bti","unilever-workers-jakarta","serbaud-aviation","sb-postel-1977","pgri-nv-teachers"],"people":["person-sri-ambar-sobsi-1977","person-dahliar-bti-1977","person-kartina-kurdi-1977","person-kusnah-unilever-1977","person-otjik-textile-1977","person-sri-suharti-aviation-1977","person-satijah-post-1977","person-sedijami-teacher-1977","person-pudjijati-union-1977"],"claims":["C316","C317","C2905","C2906","C2907","C2908","C2909"],"evidence_urls":[{"label":"国际特赦组织1977-09-23职业工会政治拘押者名单，ASA 21/09/77","url":"https://www.indonesia1965.org/content/uploads/2023/08/ASA-21-09-77-Occupational-list-of-Prisoners-trade-unionists.pdf"}],"note":"完整阅览1977扫描原件5页；原件仅为当时人权组织依据来稿汇总的公开名单，非政府囚犯总册。姓名不完整、羁押年份存在估计且每个人后续待独立核实，禁止由同名自动合并。"},{"id":"pr-035c","period":"1965—1977年，跨工种的职业与拘押去向","title":"从港口、铁路、邮政和国际工会到监狱：名单里的男性工人也不只有中央领导人","body":"同一份1977年国际特赦组织名册不仅记录知名的全国工会干部。它还记雅加达邮局工人Manto、Parto Moekiman，铁路工人Slamet和Supardi，地方水利工作人员Gunati，技术研究所职工Tutuk Hardjito以及从巨港来的工会人士Darsono。在名单形成时，部分人被关押于雅加达Salemba，另一些已被迁至布鲁岛，甚至有邮政工人Roeslan被报告与家人失去联系。与此同时，SOBSI高级干部Ferdinand Runturambi不仅曾有议会与跨国工会身份，1977年仍被报告拘押在布鲁岛。他和1977名单中仅以普通工会岗位出现的人，遭遇不能简单视为一份中央政治局的个人清单。报告也特别提醒工会会员和PKI党员不等同；但这份文件没有逐人保存工会会员证、逮捕令及所有被拘押者的最终司法结果。各行业是否曾协同开展罢工、外交出访或参加1965年政治事件，必须从其本职工作与各自地方组织的实际记录求证，而不是从同在一张拘押名册倒推。","orgs":["sobsi","sb-postel-1977","wftu","sarbu"],"people":["person-ferdinand-runturambi-1977"],"claims":[],"evidence_urls":[{"label":"Amnesty International 1977原始工会政治拘押者名单","url":"https://www.indonesia1965.org/content/uploads/2023/08/ASA-21-09-77-Occupational-list-of-Prisoners-trade-unionists.pdf"}],"note":"原报告在若干男性姓名上只有姓氏或名字，本文不将同名Darsono/Slamet/Roeslan自动链接早年政治人物；待取得更完整姓名、职业及拘押原档后再建对应人物。"},{"id":"pr-036","period":"1971年—1980年代","title":"行政机关、专业集团与新工会联合体改变劳动代表方式","body":"国家通过公务员组织、专业集团以及新的工会制度，对公务员和产业职工的代表关系进行重组。1973年成立的FBSI是不同制度环境中的工会联合体，不能视为SOBSI直接改名。原SOBSI所属职工有的人被解雇、拘押或限制重新就业，不同国有企业和私营企业招聘规则又可能具有地区差别。产业劳动组织的连续性，必须通过职工、单位、行业、机构、缴费和劳动合同核对，而不是仅凭两个工会都声称代表劳动者，就认定存在正式继承关系。","orgs":["sobsi","fbsi","golkar","korpri"],"people":["person-suharto"],"claims":["C231","C315"],"note":"需要原工会和新工会的行业会员名单与政府监管文件来验证实际延续与断裂。"},{"id":"pr-036a","period":"1966年以后—1973年，农村组织制度重组","title":"农民代表权没有在原组织被禁止后自然恢复：军政合作机关与HKTI建立","body":"1965年后的拘捕和地方政治清查，切断了许多农村劳动者与其原农会、土地改革委员会、互助队之间的联系。旧农民组织消失并不意味着种地的人、佃户和灌溉纠纷消失；变的是这些农户能够合法通过哪些机关表达要求。White等对农村政治的历史研究将1973年HKTI（印尼农民和谐协会）的形成置于国家和军方将残存农业组织改组的过程中，其中军队—农民合作机关BKST是重要中介。HKTI同Golkar的政治联系及首任负责人Martono，使它处于与原BTI完全不同的政治条件中。但仅凭全国机关名称，无法知道同一村庄里哪位原BTI成员失去土地、哪位农民加入HKTI、谁获得农药和肥料、哪个基层委员会的权力从何而来。这里必须从组织禁令、农村公职人选、农资发放和地方会员表分别建立证据链；HKTI不能当作BTI改名，更不能以机构接替推导所有成员的自动改换党籍。","orgs":["bti","hkti-1973","bkst-1973","golkar","tni"],"people":[],"claims":["C124","C239"],"evidence_urls":[{"label":"White等2023：印尼乡村组织在新秩序下的重组","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.12506"}],"note":"1973年HKTI形成及BKST联系来自后出学术综述；原1973机构设立令、首届委员会、地方会员、BKST法定权限仍待核。"},{"id":"pr-036c","period":"1970—1973年：Pertanu内部沟通与国家农业代表机构改组","title":"Pertanu进入HKTI的说法不能替它写一份不存在的解散大会记录","body":"外南梦这些具体的土地保护行动发生后，Pertanu的地方和中央人员并没有立即作为社会联系消失。Luthfi依据往来信件记载，1970年东爪哇NU机关曾催问Pertanu中央负责人Mohammad Munasir拟议中的全国会议何时召开，表明内部组织程序与实际活动仍需向下追查。1973年国家支持的农民代表机构HKTI形成，学术研究记Pertanu及其他农民组织进入新的统一代表体系。但‘某些机关和社会资源进入HKTI’、‘原Pertanu法定解散’和‘全体成员改换组织’绝不是同一件事。Luthfi文章将相关并入日期写作1973年4月27日；另一已入库的ICJ法律与机构史据C239把HKTI建立列在4月26日。两条记录可能指不同的会议、批准或实施，不能在未得当时决议前随意把其中一条改成错字。更重要的是，Pertanu前任领导Imam Churmen后来表示既未举行正式大会决定解散，法律身份是否终结仍有争论；本研究记录该主张的出典，不将其直接升级为法院裁定。要认识1973年农村真正改变了什么，还必须查谁获选县级农会干部、谁收缴会费、谁能获得肥料、土地纠纷何处处理及1950年代Pertanu老成员有没有在新体系中继续活动。","orgs":["pertanu","hkti-1973","bkst-1973","nu"],"people":["person-mohammad-munasir-pertanu","person-imam-churmen-pertanu"],"claims":["C124","C239","C2917"],"evidence_urls":[{"label":"S1541：Luthfi 2017《Bhumi》pp.154—155，1970往来与1973并入叙述","url":"https://www.jurnalbhumi.stpn.ac.id/index.php/JB/article/view/121"}],"note":"S1541说4月27日并入，C239/S199另说4月26日HKTI成立，可能是不同事件；应获取原成立大会、组织合并文书及Pertanu解散法定决定。原领导人‘无正式解散’说是后出回忆，不是司法判决。"},{"id":"pr-037","period":"1980年代—1998年","title":"工厂劳动争议、学生社团与新反对政治网络陆续发展","body":"进入1980—1990年代，企业扩张、迁移与工业劳动改变城市工人的组织处境，一些工会人士尝试建立不依附官方工会的活动网络。穆赫塔尔·帕克帕汉等人参与建立独立工会联系，工人马西娜之死成为劳动权利和国家暴力争论的重要案例。学生与劳动活动者在不同校园、工厂、地方组织之间建立联系，布迪曼·苏贾特马科、迪塔·英达·萨丽等人参与1990年代的政治组织活动，1996年PRD成立。不能仅因这些人后来主张社会主义，就把他们写成被禁PKI的组织延续。","orgs":["prd","fbsi","pki"],"people":["person-pakpahan","person-marsinah","person-budiman","person-dita-sari"],"claims":["C667","C811"],"note":"各工会、企业、学生网络及1996年党代会的原始成员记录仍需系统编列。"},{"id":"pr-038","period":"1998年—2012年","title":"政治改革中的工会、农民和幸存者组织继续提出不同要求","body":"1998年苏哈托辞职后，结社、选举和新闻活动空间发生变化，产业工会与学生、农民组织在不同地方恢复或新建联系。原政治拘押者和家属则通过法律诉讼、证言、纪念活动与历史调查争取权利。这些人并不因为共同反对过去的镇压就成为一个统一政治组织。法律允许某种工会成立，与工会实际取得企业谈判权、缴费会员和工厂代表席位仍是不同的历史过程。历史调查还须将国家人权机构、受害者网络和党派活动分别记录。","orgs":["prd","pki","fbsi"],"people":["person-pakpahan","person-dita-sari","person-budiman"],"claims":["C829","C830"],"note":"应补具体工会会员、企业层级劳动案件、土地组织和幸存者团体的完整档案。"},{"id":"pr-039","period":"2012年—2026年","title":"人权调查、国家承认与救济执行不是同一个事件","body":"2012年印尼国家人权委员会完成有关1965—1966年严重侵害的调查；2023年总统公开承认若干重大历史人权侵害并提出非司法补救。此后的受害者身份确认、医疗和心理社会服务、司法责任追究以及历史研究自由，各自有不同法律程序和机构。不能把国家作出公开表态等同于所有受害者已经被逐人认定、得到补偿或者获得司法判决。原PKI及群众组织的经历、家属持续遭遇、当代政党与工会的组织模式，应持续沿具体人员和机构查证，而不是在1965年或1998年停止。","orgs":["pki","sobsi","gerwani","prd"],"people":["person-widodo"],"claims":["C129","C735","C742"],"note":"研究库已有2023—2026法律与实际服务统计来源；具体数字须按签发份数、人数和服务项区分。"}]);

</script>
<script>
(function(){
"use strict";
var db=window.HIST, main=document.getElementById("main"), menu=document.getElementById("menu");
var state={view:"read",id:"chapter-01",q:"",from:"",to:"",page:0};
var PAGE=35;
var labels={read:"连续历史",legacy:"旧正文备查",chrono:"同期事实记录",organizations:"组织与成员",people:"人物档案",events:"事件与会议",sources:"史料出处",coverage:"研究缺口"};
var smap=new Map(db.sources.map(function(x){return [x.id,x]}));
var cmap=new Map(db.claims.map(function(x){return [x.id,x]}));
var omap=new Map(db.organizations.map(function(x){return [x.id,x]}));
function E(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function low(s){return String(s||"").toLowerCase()}
function safe(u){return /^https?:\/\/[^\s]+$/.test(u||"")?u:""}
function qterms(){return low(state.q).trim().split(/\s+/).filter(Boolean)}
function hits(v){var t=low(v);return qterms().every(function(x){return t.includes(x)})}
function urlFor(view,id){return "#"+view+(id?"/"+encodeURIComponent(id):"")}
function button(txt,view,id){return '<button class="linkbtn" data-go="'+E(view)+'" data-id="'+E(id||"")+'">'+E(txt)+'</button>'}
function tag(txt,cls){return '<span class="tag '+(cls||"")+'">'+E(txt)+'</span>'}
function title(t,d){return '<div class="head"><h2>'+E(t)+'</h2><p>'+E(d)+'</p></div>'}
function stats(){return '<div class="stats">'+[['研究事实',db.claims.length],['来源记录',db.sources.length],['组织档案',db.organizations.length],['人员档案',db.people.length],['事件条目',db.events.length],['覆盖事项',db.coverage.length]].map(function(a){return '<span class="stat"><b>'+a[1]+'</b> '+a[0]+'</span>'}).join("")+'</div>'}
function tools(extra){return '<div class="tools"><input type="search" id="q" placeholder="检索姓名、组织、史实、出处（Enter确认）" value="'+E(state.q)+'" autocomplete="off">'+(extra||"")+'</div>'}
function citeButtons(ids){if(!ids||!ids.length)return tag("本条暂无来源ID","warn");return ids.map(function(id){return button(id,"sources",id)}).join(" &nbsp; ")}

function roleList(arr){

 return arr.map(function(r){
   var p=r.person_id&&db.people.find(function(x){return x.id===r.person_id});
   var who=p?button(r.person,"people",r.person_id):'<b>'+E(r.person)+'</b>';
   var org=omap.get(r.organization);
   var where=org?button(org.name,"organizations",org.id):tag(r.organization||"所属机构未核","warn");

}
