window.HIST.claims.push(...[{"id":"C818","text":"Melvin transcribes Aceh military commander Djuarsa issuing Instr-1/10/1965 on 14 Oct to establish Ruang Yudha war room; cites a 250-page military annual report and 21-page West Aceh command bundle.","period":"1965-10 to 1966-02","type":"Scholarly transcription of military documents","source_ids":["S472","S127"],"confidence":"Moderate-high for cited document metadata; original facsimiles not independently read","basis":"Melvin 2018 introduction pp22-23 and Killing to Destroy p195; same archive as S127.","next":"Acquire Instr-1/10/1965 scan and West Aceh meeting minutes; cross-check duty logs and district victim records.","year":1965},{"id":"C1581","text":"The first page of the 30 April 1921 Soeara Ra'jat, year 4 no. 8, identifies the publication as an organ of Perserikatan Kommunist India (PKI), lists Partondo as editor and VSTP Semarang as its office, and calls for workers to unite and the Indies to be governed by its own people.","period":"1921-04-30","type":"Contemporary periodical scan; organizational self-description","source_ids":["S891"],"confidence":"High for visible masthead, date and headlines; moderate for exact translation of selected old-spelling Malay passages","basis":"All eight pages were visually reviewed; page 1 was read at high resolution. It reads “Hindia mesti diprentah ... oleh rajat Hindia sendiri” and “Hindia minta merdeka.” These are statements printed by the paper, not a survey of public opinion.","next":"Compare with an institutional copy and produce a diplomatic transcription of the complete issue.","year":1921},{"id":"C1582","text":"The 30 April 1921 issue is year 4 no.8; its masthead names Perserikatan Kommunist India (PKI), editor Partondo and a VSTP Semarang office.","period":"1921-04-30","type":"Contemporary periodical masthead","source_ids":["S891"],"confidence":"High for text visible on the scanned page","basis":"The scan shows “No. 8,” “Tahoen ke 4,” the publication date, PKI organizational masthead, editor and office.","next":"Compare with a copy located through IISH or another institutional repository.","year":1921},{"id":"C2875","text":"Melvin’s 2013 study argues that violence affecting ethnic Chinese in Aceh comprised three distinguishable waves: PKI-linked Chinese targeted with other PKI members; Baperki members targeted for alleged PKI links; and later violence against broader ethnic Chinese/pro-Beijing communities culminating in an expulsion order.","period":"1965-10 to 1966-08; Aceh","type":"Scholarly regional interpretation based on documents and oral histories","source_ids":["S612"],"confidence":"High that the article presents this periodization; moderate for its reconstruction because several underlying military documents and oral accounts are not independently available here.","basis":"This regional typology does not yield a national victim-ethnicity proportion and should not be generalized to every province.","next":"Compare the cited Aceh military chronology, Baperki documents, local government reports and independent survivor/family accounts.","year":1965},{"id":"C2877","text":"An Aceh North District report reproduced by Melvin says that around 18–19 April 1966 students detained 304 people labeled “RRT Chinese” and handed them to the North Aceh military commander; the report gives no known fate for them.","period":"1966-04-18 to 1966-04-19; Lhokseumawe, North Aceh","type":"Contemporary district report quoted by a later scholar; fate unresolved","source_ids":["S612"],"confidence":"High that the article quotes a report with the 304 figure and says their fate is unknown; low for a final unique-person count or subsequent outcome.","basis":"RRT Chinese is the source’s administrative label; the 304 are detainees, not a verified death count. The underlying district report and names are not in hand.","next":"Retrieve the April 1966 Perkembangan Di Bidang Politik/Keamanan report and list; trace custody transfer, later release, death, flight and family accounts.","year":1966},{"id":"C2878","text":"Melvin reports that Aceh Military Commander Ishak Djuarsa’s 8 May 1966 order required “alien Chinese” to leave Aceh; the article cites earlier scholarship for roughly 10,000 people fleeing by August 17.","period":"1966-05-08 to 1966-08-17; Aceh / North Sumatra","type":"Administrative-order and displacement reports in later scholarship","source_ids":["S612"],"confidence":"High that Melvin reports the order and attributed approximate displacement; moderate for exact wording and count pending the original directive and departure records.","basis":"Expulsion/displacement is not a death count. The 10,000 figure is not a list of unique refugees and may exclude people who stayed or departed by other routes.","next":"Find Djuarsa’s signed directive, checkpoint/pass lists, convoy records, port/ship manifests, refugee registration and family/community lists.","year":1966},{"id":"C2891","text":"The 30 April 1921 Soeara Ra'jat no.8 pp.5–6 has a separate appeal for founding/funding a Sarekat Islam school, ending ‘A.n. Bestuur S.I. Semarang’ and signed SEMAOEN as Voorzitter (chairman) and BOEDISOETJITRO as Secretaris (secretary). These signatures belong to the school appeal, not the preceding party-discipline essay.","period":"1921-04-30","type":"Contemporary SI Semarang school appeal and officers' signatures","source_ids":["S891"],"confidence":"High for original printed signatures and school appeal; actual donations, class start date and school financing not independently proven.","basis":"S891 original scan p.5 lower column to p.6, separated from the earlier article ending on p.5. Signatory offices are at the time and local branch only; not evidence for SI national executive office.","next":"Check original donation/payment ledger, 1921 June school intake/class register, and subsequent newspaper receipts.","year":1921},{"id":"C2892","text":"The Indonesian Ministry of Culture's historical encyclopedia summarizes the 29 November 1946 SOBSI founding conference as selecting Harjono as chair, Setiadjit as deputy chair, and Njono/Nyono as general secretary; it cites later labor histories and an ANRI inventory, not the original conference ballot or signed attendee roll.","period":"1946-11-29","type":"Government-hosted retrospective report of SOBSI founding officer slate","source_ids":["S1536"],"confidence":"High that the Ministry's webpage presents this slate; moderate for exact historical offices until 1946 original conference record is examined.","basis":"S1536 website section on 29 November 1946 Yogyakarta federation conference and early officers; the article refers to Lestari, Glassbuner, and ANRI SOBSI inventory 151, not direct 1946 signatures. Names, exact terms and multiple sources need cross-verification.","next":"Obtain original 29 Nov 1946 SOBSI conference minutes, named delegates, union affiliation/dues and contemporary newspapers; compare Tedjasukmana 1958 and the Nyono entry.","year":1946},{"id":"C2893","text":"Hearman's peer-reviewed trade-union study reports that SOBSI held its first congress in Malang, East Java, in 1947 and voted to affiliate with the World Federation of Trade Unions (WFTU), initially to seek international labor support for Indonesia's struggle for independence against the Dutch.","period":"1947; Malang","type":"Retrospective scholarly reconstruction of early SOBSI congress and international affiliation","source_ids":["S845"],"confidence":"High for the scholar's published account; congress voting record, individual delegates and initial intentions have not been independently audited.","basis":"Vannessa Hearman, International Review of Social History (2024), section on post-1945 labor and WFTU; reports initial independence rationale from earlier labor scholarship. Not a first-hand congress minute.","next":"Find the 1947 Malang SOBSI original congress resolution, voting records and WFTU correspondence, and compare post-1949 international affiliations.","year":1947},{"id":"C2894","text":"Hearman's labor-history article describes the formation of rival SOBRI, aligned with the Murba Party, in 1951, and Sarbumusi, aligned with Nahdlatul Ulama, in 1955; these were distinct union organizations and not SOBSI branch renamings.","period":"1951–1955","type":"Retrospective scholarly account of rival independent-era labor federations","source_ids":["S845"],"confidence":"High for the published chronology; actual local chapters and precise patronage differ by region and require union charters.","basis":"Hearman 2024, section on proliferation of national trade-union federations after sovereignty transfer; names, links and founding years given as scholar's synthesis.","next":"Locate 1951 SOBRI and 1955 Sarbumusi constitutive statutes, regional membership and enterprise elections; do not infer every worker's party affiliation.","year":1951},{"id":"C2895","text":"Hearman cites Indonesian Ministry of Labour figures that more than 1,500 national, regional and local trade unions existed in 1955 and about half had no affiliation to a national federation; these are ministry figures cited secondhand, not verified individual union registers.","period":"1955","type":"Secondary citation of a historical government trade-union count","source_ids":["S845"],"confidence":"High that scholarly study prints the figures, moderate for unduplicated union count and exact organizational scope without Ministry source.","basis":"Hearman 2024 text cites the original Ministry of Labour study; classification and counting by local/national entities may duplicate nested branches.","next":"Find original 1955 Indonesian Ministry of Labour union-registration tables and check double counting, local registered membership, inactive unions and organizational autonomy.","year":1955}]);

window.HIST.claims.push(...[{"id":"C2294","text":"Hearman identifies two main surviving PKI clusters after the 1965 repression: Sudisman’s group in Jakarta and a Bandung group around Ismail Bakri that Rewang supported; Rewang had chaired the Central Java provincial committee and was a Central Committee secretary/candidate member.","period":"1966-12 to 1967","type":"Secondary reconstruction of underground leadership","source_ids":["S1310","S1477"],"confidence":"Moderate; the grouping and offices are reported through scholarship, interviews and memoirs, not contemporaneous branch minutes.","basis":"Hearman, pp.71–74, compares participant accounts and later memoirs; Hill, p.366, cites Hearman for the domestic leadership chronology and is derivative, not independent corroboration. No complete membership list or command archive has been inspected.","next":"Locate Ismail Bakri, Rewang and provincial committee correspondence, names/roles lists and contemporaneous exile reports.","year":1966},{"id":"C2295","text":"Hearman reports that after Sudisman’s arrest in December 1966 an emergency PKI Central Committee was formed under Ruslan Wijayasastra.","period":"1966-12 onward","type":"Attributed organizational-history claim","source_ids":["S1310","S1477"],"confidence":"Moderate; the source is Rewang’s interview and later organizational accounts; no signed formation resolution or membership roll is reproduced.","basis":"Hearman, pp.72–73 and note 53 reports Rewang's interview; Hill, p.366, explicitly cites Hearman 2010a pp.72, 85–86. Hill is not an independent witness. No signed formation resolution or membership roll is reproduced.","next":"Find the emergency committee’s founding resolution, membership list, minutes, courier records and correspondence.","year":1966},{"id":"C2296","text":"Hearman identifies Oloan Hutapea, Munir, Sukatno and Tjugito as second-echelon leaders drawn into Rewang’s network and reports that these figures were captured in South Blitar in 1968.","period":"1967–1968","type":"Secondary reconstruction; attributed individual roles","source_ids":["S1310"],"confidence":"Moderate-high for the article’s identification; detention and capture dates require Army/court records.","basis":"Hearman, pp.72–73 and note 52; the source names prior roles from Van der Kroef and other secondary literature.","next":"Check Trisula detainee registers, trial files, identity records and party correspondence; separate each person's capture date and role.","year":1967},{"id":"C2297","text":"Rewang later explained that the move to South Blitar followed the loss of legal protection, the danger of hiding in cities and a decision to prepare armed resistance; this is his retrospective account, not a recovered committee resolution.","period":"1966–1967, recalled 2009","type":"Participant oral testimony about decision and motive","source_ids":["S1310"],"confidence":"Moderate for Rewang’s stated rationale; low-to-moderate for its representativeness of the full leadership network.","basis":"Hearman, p.73; interview with Rewang, Solo, 14 February 2009. Compare earlier quoted testimony in Andre Liem.","next":"Locate Rewang’s contemporaneous letters, provincial committee notes and interviews with other participants who disagreed.","year":1966},{"id":"C2298","text":"Hearman reports that South Blitar fugitives relied on local residents for food and shelter and that accounts differ over whether cadres remained mutually isolated or worked through small cells; the article explicitly identifies tension between these recollections.","period":"1967–1968","type":"Oral-history reconstruction of local support and cell structure","source_ids":["S1310"],"confidence":"Moderate for the presence of local support and divergent memories; exact numbers and village-level network map remain uncertain.","basis":"Hearman, pp.78–80; participant interviews and Indonesian Social History Institute transcripts. The author flags contradictions rather than resolving them into one uniform structure.","next":"Map named villages, households, food routes, couriers and cells using interviews, local records and separate witness timelines.","year":1967},{"id":"C2299","text":"Hearman reports disagreement among post-1965 PKI leaders over whether armed attacks should wait until an underground mass base was rebuilt or begin immediately; Munir later attributed the defeat to haste that exposed the South Blitar network before preparations were ready.","period":"1967–1973, recalled in 1973 and 2008–2009","type":"Participant and scholarly account of strategic disagreement","source_ids":["S1310","S1411"],"confidence":"Moderate for the existence of disagreement; the surviving statements are retrospective and do not represent all factions.","basis":"Hearman, pp.81–82; cites Guy Pauker’s 1969 report, Munir’s 1973 defense statement, and later interviews with Winata and Tuti. The RAND memorandum is USAF-sponsored contemporaneous analysis, but its text was not obtained; the dispute is accessible here only through Hearman’s quotation. It is an outside analyst’s assessment, not a PKI record.","next":"Retrieve Pauker’s full memorandum and Munir’s original defense transcript; compare with captured party papers and regional military intelligence.","year":1967},{"id":"C2323","text":"Liem’s interview material describes an emergency Central Committee above provincial leadership and South Blitar project committees; Rewang recalled nine Central Committee members, regional committee figures and cadres from several provinces participating.","period":"1967-1968","type":"Retrospective participant testimony","source_ids":["S1317"],"confidence":"Moderate for the described structure; low for a complete roster, national reach or effective command.","basis":"Rewang’s testimony in the chapter’s Kompro section; names, dates and formal authority remain uncorroborated by internal minutes.","next":"Obtain the original interview, party rosters, minutes and captured command papers; map each committee’s dates and geographic remit.","year":1967},{"id":"C2337","text":"Liem reports that military intelligence on South Blitar began by mid-1967, Soeharto issued an operational order on 20 February 1968, and the Trisula task force was formed on 5 May; the chapter cites official effective operations from May through July, while Hearman dates the named operation’s start to June.","period":"1967-06 to 1968-09","type":"Scholarly reconstruction with attributed military records","source_ids":["S1317","S1310"],"confidence":"Moderate-high for the dated stages; the difference between planning, task-force formation and the main field phase requires the original orders.","basis":"Liem reports distinct intelligence, cleanup-operation, task-force and effective-attack stages; Hearman’s June date may mark the named field operation rather than all preparation.","next":"Read the 20 February order, 5 May formation order, phase reports and 7 September closure record; distinguish phase start from operation name.","year":1967},{"id":"C2444","text":"Munir said South Blitar had not yet met the three conditions he considered necessary to begin an armed revolution: a strong party, broad mass support, and a workers' and peasants' revolutionary army.","period":"1967–1968, as recalled in 1973","type":"Retrospective strategic assessment","source_ids":["S1376"],"confidence":"High that this was Munir's assessment in the plea; medium for the condition of every local unit","basis":"A defense argument after capture is not a neutral force audit; it is consistent with but not identical to other testimony that training and arms remained limited.","next":"Find membership and village-support lists, training rosters, weapon inventories and records of armed actions.","year":1967},{"id":"C2476","text":"Hearman reports that South Blitar cells were organized in small three-person groups with differentiated tasks including organization, education/outreach and armed struggle; interviewees’ evidence indicates regrouping and contact work remained central.","period":"1967–1968 South Blitar","type":"Scholarly reconstruction from oral histories and trial / military materials","source_ids":["S1310"],"confidence":"High that the article reports this structure; medium for exact prevalence and operation across all cells","basis":"Hearman, printed pp.79–80 and notes 100–101, cites interviews with Winata and Tuti; she explicitly says exact cell activities are difficult to establish and limits the inference mainly to identifying/reconnecting with cadres and supporters. One interview does not define every unit.","next":"Locate surviving cell members’ testimony, committee records, communications and individual trial files.","year":1967},{"id":"C2479","text":"The South Blitar article juxtaposes military claims of armed training, Rewang’s account of negligible arms and slow preparation, and former fugitives’ denials of plans to attack; the evidence does not support collapsing the base into either a mature army or a wholly non-political refuge.","period":"1966–1968 South Blitar","type":"Source disagreement / bounded synthesis","source_ids":["S1310","S1376"],"confidence":"High that these competing accounts are present; medium for the extent and timing of preparation","basis":"Military reporting, defendant’s plea and survivor interviews have different incentives and vantage points; no comprehensive party or military operational file was located.","next":"Triangulate with full trial exhibits, captured documents, oral histories and local civilian records.","year":1966},{"id":"C2491","text":"KontraS’s report says Munir and Ruslan joined the East Java regional committee in late 1966 and, with secretary Suwandi, went to South Blitar in March 1967 to begin implementing the project committee.","period":"Late 1966–March 1967; East Java and South Blitar","type":"Later documentary reconstruction based on anonymous interviews and participant materials","source_ids":["S1384"],"confidence":"High that the report gives this sequence; medium for the precise dates and full group movement","basis":"The report cites anonymous interview codes FC/HCC and Munir’s 1973 defense; those interviews and the original court text were not inspected here. This may describe different arrivals/implementation stages than other accounts.","next":"Obtain the report’s interview key/recordings where available, Munir plea original, and Rewang/other participants’ dated travel accounts.","year":1966},{"id":"C2493","text":"Rewang told Liem that the underground leadership had formed an emergency CC, provincial leaderships, project committees and the beginnings of guerrilla detachments, while discussing when armed struggle could formally begin.","period":"1967–1968; South Blitar and other proposed Java bases","type":"Retrospective participant testimony about organization and procedure","source_ids":["S1317"],"confidence":"High that the interview text says this; medium for the exact completeness and operational reach of the structures","basis":"Liem reports that rosters were deliberately compartmentalized and interviewees could not identify all personnel; no complete party list or minutes were found.","next":"Find CC/Kompro rosters, appointment notes, meeting records, courier reports and dated unit returns.","year":1967},{"id":"C2499","text":"Arah Juang lists Tjugito, Iskandar Subekti, Sukatno and Suwandi among the emergency CC members and separately names Ruslan, Oloan Hutapea, Rewang and Munir as a new Politbiro.","period":"1967; underground PKI leadership","type":"Later political movement synthesis","source_ids":["S1387"],"confidence":"High that the article prints this roster; low-to-medium for a complete, formally adopted roster","basis":"The piece cites survivor memoirs and later political histories but does not provide item-level minutes; the roster may overlap with the same Rewang account reported elsewhere.","next":"Compare with full memoir, KontraS source interviews, organization papers in trials, military capture rosters and dated internal party documents.","year":1967},{"id":"C2517","text":"Hearman reports that Suwandi, East Java regional secretary, was arrested on 12 June 1968 and paraded at public meetings urging people to surrender; the paper also reports a museum photograph showing him bound during interrogation.","period":"1968-06-12 onward; South Blitar","type":"Scholar’s reconstruction from a military history, participant accounts and a museum photograph","source_ids":["S1310","S1390"],"confidence":"High that Hearman documents the arrest date and public appeals; medium for the sequence pending direct file review","basis":"Hearman cites the military history and interviews; a witness reported hearing that Suwandi had been tortured for three days, which is an allegation, not a verified interrogation record. The photograph caption labels him as under interrogation but does not by itself establish when or how he was treated.","next":"Inspect the cited operation-history pages, Suwandi’s arrest/interrogation and court file, original photograph/caption provenance, and independent testimony.","year":1968},{"id":"C2703","text":"Hearman reports that some South Blitar fugitives organized three-person cells with separate responsibility for organization, education/outreach, and armed struggle; Tuti worked in a cell’s outreach role seeking former party members and supporters.","period":"1967–1968; South Blitar","type":"Scholarly reconstruction of underground cell organization","source_ids":["S1310"],"confidence":"High that the article records these interview accounts; moderate for the cell structure’s extent and the division’s consistency across the base.","basis":"Hearman, printed pp.80–81 and notes 100–102, draws on interviews with Winata and Tuti. The third cell member and a contemporaneous roster are not identified; the article says exact activities are difficult to reconstruct beyond regrouping supporters.","next":"Obtain the original ISSI interview recordings/transcripts, underground contact reports and any surviving cell rosters.","year":1967}]);
window.HIST.sources.push(...[{"id":"S1317","title":"Perjuangan Bersenjata PKI di Blitar Selatan dan Operasi Trisula","creator":"André Liem, in Tahun yang Tak Pernah Berakhir: Memahami Pengalaman Korban 65, edited by John Roosa, Ayu Ratih and Hilmar Farid","date":"2004","url":"https://pustaka.taratsa.id/read/7663/ocr/pdf/","kind":"Oral-history chapter and historical reconstruction with selected military materials","access":"Full searchable OCR of the 2004 chapter opened at Pustaka Taratsa; on 2026-11-18 re-opened printed pp.173–184 and 195–199 plus interview list p.212, including armed-strategy debate, improvised actions, military caretakers and forced civilian logistics. Paijo and Maryono are separately listed as March 2001 interviews. OCR may contain transcription errors.","note":"Based mainly on retrospective interviews and some Army materials. The book is not the interview audio/transcripts or contemporary PKI minutes. Rewang’s decision claims remain retrospective, not authenticated orders. Paijo and Maryono are separately listed witnesses in the same Liem interview project, not independent contemporaneous records; their approximate count and locality need rosters and forensic corroboration. The Harsono passage is mediated through Liem and cites Jaringan Kerja Budaya’s 2000 discussion volume, which was not separately opened. Names and roles vary; Army figures remain attributed."},{"id":"S1376","title":"Membela Kemerdekaan, Demokrasi dan Keadilan (Pledoi Mohammad Munir)","creator":"Mohammad Munir; reproduced by Kabarnya Indonesia mailing-list blog","date":"Original speech dated 1973-03-02; web reproduction posted 2010","url":"https://kabarnyaindonesia.blogspot.com/2010/05/ac-i-pledoi-mohammad-munir-membela.html","kind":"Defendant's written legal defense / later web transcription","access":"Full transcription opened and key sections read; a matching 2014 reproduction was checked","note":"First-person defense speech prepared for a death-penalty trial. The original court copy, pagination, transcript chain and any audio are not verified. It is direct evidence of Munir's defense and retrospective account, not a court finding or neutral record of the events."},{"id":"S1384","title":"Menyusun Puzzle Pelanggaran HAM 1965: Sebuah Upaya Pendokumentasian","creator":"KontraS; International Centre for Transitional Justice (ICTJ); KontraS Surabaya; LBH Buton Raya","date":"2012; foreword dated 2012-06-26","url":"https://pustaka.taratsa.id/download/1016/pdf/1016.pdf","kind":"Human-rights documentation report; event-based database and oral testimony","access":"Full searchable PDF reviewed for method section and South Blitar chapter pp.22–26; accessed 2026-11-17","note":"The report says documentation began February 2011, used event-based records and interviews in Blitar and Buton, and was intended for truth-seeking and advocacy. In South Blitar it cites anonymous interview codes FC/HCC and Munir’s 1973 plea; testimony, legal characterization and historical reconstruction are combined. It is not an independently audited population roster or contemporaneous party record."},{"id":"S1387","title":"Perjuangan Bersenjata Pasca Malapetaka 1965","creator":"Alyendra Daud; Arah Juang / Perserikatan Sosialis","date":"Originally Arah Juang no.51, Sep 2018; web republication 2020-10-01","url":"https://www.arahjuang.com/2020/10/01/perjuangan-bersenjata-pasca-malapetaka-1965/","kind":"Left political movement interpretation drawing on survivor memoirs and later political histories","access":"Full article opened; cited South Blitar sections and article attribution read","note":"The author identifies himself as a Perserikatan Sosialis cadre/member. The piece cites Rewang’s memoir, Imam Soedjono and Siaw Giok Tjhan; its named roster and causal account are a political-historical synthesis, not independent corroboration where it relies on the same memoirs."},{"id":"S1390","title":"Operasi Trisula Kodam VIII Brawidjaja","creator":"Semdam VIII/Brawidjaja; published by Jajasan Taman Tjandrawilwatikta","date":"1969","url":"https://ecommons.cornell.edu/bitstreams/bd54cae9-7692-4b0b-8ffb-6ccb3fdf379d/download","kind":"Official military operational history and operation dossier; bibliographic citations verified through Hearman","access":"Directly read the printed citations in the full government-sponsored 1978 Sejarah Daerah Jawa Timur, pp.266–270 and bibliography/notes pp.293–294 (S1437): it cites this book at pp.2, 5, 8–11 and 83. The 1969 military history itself remains unopened.","note":"The Cornell URL is the Hearman article, not the 1969 book. Hearman cites the book for weapons, capture dates, interrogations, evacuations, village lists, force organization and captured materials. It was produced by the same regional command whose operation it describes. The exact 1 Oct date is verified only as Hearman’s statement and needs direct colophon confirmation."},{"id":"S1411","title":"The Rise and Fall of the Communist Party of Indonesia","creator":"Guy J. Pauker; RAND Corporation, Research Memorandum RM-5753-PR","date":"1969","url":"https://ci.nii.ac.jp/ncid/BA34550436","kind":"U.S. Air Force Project RAND-sponsored strategic research memorandum; contemporaneous U.S. analysis of the post-1965 PKI","access":"Read the CiNii National Institute of Informatics catalog record on 2026-11-17; catalog identifies USAF contract no. F44620-67-C-0045 and 63 leaves. Hearman quotes pp.81–82, but the memorandum itself was not obtained or read.","note":"The catalog confirms bibliographic metadata and USAF contract F44620-67-C-0045. The same report is now directly available and read through RAND source S1358; this catalog record is not an independent witness to its analysis. Hearman’s article remains a separate oral-history/scholarly source, while Pauker’s accuracy about underground discussions and casualty fates must be assessed against participants and records."}]);

window.HIST.claims.push(...[{"id":"C1502","text":"A 2024 article reports that Indonesia's Ministry of Labour listed more than 1,500 national, regional and local unions in 1955, about half unaffiliated with a federation.","period":"1955","type":"Later scholarly summary citing an earlier union survey","source_ids":["S845"],"confidence":"Moderate-to-low; the ministry list and underlying counting rules were not inspected","basis":"Hearman 2024, p. 6, citing Dwight Y. King via Vedi Hadiz; do not treat this as a count of 1,500 federations or as a verified membership total.","next":"Locate the Ministry of Labour's 1955 union directory/list and compare it with Tedjasukmana's 1956 survey and union registries.","year":1955}]);

window.HIST.coverage.push(...[{"id":"CV001","period":"Pre-1900","topic":"Dutch colonial political economy, forced cultivation, legal status, land/property, ethnic/religious/class formations","status":"Partial (1830–1900 Java agrarian/labor scholarship; earlier and archipelago-wide coverage open)","note":"No bounded starting year. New sources cover Cultivation System and 1870 agrarian law, mainly Java; pre-1830, early modern/VOC and broad regional comparison remain open.","path":"Peer-reviewed colonial-demography and land/labor synthesis; Dutch regulations and local archive series.","priority":"Very high"},{"id":"CV002","period":"1901–1926","topic":"Sukarno birth, family genealogy, parents' marriage, schooling, household at Tjokroaminoto, first political networks, intimate relationships","status":"Partial; ANRI archival leads expanded","note":"ANRI chronology, family marriage/divorce papers and 2024 Inggit archive leads located; exact marriage month/year conflict remains.","path":"ANRI Inggit family papers, school records, marriage certificate, oral-history transcript, Dutch colonial sources.","priority":"High"},{"id":"CV003","period":"1926–1942","topic":"PNI and nationalist movements, ideological influences, imprisonment, trial, exile, personal ties, political networks","status":"Partial; chronology and correspondence leads expanded","note":"ANRI timeline adds education, early public activity and a reported 1929 Hatta letter; underlying documents not yet inspected.","path":"Colonial court, prison/exile, party, school and correspondence records; Legge and Indonesian biographies.","priority":"High"},{"id":"CV004","period":"1942–1945","topic":"Occupation administration, Sukarno cooperation, Putera/Java Hokokai, labor mobilization, romusha, famine, PETA, BPUPKI, Japanese military policy","status":"Partial; demographic evidence expanded","note":"Peer-reviewed Java famine estimates now distinguish net population loss, excess deaths and missing births; forced-labor counts vary by denominator. Japanese-source and local evidence remain incomplete.","path":"ANRI, Japanese military archives, family/local testimony, Dutch/Allied records, regional birth/death and food series.","priority":"Very high"},{"id":"CV005","period":"1945–1949","topic":"Proclamation, revolution, Hatta/Sjahrir/Tan Malaka/Amir relationships, diplomacy, military and social conflicts, Dutch offensives and foreign roles","status":"Partial","note":"FRUS U.S. retrospective and selected telegrams reviewed; British/Dutch/Indonesian/UN archives thin.","path":"ANRI, Dutch National Archives, NIOD, British National Archives, FRUS, UN records, memoirs, oral history.","priority":"Very high"},{"id":"CV006","period":"1948","topic":"Madiun/FDR/PKI conflict, army rationalization, actors, sequence, repression and retrospective memory","status":"Partial; contested","note":"Contemporary U.S. telegrams and competing historiographical leads; no final causal account.","path":"Republican and military records, PKI/FDR papers, Dutch intelligence, newspapers, village/regional histories.","priority":"Very high"},{"id":"CV007","period":"1949–1957","topic":"Federal-to-unitary state, parliamentary democracy, parties, elections, rebellions, army politics, personal networks and marriages","status":"Not complete / scattered leads","note":"Added PKI institutional origin (ISDV/PKI) and Sukarno early networks; post-1949 institutional chronology remains largely unbuilt.","path":"Constituent Assembly minutes, KPU/BPS official tables, party and regional records, ANRI, FRUS.","priority":"Very high"},{"id":"CV008","period":"1957–1958","topic":"Martial law, nationalization, PRRI/Permesta, CIA/U.S. aid channels, Pope, military and regional actors","status":"Partial","note":"U.S. primary admissions and proposal records reviewed; execution matrix and Indonesian/regional records incomplete.","path":"NARA/CIA, FRUS, Indonesian court/military files, regional newspapers and memoirs.","priority":"Very high"},{"id":"CV009","period":"1959–1965","topic":"Guided Democracy institutions, cabinet and army, party alignments, political economy, inflation, land reform, labor, Sukarno private/political relations","status":"Partial; colonial class context expanded","note":"Added literature on 19th–20th c land/labor and differentiated rural relations; implementation and locality-level evidence still thin.","path":"ANRI, BPS/Bank Indonesia, party/labor/agrarian archives and local studies.","priority":"Very high"},{"id":"CV010","period":"1958–1965 U.S.","topic":"CIA/State/USIA channels, covert contacts, funding, propaganda, arms, economic leverage, Sukarno policy","status":"Partial; substantial primary leads","note":"1958 rebellion operations and 1965 political-action docs reviewed; full files and redactions unresolved.","path":"FRUS, CIA/NARA, congressional files, Embassy Jakarta, local recipient records.","priority":"Very high"},{"id":"CV011","period":"1958–1965 Britain","topic":"IRD propaganda, Konfrontasi, diplomatic/intelligence ties, 1965 information operations","status":"Partial","note":"Secondary studies identified; only abstract/page-level review for core claims.","path":"TNA IRD/FCO/CAB/MI6 releases, regional outlets, Indonesian press and audiences.","priority":"High"},{"id":"CV012","period":"1958–1965 Australia","topic":"Konfrontasi SIGINT, diplomacy, propaganda, aid/contacts, domestic 1965 response","status":"Partial","note":"Official SIGINT history and scholarly abstract found; linked files not read.","path":"NAA, ASD files, cabinet minutes, radio transcripts, diplomatic cables.","priority":"High"},{"id":"CV013","period":"1958–1965 China","topic":"Sukarno/PKI relations, overseas Chinese, aid, diplomacy, military contacts, September 30 evidence","status":"Partial","note":"S047 full working-paper PDF contains categorical 'provided small arms' wording; S134 peer-reviewed archival article finds no hard approval/shipment proof and probable no large shipment. Offers, approval, transport zations; Johnson Library Ball and NSC files; AID Indonesia Mission classified files; Fort Bragg/USC/Syracuse rosters; Indonesian National Police and TNI/Army personnel and equipment ledgers; verify Tower amendment Aug. 13, 1964 roll call and conference report","priority":"Very high"},{"id":"CV341","period":"1950-1971; focus 1966","topic":"G4/G5 Sikka-Maumere armed local meeting, Catholic political organisations and contested Jan Djong death date","status":"Partial: directly read published transcription of unpublished archival witness manuscript and regional church history; no 1966 local originals","note":"27 Feb meeting is testimony mediated by Prior, not verified minutes; Soemarno and named organisations are traceable actors. Bishop's 28 Apr letter remains a secondary citation; 9 Feb and 1 Mar Jan Djong death dates conflict. Overlapping studies are not independent witnesses.","path":"S456; S639; SVD Ende anonymous Menjaring Angin manuscript; Boumans original pp81-82; 1966 DPRD-GR and KOMOP files; Jan Djong burial/death register; bishop letter","priority":"Very high"},{"id":"CV342","period":"1963–66; core records 1964","topic":"Australian–British SIGINT cooperation in Borneo: authorization, personnel, command, sites, communications, cover and dissemination","status":"Partial: 28 April Defence Committee minute, 13 May DSD operating signal, and 3 July Army Staff Instruction/cover memorandum read; ASD retrospectives date the first deployment; several operational signals and product records remain unread","note":"Primary records establish the conditional GCHQ request, planned joint command/station division, DSD tasking and recipient controls, cover, and a later authorized establishment of one 201 Squadron troop (1 officer and 37 other ranks) at Labuan with a small Kuching detachment. The July instruction sets rotations and British logistics but does not prove names, arrival, actual collection, product dissemination or service delivery.","path":"S643–S646; S654; ASD 19 May/26 May/2 June/8 June implementation signals; 30 May Labuan recce report; 201/121 Squadron monthly logs and roster; Australian/GCHQ product registers","priority":"Very high"},{"id":"CV343","period":"1963–66; core records 1964–65","topic":"British/Australian secret cross-border action in Kalimantan: policy authorization, secrecy, operational rules, range, units, actual missions and effects","status":"Partial: Australian Cabinet transcripts and official retrospectives reviewed; 3RAR May 1965 diary downloaded/OCR-processed, with PDF pp.14, 93 and 99–101 visually checked; UK operation orders and most Australian unit diaries not read","note":"Australian Cabinet sources report British authorizations and show Australia’s 1964 caution and 1965 conditional deployment; DVA describes deniability and operational rules. AWM diary records a 1 May warning, a 13 May intelligence report about an uncompleted 5 May Serikin attack, local troop/supply estimates and trading-post pressure, and a 26–27 May mortar-fire estimate; AWM's unit summary retrospectively dates the first major Claret contact to 27 May. The diary and retrospectives differ in evidentiary type. Naming/timing and depth remain disputed; effects on Indonesian forces, Sukarno’s policy or the 1965 domestic events are not established. A 2014 KCL MA dissertation now supplies exact CAB/DEFE meeting and memo locators, but no cited original was opened; its 3,000-yard hot-pursuit summary conflicts with DVA's broader early-distance description.","path":"TNA DEFE 5/150, DEFE 5/156, DEFE 4/169, CAB 148/1; original Chromatic/Claret operation orders/reports; AWM95 3RAR/4RAR and SAS files; AWM96 commanders’ diaries; ASD/GCHQ and Malaysian/Indonesian logs; 1965 domestic-intelligence files; check CAB 148/1 DOPC meetings 17/19/29; DEFE 4/169 COS 36th meeting; DEFE 5/150 COS Memos 121/64, 124/64 (locator from S662 only)","priority":"Very high"},{"id":"CV344","period":"1964-01 to 1964-07","topic":"U.S.-brokered Indonesia-Malaysia diplomacy: aid leverage and statutory decision process; military relationships/training; observer and publicity mechanisms; Sukarno/Nasution positions; post-Tokyo diplomacy and inter-ally support","status":"Partial: selected FRUS XXVI documents d16–d57 and Australian secret records opened; underlying Johnson Library/NARA decision files, Indonesian and other participant records, aid execution accounts and several cables cited only in notes remain unread","note":"Records distinguish early aid pressure and Army-channel proposals, April–May review and debate, June recommendation, July presidential directive, conditional summit diplomacy, and competing U.S. analyses. FY1964 program totals and training counts are agency-reported figures, not independently verified disbursement, attendance, delivery or receipt. The presidential directive confirms continuation but not each aid transaction or political effect.","path":"S655–S678; S680–S693; C1089–C1166; C1169–C1191; Q318–Q323; Q325; NARA RG 59 POL 32-1 INDON–MALAYSIA, POL 3 MAPHILINDO, AID (US) INDON and POL 7 INDON; Johnson Library NSAM/NSC/telephone files; Section 620(j) congressional notifications and Attorney General opinion; AID/MAP rosters, obligations, disbursement, procurement, shipping and Indonesian receipt; Sukarno/Foreign Ministry/Army/Cabinet records; Malaysia/Philippines/Thailand/Britain/USSR counterpart files","priority":"Very high"},{"id":"CV345","period":"1964-08 to 1964-09","topic":"U.S. diplomatic mediation and channel control; Tower Amendment and covert aid-policy handling; Army contacts, intelligence rationale and contingency recommendations; d63 date discrepancy; U.S.–UK escalation limits after reported Indonesian landings","status":"Partial: FRUS XXVI d58, d61, d63–d68 opened; d67 already recorded as S621/C1035. Underlying Embassy/NARA/Johnson Library/JCS/CIA files and Indonesian/UK/Philippine/Australian counterparts remain unread.","note":"The record now distinguishes public/semi-private diplomatic channels, ater described a press-derived information route through an Adam Malik aide, with the Army step hedged and effect unknown. Exact document identity, approval, recipients and individual outcomes remain unresolved.","path":"NARA RG 59 Central Files 1964–66 POL 12 INDON: Airgram A-74 and enclosure; locate sanitized A-398/Partindo/Baperki list copies and transfer records; GWU National Security Archive Kadane tapes/transcripts; complete Martens oral history; Adam Malik, aide and Army/security receipt records; independent arrest, prison and death files.","priority":"Very high"},{"id":"CV361","period":"1968–1987","topic":"Netherlands exile solidarity: Komitee Indonesië congress on development aid and Ernst Utrecht obituary","status":"Two catalog objects identified; original item contents not yet read","note":"KOL4_26 (1978) references IISH COLL00284 and KOL22_17 (1987) records obituary metadata with author/creator discrepancy. Catalog does not establish actual congress proceedings or obituary facts.","path":"GerakIngatan lawful image access; IISH COLL00284 inventory, congress program, IGGI documents, publication original, participant names and independent cross-check.","priority":"High"},{"id":"CV362","period":"1978–1988","topic":"Dutch Indonesian exile and solidarity cultural work: Basuki Resobowo; Fridus Steijlen; Komitee Indonesië","status":"Partial; full retrospective testimony opened","note":"Steijlen reports 1978 volunteer involvement, Basuki magazine illustration and protest poster production, and cultural collaboration around 1984. Evidence establishes his testimony, not independent verification of each event or Basuki formal membership.","path":"Komitee Indonesië magazine mastheads and posters; IISH COLL00284; GerakIngatan exhibits; 1985 De Waarheid original newspaper; independent participant testimony.","priority":"High"},{"id":"CV363","period":"1965-10 to 1966-06; public retrospective debate 1990–1997","topic":"U.S. covert communications equipment and the alleged NSA interception/targeting chain; comparison with Kadane’s published interview-based account","status":"Partial: full 1997 NYRB exchange and official FRUS d155/d175/d211 read; no Kadane tapes/notes, original procurement or delivery records, NSA intercept logs, flight records or Indonesian recipient records obtained.","note":"Kadane reports that the CIA supplied Collins KWM-2 radios by way of Clark Field/Kostrad and that NSA intercepted and translated Army transmissions, including alleged target-specific kill orders. Contemporary U.S. documents independently establish a distinct three-Motorola P-31 handover plan for Nasution’s guards and a covert secure Army/U.S. communications program proposed to the 303 Committee; a 1966 record reports equipment stocks, partial diversion and technical contact but notes that the original equipment was not supplied as first proposed. These records do not prove the Collins radio route or SIGINT claims. Barry/Laber’s 1997 letters are later interpretations, not 1965 operational records.","path":"Kathy Kadane collection at the National Security Archive: accession/finding aid, tape, notes and exhibits; NARA RG59/DOD/CIA/NSC records; NSA SIGINT/frequency and translation records; USAF Clark Field/C-130 movement logs; CIA/303 procurement and delivery forms; Kostrad/Indonesian Army serial inventories and network records; independently trace alleged target orders to named victims and local command/custody records.","priority":"Very high"},{"id":"CV364","period":"1965-10 to 1966-06; retrospective accounts 1981–2010","topic":"U.S. Army communications, small-arms assistance via Bangkok, Green’s fourteen Embassy radios, and discrepancies between proposal, approval, transfer and receipt","status":"Partial: FRUS d155/d170/d171/d173 opened; d175/d211 rechecked; Bunnell, Green ADST and Simpson opened; Van der Hoeven source note compared. Original recipient, procurement, interview and flight/issue records not found.","note":"Published U.S. documents show separate radio requests/projects and stages; Bunnell reports Sukendro later confirmed radios and small arms were delivered through CIA Bangkok; Green later recalled a separate transfer of fourteen Embassy walkie-talkies to Suharto. None of the published excerpts supplies a complete serial/receipt chain. Simpson states that small arms were apparently delivered but article has no visible inline citation. Kadane’s Collins KWM-2/NSA chain remains a further distinct, unverified allegation.","path":"Obtain NARA RG 59 POL 23-9 INDON/DEF US-INDON files including telegrams 1427 and 373 and referenced 952/1333/749; LBJ/NSC/303 minutes and procurement; CIA Bangkok station and Army receipt/issue books; Green’s report/Bundy response and Embassy emergency-equipment inventory; Bunnell interview notes or recordings; separate NSA/CIA/USAF records for Kadane claims.","priority":"Very high"},{"id":"CV365","period":"1965–1966 actions and 1989–1990 retrospective interview testimony; 1997 archive-deposit claim","topic":"Sukarno’s public allegation of U.S. political funding, his reported knowledge of killings, and the U.S. Embassy’s PKI information files, senior-level coordination and feedback reporting","status":"Partial: FRUS d177, selected Kadane interview excerpts and later published speech transcriptions read; underlying speech/receipt, governor and military reports, full interviews, original lists and transfer logs not inspected.","note":"Sukarno’s Nov. 6 Rp150m allegation is reported in d177 and elaborated in a later transcription citing a 2003 collection; the transcript claims he referred to a handover/receipt record, which has not been found. A Dec. 18 speech transcript attributes killing reports to the East Java governor, military commander and Sukarno’s own information. Kadane excerpts describe an Embassy interagency index-card process, CIA cross-indexing and later list/feedback claims. These document allegations and reported awareness/testimony, not payment, underlying local events, list handover effect or personal causation.","path":"FRUS d177 footnote Airgram 331; inspect Revolusi Belum Selesai I pp.82 and 302; original Nov. 6 Cabinet speech and Dec. 18 HMI speech record; alleged Rp150m receipt, Jones/Embassy accounts and beneficiary; governor/Kodam East Java reporting and local records; Kadane recordings/notes at GWU NSA; Cornell Kahin papers Box 81 Folder 7 and Box 95 Folders 39–40; NARA RG59 POL 12 INDON A-74/A-398 and Indonesian recipient files.","priority":"Very high"},{"id":"CV366","period":"1945–1965; especially October–November 1965","topic":"Australian Radio Australia and foreign broadcast channels: institutional authority, editorial guidance, Indonesian Army feedback, Malaysian intermediary and U.S. contact","status":"Partial: read two scholarly articles and the relevant sections/notes of Easter 2005; identified seven primary archival leads, none opened. Actual scripts, transmitted broadcasts, listener response, and any effect on mobilization or political legitimacy are not established.","note":"Studies report a pre-existing External Affairs/ABC short-wave policy channel, 1965 guidance to Radio Australia, Army information preferences, Sukendro’s reported request to Malaysian radio and an Army contact’s reported caution to the U.S. The record shows reported preference-setting and coordination paths, not a single unified foreign command or demonstrated audience impact.","path":"NAA A4940/1 C1344 (1945 memo; 1963 submission/minute); NAA A1838/280 3034/2/1/8 Parts 1–2; A1838/273 570/7/9 Part 3; A6364/JA1965/10; TNA FO 371/181457; LBJ Presidential Library NSF Reel 8 pp.338–339 Telegram 1357; Australian ABC/DEA Radio Australia scripts, edits, transmission logs, listener letters; Malaysian Radio Malaysia logs and political correspondence; Indonesian Army Information Section files.","priority":"High"},{"id":"CV367","period":"1961–1966; focus 1964–November 1965","topic":"U.S. covert political action, Army–U.S. institutional relationships and third-country planning","status":"Partial: relevant edited FRUS documents d52, d110, d127, d164, d167, d168, d170, d171, d173, d175, d187 and d211 reviewed across this and prior passes; d167/d168 details newly added. Underlying archival files and Indonesian/Japanese/Thai counterpart evidence remain incomplete.","note":"Published U.S. records show selection of overt assistance, covert political-action planning, internal U.S. perceptions of Army ties, and possible Japanese/Thai/logistical information channels. Preserve differences between proposal, approval, procurement, transfer and effect. U.S. analysts’ descriptions do not establish Indonesian Army-wide beliefs; third-country discussion does not prove participation.","path":"NARA RG 59 EA/Indonesia Files Lot 68 D 467 POL 23–9 (d167); WNRC RG 330 OASD/ISA Indonesia 000.1 Sensitive 1965 (d164/d168); NSC Special Group/303 Committee Indonesia subject files and minutes (1961, 1965); Japanese Foreign Ministry/Prime Minister records; Thai Defense/Foreign Ministry, customs and port records; redacted agency shipping reports; Embassy forwarding cables; Indonesian Army liaison, communications and receipt files.","priority":"Very high"},{"id":"CV368","period":"1965-10 to 1966-01; retrospective accounts","topic":"Japan’s relations with Sukarno, Army aid approaches, private intermediaries and reported covert rice/textile support","status":"Partial: read Kurasawa and Wardaya; obtained JACAR catalog metadata; did not inspect Japanese A’-0211 originals, JACAR’s 15 images, U.S. Tokyo Telegram 1623, shipments or recipient records.","note":"The secondary record describes divergent Embassy/Tokyo views, Army-linked aid inquiries, a Japanese policy to defer Army aid pending legal authority, a cotton/textile credit exception to Sukarno, and a retrospective private correspondence chain. A separate author infers secret rice/textile support from a U.S. cable not read here. None establishes the full authorization-to-recipient chai I leadership made divergent statements; cannot infer common strike leadership or ex-PKI involvement.","path":"Merdeka Jan29 Feb23 Mar16/27/31; Tempo Mar17 Jun16 Jul28; Kompas Feb23 Mar20; Sinar Harapan May18/26; Pelita Jun28; Asiaweek Apr27; ILO 65th Provisional Record pp27-29","priority":"Very high"},{"id":"CV412","period":"1965-10 to 1966-06; public retrospective debate 1990–1997","topic":"U.S. covert communications equipment and the alleged NSA interception/targeting chain; comparison with Kadane’s published interview-based account","status":"Partial: full 1997 NYRB exchange and official FRUS d155/d175/d211 read; no Kadane tapes/notes, original procurement or delivery records, NSA intercept logs, flight records or Indonesian recipient records obtained.","note":"Kadane reports that the CIA supplied Collins KWM-2 radios by way of Clark Field/Kostrad and that NSA intercepted and translated Army transmissions, including alleged target-specific kill orders. Contemporary U.S. documents independently establish a distinct three-Motorola P-31 handover plan for Nasution’s guards and a covert secure Army/U.S. communications program proposed to the 303 Committee; a 1966 record reports equipment stocks, partial diversion and technical contact but notes that the original equipment was not supplied as first proposed. These records do not prove the Collins radio route or SIGINT claims. Barry/Laber’s 1997 letters are later interpretations, not 1965 operational records.","path":"Kathy Kadane collection at the National Security Archive: accession/finding aid, tape, notes and exhibits; NARA RG59/DOD/CIA/NSC records; NSA SIGINT/frequency and translation records; USAF Clark Field/C-130 movement logs; CIA/303 procurement and delivery forms; Kostrad/Indonesian Army serial inventories and network records; independently trace alleged target orders to named victims and local command/custody records.","priority":"Very high"},{"id":"CV413","period":"1965-10 to 1966-06; retrospective accounts exile rosters at ANRI.","priority":"Very high"},{"id":"CV418","period":"1918–1921","topic":"ISDV/PKI Malay-language press, labor organizing, Sarekat Islam branch politics and party discipline","status":"Partial: one 10 April 1920 issue text extraction read (scan image not inspected); the complete 30 April 1921 year 4 no.8 issue was visually reviewed, and pp.4–6 were read at high resolution. IISH 2010 guide lists the full 1921 year run, but no institutional copy has yet been compared.","note":"The newspapers record organizational self-presentation and local political arguments, not neutral verification or a survey of all members. The Semarang SI statement against excluding PKI cooperation must not be generalized to the central SI or every branch.","path":"S889; S890–S893; request current IISH catalogue record and physical/digital no.8; compare Soeara Ra’jat no.5 (16 March), no.7 (16 April), no.8 (30 April), no.9 (16 May), and October congress records; retrieve Perpusnas/Monumen Pers copies; corroborate 1920 labor conflicts with union, employer, police and other press records.","priority":"Very high"},{"id":"CV419","period":"1914–1923","topic":"Sarekat Islam–PKI organizational relations, local branches, party discipline and press debate","status":"Partial: S889 gives a scholarly reconstruction; issue no.8 (30 April 1921) has been fully viewed as an eight-page scan and its central Semarang SI article read. IISH lists a 1921 run in a 2010 guide. The March/October congress resolutions, issue no.9 and local membership records remain unread.","note":"The no.8 statement is an attributable local branch position signed by Semaun and Boedisoetjitro; it documents disagreement with organizational exclusion but does not represent all SI members or resolve how the national split unfolded.","path":"Acquire current IISH catalogue/shelfmark and compare copies; transcribe the article; inspect issues no.5, no.7 and no.9; retrieve March and October 1921 SI congress resolutions, PKI minu ontinuous reader, HTML or author political judgment changed.","path":"Obtain Tajib 1995 pp.288–293; inspect M. Hilir Ismail 2002/2004/2008 editions and note chain; request ANRI Kerajaan Bima items 279–280 and No.S090; search 1916–22 colonial school registrations/education reports, Kops/Kok founding and budget records, teacher payrolls and appointment lists; request Fitria 2010 full thesis; search signed staff records for Sitti Beda Seri Yulianshe/SBS Yulianche and a separate full identity for “Siti” from Makassar.","priority":"High"},{"id":"CV468","period":"c.1887–1957; Bima","topic":"Independent biography: Abdul Hamid bin Abdul Majid; family, education, genealogy, honors, offices, publications and death date.","status":"Partial; public thesis pages and family interviews provide a life outline, but OSVIA, civil/family, appointment and burial records are absent and dates/ordinals conflict.","note":"Seek family genealogy, civil/burial register, OSVIA rolls, appointment decisions, 1949 dismissal letter and book/catalog record.","path":"High","priority":""},{"id":"CV469","period":"Bima Sultanate; 1915–1939","topic":"Independent office entry: Raja Bicara/Ruma Bicara/Tureli Nggampo; role, succession, relation to Sultan, 1938 contract and official remuneration.","status":"Partial; official contract and 1923 report establish title/treatment, while job description and succession chronology rely on later studies and are disputed.","note":"Request original Bima palace rules, council minutes, dated appointment/relief records, resident correspondence and 1938 contract implementation accounts.","path":"High","priority":""},{"id":"CV470","period":"1920–1941; Bima","topic":"Independent civic/religious event entries: Satya Usaha, Darul Tarbiyah, Muhammadiyah branch/school and Raba/Baitul Hamid mosque; linked participants treated separately.","status":"Partial; later histories name actors and dates but disagree over founder/head roles; no cooperative charter, school files, notarial deed or mosque/waqf records obtained.","note":"Seek cooperative rules/accounts, 1931 school charter/staff registers, 1937 branch minutes, 1941 notarial deed, waqf deed and mosque construction records.","path":"High","priority":""},{"id":"CV471","period":"1934–1939; Bima/Koepang/Batavia","topic":"Independent criminal-case and exile entries: 1935 allegations, 1936 local trial/reported sentences, 1937–39 petition and returned-office chronology.","status":"Partial; press/agency reports omit defendants' personal names; finding aid identifies petition volume 9921 but case, judgment, appeal and final penalty not read.","note":"Request ANRI Tzg Ag 1939/8131 item 9921, Politiek Verslag reels 7–8, trial file, Treasury audit, suspension/transfer orders and 1949 letter.","path":"High","priority":""},{"id":"CV472","period":"1942–1949; Bima/NTB","topic":"Independent 1948 education census and residence/family-displacement entries; distinguish office-title signature from named person and request from actual enrollment.","status":"Partial; census is a facsimile with date ambiguity and unnamed Tureli Ngampo signatory; house and family displacement mainly rest on descendant/local accounts.","note":"Obtain original M61 and associated education correspondence, house/land records, Japanese occupation documents, family interview transcript and burial register.","path":"Medium","priority":""},{"id":"CV473","period":"1924–1936; Bima, Raba, Sumbawa, Dompu","topic":"Independent judicial-institution entry: Landraad at Raba, Raad van Landshoofden, Zelfbestuursgerecht/Gemeentegerecht, 1924/1927 chronology, and reported 1936 Bima trial.","status":"Partial; a 1928 official annual report, 1935 government almanac OCR and retrospective regional history now provide institutional dates and categories; no original rules, court registers or case judgment have been inspected.","note":"Keep colonial ordinary court, indigenous/local-head court and minor self-government courts separate. The newspaper’s special trial panel is not the same evidence as the generic yearbook listing.","path":"Request 1924/1927 regulations, original almanac facsimile, 1936 Raad van Landshoofden minutes/judgment/appeal, Bima fiscal audit and prison/exile record.","priority":"High"},{"id":"CV474","period":"1931–1959; Sumbawa and NIT","topic":"Independent biography of Sultan Muhammad Kaharuddin III: succession date/ordinal, family, education claims, NIT and district offices, 1947 jubilee and Bala Puti palace.","status":"Partial; ANRI sourcebook and current LATS pages provide public roles and family lineage; official 1935 yearbook adds 7 May 1932, creating a date discrepancy; no civil, marriage, school, succession or appointment originals obtained.","note":"ANRI lists the Sultan as entry 23 in a sequence including Riwabatang; LATS calls him XVII. ANRI uses 1931–58; LATS writes 1931–59. Preserve each source’s count and endpoint.","path":"Inspect RVD NTT Nos.327–335 and A1540/47, 1931–32 succession/recognition orders, education records, NIT minutes, 1959 appointment instrument, and marriage/birth records.","priority":"High"},{"id":"CV475","period":"1949; Bima and Pulau Sumbawa","topic":"Independent entries for Muhammad Hasan and the 1949 island council: elected chair, later NIT Parliament selection, his political self-account, and distinctions from the Council of Kings.","status":"Partial; thesis appendix reproduces ANRI-AKB Nos.59–60, including 26 February meeting and 17 November speech, but original files, KNI roster and NIT parliamentary records have not been inspected.","note":"The address’s “prodeo” statement is self-report with uncertain meaning; it does not establish imprisonment or identify an opposing group.","path":"Request ANRI-AKB Nos.59–60 and 21, election/appointment certificates, KNI/Bima committee records, NIT membership list and roll-call/debate minutes.","priority":"High"},{"id":"CV476","period":"1920, 1926, 1932; Bima, Timor and Dompu","topic":"Independent archival-finding-aid entries for DOR items 120, 124 and 127; special focus on the 1932 Dompu dienstbaarheid investigation.","status":"Partial; catalogue descriptions and physical-only availability confirmed; no underlying DOR documents read.","note":"Item 127 is a report excerpt lead, not evidence of its findings. Item 124 concerns South-Central Timor and is not a Bima trial record.","path":"Request DOR collection 2.20.61 items 120 and 127; inspect original item title and contents, definitions, investigation method, named parties, conclusions and attachments.","priority":"Very high"},{"id":"CV477","period":"1945–1968; Bima","topic":"Independent institutional entry for the Bima Badan Hukum Syara: pre-formation offices, 1947 decree/structure, judicial and religious-education functions, and separation/afterlife.","status":"Expanded but partial; retrospective studies and official institutional history give office names, duties, cases and later succession. No founding decree, instruction, personnel register or transfer instrument inspected.","note":"Separate judicial, religious-administration and school-management functions. The 2013/2014 Mutawalli texts and 2020 Mukhlis dissertation share earlier Abdul Gani Abdullah citations; do not count these as independent corroboration.","path":"Acquire the 1945 Sultan representation, Decision No.12 (14 Feb 1946), Beslit No.42 and instruction (4 May 1947), BHS handover/PA records under Laws 22/1946 and 32/1954, and Yasim founding deed/minutes of 16 Mar 1968.","priority":"Very high"},{"id":"CV478","period":"1956–1959; Bima","topic":"Independent event entries for BHS fasakh decision No.27/1956, taklik-talak No.16/1958 and inheritance/land dispute No.28/58 plus 1959 confirmation No.3/59.","status":"Case content known only through a later author citing BHS files; his text preserves party initials and dates but OCR and the English abstract contain inconsistencies.","note":"Do not restore personal names, speculate about a party’s attendance, or calculate property shares from OCR until the original case jackets and confirmation instruments are read.","path":"Request the full case jackets with petitions, summons/service, witness statements, minutes, findings, orders, confirmation signatures and enforcement records.","priority":"Very high"},{"id":"CV479","period":"1926–1947 onward; Bima/Mecca","topic":"Separate profiles for the seven people in the 1947 BHS roster, their offices, Mecca education/residence claims, and individual educational or later judicial roles.","status":"Roster/roles and five individual itineraries are reported by a 2020 dissertation through Abdul Gani Abdullah (2004); a 2013 study gives a separate early office account; originals and the cited book are not inspected.","note":"Keep Ishaq/Ishak spelling variants and the 1945, 1947 and 1964 office references traceable without automatic identity merging. Abubakar Husain and Saleh Abdul Qadir remain especially under-documented.","path":"Obtain Abdullah 2004 pp.169, 172–195 and the original Beslit No.42/instruction; seek Mecca student/residence records, local appointment registers, mosque/school files and signatures for each individual.","priority":"Very high"},{"id":"CV480","period":"1934–1950; Bima/Sumbawa","topic":"Independent archival-finding-aid entry for Raad Agama, conversion/zakat declarations, 1940 zakat list, 1941 Sultan letter, 1945–47 regulation, 1947 Raad Agama regulation and 1949 zakat rules.","status":"ANRI inventory titles and formats reviewed at items 266–274; underlying files not opened.","note":"Inventory descriptions are retrieval aids, not proof of a letter’s reasoning, legal effects, sums, signatories or implementation. Item 271 is not yet identified with Beslit No.42.","path":"Request ANRI Bima inventory items 266–274; transcribe item-level title, date, creator, addressee, script, enclosure, approval and relation to colonial/transition authorities.","priority":"Very high"},{"id":"CV481","period":"1931–1934; Raba/Suntu, Bima","topic":"Independent profiles of Muhammad Sanan (reported Darut Tarbiyah head), Abdurrahman Idris (reported Darul Ulum Suntu head) and the separate school institutions they served.","status":"Retrospective 2020 dissertation reports the names and dates, citing older literature and a 2003 foundation report; no contemporaneous staff rolls or establishment files obtained.","note":"Do not identify Muhammad Sanan with Tuan Guru Sana or another later “Sanan” without matching records. Darul Ulum Suntu (1934) and Darul Ulum Paruga (1938 table entry) remain distinct until resolved.","path":"Locate each school’s foundation/recognition file, teacher appointment and salary lists, student registers, notarial/government records and the cited earlier histories.","priority":"High"},{"id":"CV482","period":"1957–1964; Bima","topic":"Independent event entry on conversion of BHS functions into the Bima Religious Court, first-chair appointment and conflict between official dates for formal establishment.","status":"Partial; the court’s 2024 activity report states the 9 Dec 1964 decision appointed H. Ishaq Abdul Qadir as first chair. Its 2023 LKjIP and 2024 strategic review repeat that the court was formally established on 16 Mar 1964 under the 9 Dec 1964 decision, an unresolved anachronism.","note":"The two planning/performance documents belong to the same court and repeat the same passage; count as one text lineage. No ministerial decision, court opening record or administrative transfer instrument has been read.","path":"Request Ministry of Religion Decision B/IV/2/9/6550 (9 Dec 1964), effective-date clause, Bima receipt and appointment register, court first-sitting records, BHS asset/personnel transfer and PP No.45/1957 implementation correspondence.","priority":"Very high"},{"id":"CV483","period":"1936–2015; Tawali/Wera and Bima, with Mecca/Surabaya educational links","topic":"Independent person entry: H.M. Said Amin’s identity, family, schooling, teachers, religious education, teaching/judicial am contexts but attribute no statement to him; team minutes and attendee lists not accessed.","path":"Kemenag/FKUB minutes and signed attendance list; 2014 coordination minutes, team order and follow-up report.","priority":"Medium"},{"id":"CV487","period":"1957–2015; Bima and Mecca","topic":"Independent biographical and intellectual record: educational timeline, source genealogy, primary writings, ritual reform discourse, MUI and institutional roles.","status":"Expanded; partial","note":"The 2019 Mutawali articles and 2018 book share a source network; Ahlan’s 2022 thesis is partly restricted and cites the same biography. Direct writings are mostly not yet read.","path":"Obtain Mutawali–Murtadha 2018 biography; Said Amin’s authored books and manuscripts; interviews with independent family, students and institutional staff; source-level comparison of the 2012 interview.","priority":"High"},{"id":"CV488","period":"2015–2022; Bima","topic":"H. Muhammad AR, BA: YASIM leadership, public statements and case participation","status":"Partial","note":"The sources show institutional roles and selected public statements but no verified full name, birth/family record, full education history, or complete tenure file.","path":"YASIM board appointments and registry; internal audit, Dore transaction, court case, mosque personnel records","priority":"High"},{"id":"CV489","period":"2016–2026; Madawau and Bima–Dompu border","topic":"Anwar Ibrahim: village-head profile, public land claims and identity matching","status":"Partial","note":"Court caption supplies approximate age and office in 2021; reports identify the same-name village head in 2016 and 2026, but personal records and parcel identity are missing.","path":"Village-head election/appointment records; identity file; 1975 school agreement; cadastral and boundary files","priority":"High"},{"id":"CV490","period":"2021–2026; So Tololara, Madawau","topic":"Civil case 14/Pdt.G/2021/PN Rbi, first-instance judgment and judicial review" ority":"Medium"},{"id":"CV495","period":"1969–1970 instruments alleged; reported 2016–2017; Pela, Monta","topic":"Arsyad Salam heirs/ARUN auction challenge and Landreform paper trail","status":"Partial","note":"A news extract records an ARUN request and several paper numbers, but no petition, auction file, or cited Landreform original.","path":"ARUN petition, land books, 1969/1970 committee files, BPN survey and auction resolution","priority":"High"},{"id":"CV496","period":"2019; Dore, Palibelo","topic":"Eight-are YASIM land sale and residents’ access dispute","status":"Partial","note":"Both residents’ and YASIM chair’s reported accounts are available in one article; deeds, board minutes and replacement waqf record are not.","path":"Sale deed, receipt, board minutes, replacement-land purchase, waqf record and village road file","priority":"Medium"},{"id":"CV497","period":"2016; Madawau–Mangge Na’e boundary","topic":"Bima–Dompu boundary confrontation, status-quo agreement and proposed provincial review","status":"Partial","note":"Multiple Bimakini stories describe the dispute and intended temporary measure; place-name variants and final boundary decision remain unresolved.","path":"Signed agreement, administrative boundary maps, provincial survey, 2013 police incident record and final decree","priority":"High"},{"id":"CV498","period":"2017; Kabupaten Bima and Pela/Monta","topic":"County guarantee-land auctions, distinct from YASIM land management and Pela heirs’ claim","status":"Partial","note":"Local news describes county auction concerns and a separate Pela heirs’ challenge; the public tender package and legal records were not inspected.","path":"County auction lists, tender committee records, Pela petition, deeds and Landreform papers","priority":"Medium"},{"id":"CV499","period":"2021 and 2026; Madawau","topic":"Post-judgment cultivation confrontation and proposed KDMP site","status":"Partial","note":"One local report gives participant claims in November 2021; a J 59","period":"1965-08 to 1965-10","topic":"G30S origins, Aidit–Sjam–Biro Chusus network, military-officer contacts and decision authority","status":"Expanded with contemporary public texts, the Council roster, a specific Embassy roster crosswalk, the KOTI archival leads, and participant/interrogation-derived accounts; original PKI minutes and authenticated operational records remain absent.","note":"Tjugito is named on the Council list and appears in A-398’s Embassy CC roster, but that does not establish his knowledge or role. Sudisman later claims he personally agreed while denying a whole-CC decision; the Oct. 5 public statement says Council-listed PKI members were not informed/asked. CIA’s specific provincial timeline derives chiefly from Army interrogation testimony. Preserve levels of knowledge, authorization, execution and later public line as distinct questions.","path":"ANRI KOTI item 515 and Guide items 365–366/369; IISH item 306 microfiche; original Politburo/Secretariat minutes; Suwardiningsih and Peris Pardede files; original Ariwarti Waspada; RRI logs; A-398 roster provenance; party/CDB records.","priority":"Very high"},{"id":"CV560","period":"1966-12 to 1968-09","topic":"Post-purge PKI underground leadership, emergency Central Committee, South Blitar and Trisula","status":"Hearman and Liem oral-history reconstructions read; emergency Committee/project structures and disputes are clearer, but internal PKI minutes, rosters and unit orders remain unlocated","note":"Distinguish pre-1965 Biro Chusus from post-1965 emergency structures; map Jakarta/Ismail Bakri groupings, Rewang, Ruslan, Kompro organization, couriers and local support. Rewang said the formal armed campaign had not begun and awaited a national conference; some actions allegedly exceeded Kompro decisions.","path":"Rewang, Munir, Ismail Bakri and local witness materials; captured party files; PKI exile records; Trisula/Kostrad orders; district detention and village caretaker lists","priority":"Very high"},{"id":"CV561","period":"1965-1966","topic":"Deaths, missing persons and victim ethnicity across provinces","status":"National total and Chinese-death estimate reviewed; no national victim-level ethnic dataset located. The Aceh military chronology gives selected local ethnic identifiers and records a separate fatal shooting of a Chinese Indonesian by a military post, but remains an incomplete military list.","note":"The approximate 2,000 Chinese estimate divided by an approximate 500,000 total yields only a derived 0.4% ratio, not a measured share. The Aceh chronology records four Chinese among five deaths at Blang Pidie and four named Chinese among ten at Sama Dua on 14 Oct 1965, plus a 6 Dec entry reporting a Chinese Indonesian shot dead by a military post. These local entries are not a province-wide or national sample; it is unresolved whether the December victim is included in Melvin’s 21-person count. No dependable national percentages for any group can be calculated.","path":"Komnas HAM/YPKP rosters; provincial/village victim lists; cemetery and civil registers; ethnic-Chinese community records; reconcile all 21 Melvin entries with S855 chronology including the 6 Dec Beutong shooting; obtain district death/custody lists and civilian registers; trace Cribb-Coppel estimate and use uniform denominators/time windows","priority":"Very high"},{"id":"CV562","period":"1957-1969","topic":"PKI tactical militarization, fifth-force proposal, local militia networks and Army territorial structures","status":"Fifth Force and BTI materials still lack original implementation files; East Java and South Blitar evidence is now supplemented by a directly inspected Aceh military report documenting territorial command restructuring, intelligence limits, arrests, property seizures, account freezes and civilian auxiliary mobilization.","note":"Aceh report evidence is an institutional self-account: formal orders and command design are documented as the report describes them, while execution, actual reach and the report’s political allegations require independent confirmation. Separate proposed arming, training, weapons delivery, receipt and use; regional balance varied.","path":"BTI catalogue nos.257–259; original Kodam V inventory 316-a; KOTAM/Kodam/Korem/Kodim orders; Aceh KOHANDA/Pepelrada files and signed orders; Trisula command files; militia rosters, weapons receipts, village appointments and party branch files","priority":"Very high"},{"id":"CV563","period":"1965-1969","topic":"Contemporary Southeast Asian communist-party comparison","status":"Expanded selectively to Cambodia, Laos and Hmong recruitment within the CPT; remains a non-symmetric comparison rather than a complete regional dataset","note":"Compare party decision to armed struggle, existing guerrilla capacity, territorial base, external command/support, recruitment and social constituency. ECCC guide is a court-judgment summary; Lao and Hmong studies are bounded scholarly cases; NIE force estimates remain U.S. estimates.","path":"CPM/CPT/CPB/PKP/CPP/NPA/CPK/Lao party primary documents; Malay/Thai/Burmese/Philippine/Cambodian/Laotian archives; external aid and border records","priority":"High"},{"id":"CV564","period":"1965-1968","topic":"Political and class logic of G30S defeat, PKI destruction, military power and regional violence","status":"Evidence base now includes selected original Aceh regional military pages and chronology. Causal synthesis remains a set of testable pathways, not a settled single-cause account or authorial political judgment.","note":"Aceh’s report records both security command/territorial operations and local demonstrations, arrests, killings and property seizure. Its account is not independent evidence of every alleged motive or casualty. Keep operational failure, internal organization, military territorial power, state killings and detention, local party/class/religious conflicts, civilian incentives and foreign channels distinct.","path":"Pr
