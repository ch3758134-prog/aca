ovince-level chronology of orders, arrests, killings, disappearances, land/property/jobs, party communications, foreign aid execution, and survivor/perpetrator testimony; compare Aceh orders with local execution and civilian registers","priority":"Very high"},{"id":"CV565","period":"1945–2011","topic":"South Kelud agrarian conflict, land reform, post-1965 dispossession and Sakri case","status":"Local scholarly study and 2011 Constitutional Court judgment added; key underlying land files and local newspaper originals remain unexamined","note":"Separate cultivation/occupation, petition, administrative designation, plan, redistribution, military custody, eviction, concession and legal title. Court reproduces party submissions but does not decide land ownership.","path":"ANRI Ministry of Agriculture files cited by Yudistira/Sapto; SK49/KA/64 and SK50/KA/64 schedules; Petungombo/Kodam/PUSKOPAD and HGU records; Berita Yudha 30 Nov 1965; Sakri P-7 and Blitar district case file","priority":"High"},{"id":"CV566","period":"1951–1968","topic":"PKI internal causes, Aidit’s strategy, post-defeat self-criticism, militarization and underground command","status":"Aidit’s 1963 program report, September 1966 self-criticism and new archival-based organization study reviewed; primary operational records and provincial comparisons still missing","note":"Distinguish official party doctrine, private leadership decision-making, armed rhetoric, training, military liaison, actual force, command/communication failure and later repression. Retrospective self-criticism is an interested primary source.","path":"PKI CC/Politburo minutes, DPP BTI 257–259 and 262, HANREV files, Biro Chusus records, KOTI-seized PKI papers and provenance, provincial correspondence, arms receipts and local implementation","priority":"Very high"},{"id":"CV567","period":"1965–1966","topic":"National victim counts and ethnicity-specific shares","status":"Komnas HAM categories, local Makassar targeting, and the Aceh military chronology reviewed; no complete nationally representative victim register with ethnic identifiers located.","note":"The Aceh report records the 14 Oct local incidents (15 deaths, with ethnicity unspecified for six reported dead) and a separate 6 Dec fatal shooting by a military post of a 27-year-old Chinese Indonesian. Melvin counts 21 ethnic Chinese victims in the chronology and says that count excludes people whose bodies were not publicly displayed, but the article does not identify whether the 6 Dec case is included. None is a national denominator. The 0.4% quotient remains arithmetic from uncertain estimates, not a measured victim share; other group percentages are unsupported.","path":"Komnas witness BAPs, YPKP and provincial/village names lists, Aceh chronology and local civil registers, burial records and ethnic association files; reconcile Melvin’s 21-count case by case; document coverage, identity, time-period and denominator before any calculation","priority":"Very high"},{"id":"CV568","period":"1965–1969","topic":"PKI and contemporaneous Southeast Asian communist-party trajectories","status":"Selective regional comparison is in existing dossier; new PKI organization model clarifies comparison variables; party-side primary sources remain uneven","note":"Compare prior armed experience, legal/underground form, territory, cross-border rear areas, military support, recruitment constituency and party/state penetration. Do not treat different source types or U.S. estimates as a symmetric force census.","path":"CPM, CPT, CPB, PKP/CPP/NPA, WPK/CPK and Lao party congress resolutions, military histories, border files, cadre/membership and aid records; compare with PKI party publications and provincial archives","priority":"High"},{"id":"CV569","period":"1965–1966; retrospective studies 2017–2023","topic":"East Java local military geography: road access, Army command centers, civilian allies, population loss and refuge","status":"New census/GIS papers identify district-level associations and hotspots; indicators are population-change proxies, not death counts or proof of specific perpetrators. Full 2023 article still unreviewed.","note":"Use Chandra’s 2019 road-access study with 1961/1971/1980 census method and Chandra–Zhang’s 2023 abstract alongside Leksana’s quoted Kodam orders, Robinson’s synthesis, and local testimony; compare each association with dated operational records.","path":"S1332;S1333;S295;S043;S1310;S1317;S859;C2369–C2372","priority":"Very high"},{"id":"CV570","period":"1965-10 to 1966-03; studies published 2018–2021","topic":"Yogyakarta / Central Java: military intelligence, civilian lists and auxiliaries, arrests, detention and civilian autonomy","status":"Full 2018 Yogyakarta case study and 2020 abstract plus appendices added; mechanisms are better specified but base orders, detention lists and arms records remain to be checked.","note":"Trace sequence: Kopkamtib/RPKAD deployment → KAP/Front Pancasila and local rallies → civilian lists/organizational lists → arrest, truck transport and overcrowded detention → classification, torture/execution and local militia action; test where Army restrains, permits or loses control. Compare with East Java’s existing organizational networks and West Java commander behavior.","path":"S1336;S1337;S1332;S043;S295;S859;C2375–C2381","priority":"Very high"},{"id":"CV571","period":"1965-08 to 1966-03; testimony published 1966","topic":"G30S authorization and decision chain through the Njono/Untung Mahmilub records","status":"Two searchable 1966 trial volumes now reviewed at selected pages. They preserve competing layers: courtroom defense, prior interrogation summaries, prosecution argument and judicial findings. Njono's recorded court account says the Politburo chose to report the threat to Sukarno; the judgment cites an earlier account to find approval of a pre-emptive action. Original Politburo minutes, the alleged 28 August letter and underlying interrogation record remain absent. The printed editions identify the Army legal-education center as publisher and cite an Army publication order, confirming institutional publication rather than independent transcript provenance.","note":"Do not collapse testimony, judgment and verified action into one narrative. The trial was held under military custody during mass repression; OCR copies have errors. Untung's assertions do not establish that a General Council coup existed. The official editions are useful for what the military tribunal presented and how it framed the cases; they are not necessarily verbatim, complete or procedurally fair records.","path":"S1353;S1354;S1352;S1328;S252;S260;C2399–C2406; ANRI/Mahmilub docket, original BAPs, Politburo minutes, BPI/SUAD-I files, Council-of-Generals tape provenance","priority":"Very high"},{"id":"CV572","period":"1965–1966; advocacy datasets reported 2013–2023","topic":"Victim lists, missing-person categories, burial sites and victim ethnicity","status":"Regional West Sumatra records and Taher's printed LPR-KROB appendix use mixed case categories and lack an ethnicity field; national legal-category reports and burial/survivor databases also use distinct units. None supplies a comprehensive ethnicity-coded national death roster.","note":"Do not turn a section subtotal of 333 into a national death count or add grave sites, survivors, disappearances and deaths. No nationwide Javanese, Balinese, Sundanese, Madurese or Chinese victim percentages can be calculated from the reviewed records.","path":"S859;S1311;S1322;S1356;S231;S1340–S1343;S1349;S1350;C2356–C2358;C2384–C2391;C2407–C2409; request the original LPR-KROB dataset, Komnas HAM intake record and regional civil registers","priority":"Very high"},{"id":"CV573","period":"1961–1969; contemporary and retrospective comparative records","topic":"PKI public military discourse, clandestine strategy and Southeast Asian party comparison","status":"RAND RM-5753 has now been read directly through its official full scan, including the South Blitar decision and casualty passage. Its specific claim that Rewang was killed is disproved by prison/release reporting. The source remains a U.S.-funded analytical interpretation, not a PKI record. A 1968 U.S. NIE gives asymmetric party-force estimates; comparisons remain provisional.","note":"No uniform dataset measures party militarization or field strength. Separate public doctrine, officer contact, training, arms transfer, command authorization, actual fighting and state/civilian coercive capacity. RAND analysis and U.S. intelligence are situated estimates, not PKI records or comparable regional censuses.","path":"S1310–S1317;S1344–S1348;S1357–S1358;S1380–S1381;S1411;S1507–S1511;C2303;C2372;C2392–C2397;C2410–C2414;C2566; obtain party archives, operation logs and local group records from CPM/CPT/CPB/CPP-NPA and Lao organizations.","priority":"High"},{"id":"CV574","period":"1965–1968","topic":"Regional burial-site and person-level evidence audit","status":"YPKP has reported hundreds of sites and victim organizations maintain local lists, but underlying submitted data and verification records are not open in the reports reviewed. Independent regional studies use different units: detained person, survivor listing, missing person, alleged grave site and population anomaly.","note":"Every count must retain its unit, dates, geography, inclusion criteria and duplicate treatment; none can be silently converted to national deaths or ethnic shares.","path":"S1340–S1343;S1349;S1350;S859;C2384–C2391; obtain submission annexes, raw person lists, burial-site verification logs and civil-register data","priority":"Very high"},{"id":"CV575","period":"1965-08 to 1965-12; retrospective report date uncertain","topic":"Aceh territorial command, Pepelrada controls, local killing chronology and civilian auxiliary organization","status":"Direct page-image review covers KODAM-I/KOHANDA report pp.5–9 and 16–17 plus its 21-page Chronologis annex. It records regional command restructuring, arrests, local crowd/military interactions, killings (including a Chinese Indonesian reportedly shot dead by a military post), anti-Chinese property violence, asset control and administrative restrictions; original order copies and victim/custody registers remain unreviewed.","note":"This is one institutional military account. Its 1,941 aggregate, event attributions, ethnic labels, report of a military-post shooting and G30S allegations are not independently verified. Melvin’s 21-Chinese figure uses this same chronology; whether it includes the 6 Dec Beutong shooting remains unresolved. Local records cannot yield province-wide or national ethnic proportions.","path":"S855;S612;C2420–C2433; obtain Kep-3/8/1965, Instruction MSR-10/G-I/11092400/65, Kep/Peplrada-29/10/1965, Pepelrada-4/1/11/65, daily KOHANDA/Kosekhan logs, detention and victim lists, civil/burial records","priority":"Very high"},{"id":"CV576","period":"1928–1965; Rewang interview recorded 2011","topic":"Rewang independent biography, Politburo rank and G30S responsibility account","status":"A 2011 interview transcript appended to a 2012 university thesis adds self-reported career dates and a collective-responsibility account; the six-person decision and Njoto-exclusion framing was not confirmed. Full membership date conflicts with Hearman's chronology.","note":"Interview transcript directly read, but no audio, party roster or contemporaneous appointment record; preserve the 1964/1965 difference.","path":"S1362;S1310;C2434–C2436; obtain recording, memoir, rosters, correspondence and other Politburo accounts","priority":"High"},{"id":"CV577","period":"1965-07 to 1965-08; plea written 1973","topic":"Aidit–Munir communications, Politburo Daily Board, August briefing, Biro Chusus and G30S decision sequence","status":"Munir's 1973 defense distinguishes his reported knowledge of a Daily Board agreement and private explanation by Aidit from the 27/28 August briefing, which he said produced no vote or assent. This is a participant's courtroom account, not proof of formal PKI authorization.","note":"Full online transcript read; original court copy, Politburo minutes, Daily Board records and Special Bureau files remain missing.","path":"S1376;S1362;S1310;S1317;C2438–C2442; obtain original plea, trial files, party minutes and military participants' records","priority":"Very high"},{"id":"CV578","period":"1966–1968","topic":"South Blitar underground leadership, strategic debate, training, weapons and capture","status":"Munir's defense gives a detailed first-person chronology, organizational categories, stated defensive motive and his assessment that the base was unprepared; his January–August operations period must be separated from the named Trisula operation. Other oral histories and Army accounts differ on timing and decisions.","note":"Participant statements are legally interested/retrospective; no complete roster, operational order, weapon register or village support list.","path":"S1376;S1310;S1317;S1358;C2443–C2447; retrieve Kompro/emergency committee files, weapons/training rosters, Trisula orders, arrests and local testimony","priority":"Very high"},{"id":"CV579","period":"1945–1995; particular detention/execution events 1967–1995","topic":"Independent biographies, trial, detention, appeals, execution and post-execution advocacy for Munir, Ruslan and Ismail Bakri","status":"TAPOL and Amnesty fill biographical and prison chronology; case dates conflict (Munir arrest/capture and execution), Amnesty's Ruslan court type is inconsistent within one report, and his ages vary. Ismail's life-sentence and release chronology is reported but original decrees remain uninspected.","note":"Court and prison records not located; advocacy organizations report cases and international appeals.","path":"S1363–S1369;S1371;S1374–S1376;S310;S337;S845;C2449–C2468; obtain judgments, prison files, execution and clemency records, family documents","priority":"Very high"},{"id":"CV580","period":"1961 census through 2024 research; violence mainly 1965–1968","topic":"National victim ethnicity proportions and compatible regional denominators","status":"Searches add regional Bali mortality estimates and local Aceh ethnic labels but no national person-level victim list with self-identified ethnicity. Available counts use deaths, disappearances, prison deaths, burial sites, population anomalies or regional proportions as distinct units.","note":"No national ethnic death denominator; 1961 census omitted an ethnicity question; regional estimates cannot be converted into national ethnic victim shares.","path":"S1318;S231;S612;S1310;S855;S1363;S1366;S845;C2470; obtain local victim/civil/burial registers with ethnicity source, time/geography coverage and deduplication rules","priority":"Very high"},{"id":"CV581","period":"1945–1965; records from 1952–1955 and later scholarship","topic":"Munir and Ruslan labor biographies, SOBSI leadership titles and WFTU roles","status":"Sources establish senior SOBSI and WFTU involvement but use different rank translations and periods. Cornell catalogs Ruslan's 1953 congress report; the report and SOBSI executive lists have not been read.","note":"Do not harmonize General Secretary, deputy secretary-general, third deputy chair, or WFTU council roles without dated primary records.","path":"S1363;S1370;S1372;S337;S845;C2449–C2453;C2465–C2466; obtain congress proceedings, WFTU Box 3 Folder 9, SOBSI leadership rosters and press files","priority":"High"},{"id":"CV582","period":"1980–1985","topic":"Foreign labor and diplomatic pressure concerning Indonesian death-row prisoners","status":"British TUC/AUEW appeals in 1982 and Dutch, Australian and European Community appeals reported after Munir's execution show an overseas labor/human-rights channel; they concern prisoner advocacy and cannot be back-projected as evidence of 1965 intervention.","note":"TAPOL and Amnesty summarize the communications; original cable, diplomatic notes, receipt, government response and policy effect need independent files.","path":"S1363;S1366;S1367;S1375;C2459–C2461; locate TUC, Dutch, Australian, EC, presidential and Kopkamtib correspondence","priority":"Medium"},{"id":"CV583","period":"1961–2000","topic":"Ethnic composition of population censuses","status":"Expanded with demographic review and official BPS catalogue.","note":"S1377 says censuses 1961–1990 did not include direct ethnicity data and 2000 was first; S1383 confirms publication metadata, not questionnaire variables.","path":"Download BPS 1961 volume/questionnaire; compare S1377 with full census instruments and any special surveys.","priority":"High"},{"id":"CV584","period":"1965–1967","topic":"National ethnicity composition of victims","status":"Contested estimates and regional counter-evidence mapped; national proportions remain uncalculable.","note":"Cribb/Coppel estimate is summarized by Woolgar; Melvin documents regional anti-Chinese targeting in Aceh; lists reviewed have no national person-level ethnicity coding.","path":"S1322;S231;S612;S1356;S1377; recover provincial lists and code killings, detention, expulsion and property attacks separately.","priority":"Critical"},{"id":"CV585","period":"1966–1968","topic":"South Blitar cells, arms and authorization","status":"Article reread; small cells, disputed armed plans and the reported 34 firearms entered.","note":"Rewang’s retrospective statement and military seizure report are different sources; no minutes or complete inventory found.","path":"S1310;S1376; seek trial exhibits, captured papers, Trisula seizure reports, cell communications and provincial committee testimony.","priority":"Critical"},{"id":"CV586","period":"1960–1968","topic":"Communist Party of Malaya armed-strategy comparison","status":"1960 defeat, 1967 preparations and 1 June 1968 announcement of renewed armed struggle recorded.","note":"The 1961 Deng influence is recounted through Chin Peng and security sources, not party minutes; title period and combat span are not identical.","path":"S1379; CPM congress/plenum records, Chin Peng/Rashid Maidin memoirs, Thai border records and Malaysian files.","priority":"High"},{"id":"CV587","period":"1965–1968","topic":"Communist Party of Thailand comparison","status":"Expanded: the CPT’s shift from urban/legal activity to rural armed struggle is bounded to a cited retrospective account; it dates the first northern attack to 7 Aug 1965.","note":"Cui Feng cites Saiyud 1986 p.180 for the first attack date; the underlying Thai military history and contemporary incident records remain uninspected. Do not treat the CPT as equivalent in size, organization or battlefield maturity to PKI.","path":"S1408;S1313;S1321; inspect Saiyud 1986 p.180, CPT resolutions, Thai incident logs and local oral histories.","priority":"High"},{"id":"CV588","period":"1948–1989","topic":"Communist Party of Burma / China border support","status":"1968 border campaign and later Yunnan aid mechanisms expanded.","note":"UCDP supplies conflict chronology; Zhang provides individual volunteer histories; Peng distinguishes central and local policy from 1969 onward. These do not prove China’s support to PKI.","path":"S1378;S1381;S1382; CPB/Burmese records, Chinese party documents, Yunnan files and Burmese diplomatic files.","priority":"High"},{"id":"CV589","period":"1968–1969","topic":"CPP and New People’s Army comparison","status":"Founding party line separated from field capacity.","note":"Program documents establish a declared rural armed strategy, not actual strength or territory.","path":"S1315;S1344;S1345; founding communiqué, NPA declaration/roster and local military files.","priority":"High"},{"id":"CV590","period":"1965–1969 Southeast Asia","topic":"Comparative measurement of communist movements","status":"Expanded with a 1968 U.S. intelligence snapshot and an exact Thai insurgency date; remains non-comparable across source categories.","note":"The 1968 NIE contrasts a few hundred PKI activists in the hills with CPM, Sarawak guerrilla, Huk and Burma White Flag estimates; figures are a time-specific U.S. estimate, not an audited force census. PKI Fifth Force proposal, limited training evidence, Army territorial apparatus and later PKI underground detachments are separate forms.","path":"S1312–S1315;S1320–S1321;S1329;S133;S295;S1408; party/unit rosters and contemporaneous security records.","priority":"High"},{"id":"CV591","period":"1966–1968 South Blitar","topic":"Relocation and base-formation timeline","status":"Expanded from Rewang’s interview on proposal and approval; exact relocation and Kompro dates remain unsettled.","note":"Liem records Rewang saying that after Sudisman’s December 1966 arrest he proposed leaving Jakarta and building village resistance; the group agreed and East Java CDB contacts had prepared villages. Later memoir-derived dates may refer to arrival, local preparation, or formal committee establishment rather than the same event.","path":"S1317;S1384;S1385;S1388; obtain the memoir, CDB records, dated travel/contact papers and village committee evidence.","priority":"High"},{"id":"CV592","period":"1967 South Blitar","topic":"Emergency Central Committee roster and appointments","status":"Expanded with explicit structure and decision conditions; exact roster and formation date remain unverified.","note":"Rewang recalls an Emergency CC above provincial leadership and Kompro, about nine CC members and guerrilla detachments beginning formation. The interview says an all-Java/national conference to assess conditions and readiness had not yet occurred. The 23 May 1967 date comes from a later memoir-derived report, not an independent minute.","path":"S1317;S1384;S1385;S1387;S1388; obtain Rewang memoir pages, original meeting minutes, appointment notices, captured papers and local roster.","priority":"High"},{"id":"CV593","period":"1967–1968 South Blitar","topic":"Armed-struggle policy, Perjuta and local authorization","status":"Expanded: distinguishes planned organized people’s war from local armed acts outside the reported Kompro line.","note":"Rewang says the leadership had not agreed to commence organized armed struggle pending national assessment; he describes some disarmament and attacks on alleged past executioners as outside program and retrospectively calls some “armed propaganda.” This is a participant’s later account, not a complete action log or authorization record.","path":"S1317;S1376;S1384;S1385;S1388; identify incidents, target lists, operational orders, meeting records, trial files and local testimony.","priority":"High"},{"id":"CV594","period":"1967–1968 South Blitar","topic":"Tjugito, Pratomo and “Memimpin Perang Rakyat”","status":"Secondary claims identified; manual and authorship unverified","note":"KontraS and Tirto associate Tjugito/Pratomo with the manual; no copy, capture inventory, training register or distribution log reviewed.","path":"S1384;S1386; military capture inventory; manual copies; course lists","priority":"High"},{"id":"CV595","period":"1967–1968 South Blitar","topic":"Detga headcount and weapons capacity","status":"Open; the reported 150-person force is not reconciled with arms records","note":"A memoir-derived press figure gives 150 armed members; Hearman/Munir accounts and military seizure claims use different units and scopes. No personnel list or complete inventory.","path":"S1310;S1376;S1385;S1388; unit rosters, weapons issue/seizure records","priority":"High"},{"id":"CV596","period":"1967–1968 East Java","topic":"Army intelligence, arrests and Trisula funding","status":"Secondary narrative found; underlying operational documents absent","note":"Koran Sulindo reports intelligence after named arrests and an initial local funding arrangement attributed to Jasin; do not treat either sequence as verified without Army, provincial, Air Force and treasury records.","path":"S1385;S1389; S1310; Trisula orders, intel files, budget/transfer and deployment records","priority":"High"},{"id":"CV597","period":"1967 South Blitar","topic":"Source-dependence and memoir access","status":"Open; several public retellings may be dependent","note":"The 2017 Rewang memoir is bibliographically verified but not text-accessed; secondary articles cite or appear to summarize it without page references. The official TNI volume is catalogued, but the online copy was not extractable.","path":"S1385;S1387;S1388;S1389; obtain print/scan and document citation chains","priority":"High"},{"id":"CV598","period":"1966–1968 South Blitar","topic":"Underground network formation and local cell functions","status":"Expanded: compartmentalization is now tied to participant recollections of the Emergency CC/Kompro decision chain.","note":"Liem records Muyatno identifying “Gatot Taryo” as his sole contact and as Kompro chair, while saying that many members did not know one another. This may have protected the network but is not by itself proof that every cell was disconnected or that this explains military defeat.","path":"S1310;S1317;S1384;S1385; S1388; verify name forms, appointment, communication routes, actual cell activity and capture records.","priority":"Critical"},{"id":"CV599","period":"1967–1968 South Blitar","topic":"Refuge, local support, coercion and the meaning of armed resistance","status":"Expanded with conflicting survivor accounts and village-level operational pressure; local variation and representative samples remain open","note":"Accounts include family/refuge motives, party rebuilding, children and villagers relaying warnings, some armed actions, mass evacuations and coercion during Trisula. These cannot be generalized to every village or every fugitive.","path":"S1310;S1317; S1390; seek named-site evacuation and camp registers, village testimony, family records, operation scripts, leaflets and human remains documentation.","priority":"Critical"},{"id":"CV600","period":"1968-06 to 1968-08 South Blitar","topic":"Interrogation, capture and leader-transfer chain","status":"Leader fates and several capture dates are reconstructed from Hearman, participant interview and contemporary human-rights reporting; Rewang is confirmed alive through imprisonment and 1991 release, correcting Pauker’s printed death claim. No original capture, trial, sentence, prison-intake or complete operation casualty records obtained.","note":"Hearman cites army-history pages 137, 140 and 142 for Suwandi, tactical interrogations and leader captures; sources disagree on Munir/Ruslan and Rewang capture dates. Separate capture, formal registration, intake and family notification.","path":"S1310;S1363;S1366;S1386;S1390;S1392;S1394;S1396–S1397;S1507–S1510; obtain operation logs, detention/interrogation registers, trial dockets, verdicts, prison intake/release and execution records, and village household/death lists.","priority":"Critical"},{"id":"CV601","period":"1967–1969 South Blitar historiography","topic":"Contemporary and official military accounts","status":"Expanded: official military publications now identified as a 1968 second edition and a separate bibliography’s 1969 third edition; neither text directly collated.","note":"S1391 is a 44-page 1968 second-edition catalogue record; S1392 cites a 1969 third edition and pages 34, 40–41; S1390 (1969 Semdam history) remains cited through scholarship only.","path":"S1390–S1393; obtain the military book, both Sketsmasa editions, maps, orders, rosters, weapons/capture lists and footnote provenance.","priority":"Critical"},{"id":"CV602","period":"1967–1968 East Java and South Blitar","topic":"Military rule, Kopkamtib, territorial operations and civil administration","status":"Expanded from a 1999 state-sponsored account; execution remains unverified at village level","note":"The retrospective provincial history says ABRI officers filled some strategic civilian vacancies, Kodam directed intelligence and territorial operations with civil offices, and follow-on territorial consolidation lasted through Dec 16, 1968. It also reports 712 Surabaya arrests under separate Operation Sambar Raga. No original appointment lists, orders, or arrest registers were inspected.","path":"S1392;S1393; obtain Kodam/Korem/Kopkamtib orders, caretaker appointment lists, village records, Sambar Raga registers and Trisula phase closeout reports.","priority":"Critical"},{"id":"CV603","period":"1968 South Blitar / Trisula, Aug 1968–2017 sources","topic":"Reported deaths, arrests, detainees and displaced people: source-chain and count definitions","status":"Expanded but unresolved; exact NYT articles and individual registers remain unavailable","note":"Separate: 257 arrests in a May–July military-history citation; 850 detainees at 9 Aug checkpoint; Amnesty “more than 800 arrested” in June/July and “many killed”; 2,000 killed-or-arrested in 2010 retelling of NYT; 2,000 deaths plus thousands detained/displaced in 2017 article citing NYT. No source presently supports collapsing these into one audited total.","path":"S1310;S1317;S1334;S1392;S1394–S1397;S1390; NYT TimesMachine/ProQuest, 9 Aug press report, daily Trisula returns, detainee and casualty registers.","priority":"Critical"},{"id":"CV604","period":"1968–1969 East Java / U.S. post-operation relationship","topic":"U.S. consular assessment, development advice, counterinsurgency framing and actual aid delivery","status":"Scholarly quotations identify post-operation U.S. consular observation and policy advice; NARA confirms an RG 59 1967–1969 subject-numeric/box-list route, but the specific Airgram A-12 and any aid execution records remain unread.","note":"The source’s cited locator is POL 18 INDON / Surabaya / Airgram A-12 / 29 Jun 1969; use NARA Archives II 1967–1969 box lists, then seek AID/USOM approvals, appropriations, shipments and local receipts.","path":"S1310;S1324;S1399;S1402–S1404; C2534–C2535; C2540–C2541","priority":"High"},{"id":"CV605","period":"1968–1971 South Blitar and Nganjuk","topic":"Children separated/orphaned, foster-care pilot, family consent and outcomes","status":"Report located bibliographically; primary survey and case files not accessed","note":"Hearman cites a 1971 IKIP/Dinas Sosial report and describes attempts to place children orphaned during the operation in new foster homes; the report’s scope, number, consent, family contact and outcome are unknown.","path":"S1394;S1400; obtain report/appendices, social-affairs placement files, guardian/consent records and kin/child testimony.","priority":"Critical"},{"id":"CV606","period":"1968–1971; South Blitar (Bakung, Sumberdadi and surrounding villages)","topic":"Food production and consumption, displacement, water access, and the state’s post-operation social survey","status":"A 1970 government survey is cited by a directly read 2015 study; the original survey remains unlocated. The article reports village-level market crop data and survey statements, with sample and household data not yet checked.","note":"The reported figures and diet/water observations concern the named surveyed villages; no report tables or respondent-level records are available, so no inference to all of South Blitar is supported.","path":"S1324 pp.92–93 and notes 13, 15, 64, 69; S1405; seek the report, questionnaires and tables through Social Affairs and university catalogs.","priority":"Medium-high"},{"id":"CV607","period":"1966-12 to 1968; South Blitar and dispersed PKI networks","topic":"Emergency CC authority, Kompro structure, and the decision to commence organized armed resistance","status":"Participant accounts distinguish relocation and party reconstruction from a later, still-unmade decision to begin organized people’s war; original minutes and complete roster remain absent.","note":"Rewang reports the relocation proposal and acceptance, an Emergency CC above regional/project bodies, about nine CC members, and a pending national conference. Local armed acts reportedly occurred outside the Kompro/CC program. Some names are compartmentalized and the exact 1967-05-23 formation date is memoir-derived.","path":"S1317;S1384;S1385;S1387;S1388; obtain Rewang memoir, CC/CDB/Kompro records, conference papers, local action logs and capture files.","priority":"Critical"},{"id":"CV608","period":"1965-10-10 to 1965-11-27; East Java and Central Java","topic":"Regional Army command shift, Pupelrada/Puterpra, village guards and auxiliary forces","status":"Full article text read for East Java orders quoted from Kodam VIII Brawijaya inventory 316-a; Hammer’s full Central Java study reviewed; original regional orders and local execution lists not obtained.","note":"Evidence distinguishes early public-order instructions and pre-existing/local civilian mobilization from the 21 October Pancasila Operation, the 26 October placement/training order, November arming and resident-registration instructions, and Central Java’s separate RPKAD village-guard recruitment/training. A duplicate T.702/1965 number for 23 and 27 November requires original-file review.","path":"S295;S139;C2330–C2333;C2569–C2574;C2576; obtain original order bundle 316-a, recipient receipts, six-hour reports, village rosters, arms/training registers, detention and screening lists","priority":"Critical"},{"id":"CV609","period":"Archive documents 1967–2016; methodological relevance to 1965–66 victim ethnicity","topic":"Amnesty International archive ethnicity tags and limits as a possible victim-data source","status":"Homepage, how-to guide and Chinese, Dayak and Javanese category pages directly opened; individual reports are not yet exhaustively coded.","note":"The archive explicitly defines document coverage as 1967–2016 and says it contains 200+ public PDFs. Ethnicity labels organize document retrieval; they are not a national or regional 1965–66 death roster and cannot supply ethnic denominators.","path":"S1350;S1311;S1356;S231;S612;C2408–C2409;C2472–C2475;C2575; obtain and code relevant report PDFs individually without treating tags as people or death counts","priority":"Very high"},{"id":"CV610","period":"1965-11 to 1966-12; Korem 083 Malang-Besuki and Kodim 0809 Kediri","topic":"Army-reported detention totals, daily status changes and count anomalies","status":"Leksana’s 2023 monograph directly reproduces a 1965 military detention table and cites a dated Kediri tally; Brawijaya original pages and individual registers not obtained.","note":"Korem 083 table prints 2,472 detainees (4 Nov), 6,259 (12 Dec noon), 5,798 (midnight), 4,431 (29 Dec), with an unexplained 1,509 on 23 Nov and blank totals on 4/23 Dec. Separate undated Kediri tally gives 245 civil servants, 211 village officials, 2,955 civilians. These are detention counts/tallies, not deaths; period, status changes and duplication rules are unknown.","path":"S1410;S295;C2577–C2578; original inventory 316-a report pp.8–18, daily custody/transfer/death records, full Kodim 0809 tally and date","priority":"Critical"},{"id":"CV611","period":"1965-11-19 to 1966-01-18; Donomulyo, South Malang and Wates/Blitar","topic":"Local implementation of South Malang Pancasila Operation, civilian information networks, detentions and killings","status":"2023 chapter read for a specifically titled 1966 operation report and a 2016 eyewitness interview; report originals, local rosters, village registers and burial records not opened.","note":"P.O.004/1965 dated 19 Nov was implemented from 29 Nov to 18 Jan; Army units, Puterpra, Marines and Brimob appear in the published sequence. Donomulyo Tjatur Tunggal and village heads supplied local information; a local witness described military executions and Ansor participation. Official report’s “90% PKI” is an allegation, not a census.","path":"S1410;C2582–C2584; obtain P.O.004, operation daily reports, district rosters, detainee lists, cemetery/burial registers and named family/witness accounts","priority":"Critical"},{"id":"CV612","period":"1967–1968; East Java former PKI districts","topic":"Post-killing New Orderisation teams, village-head replacement and election postponement","status":"Open-access 2023 monograph chapter read for the Brawijaya military meeting/order chain; originals in inventory 316-b and local appointment/election records not accessed.","note":"The chapter reports Java commanders/Kostrad/RPKAD meeting in July 1967, a September provincial guidance-team order, Korem/Kodim teams, caretakers replacing village heads and postponed village elections in former PKI areas. This is state-building and local administration after the killings; province-wide completeness remains unverified.","path":"S1410;C2585; inventory 316-b Siaran Kilat No.1/1967, Kep-001/ORBA/9/1967, appendices, caretaker appointments, district election registers and village correspondence","priority":"Critical"},{"id":"CV613","period":"1965-12 to 1968; surviving PKI networks in Jakarta, Bandung and South Blitar","topic":"Post-repression factional regrouping, leadership authorization, refuge, underground cells and readiness for armed struggle","status":"Hearman and Liem participant materials reconstruct two leadership groupings, a compartmentalized Emergency CC/Kompro structure and conditional discussion of armed action; Rewang’s 1991 release independently contradicts Pauker’s claimed death. No contemporaneous emergency-CC minutes, complete roster or authorization resolution found.","note":"Hearman distinguishes Sudisman/Jakarta and Ismail Bakri/Bandung groupings; Rewang’s cluster moved toward survival, reorganization and a conditional armed-struggle plan. Munir later blamed haste and immature preparations; some reports and testimonies describe isolated armed actions. These distinct statements do not establish a unified, combat-ready nationwide underground.","path":"S1310;S1317;S1384;S1385;S1388;S1411;S1358;S1508–S1510;C2587;C2299;C2478;C2492–C2495;C2559–C2563; obtain Emergency CC and Rewang/Munir originals, court files, domestic couriers and operation logs.","priority":"Critical"},{"id":"CV614","period":"1965-10-14; Blang Pidie and Sama Dua, South Aceh","topic":"Local incident-level ethnicity coding and the limits of proportional estimates","status":"Melvin transcribes two entries from the Aceh military chronology; the original page 8 has not been directly inspected and victim identity/location crosswalk is incomplete.","note":"The published account reports four Chinese victims among five deaths at Blang Pidie and four among ten at Sama Dua; six people in the latter entry lack ethnicity coding. The four named Chinese victims there are said to be from Blang Pidie. These are reported event fractions, not provincial or national population shares; possible location/origin or duplicate-person ambiguity bars aggregation.","path":"S612;S855;C2422;C2588;inspect Chronologis 1966 p.8, names, event locations, residence, family/burial records and all 21 Chinese-coded entries","priority":"Critical"},{"id":"CV615","period":"1968; South Blitar / Trisula operation","topic":"Local military auxiliaries, territorial control, surveillance and coerced civilian logistics","status":"Hearman’s study compares village interviews with the 1969 Brawijaya Trisula history; the operation book, caretaker lists and village registers are not directly inspected.","note":"Reported mechanisms include replacing Hansip with Banser after alleged intelligence leaks, installing military caretakers, village-level company deployment, identity and resident/cattle registration, closely spaced checkpoints, movement controls, and forced local labor for patrols and detainee management. This describes a local counterinsurgency system, not uniform national practice.","path":"S1310;S1324;C2512;C2514–C2516;C2590–C2591;obtain Operasi Trisula pp.67, 85, 89, 167 and 1968 village registers, rosters and local testimony","priority":"Critical"},{"id":"CV616","period":"1960; 1964; October–November 1965","topic":"Army Air Command, U.S. training and aircraft procurement, and Suharto’s secret courier network to regional commanders","status":"A specialist article quotes/summarizes former Army Air Command pilot Sudjai’s memoir; full 2009 memoir series, original confidential orders and flight logs not directly inspected.","note":"The article attributes to Sudjai training opportunities at U.S. military flight schools, Army purchase of two U.S.-made Aero Grand Commander aircraft, repeated flights carrying Suharto orders to Java division commanders, and commanders’ initial uncertainty. These are bounded memoir claims; no inference of U.S. covert action follows from training or commercial procurement.","path":"S1412;S250;S026;C2593–C2599; retrieve The Global Review 2009 five-part series, Army Air Command logs, regional command diaries, U.S. training rosters and aircraft sales/export files.","priority":"Critical"},{"id":"CV617","period":"August–October 1965; CIA assessment dated 1965-10-06","topic":"PKI succession contingencies, Sukarno’s health, G30S timing and competing early CIA hypotheses","status":"Full contemporaneous OCI No.2330/65 text read; the August contingency-plan source is unnamed and unlocated; Indonesian primary records remain absent.","note":"The report says an August contingency plan had been “reliably reported,” then speculates about its possible effect on timing. It also judges Aidit unlikely to have approved murders or government change. Record as an early CIA knowledge snapshot with internal uncertainty, not proof of the alleged plan or of who authorized the movement.","path":"S026;C2600–C2605;Q540; locate CIA source notes, PKI meeting and succession records, Sukarno medical/schedule files, RRI/KOTI transcripts and Central Java unit records.","priority":"Critical"},{"id":"CV618","period":"Late 1965–1974; West Kalimantan and Sarawak border","topic":"West Kalimantan PKI underground, PGRS/Paraku organizational boundaries and regional survival conditions","status":"Peer-reviewed 2002 regional study read in full around pp.57–61 and 85–86; underlying army manuscript, internal PKI and guerrilla records remain unavailable.","note":"Study separates Sarawak-oriented PGRS/Paraku from the West Kalimantan-oriented PKI and some Indonesian volunteers, while documenting limited contact and planned cooperation. Organizational labels and counts in military histories are inconsistent; geographic factors are author interpretation, not a universal model.","path":"S232;C2606–C2610;C322;C673; retrieve 1970/1975 Kodam histories, cited 1967 intelligence reports, the unpublished manuscript Penumpasan Terhadap Gerombolan Tjina Komunis, local party/guerrilla rosters, 1967 press and village records.","priority":"Critical"},{"id":"CV619","period":"1951–1971; 17 Aug 1965 statement as retrospectively cited; 1966–1967 party re-evaluation","topic":"PKI Politburo self-criticism: 1951 legal strategy, internal reporting and mass-action assessment, agrarian/labor policy, armed line and authorship/publication provenance","status":"A scanned 1971 reprint was visually checked at selected pages and compared with Indonesian/English transcriptions and Sudisman’s 1967 defense. The original 1966 manuscript, original 1965 statement, district reports and operational records remain unavailable.","note":"The 1966 text says the 1951 parliamentary path was initially correct under its conditions, then criticizes later failure to debate/agree a principal struggle form and the fixing of peaceful legality as a principle. It also criticizes mass-action reporting, land and labor strategy and calls for armed agrarian revolution that must arise from peasant struggle. These are the surviving faction’s diagnoses/program, not independently verified descriptions of nationwide implementation or sufficient causal proof of PKI defeat.","path":"S228 item 507; S252 printed pp.237–238; S261 publisher note; S262 scan; S1331 transcript; S1339 lines 447–448; C2614–C2626. Request item 507, 17 Aug 1965 Harian Rakjat and provincial reports, 1951/1956/1959/1965 CC records, agrarian/labor firm records, original Tribune issue no.3, and 1966 drafting/circulation files.","priority":"Critical"},{"id":"CV620","period":"1965-08-17; Jakarta newspaper record and later 1966/1971 references","topic":"Access to the full Harian Rakjat issue and the Politburo statement cited by the 1966 self-criticism","status":"No full issue or statement text found online in this pass. ISEAS MFM 4 holdings cover 1953–1965; Xiamen CSEAS lists through 1965.9; Perpusnas digital pointer described only 1951–52 issues as digitized.","note":"Roosa’s reproduced cartoon and slogan are not the full issue or the complete Politburo statement. ANRI KOTI item 507 is only a catalogue lead. Holdings-range evidence does not verify any single daily copy.","path":"S1413–S1415; C2623–C2629; request the exact date/reel from ISEAS MFM 4 and Xiamen CSEAS, inspect Khastara’s current manifest, search Warung Arsip and other repository catalogues, and request ANRI item 507.","priority":"Critical"},{"id":"CV621","period":"1967–1985; South Blitar, Jakarta, Blitar and Pamekasan","topic":"G9 independent person file: Gatot Lestario / Gatot Sutaryo / likely “Gatot Taryo”; underground role, capture, trial, spouse imprisonment, letters and execution","status":"Partial","note":"Secondary research and contemporary advocacy sources now identify overlapping South Blitar and PKI East Java roles, probable alias crosswalk, arrest and later prison trajectory. The precise Kompro office, trial and verdict dates, Pudji’s sentence length, execution date, and individual decision authority remain disputed or indirectly reported. No court, arrest, party roster, original letter, prison or execution record was inspected.","path":"Obtain Semdam VIII Brawidjaja 1969 Operasi Trisula pp.297–298; original Muyatno interview; East Java PKI roster/Kompro minutes; Blitar District Court docket and judgments; Indonesian Times and Suara Karya Jan 1976 originals; Pudji Aswati judgment and Malang custody record; IISH ARCH02325 letters; NLW file 2/3; execution and cemetery registers.","priority":"High"},{"id":"CV622","period":"1975–1986; Blitar courtroom defense, publication in Dutch exile, 1986 Indonesian circulation ban","topic":"G9 independent person file and G30S/South Blitar decision history: Gatot Lestario’s defense text, political framing, publication chain and censorship record","status":"Partial","note":"TAPOL Bulletin 71 (1985) prints selected English-translated extracts and reports an approximately 80-page handwritten defense made 26 Dec 1975. TAPOL Bulletin 76 reports an almost complete annotated Dutch edition in the 1985 volume Indonesië: De waarheid omtrent 1965. Suharto staat terecht. Official JDIH supplies the complete two-page Attorney General decision dated 5 June 1986: it orders nationwide prohibition, surrender and seizure; its preamble cites a BAKIN opinion from 11 Apr and asserts the book threatens public order. Neither the original Indonesian plea, the Dutch volume nor the BAKIN opinion has been inspected.","path":"Inspect the 1985 Dutch volume and full bibliographic record; locate and collate the original 80-page defense manuscript, Blitar docket and judgment; obtain BAKIN opinion R/921/IV/1986/G and related book-ban materials; compare Lestario’s 1975 retrospective with Sudisman’s 1967 defense, Politburo self-criticism, contemporaneous minutes, military records and independent South Blitar testimony.","priority":"Critical"},{"id":"CV623","period":"1963–1989; focus: June 1986 book bans and their administrative pathways","topic":"Formal authority, foreign-print controls, security/intelligence recommendations, regional Muspida action and later interagency review","status":"Partial; 1963 legal text, Keppres 10/1986, and KEP-041/KEP-044 scans reviewed; ELSAM 1999 full scan pages 34–38, 76 and 143 reviewed. No underlying advice memoranda, hearing minutes, coordination records or enforcement logs.","note":"Penpres 4/1963 gives the Attorney General banning authority and contains import-screening, postal-return and seizure provisions. KEP-041 names a BAKIN opinion; KEP-044 names a Department of Information recommendation. ELSAM describes central and regional channels and says a 1989 clearing house later formalized review; this is secondary reconstruction. The 18 June date of KEP-044 does not resolve ELSAM’s “one month after” wording for a June hearing.","path":"S1430–S1433;S1428;C2661–C2669; retrieve cited BAKIN and Department of Information memoranda, Commission I hearing record, Menko Polkam/Muspida minutes, local seizure and postal/customs registers, Keppres 29/1988, and signed KEP-114/JA/10/1989","priority":"Critical"},{"id":"CV624","period":"1975–1985; Gatot Lestario’s courtroom defense, smuggling, Dutch translation and title/bibliography chain","topic":"Independent publication provenance and title disambiguation for Lestario’s defense text","status":"Partial: TAPOL 71 extracts, TAPOL 76 notice, Hearman 2016 article, Scott bibliography and catalog/finding-aid snippets reviewed; no 1985 Stichting Indonesia Media copy located.","note":"Hearman says defense copies were smuggled out by former political prisoners, translated into Dutch with a Wertheim introduction, and retitled in allusion to Sukarno. CiNii records a separate 1985 Indonesian edition of Sukarno’s Indonesia menggugat / Indonesië klaagt aan. Private bibliography lists Lestario’s plea within the 1985 book, while one dealer gives the whole booklet as 35 pages and Scott lists an essay at pp.170–235. This is an unresolved title and pagination conflict, not evidence of completeness.","path":"S1417;S1426–S1429;S1434–S1436;C2670–C2672; obtain the physical Dutch booklet and Blitar court manuscript; check title page, table of contents, translator/editor, pagination, provenance, printer and any copies in Dutch/Indonesian archives.","priority":"Critical"},{"id":"CV625","period":"1967–1968; South Blitar / Trisula","topic":"Emergency PKI networks, local agriculture, military evacuation and food control, detention, gendered and household impacts","status":"Expanded from two scholarly studies and retrospective witnesses; village orders and registers remain uninspected","note":"Evidence separates Emergency CC/Kompro preparation and national-conference condition from local acts; military theory (Mao/Vietnam) from limited practical capacity; crop-extension efforts from the military’s attributed “taxation” allegation; camp controls, forced civilian logistics, caretakers and gendered/household impacts. Interviews and military-history figures are indirect or retrospective; no village roster or complete action log.","path":"S1310;S1317;S1324;S1384;S1385;S1390;C2510–C2516;C2560–C2564;C2673–C2687; obtain Operasi Trisula pp.206, 243 and adjacent pages, caretaker and evacuation lists, route maps, weapons/action logs, village food/camp registers and original interviews","priority":"Critical"},{"id":"CV626","period":"1965–1967; national estimates and selected Makassar, Aceh, West Java, South Blitar cases","topic":"Victim identity and ethnicity, local ethnic targeting, national denominator and alleged group proportions","status":"Search and cross-check expanded 2026-11-19; no national victim-level ethnic register or defensible percentage found. Published Chinese-death estimates remain approximate, and regional evidence demonstrates locally specific anti-Chinese targeting and violence. Chandra 2019 has now been checked; it adds regional patterns but no victim ethnicity or death counts.","note":"The approximate 2,000 Chinese estimate divided by an approximate 500,000 total yields only a derived 0.4% ratio, not a measured share; the approximate 2% population denominator is not an ethnicity-coded 1961 victim census. Komnas HAM's 349 examinations and its legal-category figures are not a national death census. Local targeting in Aceh, North Sumatra, West Java, Makassar and 1967 West Kalimantan must be distinguished by place, date, violence type and denominator. No national Javanese, Balinese, Sundanese or other group percentages can be produced from available records. Chandra 2019 uses aggregate census totals and election results; its population changes cannot isolate deaths from migration or yield victim-ethnicity shares.","path":"S859;S231;S1322;S1324;S1317;C2310;C2356;C2358;C2474;C2674;C2682–C2683; locate victim-level Komnas HAM/YPKP, local civil/burial/detention/community registers with identity fields; trace the 2,000 estimate's source chain and keep 1967 West Kalimantan separate from 1965–66.; S1512; obtain the cited Central Java census volumes, election tables and district-level registers","priority":"Critical"},{"id":"CV627","period":"1967–1968; East Java / South Blitar and South Malang","topic":"Trisula phases, ABRI caretaker administration, civil-territorial operations, official underground-force claims and competing survivor accounts","status":"Expanded with a directly opened 1978 government history; underlying 1969 military history and 1975 regency booklet remain unavailable","note":"The state history distinguishes intelligence/territorial activity, a 31 May Trisula start, an approximately two-month physical operation, rehabilitation through 7 September, and civil-territorial guidance through 16 December. It reports 144 ABRI caretakers, unlike Liem’s 234; describes the Kompro as strongly armed with two Detga and 17 Gerda; quotes an 850 detainee figure; and cites a November 1968 document for a March plan. All are attributed official claims, not neutral audited facts. Rewang and Munir give a different account of central authorization, readiness and local defensive action.","path":"S1310;S1317;S1376;S1384;S1390;S1393;S1410;S1437; obtain Semdam VIII/Brawijaya Operasi Trisula pp.5, 8–11, 64, 83, 122–123, 243; Sketsmasa third edition pp.12–15, 34–41; Pemkab Blitar Selayang Pandang Blitar Selatan p.1; phase orders and registers; original “Pedoman Aksi Kota”; village caretaker, intelligence, evacuation, detention and weapons records","priority":"Critical"},{"id":"CV628","period":"1965–1966; G30S planning, China arms discussions and post-event narrative","topic":"Origins, actor authorization, interrogation/trial source chains, and foreign information channels","status":"Expanded by direct CIA-study, embassy-cable and scholarly full-text review; primary party minutes, interrogation originals, Chinese delivery chain and original press items remain missing","note":"The CIA’s 1968 reconstruction places a small September planning group and a Dani–Beijing arms channel in its narrative, while admitting the conspiracy account rests entirely on participants’ interrogations. Roosa’s comparison of Latief’s records identifies concrete coercion/contradiction issues. A Nov 1965 U.S. cable carries an unidentified Polish report of a limited operation originating outside the PKI, but the Embassy warns it may be doctored. A separate Apr 1966 U.S. cable traces one army-newspaper Mao–Aidit story to a Hong Kong satire; this is not evidence that all Chinese–Indonesian contacts were fictitious.","path":"S115;S134;S136;S251;S1438;S1439;C2696–C2702; request Subandrio/Dani/Latief BAPs and court files, Polish Embassy records, Chinese MFA minutes, Indonesian Air Force cargo/receipt registers, Hong Kong and Jakarta original periodicals","priority":"Critical"},{"id":"CV629","period":"1965–1968; PKI underground resistance and Southeast Asian communist organizations","topic":"Cell organization, formal authorization, weapons/training capacity, strategic disagreement, post-1965 survival and period-specific comparison with CPT, MCP and CPB","status":"Partial; a page-checked peer-reviewed South Blitar article and comparative Thai study supplement prior participant/military records; party minutes and comparable rosters remain absent.","note":"Hearman reports compartmentalized three-person cells, limited weapons and contested timing; CPT sources describe an earlier rural/armed trajectory; MCP and CPB differ in the length and geographic basis of their insurgencies. 1968 U.S. estimates are a biased snapshot using non-equivalent categories, not standardized force counts.","path":"S1310–S1314; S1348; S1441; obtain emergency-CC/provincial minutes, cell/arms rosters, court defense originals, CPT/PLAT operation records, MCP border force records and CPB contemporary data.","priority":"Very high"},{"id":"CV630","period":"1951–1968; PKI internal diagnosis, clandestine reorientation, and comparative communist-party structures","topic":"Party decision channels; legal mass-party strategy vs armed preparation; membership/cadre expansion; post-defeat clandestine program; CPT declared doctrine, insurgency onset, cell secrecy and foreign support","status":"Expanded by the 1966 Politburo-attributed self-criticism and Sudisman’s 1967 defense, plus a CIA-hosted retrospective Thai insurgency study and Baird’s peer-reviewed account. Party minutes, original rolls, CPT congress/operational records and aid logs remain missing.","note":"The 1966 text says strategic debate and some decisions were concentrated in leadership channels, legal-parliamentary work weakened readiness for repression, and membership growth outpaced training; these are primary evidence of the surviving leadership’s diagnosis, not a neutral causal verdict. Its 1966 general language and Sudisman’s 1967 defendant account differ in institutional framing. CPT doctrine, rural preparation and actual armed conflict began at different reported dates; foreign support claims rest partly on Thai intelligence interviews. Keep PKI membership, insurgent estimates, party cells and armed fighters in separate categories.","path":"S1331;S1441;S1442;S260;S261;S1310;S1312;S1313;S1314;S1348;C2709–C2716; locate CC/Politburo records, member rolls, 1966 document drafts/circulation, CPT congress directives, regional incident logs, VOPT recordings and Chinese/CPT assistance records.","priority":"Critical"},{"id":"CV631","period":"1961–1965; legal civil defense, AURI Hansip/HANREV training and Fifth Force distinctions","topic":"Legal authorization and command chain; recruitment/selection; course schedules and curricula; institutional control; Rawabinong vs Lubang Buaya; headcount definitions; weapons transfer; relation to 30 September planning","status":"Expanded with official 1962 statutes, Sujono testimony, Crouch and Anderson–McVey reconstructions, and two later narratives with source-lineage limits; original 10 March instruction, Omar Dhani trial vol.III, Soedarmanto p.106 and course files remain unobtained.","note":"Keppres 48/1962, 128/1962 and UU14/1962 establish general legal authority, not a named Fifth Force or 1965 course. Separate a reported 10 Mar base-Hansip instruction; Army Sumatra Kodim companies; the 120-person Halim guard plan; expanded Lubang Buaya course; Rawabinong; headcount definitions; and late arrivals. Sources report 21 Sep order, 26 Sep actual closure, training through G30S and training through eve Oct 1; these may describe different administrative and operational endpoints. None replaces the missing orders, rosters, logs or source pages.","path":"S133; S1353; S1443–S1451; S1473–S1476; request ANRI BTI 257–259; obtain Omar Dhani Mahmillub vol.III pp.47,468–489; find Soedarmanto pp.103–106 and source; secure 10 Mar order/Korud files, Sumatra Kodim records, course/attendance/weapon/return books; compare 1994 original and cited contemporary press.","priority":"High"},{"id":"CV632","period":"14 January–3 September 1965; Fifth Force public proposal, presidential statements, press controversy, archive retrieval, and TAKARI/KOTARI follow-through","topic":"Presidential proposal and decision status; distinction between popular defense and a constituted service; exact 31 May/1 June event identity; contemporary press and Chinese military/diplomatic channels; archive access and source dependence; economic command design and implementation","status":"Expanded: January press reports now provide a Perpusnas microfilm lead and a six-issue sequence; the 14 Jan/15 Jan accounts conflict on whether 10 million were workers or peasants. A 1968 CIA report speculates Beijing encouraged Aidit but cites no direct contact record at that sentence. May 31/June 1 date dispute and later press/Chinese archival routes remain open.","note":"Keep the publicly reported proposal separate from internal strategic intent, Chinese encouragement, Sukarno’s response, service planning, training and actual arming. The thesis and later accounts are locator/citation-chain evidence until the 14–15 Jan originals are read; the CIA paragraph is evidence of a 1968 intelligence judgment, not proof of the inferred channel.","path":"S1452–S1472; S859; S134; retrieve Warta Bhakti 14 Jan, Indonesian Observer 14 Jan, Harian Rakjat 15 Jan and 18 Jan, Antara 18 Jan, Warta Bhakti 23 Jan, Harian Rakyat 26/30 Jan; verify Perpusnas and LOC/ISEAS microfilm holdings; locate CBS Kalb report, Crouch p.87, Chinese Embassy/Aidit communications, ANRI item 750, Antara 31 May–2 June, Suluh Indonesia 2 June, service-chief plans, and June 1 territorial-command records.","priority":"High"},{"id":"CV633","period":"1966–1968 court proceedings; archival and scholarly access records reviewed 2026-11-19","topic":"Omar Dani Mahmilub verdict, transcript versions, finding aids, photographs and bibliographic source chain","status":"ANRI finding aids and academic citations directly checked; no complete multi-volume transcript or judgment text obtained.","note":"ANRI KOTI item 63 is one folder described as a copy of the verdict file; ANRI photo inventory p.555 lists the 5–24 Dec 1966 Bappenas hearings. Oey cites Vol. II pp.131/140; van der Kroef cites book I pp.3/287/320; Crouch's Vol. III citations remain separate. Name variants Dani/Dhani and a caption “Omar Said” must remain visible until original pages/images are compared.","path":"S118;S1338;S1478;S1479;S1482;C091;C2799–C2802; request ANRI item 63, Cornell trial transcripts, Mahkamah Agung docket and original court/photograph copies.","priority":"Very high"},{"id":"CV634","period":"1966–1968 domestic PKI underground; 1966–1980s party-in-exile in China","topic":"Surviving domestic leadership, Emergency CC, South Blitar Kompro and armed-struggle decisions, compared with Beijing Delegation authority and exile administration","status":"Domestic structure remains reconstructed from divergent participant interviews, U.S.-sponsored analysis and military/court sources. Direct reading of Pauker reveals at least one demonstrably false fate claim (Rewang); independent TAPOL and Amnesty reporting establishes his 1991 release. No original command minutes or domestic–exile correspondence located.","note":"Keep the Sudisman-Jakarta and Ismail Bakri/Rewang-linked Bandung/East Java clusters, Ruslan's attributed Emergency CC role, South Blitar Kompro/cells, local armed actions and proposed national-war conference distinct. Keep Beijing CC-PKI Delegation distinct: its 1966 external mandate and PRC-hosted exile functions do not prove control over domestic units or G30S planning. Hill's domestic details cite Hearman and are derivative.","path":"S1310;S1317;S1358;S1376;S1384–S1388;S1477;S1508–S1510;C2294–C2295;C2321–C2323;C2476–C2478;C2560–C2564;C2790–C2798; retrieve Emergency CC/Kompro minutes, Rewang/Munir trial papers, domestic couriers and IISH/Beijing Delegation files.","priority":"Critical"},{"id":"CV635","period":"1965 alleged Politburo meeting; 1978 KOPKAMTIB narrative; 1979 White Book process; 1981/82 military biography","topic":"Official account of 28 Aug 1965 decision-making, its citation chain, state narrative revision and conflict with court testimony","status":"The 1981/82 state biography and 1979 instruction were directly read; the 1978 cited white book and 1979 revised volume remain uninspected. Court accounts diverge; minutes not located.","note":"Safwan says an expanded Politburo meeting gave full delegated authority to Aidit and cites KOPKAMTIB 1978 pp.77 and 121. Inpres 5/1979 orders the State Secretary to perfect a white book already prepared by KOPKAMTIB, but does not disclose the revision's edits. Njono and Munir trial accounts differ from the official story. Do not count the biography and the cited white book as independent confirmation.","path":"S1353;S1376;S1480–S1481;C2400;C2439;C2803–C2805; obtain 1978 and revised 1979 white-book editions, drafting records, court transcript originals, Politburo minutes and party correspondence.","priority":"Critical"},{"id":"CV636","period":"1965–1967 killings; national estimates and selected regional ethnic violence","topic":"Ethnic identities and denominators among victims; estimate provenance and whether group-specific mortality rates can be calculated","status":"No national victim-level ethnic dataset or defensible national percentage found after expanded search; the only prominent Chinese share is estimate-based arithmetic, while local evidence documents severe regional variation.","note":"Approximately 2,000 ethnic Chinese deaths against an approximate 500,000 total yields about 0.4% only as a derived quotient; it is not a victim-record share. Population estimates near 2% are not a matched census denominator. Do not infer ethnic distributions for the remaining victims or national rates for Javanese, Balinese, Sundanese, Dayak or others. Separate 1965–66 massacres from 1967 West Kalimantan expulsions/killing.","path":"S231;S1322;S1311;S612;S855;S1318;C2310–C2311;C2340–C2341;C2474–C2475;C2575; seek village names, explicit identities, missing-person/death/cemetery/civil records, and use consistent time/place definitions.","priority":"Critical"},{"id":"CV637","period":"1945–1968; PKI public doctrine, party practice and armed capacity; CPM border-based armed strategy","topic":"Distinguish PKI theory of armed struggle, legal/mass political line, actual clandestine channels and military capacity; compare with CPM phase-two insurgency","status":"New primary speech excerpt and full comparative article reviewed; doctrine-practice distinction sharpened, but implementation and primary party evidence remain OPEN.","note":"Aidit’s 1960 New Age excerpt retrospectively names three forms of struggle and calls for a National Front and broad mass party; a 2023 intellectual history characterizes 1950–65 PKI strategy as cross-class and nonviolent/parliamentary. The texts require contextual comparison, not a simple “peaceful vs militarized” label. CPM sources describe a long-lived border-based insurgent structure resuming operations in 1968, including secondary strength and PRC-support claims that are not a symmetric comparator with PKI membership or South Blitar.","path":"S1483;S1484;S1325;S1314;S1312;S261;S1329;C2806–C2810; obtain complete Aidit speech, party congress/Politburo/Biro Chusus files, provincial training/weapons lists, CPM primary declarations and Thai/Malaysian records.","priority":"High"},{"id":"CV638","period":"1968–1971; CPM underground logistics, arms/cell organization and PRC-supported broadcast channel (comparison only)","topic":"Evidence for border insurgency infrastructure and foreign propaganda support; assess Malaysian state statements against participant memoirs and radio-transcript research","status":"One full official Malaysian security publication and one preliminary radio/transcript study reviewed; they reveal precise evidence paths but underlying CPM/PRC records remain unverified.","note":"The Malaysian 1971 paper quotes captured documents and arrested/surrendered persons on small cells, short training, weapons, village food supply and cross-border withdrawal; it is a security mobilization document with redactions and unknown interrogation conditions. Ong 2006 reports a CPM radio station in Hunan based partly on Chin Peng memoir and a transcript corpus accessed through Singapore ISD; paper states it is not authoritative. No direct evidence here of equivalent CCP support to the PKI; do not transfer these mechanisms across parties.","path":"S1483;S1485;S1486;C2811–C2815;Q568; obtain 1968 White Paper, original CPM captured directive, interrogation and court records, VMR transcripts/recordings, Chinese international-liaison and radio station records, Thai/Malaysian border incident records.","priority":"High"},{"id":"CV639","period":"1965 Oct–1966; U.S. medicine and communications aid; 1981–1987 retrospective recipient/ambassador accounts","topic":"Disaggregate covert aid proposals, approvals, handovers and retrospective accounts; test medical resale, separate radio transfers, and the provenance of U.S. casualty estimates","status":"Official FRUS records establish an October plan to covertly transfer three Motorola P-31 sets, a November medicine approval and implementation arrangement, later communications stages, and a December dispute over credit cover. Green’s 1987 oral history says 14 Embassy emergency radios went to Suharto and that some U.S.-supplied medicines were resold; Bunnell reports Sukendro’s 1981–82 confirmation of medicine, radio and small-arms delivery. These are later recollections; dates/quantities/receipts remain incomplete. Green also describes the 300,000 estimate as an average of staff guesses, not a counted victim list.","note":"Do not merge the October three-set P-31 plan, d175’s unspecified items reportedly furnished from stocks on 13 October, Green’s undated 14-radio recollection, and the 1965–66 larger communications project. Distinguish covert commercial medicine arrangements, approval, purchase, receipt, distribution and resale. Green and Sukendro/Bunnell accounts provide important retrospective evidence but are not inventory/receipt documents.","path":"S431; S029–S033; S171–S173; S176; S455; S806–S808; S865–S867; C753; C1418; C1420; C1423–C1426; C1457; C2816–C2820; Q569; retrieve RG59/RG84/303 Committee and CIA purchase/shipping files, embassy radio inventory and Army receipt/issue logs, Bunnell interview notes, Green’s February 1966 worksheets and battalion movement records.","priority":"High"},{"id":"CV640","period":"1967–1968; East Java / South Blitar underground PKI","topic":"TNI SUAD-I report, captive-derived Kompro roster and alleged early-1968 armed-conflict decision","status":"Partial: full translated Army intelligence report and Embassy cover note opened; underlying SUAD-I file, captives, documents, party minutes and execution records missing","note":"The 17 Feb 1968 TNI report names Tarmudji and several Kompro roles, describes Kompro/Triko sections, and reports an early-1968 conflict plan stalled for lack of readiness reports. The Embassy’s 28 Feb cover note says no collateral information confirms reported killings were conducted by a cohesive PKI group. Rewang’s later recollection says the start date was undecided and required a provincial-committee decision. These source claims conflict and have different provenance.","path":"S1487;S1317;S1310;S1392;C2821–C2828; original SUAD-I file and interrogation papers; captured documents; Kompro rosters; regional readiness reports; provincial committee conference records; local incident/victim records","priority":"Very high"},{"id":"CV641","period":"1965-10; Jakarta; KIAPMA, foreign delegates and Chinese Commercial Counsellor’s Office search","topic":"Conference record and attendance; temporary military/telecom restrictions; separate diplomatic search; formal property status","status":"Partial; contemporaneous reports and finding aids found; attendance/date/legal-status conflicts open","note":"ANRI inventory No.817 and Dutch finding aid item761 identify separate record groups; Peking Review, Le Figaro quote and Reuters preview give differing numbers; Dommen disputes official embassy-property listing but register missing. Do not merge KIAPMA into the office search or settle diplomatic immunity from one footnote.","path":"S1488–S1495;S1498;S1501; retrieve KIAPMA minutes/roll, item761, Army 328th Battalion report, Chinese protest and Indonesian MFA property/incident register.","priority":"High"},{"id":"CV642","period":"1963–1966; Jakarta–Cairo–Havana–Beijing; AAJA, AAPSO, OISRAA, PWI and Indonesian diplomatic staff","topic":"Network biographies, arrest and office seizure, press/telecom interruption, temporary relocation, Beijing plenary, PRC facilities and media channels","status":"Partial; primary statements and contemporaneous communiqués added; institutional control and arrest evidence incomplete","note":"Available record supports different organizations with overlapping personnel, not a single foreign-directed body. AAJA reported arrest/communications disruption; April 1966 communiqué chose a Beijing seat; later scholarship finds growing Chinese state influence. Actual budgets, orders, minutes, arrests and returned/exiled individual biographies remain open.","path":"S1496–S1503;S1506; retrieve 1963 Declaration/rosters, AAJA serials and minutes, NARA/Indonesian arrest files, Chinese Journalists’ Association facility records, OISRAA bulletins and radio logs.","priority":"High"},{"id":"CV643","period":"1965–1968; PKI post-defeat self-criticism and Beijing exile Delegation","topic":"Internal cause claims, doctrine/practice transition, armed line, leadership succession, regrouping and domestic/exile communication","status":"Partial; self-criticism and scholarly exile reconstruction reviewed; implementation, domestic command and original minutes absent","note":"The 1966 text names adventurism and post-defeat reliance on Sukarno as errors, then advocates armed rural struggle; this is a post-defeat factional diagnosis, not a verified complete cause. Hill documents exile divisions, Adjitorop’s authorization and Chinese host leverage but not command of domestic cells.","path":"S1503;S1505; compare S1484;S1487;S1310;S1317; obtain IISH items, Indonesian Tribune original 1966 issues, Politburo/Central Committee minutes, regional instructions, Chinese liaison records and CPM records for bounded comparison.","priority":"Very high"},{"id":"CV644","period":"1965–1968; West Java / Banjaran textile mill; China and Japan aid","topic":"Chinese industrial credit/equipment, Japanese reparations contribution, aid interruption and factory restart/production","status":"Partial; PRC statement and later JICA industrial survey establish a promising specific chain, not the agreements and physical transfers","note":"PRC note asserts >8,200 tons and >70% shipped before aid/experts were withdrawn in April 1966; JICA 1991 report says Chinese aid was main finance, some Japanese reparations supported construction, and factory operation began 1967/full scale 1968. Intermediate financing, construction and handover stages remain unexplained.","path":"S1502;S1504; obtain 1961 bilateral agreement, loan/credit schedules, port/customs manifests, Banjaran inventory, 1966–68 commissioning/finance files and expert departure records.","priority":"High"},{"id":"CV645","period":"1965–1966; national victim ethnicity and region-specific anti-Chinese violence","topic":"National death estimates by ethnic group; ethnicity coding in population censuses; Aceh and West Java variation; deaths versus detention, expulsion and property loss","status":"Partial; no national victim-level ethnicity-coded register found; local Aceh military/district reports and competing scholarly interpretations are documented","note":"Cribb–Coppel’s approximate 2,000 ethnic-Chinese death estimate and the approximate 500,000 national denominator remain estimates, not measured proportions. Woolgar summarizes a national non-overrepresentation argument; Melvin documents and argues for a later, explicitly ethnicity-directed Aceh phase. These can coexist: a national estimate does not erase local targeting. The 304 detainees and approximately 10,000 displaced people are not death counts.","path":"S231;S612;S1322;S1311;S1318;S1383;S859;S855. Obtain 1961 census questionnaire/tables, local civil/burial records, Aceh district April 1966 report and 304-person list, expulsion/convoy registers, and regional victim/family lists with provenance.","priority":"Very high"},{"id":"CV646","period":"1968–1991; South Blitar Trisula and post-operation trials","topic":"South Blitar leader fate records, casualty category/source chain, military deployment, civilian control, detention and long-term sentence/execution outcomes","status":"Partially resolved: Rewang survived and was released in 1991, disproving Pauker’s death claim. The 2,000 figure appears as killed in RAND and Hearman 2017 but captured/killed in other derivative accounts; no original NYT article or named casualty list has been inspected.","note":"Keep killed, captured, formally arrested, detained, displaced and executed as separate outcomes. Distinguish military estimate, scholar’s synthesis, advocacy report and individual court/prison evidence. The reported 5,000 soldiers/3,000 militiamen and coercive civilian measures are not casualty counts.","path":"S1310;S1358;S1392;S1394;S1396–S1397;S1425;S1507–S1510; obtain NYT TimesMachine/ProQuest/microfilm, Brawijaya/Kodam operational and village records, casualty and detention registers, court/prison files for Rewang/Pudji/Gatot and families, burials and displaced-person lists.","priority":"Critical"},{"id":"CV647","period":"1961–1980 census data; Central Java 1965–1966","topic":"Regional variation in estimated population change, civilian-party geography, Army deployment, migration and limits of death-count inference","status":"Expanded with a full-text review of Chandra 2019; original census/election tables and local event records remain uninspected","note":"The study identifies Pekalongan, Demak and Surakarta population-loss clusters and rural population-gain areas. It combines 1961/1971/1980 census counts with 1955/1957 election returns. Its inferred PNI/NU/RPKAD roles are author interpretations of aggregate patterns; population gaps also reflect migration and do not identify individual deaths, victim ethnicity or local responsibility.","path":"S1512;S139;S151;S1336–S1337;S1332; obtain Central Java census volumes and official election returns; RPKAD deployment orders and local unit logs; detention, burial, missing-person, refugee and court registers; compare with district-level oral histories","priority":"High"},{"id":"CV648","period":"2026-04–2026-10","topic":"Domestic worker statutory protection and constitutional challenge","status":"Partial","note":"UU 2/2026 enacted 30 Apr; official PDF shows direct/agency recruitment distinctions and social insurance linked to agreement; 29 Oct MK case 352 petition not accepted for procedural reasons. Does not establish practical implementation or merits determination.","path":"S1514;S1515; obtain local RT/RW reporting and social insurance enrollment evidence; compare JALA PRT union testimony; read MK judgment reasoning and legislative history","priority":"High"},{"id":"CV649","period":"1948–1964","topic":"Gerwis/Gerwani leadership commissions and magazine publishing contrasted with Perwari","status":"Partial; page-specific periodical leads","note":"S462 reports 1954 congress commissions for rights, culture, organization and finance; 1957 membership and cross-party candidacies remain self-reported. S1517 March 1960 catalogue identifies editors and pages for international women's day, children's health and domestic columns. S1518 compares Api Kartini and Perwari Trisula but chapters restricted.","path":"S462;S1516;S1517;S1518; obtain 1954 minutes, 1961 constitution scan, March 1960 issue, Perwari Trisula issues, district dues and leadership rosters","priority":"Very high"},{"id":"CV650","period":"1954–1965","topic":"Gerwani congress programs and the link between women's wage/leave rights, rural land tenure and grassroots organization","status":"Expanded; 1961 program transcription directly read, implementation and print facsimile unverified","note":"Fourth congress program explicitly demands equal pay, maternity/menstrual leave, workplace childcare, women's land title, women
