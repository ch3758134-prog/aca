 Bukit Duri; allegation of torture comes from NGO and not independently verified court record.","period":"1966–1977","type":"Named contemporary human-rights report of detention and trial","source_ids":["S230"],"confidence":"High for printed NGO account; individual court/torture documentation outstanding","basis":"Amnesty ASA21/09/77 p2 Sri Ambar","next":"Seek 1975 judgment, prison register, interview and family record.","year":1966},{"id":"C317","text":"Amnesty recorded 1977 Unilever worker/union member Kusnah as detained at Bulu Semarang after 1969 arrest, and Jakarta textile worker Otjik at Plantungan women's detention camp after 1967/68 arrest.","period":"1967–1977","type":"Named NGO worker-level case reports","source_ids":["S230"],"confidence":"High for reported names/jobs/camps, exact arrests/camp status require primary registers","basis":"Amnesty ASA21/09/77 p2 Kusnah and Otjik","next":"Seek Unilever and textile payroll, dismissal dates, tribunal/penitentiary files.","year":1967},{"id":"C2905","text":"Amnesty International's September 1977 union-detainee dossier lists Kartina Kurdi as a BTI parliamentary organizer and Gerwani leader reportedly arrested in 1965 and then held at Bukit Duri in Jakarta.","period":"1965–1977","type":"Contemporaneous NGO claim about an identified cross-organization activist","source_ids":["S230"],"confidence":"High that Amnesty printed this identity and location; not independently confirmed by parliamentary, court, or prison records.","basis":"ASA 21/09/77 printed p1; BTI and Gerwani roles are separately attributed, and the dossier is not a full legal-membership roll.","next":"Verify Kartina Kurdi's parliamentary seat, Gerwani appointment, arrest warrant, transfers and release using Indonesian primary records.","year":1965},{"id":"C2906","text":"Amnesty's 1977 union prisoner list identifies Dahliar as a BTI parliamentary representative, reportedly arrested in October 1965 and held at the Plantungan women's camp at the time of publication.","period":"1965-10–1977-09","type":"Contemporaneous NGO report on woman agrarian representative and detention","source_ids":["S230"],"confidence":"High for this claim's publication by Amnesty; appointment, detention dates and individual fate unverified by original Indonesian records.","basis":"ASA 21/09/77 printed p1; particular prisoner details may derive from relatives or correspondents and are not official judicial findings.","next":"Locate parliamentary personnel lists and camp records for Dahliar; distinguish detention from post-1977 outcome.","year":1965},{"id":"C2907","text":"Amnesty's September 1977 dossier describes Sri Suharti as a lawyer and Serbaud civil-aviation union activist reportedly arrested in 1969, then held in Bukit Duri, and says her husband was also detained.","period":"1969–1977","type":"Contemporaneous NGO report of occupation, union status, family and custody","source_ids":["S230"],"confidence":"High for exact NGO report; independent employment, legal practice, family and prison records missing.","basis":"ASA 21/09/77 printed p3; a spouse's detention does not establish shared political command or personal PKI membership.","next":"Find Serbaud union records, legal employment and individual detention evidence; independently verify spouse and children's subsequent status.","year":1969},{"id":"C2908","text":"The 23 September 1977 Amnesty list describes Satijah as a postal and telecommunications workers' union participant, reportedly arrested in Jakarta in May 1969 and then held at Plantungan.","period":"1969-05–1977-09","type":"Contemporaneous NGO named occupation and detention report","source_ids":["S230"],"confidence":"High for what Amnesty reported; employer membership, arrest and camp entries not independently inspected.","basis":"ASA 21/09/77 printed p2; only given name in this report, disambiguation incomplete.","next":"Find full name, SB Postel union membership, arrest/camp records and family testimony without inferring party affiliation.","year":1969},{"id":"C2909","text":"Amnesty International's 1977 dossier identifies Sedijami as a teacher and PGRI-NV union member reportedly arrested in 1965 and held at Plantungan by 1977.","period":"1965–1977","type":"Contemporaneous NGO named teacher-union prisoner report","source_ids":["S230"],"confidence":"High for report text; independent teacher employment, union membership and prison records not inspected.","basis":"ASA 21/09/77 printed p2; PGRI-NV is not necessarily identical to other teachers' federations.","next":"Locate PGRI-NV statutes and school appointment, arrest and prison records for Sedijami.","year":1965},{"id":"C124","text":"White, Graham and Savitri describe major rural organizations being suppressed or restructured after 1965; they trace a 1973 BKST/HKTI reorganization and continued village-level military surveillance as longer aftermath.","period":"1965-1970s and later","type":"Scholarly synthesis of institutional transformation","source_ids":["S138"],"confidence":"Moderate; original 1973 regulatory and district records not inspected","basis":"S138 section 3; dates/agency pathways need original decrees.","next":"Find HKTI founding decree, BKST records, local KORAMIL/Babinsa organizational orders and survivors' agrarian histories.","year":1965},{"id":"C239","text":"ICJ history dates 1973 February formation of state-supported FBSI union federation and 26 April creation of HKTI peasant association, describing post-1965 transformation in how organized workers/peasants could represent their interests.","period":"1973","type":"Institutional retrospective","source_ids":["S199"],"confidence":"Moderate-high for dated overview, original legal/founding files open","basis":"S199 p121","next":"Get 1973 declarations, FBSI/HKTI official charter and local federation memberships.","year":1973},{"id":"C2912","text":"Hearman's WFTU/SOBSI study identifies Setiati Surasto as a female SOBSI deputy official who replaced Sugiri in a secretariat post with the World Federation of Trade Unions in Prague, without demonstrating that she was on Adam Soepardjan's 1959 travel delegation.","period":"1950s–1960s (precise appointment unverified)","type":"Scholarly attribution of distinct domestic and international union roles","source_ids":["S845"],"confidence":"High for scholarly attribution of posts; exact appointment dates and any affiliation with Gerwani unverified.","basis":"S845 places her in SOBSI and WFTU administrative network; no linked individual travel record is supplied for Adam's 1959 delegation.","next":"Obtain SOBSI and WFTU employment/secretariat minutes, date of succession and original correspondence.","year":1950}]);
window.HIST.sources.push(...[{"id":"S001","title":"Biographies of key figures, A History of Modern Indonesia","creator":"Adrian Vickers; Cambridge University Press","date":"2013","url":"https://www.cambridge.org/core/books/abs/history-of-modern-indonesia/biographies-of-key-figures/21CF0B5C6053D149E180A52FD913F698","kind":"Scholarly reference chapter","access":"Full chapter summary/page metadata","note":"Compact biographical chronology; marriage dates conflict with ANRI and other references; not primary evidence."},{"id":"S013","title":"The Cold War in Indonesia, 1948","creator":"Harry A. Poeze; Journal of Southeast Asian Studies","date":"2009","url":"https://www.cambridge.org/core/journals/journal-of-southeast-asian-studies/article/abs/cold-war-in-indonesia-1948/9362C0BA3273C130F83C2B35C242A354","kind":"Peer-reviewed scholarly article; publisher abstract and references","access":"Publisher abstract, metadata and selected endnotes opened 2026-11-12; full article remains access-restricted. Endnotes provide archival leads to Drees 164, Beel 25 and U.S. Consul John Hamlin report NARA 856D.00B09.3048.","note":"Poeze argues Madiun had significant international-communist links through Musso’s return after European discussions and a mandate to reform PKI policy. This is a scholarly interpretation, not an operational directive or proof of Soviet command. Archive references are leads only; compare McVey, Efimova/Sidel and Anderson."},{"id":"S016","title":"Missing millions: Java's 1944–45 famine in Indonesia's historiography","creator":"Modern Asian Studies / Cambridge","date":"2024","url":"https://www.cambridge.org/core/journals/modern-asian-studies/article/missing-millions-javas-194445-famine-in-indonesias-historiography/97C1382A9684E3F3E1B46A8A6DFBA367","kind":"Peer-reviewed article","access":"Abstract/search extracts","note":"Useful on famine estimates and romusha memory; avoid repeating debated mortality totals without methodological review."},{"id":"S017","title":"Naskah Sumber Arsip Sukarno","creator":"ANRI","date":"2020","url":"https://anri.go.id/download/naskah-sumber-arsip-seri-presiden-ri-sukarno-1586395026","kind":"Archival source compilation","access":"Search extract only","note":"Contains archival-source reproductions/context; PDF not yet reviewed page by page."},{"id":"S036","title":"Presidential Decree No. 150/1959","creator":"Republic of Indonesia; BPK legal database","date":"5 Jul 1959","url":"https://peraturan.bpk.go.id/Home/Download/87103/Kepres%20No.150%20Tahun%201959.pdf","kind":"Primary legal text","access":"PDF opened","note":"Text dissolves Constituent Assembly and restores 1945 Constitution; constitutional legitimacy is separate analysis."},{"id":"S037","title":"Law No. 5/1960 Basic Agrarian Law","creator":"Republic of Indonesia; JDIH BPK","date":"24 Sep 1960","url":"https://peraturan.bpk.go.id/Home/Download/116465/UU0051960.pdf","kind":"Primary legal text","access":"Official BPK PDF opened; Articles 6, 7, 10 and 17 and explanatory sections reviewed","note":"Distinguish statutory principles from implementation; page/paragraph locators reviewed include PDF pages 3, 5, 23–24 and Articles 6, 7, 10, 17."},{"id":"S038","title":"Law No. 2/1960 on Sharecropping Agreements","creator":"Republic of Indonesia; JDIH BPK record; full-text reproduction by Yayasan Titian","date":"7 Jan 1960","url":"https://peraturan.bpk.go.id/Details/51300/uu-no-2-tahun-1960","kind":"Primary legal record plus text reproduction","access":"Official BPK metadata reviewed; searchable five-page reproduction read at https://kitabhukum.wordpress.com/wp-content/uploads/2013/11/uu-no-2-th-1960.pdf","note":"BPK metadata confirms title and enactment date; full text reproduction is hosted outside government and should be compared with State Gazette. Relevant clauses: Articles 2–4, 7–9, 14–17."},{"id":"S039","title":"Perpu No. 56/1960 on Agricultural Landholding Limits","creator":"Republic of Indonesia; JDIH BPK","date":"29 Dec 1960","url":"https://peraturan.bpk.go.id/Download/43030/perpu%20056%201960.pdf","kind":"Primary legal text","access":"Official BPK PDF directly opened; statutory articles and explanatory memorandum reviewed","note":"Effective 1 Jan 1961. The explanatory memorandum's farmer/landholding figures are official policy claims, not an independent survey. Relevant PDF pages 0–9 and Articles 1, 5, 8–13."},{"id":"S041","title":"Agrarian movements and rural populism in Indonesia","creator":"Ben White, Colum Graham and Laksmi Savitri; Journal of Agrarian Change 23(1), pp. 68–84","date":"First published 2 Aug 2022; journal issue 2023","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.12506","kind":"Peer-reviewed open-access article","access":"Full-text page opened; abstract and sections on party strategy, land reform and 1963–64 actions reviewed","note":"Authors' historical synthesis; membership figures are claims reported by the article; archive and locality-specific corroboration remain necessary. Key passages: lines 139–164 and 145–161."},{"id":"S058","title":"Merdeka: The Struggle for Indonesian Independence and the Republic's Precarious Rise, 1945–1950","creator":"Harry Poeze and Henk Schulte Nordholt; Cornell/JSTOR","date":"2024","url":"https://www.jstor.org/stable/jj.19061282","kind":"Scholarly monograph","access":"Full chapter 10, Civil War February–November 1948, opened/read in De Gruyter open-access PDF, pp.256–300; especially pp.275 and 283–286.","note":"Scholarly reconstruction using participant reports, press and archive references. The 1949 Sumarsono report remains mediated; author judgments are interpretations."},{"id":"S063","title":"Labour and Land in Indonesia: An Introduction","creator":"Ben White and Marcus Taylor; Journal of Agrarian Change","date":"18 Aug 2025","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.70034","kind":"Peer-reviewed agrarian-history review article","access":"Full publisher page and abstract opened; selected overview sections reviewed","note":"25(4), e70034. A field overview and historiographical synthesis, not a primary source or an Indonesia-wide uniform model; authors identify class, gender/generation, plantation, extractivist and rural militarization themes."},{"id":"S064","title":"Labour Mobility and Colonial and Forced Labour Regimes in Indonesia: A Long-Term View","creator":"Ulbe Bosma; Journal of Agrarian Change","date":"25 Feb 2025","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.70002","kind":"Peer-reviewed historical synthesis","access":"Full publisher page and abstract opened; selected passages reviewed","note":"25(4), e70002. Covers labour regimes from the 1600s and regional divergence; its national synthesis must be checked against locality-specific evidence."},{"id":"S065","title":"The Price of Un/Freedom: Indonesia’s Colonial and Contemporary Plantation Labor Regimes","creator":"Tania Murray Li; Comparative Studies in Society and History","date":"2017","url":"https://www.cambridge.org/core/journals/comparative-studies-in-society-and-history/article/price-of-unfreedom-indonesias-colonial-and-contemporary-plantation-labor-regimes/8EFC43C76E9427735F4CD38C7037CCF5","kind":"Peer-reviewed historical/anthropological article","access":"Publisher page opened; bibliographic metadata and abstract/selected passages reviewed","note":"59(2), 245–276. Focuses on plantation labour regimes and coercion; not a comprehensive account of all regions or all labour forms."},{"id":"S078","title":"FRUS 1958–1960, d224: Situation in Indonesia under the first Guided Democracy government","creator":"U.S. Department of State, Office of the Historian","date":"10 Sep 1959","url":"https://history.state.gov/historicaldocuments/frus1958-60v17/d224","kind":"Secret U.S. policy assessment","access":"Full text opened; summary and source note reviewed","note":"Reports 10 July government formation, expanding Army role, exclusion of Masyumi/PSI from executive and limited PKI role; interpretation that Sukarno used Army as PKI counterweight is the embassy's analysis."},{"id":"S079","title":"FRUS 1955–1957 d311, Report on Takeover of Dutch Enterprises","creator":"U.S. Embassy Jakarta; U.S. State Department Office of Historian","date":"6 Dec 1957","url":"https://history.state.gov/historicaldocuments/frus1955-57v22/d311","kind":"Contemporary U.S. diplomatic report including editorial footnote to Dec5 cabinet action","access":"Full cable and editor footnote re-read incl telegram1445's translation of Dec5 cabinet decision","note":"Cabinet moved worker-seized Dutch businesses under government supervision and management boards; KPM specifically under government military-related authority. U.S. diplomats' view/source translation not direct original Indonesian cabinet minutes; occupation, administrative supervision, military direction and nationalization must be separated."},{"id":"S083","title":"Law No. 5/1960 Basic Agrarian Law: full text","creator":"Republic of Indonesia; JDIH BPK","date":"24 Sep 1960","url":"https://peraturan.bpk.go.id/Home/Download/116465/UU0051960.pdf","kind":"Primary legal text","access":"Official 33-page PDF opened; selected articles and explanatory text directly reviewed","note":"The law repeals named colonial agrarian provisions and sets a national framework; statutory text alone cannot establish land redistribution or local practice."},{"id":"S084","title":"Law No. 2/1960 on Sharecropping Agreements: searchable text reproduction","creator":"Republic of Indonesia; reproduction compiled by Yayasan Titian, hosted by KitabHukum","date":"7 Jan 1960","url":"https://kitabhukum.wordpress.com/wp-content/uploads/2013/11/uu-no-2-th-1960.pdf","kind":"Text reproduction of primary legal text","access":"Five-page PDF transcription opened and read; official BPK metadata for same law separately checked","note":"Non-government-hosted transcription; compare with original State Gazette. It specifies written agreements, witnesses, village/camat authority, local harvest shares and anti-ijon provisions."},{"id":"S085","title":"Perpu No. 56/1960 on agricultural landholding limits","creator":"Republic of Indonesia; JDIH BPK","date":"29 Dec 1960; effective 1 Jan 1961","url":"https://peraturan.bpk.go.id/Download/43030/perpu%20056%201960.pdf","kind":"Primary legal text","access":"Official PDF directly opened; Articles 1, 3–10 and explanatory memorandum reviewed","note":"Sets household holding rules and minimum-land policy and directs compensated acquisition/redistribution; explanatory social statistics are the government's own stated rationale."},{"id":"S086","title":"Presidential Decree No. 200/1960 dissolving Masyumi","creator":"Republic of Indonesia; JDIH BPK","date":"17 Aug 1960","url":"https://peraturan.bpk.go.id/Details/150794/keppres-no-200-tahun-1960","kind":"Primary legal record and PDF viewer","access":"Official BPK title, date and file record reviewed; scan viewer did not expose OCR text","note":"Confirms formal decree title/date/action; underlying scan should be retrieved and transcribed before detailed quotation or legal analysis."},{"id":"S087","title":"Presidential Decree No. 201/1960 dissolving the Indonesian Socialist Party (PSI)","creator":"Office of the President of Indonesia; ANRI SIKN image, via Wikimedia Commons","date":"17 Aug 1960","url":"https://commons.wikimedia.org/wiki/File:Keputusan_Presiden_Republik_Indonesia_Nomor_201_Tahun_1960_tentang_Pembubaran_Partai_Sosialis_Indonesia.jpg","kind":"Primary decree scan / archival catalog record","access":"High-resolution image available; Commons metadata attributes source to ANRI SIKN, whose source page was not accessible in this pass; image text not yet transcribed","note":"Treat Commons as an access copy with stated ANRI provenance; verify archival identifier and transcribe image directly before quoting clauses."},{"id":"S140","title":"Ringkasan Eksekutif Hasil Penyelidikan Tim Ad Hoc Penyelidikan Pelanggaran HAM yang Berat Peristiwa 1965-1966","creator":"Komisi Nasional Hak Asasi Manusia (Komnas HAM)","date":"2012; investigator mandate 2008-2012","url":"https://tapol.org/sites/default/files/sites/default/files/pdfs/Komnas%20HAM%201965%20report%20Indonesian.pdf","kind":"Indonesian national human rights commission original investigation executive report (hosted by TAPOL mirror)","access":"Official-authored full executive-report PDF opened; printed pp1 and 116-121,141-144,164-165 and 171 screenshot checked 2026-11-09; sections on Moncongloe, Maumere and Medan read; underlying witness BAPs not obtained","note":"Primary source for Komnas HAM investigative findings but not 1965 contemporaneous order or criminal verdict; Maumere Geliting 500 is one witness estimate; South Sulawesi 9765 is report's approximate arrests by Mar1966; 1970-77 Moncongloe transfer, forced-labor testimony; BAP 35/VIII/2008 and 226/233/II/2009 need originals; figures/temporal conflicts should not be normalized."},{"id":"S152","title":"Telegram 212 from American Consul Surabaya to Djakarta, Joint SITREP 22","creator":"U.S. Consulate Surabaya; RG84 Entry P339 Box14 Folder7","date":"1965-12-27 (received 28 Dec)","url":"https://nsarchive.gwu.edu/media/15722/ocr","kind":"Contemporary U.S. consular report on East Java violence and economic-labor changes","access":"Original three-page HTML OCR read in full; source PDF facsimile not visually verified","note":"Documents attributed NU source on prisoner transfers and killings, reports rice scarcity and 21 Dec textile seizure, and Surabaya state-enterprise hiring preference shift from SOBSI to SARBUMUSI/Army veterans; region-specific field reports, not national administrative orders."},{"id":"S196","title":"Telegram 1290 U.S. Embassy Jakarta to State","creator":"Marshall Green; NARA RG84 P339 Box14 Folder4","date":"1965-11-01","url":"https://nsarchive.gwu.edu/document/15705-document-9-telegram-1290-american-embassy","kind":"Contemporary U.S. ambassador situational report","access":"NSA curator page and full OCR directly opened 2026-11-10; scanned facsimile not yet collated; curator incorrectly locates report in North Sumatra whereas telegram explicitly says Palembang South Sumatra","note":"Reports arrests of PERBUM oil-worker union leaders and senior SOBSI from Shell/Stanvac refineries and PUSRI fertilizer; arrests not employment dismissal tally. Curator's claim that ownership transfer was scuttled requires correction in light of UN S197 and WB S198."},{"id":"S211","title":"Indonesianisasi of Dutch economic interests 1930-1960: the case of Internatio","creator":"Jasper van de Kerkhof, Bijdragen tot de Taal-, Land- en Volkenkunde 161(2/3),181–209","date":"2005","url":"https://brill.com/view/journals/bki/161/2-3/article-p181_1.pdf","kind":"Peer-reviewed Dutch-corporate archival historical reconstruction","access":"Full Brill PDF text pages181-209 read, extensive company archival notes on pp199-205; screenshot endpoint cache miss","note":"GAR Internatio inv.428 (Dec5-6 union-management talks), inv.444 (7 Dec worker takeover, 21 Dec Army control), inv.74 and others (Feb1959 Satya Negara/July firm nationalisation). Corporate side archival provenance and workers' oral testimony limited; actual GAR objects not read."},{"id":"S228","title":"Inventaris Arsip Tekstual Komando Operasi Tertinggi (KOTI) 1963-1967","creator":"Arsip Nasional Republik Indonesia (ANRI)","date":"ANRI public official finding aid; coverage 1963–1967","url":"https://anri.go.id/download/inventaris-arsip-tekstual-komando-operasi-tertinggi-19631967-1586226436","kind":"Official Indonesian national archive detailed catalogue","access":"Official full catalogue PDF text opened; on 2026-11-18 rechecked entry 507 in the online text. Entry 507 title and wording were confirmed; the item itself has not been requested or read.","note":"Finding aid only: item 507 describes a Politburo CC PKI statement about continuing revolutionary offensive in all fields and developing the revolutionary situation to its peak, but gives no date, document text, physical condition, or proven link to the 17 Aug 1965 statement cited by the 1966 self-criticism. Item 515 separately has a date/description conflict; folder contents have NOT been examined."},{"id":"S230","title":"Political Prisoners in Indonesia: Trade Unionists, Index ASA 21/09/77","creator":"Amnesty International, International Secretariat","date":"1977-09-23","url":"https://www.indonesia1965.org/content/uploads/2023/08/ASA-21-09-77-Occupational-list-of-Prisoners-trade-unionists.pdf","kind":"Original 1977 human-rights NGO named political-prisoner dossier","access":"Full scanned primary Amnesty release read; cover image screenshot verified, pp1-2 names and trades","note":"List is Amnesty's contemporaneous attributed report, not court-verified identity or an exhaustive census; arrests, torture and detention conditions need individual court/penitentiary records. Membership figures attributed/approximate."},{"id":"S233","title":"Inventaris Arsip Boven Digoel (1927–1942 and 1954; cover has typographical 1927–1924)","creator":"Inna Mirawati; Arsip Nasional Republik Indonesia","date":"1990","url":"https://www.anri.go.id/download/inventaris-arsip-boven-digoel-1605866328","kind":"Official original-item national archive inventory","access":"Full official PDF text searched; original first page screen viewed; detailed items 91–145 and 269–296 examined as catalogue","note":"Cover prints incorrect 1927-1924; official index dates 1927-1942 &1954. All original prisoner records, work rosters and mail remain unopened; administrator-produced categories need critical reading."},{"id":"S245","title":"The Partai Nasional Indonesia, 1963–1965","creator":"J. Eliseo Rocamora, Indonesia (Cornell SEAP), Vol.10:143–182","date":"1970-10","url":"https://ecommons.cornell.edu/bitstreams/31c2dcdf-f300-43fa-9633-51700117d1de/download","kind":"Peer-reviewed/academic original contemporary-party-paper-based study","access":"Complete published paper text read; source notes to internal party pamphlets and speeches examined; PDF image endpoint unavailable","note":"It is historian's argument with then-available party records, not original PNI National Congress minutes, provincial police logs or independent census."},{"id":"S251","title":"Indonesia–1965: The Coup That Backfired CIA/SRS RSS0033-68","creator":"US CIA Research Staff","date":"1968-12","url":"https://www.cia.gov/readingroom/docs/esau-40.pdf","kind":"Declassified classified US intelligence retrospective","access":"Full 1968 CIA research-study text accessed through the indexed CIA Reading Room PDF. On 2026-11-18 rechecked the title/foreword, printed pp.109–130 on the reported September planning meetings and Dani’s Beijing mission, and the cited Subandrio interrogation footnote. Earlier work reviewed printed pp.25–27, 79–80 and 157–162. CIA direct-file URLs can redirect to the generic Reading Room.","note":"The anonymous December 1968 CIA/SRS report is an intelligence reconstruction, not an independent operational record. Its foreword states that the conspiracy/planning section rests entirely on interrogation of participants; the report’s footnote attributes the January 1965 100,000-light-arms offer to Subandrio’s interrogation report. It interprets several statements as evidence of a near-final deal while conceding that the connection to G30S is unclear. Compare its narrative with Chinese MFA records reported by Zhou (S134), actual flight/cargo/receipt records and the coercion/contradiction issues analyzed by Roosa (S1439). Do not treat its claims as proof of shipment, party-wide authorization or arms use."},{"id":"S283","title":"The Partai Nasional Indonesia 1963-1965","creator":"J. Eliseo Rocamora, Cornell journal Indonesia 10 (1970) 143-182","date":"1970-10","url":"https://ecommons.cornell.edu/server/api/core/bitstreams/31c2dcdf-f300-43fa-9633-51700117d1de/content","kind":"Historical political-party study based on party papers and interviews","access":"Full Cornell PDF text read, pp143-182, specifically pp168-180; screenshot attempt failed due rendition metadata","note":"Scholarly reconstruction cites 1964 Central Java party resolutions, 1965 Book White, party correspondence and press; originals not individually inspected. Includes partisan interpretation and anachronism risk in recalled motives."},{"id":"S337","title":"Indonesian trade unionists, the world federation of trade unions and cold war internationalism, 1947-65","creator":"Vannessa Hearman / Labour History","date":"2016","url":"https://researchers.cdu.edu.au/en/publications/indonesian-trade-unionists-the-world-federation-of-trade-unions-a/","kind":"Peer-reviewed scholarly article","access":"Institutional publication metadata and full abstract read; article body NOT accessed","note":"Abstract argues SOBSI international work served diplomacy, domestic left politics, and member education; full text and archival footnotes pending."},{"id":"S344","title":"Gambaran Kepentingan Politik Kelompok Komunis di Indonesia: Pemogokan Buruh di Delanggu 1948","creator":"Dyah Ayu Anggraheni Ikaningtyas / SOCIA UNY","date":"2013","url":"https://journal.uny.ac.id/index.php/sosia/article/download/5337/4640/13708","kind":"Peer-reviewed local historical study","access":"Full original journal PDF opened and read all nine pages; ANRI archival items cited but originals NOT opened","note":"Printed pp5-7 cite ANRI Koleksi Kepolisian Negara No.1215 and No.342; interpretation of PKI motivation is author's argument; 1948 contemporary files and KKA circular still unverified."},{"id":"S347","title":"Inventaris Arsip Kepolisian Negara RI 1947–1949","creator":"Widiyanti / Arsip Nasional Republik Indonesia","date":"1995","url":"https://www.anri.go.id/download/ra-26.-inventaris-arsip-tekstual-sekretariat-negara-kepolisian-negara-ri-19471949-1714018366","kind":"Official archival finding aid","access":"Full official ANRI Police inventory opened; Madiun-related items 199, 703, 704 and 705 checked.","note":"Finding aid only. Item 199 catalogs Interior Ministry tasking to Bambang Soepeno; 703 a Solo order (disguised-Siliwangi wording is catalog language); 704–705 catalog broadcasts/transmitter request. Originals not opened."},{"id":"S348","title":"Perseteruan Front Demokrasi Rakyat (FDR) dan Kabinet Hatta Pada Peristiwa Delanggu (1948-1949)","creator":"Syarif Cahyo Nugroho / UIN Syarif Hidayatullah Jakarta","date":"2024","url":"https://repository.uinjkt.ac.id/dspace/bitstream/123456789/79105/1/SS23085.pdf","kind":"Undergraduate historical thesis","access":"Full 116-page PDF opened; relevant pp.72-74 read","note":"Secondary thesis; parliamentary motions are quoted from later histories rather than KNIP minutes; politically loaded framing in abstract is author interpretation, not verified motive."},{"id":"S349","title":"Sartono, Meester in de Rechten di Kursi Pertama Ketua Parlemen Indonesia","creator":"Muhammad Yasin / Hukumonline","date":"2019-12-10","url":"https://www.hukumonline.com/berita/a/sartono--imeester-in-de-rechten-i-di-kursi-pertama-ketua-parlemen-indonesia-lt5dee18e79d5af/?page=all","kind":"Retrospective legal-history biography","access":"Full web article opened; lines 149-177 inspected","note":"Independent retrospective corroboration of July 1948 Sartono inquiry chair; original BP-KNIP records still absent. Article internally contradicts itself: claims Sartono died 1958 while describing his 1960 resignation; do not adopt death date."},{"id":"S350","title":"Mr. Sartono: Karya dan Pengabdiannya","creator":"Nyak Wali A.T.; Departemen Pendidikan dan Kebudayaan RI","date":"1985","url":"https://upload.wikimedia.org/wikipedia/commons/b/b2/Mr._Sartono_Karya_dan_Pengabdiannya_%281985%29.pdf","kind":"Government-published retrospective biography","access":"Full 1985 book PDF opened; chapter VI printed pp.108-110 and biographical appendix pp.114-115 directly read","note":"Primary published 1985 text, not 1948 KNIP minutes. Printed p108 confirms July 1948 inquiry and Hatta-mediated meeting; appendix p115 repeats inquiry. Book itself contains potentially inaccurate chronology about 1960 DPR-GR; separate contemporaneous verification needed."},{"id":"S358","title":"Renegotiating the Postcolonial Workplace: Indonesian Dockworkers in 1950","creator":"John Ingleson; Indonesia 102; Cornell University eCommons","date":"2016-10","url":"https://ecommons.cornell.edu/bitstreams/c0ca72f5-62f9-481d-8d89-ac1e9dbf3458/download","kind":"Scholarly historical article with labor, company, government and press sources","access":"Full PDF opened directly 2026-11-12; relevant sections read on harbor labor structure, Belawan and Semarang strikes, and the 13 February 1951 measure; not a cover-to-cover reread","note":"Secondary research citing contemporary newspapers, Netherlands National Archives, ANRI and company records; original 1948 Labor Inspectorate report, port collective agreements and February 1951 military regulation were not all directly obtained in this pass. Cornell publication record: https://ecommons.cornell.edu/entities/publication/499cae66-b2c2-4137-8e11-58c59b1b1ae5; crowd counts, wages and quoted legal chronology require primary cross-check."},{"id":"S369","title":"Boven Digoel: Projecting a New Society","creator":"Yamamoto Nobuto; Southeast Asian Studies (Kyoto University) 14(1)","date":"2025-04-24","url":"https://englishkyoto-seas.org/2025/04/vol-14-no-1-yamamoto-nobuto/","kind":"Open-access scholarly archival and press study","access":"Full publisher HTML article opened; introduction and detention totals and colonial newspaper sections inspected","note":"Traces 1926-27 Dutch crackdown and Boven Digoel banishment through Sin Jit Po and Pewarta Deli; arrest and exile figures are reported from cited scholarship, not verified original prisoner register or court cases."},{"id":"S381","title":"Release Prisoners Of Conscience Now! - Indonesia’s Prisoners","creator":"Human Rights Watch and Amnesty International","date":"1998-06","url":"https://www.hrw.org/legacy/reports/reports98/indonesia/indo1-1.htm","kind":"Contemporaneous joint NGO report, retrospective case compilation","access":"Full publicly accessible section I HTML opened 2026-11-10","note":"Named 1997 PRD/SMID/PPBI/STN sentences and March 1998 SBSI protest arrests; court judgments and release records not inspected; organizations are not assumed to be direct PKI successors."},{"id":"S419","title":"Pernyataan Pers Presiden Republik Indonesia pada 11 Januari 2023 tentang 12 peristiwa pelanggaran HAM berat masa lalu","creator":"Indonesian Cabinet Secretariat; official Joko Widodo presidential transcript","date":"2023-01-11","url":"https://setkab.go.id/pernyataan-pers-presiden-ri-di-istana-merdeka-provinsi-dki-jakarta-11-januari-2023/","kind":"Contemporaneous public head-of-state admission of past serious human-rights violations","access":"Complete official Indonesian transcript opened, indexed official state translation crosschecked, original audio or PPHAM investigative report not opened","note":"Names 1965-66 as first of 12 gross rights violation episodes, presidential regret and promise of rights restoration and prevention without denying possible judicial resolution; speech is institutional recognition, not per-person perpetrator verdict or criminal conviction."},{"id":"S422","title":"Catatan Akhir Tahun 2024 Hak Asasi Manusia di Indonesia","creator":"Komisi Nasional Hak Asasi Manusia (Komnas HAM)","date":"2024-12-10","url":"https://www.komnasham.go.id/files/20241210-catatan-akhir-tahun-2024-hak-asasi-%24WSV79CZD.pdf","kind":"Original 2024 national rights commission annual review and service metrics","access":"Complete official PDF text available and relevant judicial investigation and SKKPHAM paragraph read; web screenshot original blocked403, not visually audited","note":"At 2024 year end Komnas HAM reported 13 investigated gross violations referrals to Attorney General without new judicial follow-through and 2024 Jan-Nov 725 SKKPHAM victim status letters of which 598 for 1965/66; letters not compensation and year not lifetime total."},{"id":"S459","title":"Program Gerwani approved at fourth national congress 14-17 December 1961","creator":"DPP Gerwani","date":"1961-12-14/17","url":"https://gerwani.logosid.app/teks/42","kind":"Contemporaneous organizational program; later digitized transcription","access":"Full digital text opened 2026-11-11; printed facsimile not inspected","note":"Program claims and demands are not evidence of implementation; transcription contains inconsistent legal citation No 68/1958 versus No 68/1959; check original."},{"id":"S467","title":"ILO Committee on Freedom of Association: GB.270/7 paragraphs 425-442","creator":"International Labour Organization Governing Body","date":"1997","url":"https://webapps.ilo.org/public/english/standards/relm/gb/docs/gb270/gb-7.htm","kind":"ILO supervisory primary institutional record","access":"Full HTML relevant paragraphs 425-442 opened 2026-11-11","note":"Reports Indonesian government assertions on 1994 Medan arrests and Marsinah; committee explicitly requests independent investigation; does not prove who murdered Marsinah."},{"id":"S484","title":"86th International Labour Conference, Committee on the Application of Standards: Indonesian Government statement on Convention No. 87 and PER-05/MEN/1998","creator":"International Labour Organization; Indonesian Government representative","date":"1998-06","url":"https://webapps.ilo.org/public/english/standards/relm/ilc/ilc86/com-apd4.htm","kind":"Official ILO conference proceedings recording a government statement","access":"Full English HTML read, lines 524-529","note":"The representative stated that PER-05/MEN/1998, dated 27 May 1998, cancelled PER-03/MEN/1993 and allowed union registration at company level; she said this enabled SBSI's recognition. Record these as a contemporaneous government statement, not as an independent audit or a substitute for the missing PER-05 original."},{"id":"S485","title":"GB.275/4/1E, 316th Report of the Committee on Freedom of Association, Case No. 1773 (Indonesia)","creator":"International Labour Organization; Committee on Freedom of Association","date":"1999-06","url":"https://webapps.ilo.org/public/french/standards/relm/gb/docs/gb275/gb-4-1e.htm","kind":"Official ILO interim supervisory report, French-language edition","access":"Full French HTML read, paras. 570-617; translated claims are attributed separately to complainants, Government, or Committee","note":"Records the 1999 Government reply, local registration disputes, military-interference allegations and denials, the Committee's treatment of unresolved contradiction, SBSI registration and Dita Sari's then-current detention. Translation from French is recorded in the claim ledger; underlying company, court and administrative files remain missing."},{"id":"S493","title":"Inventaris Arsip Tekstual Boven Digoel (1927-1942 & 1954)","creator":"Inna Mirawati; Arsip Nasional Republik Indonesia (ANRI)","date":"1990","url":"https://www.anri.go.id/download/inventaris-arsip-boven-digoel-1605866328","kind":"Official archival finding aid","access":"ANRI PDF and catalog page opened; full finding aid read","note":"Catalogs Boven Digoel holdings including individual and family lists (nos.98-105), police and shipping instructions (216-217), a secret 18 February 1927 letter recording allegations of transnational communist contacts (254), birth and death registers (267,269), and labor/attendance records (271-296). Catalog entries establish that records are described, not their contents. The cover OCR has an apparent date typo; official catalog and internal text give 1927-1942 and 1954."},{"id":"S495","title":"Naskah Sumber Arsip Citra Daerah Provinsi Papua dalam Arsip","creator":"Arsip Nasional Republik Indonesia","date":"undated","url":"https://www.anri.go.id/download/naskah-sumber-arsip-citra-daerah-provinsi-papua-dalam-arsip-1586333524","kind":"Official archival sourcebook / finding aid","access":"ANRI web PDF text extraction read, printed pp.131-132; direct PDF download returned 403","note":"Describes Boven Digoel no.200 as four sheets, no.102 as a release list including Hatta, Sjahrir and Bondan, Binnenlandsbestuur no.1308 as W.P. Hillen's 1930 camp report (37 sheets), and no.210 as a supervisor diary on camp tasks (106 sheets). Finding-aid text only; none of those original records were read."},{"id":"S497","title":"Boven-Digoel: Projecting a New Society","creator":"Yamamoto Nobuto; Southeast Asian Studies 14(1), pp.87-107","date":"2025-04-24","url":"https://englishkyoto-seas.org/2025/04/vol-14-no-1-yamamoto-nobuto/","kind":"Peer-reviewed scholarly article","access":"Full HTML and PDF opened and read","note":"Uses Sin Jit Po and Pewarta Deli reporting to reconstruct exile transports and selected biographies; also reports Sukarno's 1933 confidential letter citing Hering. The underlying newspaper issues and Sukarno letter were not opened; these details remain attributed to Yamamoto and its cited sources."},{"id":"S499","title":"Indonesische overpeinzingen (under pseudonym Sjahrazad), III. Boven-Digoel","creator":"Sutan Sjahrir; DBNL digital edition of 1945 book","date":"1945 edition; letters dated March 1935","url":"https://www.dbnl.org/tekst/sjah001indo01_01/sjah001indo01_01_0004.php","kind":"First-person published letters / autobiographical account","access":"Full Dutch chapter text opened and read; letters dated 7, 9, 15 and 27 March 1935","note":"Sjahrir's first-person description of camp boundaries, exile-led village administration, paid work, subsistence and perceived pressure to work. It is an individual account from 1935, not a census, administrative order or direct witness to 1927 transports."},{"id":"S502","title":"Indisch Verslag 1931: Verslag van Bestuur en Staat van Nederlandsch-Indië","creator":"Government of the Netherlands Indies; Leiden University/KITLV digital collection","date":"1931","url":"https://kitlv-docs.library.leiden.edu/open/Metamorfoze/Indisch%20Verslag/MMKITLV01_PDF_TS2710_1931.pdf","kind":"Official colonial-government annual report","access":"Full 1931 PDF opened; Boven-Digoel section and printed page 56 read","note":"Reports W.P. Hillen's 1930 investigation, immediate revocation of 219 internments, 186-person B-group release on 18 June 1931, official classifications for continued observation, and 1 April 1931 population counts. These are government-reported decisions, classifications and counts, not independent assessments of conditions or release fairness."},{"id":"S504","title":"Handelingen der Staten-Generaal 1930-1931, Tweede Kamer, 8ste vergadering, 21 October 1930: interpellation concerning the Hillen report","creator":"Dutch House of Representatives; official parliamentary transcript","date":"1930-10-21","url":"https://repository.overheid.nl/frbr/sgd/19301931/0000044950/1/pdf/SGD_19301931_0000260.pdf","kind":"Official parliamentary verbatim proceedings","access":"Full PDF opened; interpellation and Minister de Graaff's answer read","note":"Records Cramer's account of the Hillen report, his questions about 412 proposed releases, health conditions and unequal regional referral rates, and the Colonial Minister's counterargument that lists and inquiries were reviewed through central administrative bodies. It is a debate record and does not independently establish the underlying counts or every case file."},{"id":"S505","title":"De worsteling van de Nederlandse autoriteiten met het communisme in Nederlands-Indië","creator":"J.C.M.Q. Kaulingfreks; Radboud University","date":"2019-08","url":"https://theses.ubn.ru.nl/server/api/core/bitstreams/34306b6e-ab3f-407c-b6b4-6ea2d07ed0a4/content","kind":"Master's thesis in history; secondary synthesis with archival-citation apparatus","access":"Full PDF opened; title page, pp.26-27 and footnotes 92-103 read","note":"Reports 1926 decision-making and 1930 Hillen review through published documentary sources and National Archives references; underlying correspondence and Hillen report not accessed. Body calls Hillen report March 1930 while its cited title gives 22 July 1930."},{"id":"S506","title":"Handelingen van het College van Gedelegeerden, zittingsjaar 1937-1938, 16de vergadering, 5 January 1938, petition no.17","creator":"College van Gedelegeerden; official proceedings","date":"1938-01-05","url":"https://kitlv-docs.library.leiden.edu/open/TS/volksraad/1937-38-3.pdf","kind":"Official parliamentary/legislative proceedings; primary transcript","access":"Full PDF opened; printed pp.163-164, second report of the Petition Committee, read","note":"Records the 45-person petition, parliamentary statements and procedural disposition. Speakers' factual allegations and cited 2,100 figure are not independently verified; original petition and cited government letters not obtained."},{"id":"S507","title":"Boven-Digoel","creator":"L.J.A. Schoonheyt, government physician (arts)","date":"1936","url":"https://www.papuaerfgoed.org/sites/default/files/collectie/files/2004-09/schoonheyt_1936_digoel.pdf","kind":"Contemporary firsthand narrative by colonial government physician; not a formal administrative report","access":"Full 277-page scan downloaded and OCR text searched; title and printed pp.150-157, 188, 258-269 read; pp.153-154, 256 and 266 visually checked","note":"Author says he served almost two years as government doctor at Tanah-Merah and openly defends the camp commandant, government policy and colonial hierarchy. Strong for the account he gives, not neutral or representative. Image check corrects OCR '1937' to printed '1927'."},{"id":"S828","title":"Kenang-kenangan Kongres Gerwis ke-2, 25-31 Maret 1954","creator":"DPP Gerwani; second Gerwis congress","date":"1954","url":"https://pustaka.taratsa.id/read/618/ocr/pdf/","kind":"Contemporaneous organizational congress commemorative booklet and adopted statutes","access":"Full OCR text opened; original page images not checked; OCR errors remain possible.","note":"Firsthand published organizational document: congress proceedings, resolutions and 1954 statutes. OCR passages were read at lines 286-306, 819-843, 1057-1145 and 1494-1535; original page images have not been checked. Claims about finance, attendance and membership are organization self-report, not independently audited."},{"id":"S837","title":"An Early Account of the Independence Movement (Semaun report translated by Ruth McVey)","creator":"Semaun; Ruth T. McVey translator and editor","date":"1922 original; 1966 English translation","url":"https://ecommons.cornell.edu/bitstreams/a26846c6-5326-4b05-b2ca-6a48749d4fe8/download","kind":"Contemporaneous movement leader report in later translated scholarly edition","access":"Full 30-page PDF text opened 2026-11-12; pp. 51 and 59-63 examined","note":"1922 Russian congress publication translated into English in 1966 via intervening languages; original language and membership/strike counts require independent verification; participant partisan account; editor notes transcription errors."},{"id":"S845","title":"From Travel to Imprisonment: Remembering Cold War Trade Unionism and the WFTU in Adam Soepardjan's Prison Notebooks","creator":"Vannessa Hearman, International Review of Social History","date":"2024 online publication","url":"https://doi.org/10.1017/S0020859024000580","kind":"Peer-reviewed open-access historical article","access":"Publisher's complete PDF located; relevant sections on colonial/postwar union history, SOBSI, WFTU, 1950s federation plurality and Soepardjan read","note":"The article synthesizes earlier labor scholarship and uses Adam Soepardjan's 1959 travel accounts and 1975–1976 prison notebooks. Exact 1931 membership estimates and later union counts are cited through prior scholarship rather than independently reconstructed in this pass; Soepardjan's notebook originals were not opened."},{"id":"S846","title":"The Political Character of the Indonesian Trade Union Movement","creator":"Iskandar Tedjasukmana; Cornell University Modern Indonesia Project, Southeast Asia Program","date":"1958","url":"https://pustaka.taratsa.id/files/687/pdf/1761209224-20782754/250f9362d33f1c093d3e808e0c51e89d/The%20Political%20Character%20of%20the%20Indonesian%20-%20Tedjasukmana.pdf","kind":"Contemporary monograph and organizational survey by an Indonesian labor politician","access":"Digitized monograph sections on 1945–1957 union formation, political alignments, federation membership and institutional history read; Cornell catalog record cross-checked","note":"A near-contemporary source written by a former Minister of Labor and Labor Party official, with direct knowledge and political commitments. Membership counts are declared or attributed, not audited census totals; the book's political classifications and retrospective organizational history should be compared with union statutes, minutes and government records."},{"id":"S889","title":"Translating and Transliterating Marxism in Indonesia","creator":"Oliver Crawford; Modern Asian Studies 55(3), pp.697–733","date":"2021","url":"https://www.cambridge.org/core/services/aop-cambridge-core/content/view/8C92D9F2AAC5AE1097BAAC3C5E6FABAC/S0026749X20000104a.pdf/translating_and_transliterating_marxism_in_indonesia.pdf","kind":"Peer-reviewed open-access scholarly article","access":"Complete 37-page PDF opened; relevant sections on 1914 ISDV, Sarekat Islam, the 1920 party, 1921 split, Indonesian Marxist vocabulary and Sukarno’s 1926 essay read 2026-11-12","note":"Later scholarly reconstruction citing party press and writings. It supports the author’s discussion and the documents he cites, not independent proof of every historical claim; pursue cited original issues and pamphlets."},{"id":"S890","title":"Soeara Ra'jat, No. 3 (10 April 1920)","creator":"ISDV; editors Darsono and J. A. Dengah","date":"1920-04-10","url":"https://marxists.architexturez.net/indonesia/indones/Suara%20Rakyat/19200410%20Suara%20Rakyat.pdf","kind":"Contemporary newspaper issue; third-party digital facsimile/transcription","access":"Web text extraction opened; masthead, date, editors and first-page strike report read. PDF screenshot failed with HTTP 526; direct local retrieval was blocked.","note":"The issue identifies itself as ISDV’s organ. Its reports and appeals establish what this newspaper published, not independent verification of each strike detail or the editorial’s characterization of employers/government. Locate an institutional copy or microfilm for image-level comparison."},{"id":"S891","title":"Soeara Ra'jat, Tahun ke-4 No. 8 (30 April 1921)","creator":"Vereniging van Spoor-en Tramweg Personeel; editor Partondo; published at VSTP Semarang","date":"1921-04-30","url":"https://commons.wikimedia.org/wiki/File:Soeara_Ra%27jat_30_April_1921.pdf","kind":"Contemporary newspaper issue; digitized 8-page scan hosted by Wikimedia Commons","access":"Complete eight-page PDF downloaded; all pages visually reviewed; page 1 and pages 4–6 read at high resolution. English-only OCR produced no usable text. Selected Malay passages manually read; no diplomatic transcription made. Wikimedia Commons traces the scan to marxists.org.","note":"The scan directly shows the printed issue, not the accuracy of its political claims or the representativeness of the Semarang branch. Old Malay spelling and some damaged page areas limit exact translation. Compare with institutional copies and the IISH periodical holdings guide."},{"id":"S894","title":"Soeara Ra'jat, year 4 no.9 (16 May 1921), front-page reproduction","creator":"Soeara Ra'jat; article by Tan Malaka; reproduction credited to Harry A. Poeze","date":"1921-05-16","url":"https://commons.wikimedia.org/wiki/File:Soeara_Ra%27jat,_Tan_Malaka_-_Sovjet_atau_Parlement%3F.jpg","kind":"Reproduction of a contemporary newspaper front page embedded in a later scholarly biography; digital image on Wikimedia Commons","access":"Full-resolution 1,765×1,559 image downloaded and visually reviewed 2026-11-12. Page visibly identifies no.9, 16 May 1921, and the first installment of “Sovjet atau Parlement?” by Malaka; text includes “Deli, Juni 1920.”","note":"Commons identifies Poeze 1976, p.135 as the source of this reproduction. It is one reproduced page, not a digitized complete issue or independent scan from an institutional 1921 newspaper holding. Exact transcription and translation of the article remain open."},{"id":"S895","title":"Tan Malaka: strijder voor Indonesië's vrijheid: Levensloop van 1897 tot 1945, chs. IV–V","creator":"Harry A. Poeze; Brill / KITLV, volume 78","date":"1976","url":"https://brill.com/display/book/9789004287099/BP000006.pdf","kind":"Scholarly biography with archival citations and reproduced newspaper image","access":"Open-access PDF opened; relevant chapter IV pp.76–113 and chapter V pp.114–181, including printed pp.121–133, 135, 169–170 and notes 37–38, 48 and 73, reviewed 2026-11-12. Reports “S.I. Semarang dan Onderwijs” in Soeara Ra’jat nos.18 (1 Oct 1921, pp.3–5) and 20 (1 Nov 1921, pp.1–4), the December pamphlet, and the school’s growth; also reports the “Sovjet atau Parlement?” serialization.","note":"A later scholarly reconstruction using contemporary press, correspondence, memoirs and a brochure copy; the cited newspaper issues and colonial correspondence have not individually been opened. The school narrative says 50 pupils at opening, 80 within a month and 123 in August, while note 13 says 64 on 30 June; retain this internal count discrepancy. Poeze says he could not locate the original “Sovjet atau Parlement?” pamphlet. Enrollment and print-run figures are not independently audited."},{"id":"S913","title":"“Bound Hand and Foot”: Railway Workers and the 1923 Strike in Java","creator":"John Ingleson, Indonesia 31, Cornell University digital repository","date":"1981","url":"https://ecommons.cornell.edu/bitstream/1813/53721/1/INDO_31_0_1107015193_53_87.pdf","kind":"Peer-reviewed historical article using colonial records and newspapers","access":"Full article opened online; chronology and strike analysis read 2026-11-14","note":"Reconstructs the VSTP strike and repression; underlying Dutch archival files are cited by the article and were not all read independently."},{"id":"S932","title":"Women Write to Us From Everywhere","creator":"Darmini; Women of the Whole World","date":"1954-09","url":"https://gerwani.logosid.app/teks/3","kind":"Contemporaneous Gerwani officer letter; later digital transcription","access":"Full transcription opened 2026-11-15; original September 1954 issue p18 not scanned/checked","note":"Darmini reports Monica Felton (WIDF) and Dutch, Australian and Soviet women delegates at Gerwani congress and local visits. First-person organizational claim, not independent confirmation of each visit or its effects."},{"id":"S1212","title":"Behind the Banner of Unity: Nationalism and Anticolonialism among Indonesian Students in Europe, 1917–1931","creator":"Klaas Stutje; University of Amsterdam dissertation","date":"2016","url":"https://pure.uva.nl/ws/files/2806111/174460_Stutje_Thesis_complete_.pdf","kind":"Historical dissertation using Dutch and Comintern archival records","access":"Full PDF opened and read; pp.127–130 and 140–141 checked, including footnotes citing Dutch National Archives and IISH Comintern files.","note":"Secondary reconstruction. Several cited police reports, correspondence and the Hatta–Semaoen agreement itself were not independently read; quotations and the agreement’s meaning require those records."},{"id":"S1213","title":"(Un)preparing a Revolution: The Comintern in the Prelude to the 1926–1927 Uprisings in Indonesia","creator":"Kankan Xie; chapter in The Russian Revolution in Asia: From Baku to Batavia","date":"2021; pp.122–137; DOI 10.4324/9780429352195-10","url":"https://www.researchgate.net/publication/358579518_2021_KankanXIE_UnPreparing_a_Revolution_The_Comintern_in_the_Prelude_to_the_1926-1927_Uprisings_in_Indonesia","kind":"Scholarly book chapter with Comintern archival citations","access":"Chapter metadata and indexed full-text excerpts reviewed; exact notes for Folders 2 and 32 and the 3 June 1926 Semaoen paper were checked. Full chapter PDF was not obtained in this access path.","note":"The chapter cites archival documents, but the underlying IISH/RGASPI items were not read here. Its interpretation of Comintern debates should not be treated as the documents themselves."},{"id":"S1238","title":"The Soviet View of the Indonesian Revolution: A Study in the Russian Attitude Towards Asian Nationalism","creator":"Ruth T. McVey; Cornell Modern Indonesia Project","date":"1957","url":"https://pustaka.taratsa.id/files/645/pdf/1761012270-14440839/2307a79d5c6866192d8c8fdc79c1955e/The%20Soviet%20view%20of%20the%20Indonesian%20revoluti%20-%20Ruth%20Thomas.%20McVey.pdf","kind":"Scholarly monograph","access":"Full PDF opened/read via a non-institutional mirror; bibliographic details cross-checked against Columbia, Cornell and Smithsonian catalog records.","note":"McVey describes Soviet views and the 1948 return; she notes the documentary base was sparse and sometimes unreliable and relies partly on later PKI reprints. Secondary synthesis, not a primary instruction or independent verification of every reported event."},{"id":"S1240","title":"From Russia with Love?","creator":"John T. Sidel; Indonesia 84 / Cornell eCommons","date":"2007-10; pp.161–172","url":"https://ecommons.cornell.edu/entities/publication/94fbdf4f-147e-443c-bfbf-2f858df3c291","kind":"Scholarly review essay of Larisa Efimova’s book","access":"Full PDF opened/read; Cornell metadata page available.","note":"A review of Efimova rather than an independent archival investigation. Sidel reports Efimova’s use of CPSU CC foreign-relations files and Musso documents, and notes bureaucratic filtering and absent Dutch/Chinese records. Interpretive conclusions should be attributed to Efimova as presented by Sidel."},{"id":"S1243","title":"Stalin and Indonesia: Soviet Policy towards Indonesia: Unknown Pages","creator":"Larisa M. Efimova; LAP Lambert Academic Publishing","date":"2014; ISBN 9783659606045; 184 pp.","url":"https://www.scribd.com/document/852608899/Larisa-Efimova-Stalin-and-Indonesia-Soviet-Policy-Towards-Indonesia-Unknown-Pages-lap-LAMBERT-Academic-Publishing-2014","kind":"Scholarly monograph based on Russian archival research","access":"Full third-party hosted scan read; bibliographic details checked against publisher/book catalog records.","note":"The author cites RGASPI and AVP RF records, but the archive originals were not read here. The author herself describes the surviving files as fragmented and chronologically disconnected. Scan host is not the publisher or archive."},{"id":"S1244","title":"The Communist Party of Indonesia and the Comintern","creator":"Joop Morriën; Mete Tunçay archival collection / TUSTAV mirror","date":"Undated; text notes author consulted Comintern/CPN materials in 1989 and PKI materials in 1991","url":"https://filedn.eu/lpwTKmJuSKCLNjzDCWvh2dm/arsiv/mete-tuncay-arsivi/MT_67.3.3.pdf","kind":"Archival-based scholarly working paper","access":"Full 16-page PDF opened/read.","note":"Author reports access to party and Comintern files, but the individual underlying originals were not read. Some claims rely on his own earlier articles; coded names and undocumented archival details require checking against current RGASPI/IISH holdings."},{"id":"S1245","title":"The Military Aspects of the Madiun Affair","creator":"David Charles Anderson; Indonesia 21 / Cornell eCommons","date":"1976-04; pp.1–63 (page ranges vary in citations)","url":"https://ecommons.cornell.edu/bitstreams/eacc83ca-4b50-497d-a1be-d812f7dba8/download","kind":"Scholarly article based on military and regional records","access":"Full Cornell PDF opened/read in prior research.","note":"Challenges a simple national command narrative and details military actions. Its footnote on an alleged 17 September Cochran–Sukarno–Hatta U.S.-aid bargain rests on oral information relayed by Ruth McVey and Anderson’s inference, not direct State Department proof."},{"id":"S1254","title":"Estranged Comrades: Global Networks of Indonesian Communism, 1926–1932","creator":"Kankan Xie; UC Berkeley PhD dissertation / eScholarship","date":"2018-12","url":"https://escholarship.org/content/qt79314435/qt79314435_noSplash_9d6291f52fdd834cfed0948ddb860281.pdf","kind":"Scholarly dissertation based on Comintern, Dutch and British archival research","access":"Full official eScholarship PDF opened/read; chapter on Comintern and Alimin/Musso trip and arrest reviewed.","note":"Cites IISH ARCH01744, Comintern minutes and retrospective accounts; most underlying archival items not read directly. Treat dates and institutional conclusions as Xie’s reconstruction, not direct primary text."},{"id":"S1255","title":"Menggugat Peristiwa Madiun: Pembelaan D.N. Aidit di muka sidang Pengadilan Negeri Djakarta","creator":"Dipa Nusantara Aidit; 1963 fourth printing of a 1955 courtroom defense text, Jajasan Pembaruan","date":"Speech delivered 1955-02-24; online text cites 1963 fourth printing","url":"https://www.marxists.org/indonesia/indones/1955-AiditMenggugatPeristiwaMadiun.htm","kind":"Political defense speech / near-contemporary primary testimony","access":"Full Indonesian transcription opened/read; page identifies its source as the 1963 fourth printing. The scan link and original 1955 court transcript/audio were not inspected.","note":"Aidit was an interested party speaking in a political prosecution and defending PKI/FDR. Use for what he argued and his chronology claim that Musso and other leaders were absent during initial local actions, not as neutral proof of command or responsibility."},{"id":"S1266","title":"Remembering and Forgetting Indonesia’s Madiun Affair: Personal Narratives, Political Transitions, and Historiography, 1948–2008","creator":"Akiko Sugiyama; Indonesia 92","date":"2011-10; pp.19–42","url":"https://ecommons.cornell.edu/entities/publication/4f04adc8-db9c-4557-a900-1728011ec41c","kind":"Peer-reviewed historiographical article","access":"Full text read previously; current PDF open rate-limited.","note":"Full PDF read earlier; Cornell record checked again; current PDF open rate-limited."},{"id":"S1269","title":"Republik Indonesia: Propinsi Djawa Timur","creator":"Pemerintah Republik Indonesia","date":"1953","url":"https://id.wikisource.org/wiki/Halaman:Republik_Indonesia,_Propinsi_Djawa_Timur.pdf/85","kind":"Official retrospective regional history","access":"Digitized p.85 directly reviewed.","note":"Digitized p.85 directly reviewed."},{"id":"S1287","title":"De Madioen Affaire","creator":"Sumarsono / Dutch detention-investigation file as cited by Sugiyama and Poeze","date":"1949-11-11 (date in later scholarship)","url":"https://ecommons.cornell.edu/entities/publication/4f04adc8-db9c-4557-a900-1728011ec41c","kind":"Unpublished report / retrieval lead","access":"Unpublished report not obtained; identified via secondary citations.","note":"Original report and Dutch file not obtained."},{"id":"S1310","title":"Guerrillas, Guns, and Knives? Debating Insurgency in South Blitar, East Java, 1967–68","creator":"Vannessa Hearman; Indonesia 89","date":"2010-04","url":"https://hdl.handle.net/1813/54511","kind":"Peer-reviewed scholarly article; oral-history and military-history reconstruction","access":"Full article PDF opened from Cornell eCommons; printed pp.71–85, especially 72–84 and 79–82, and notes on leadership clusters, Emergency CC, three-person cells, weapons, local violence and Trisula operations reviewed again on 2026-11-19.","note":"Reconstructs the underground PKI through survivor interviews, the Indonesian Social History Institute interview collection, Rewang, Munir's later defense statement, memoirs, a USAF/RAND-sponsored Pauker report and the Army history Operasi Trisula. No original PKI leadership minutes, local party rosters, Pauker report, underlying unit orders or complete interview recordings were independently inspected. Testimonies diverge by role and legal risk; Hill 2020 cites this article for domestic Emergency CC chronology and is not independent corroboration."},{"id":"S1329","title":"The Indonesian Revolution and the Immediate Tasks of the Communist Party of Indonesia","creator":"Dipa Nusantara Aidit; report to the First Plenary Session of the Seventh CC, published by Foreign Languages Press/Peking Review","date":"1963-02-10 report; English collection 1964","url":"https://www.marxists.org/history/indonesia/1963-AiditIndonesianRevolution.htm","kind":"Contemporaneous party leadership political report / primary programmatic text in English translation","access":"Full digital English text read 2026-11-17; publication metadata cross-checked against Peking Review and book catalogue records","note":"A public programmatic statement and retrospective account of PKI rebuilding after 1950, not an internal operational order. It shows what Aidit said the party line and organizational problems were; do not treat rhetoric as proof of implementation or arms."},{"id":"S1358","title":"The Rise and Fall of the Communist Party of Indonesia","creator":"Guy J. Pauker; RAND Corporation","date":"1969-02","url":"https://www.rand.org/pubs/research_memoranda/RM5753.html","kind":"RAND research memorandum RM-5753-PR prepared for U.S. Air Force Project RAND","access":"Official RAND bibliographic page and complete PDF scan reopened; printed pp.61–62 visually checked on 2026-11-19, including p.62’s South Blitar casualty paragraph and footnote 71.","note":"RAND’s abstract advances a strongly pro-Army account of Aidit’s responsibility and the October killings. On printed p.62 Pauker says Hutapea and Rewang were killed and gives about 2,000 underground PKI members/leaders killed in summer 1968, citing NYT reports of July 12 and October 29. The Rewang fate statement is contradicted by his arrest, trial, imprisonment and 1991 release documented by Hearman, TAPOL and Amnesty; the casualty paragraph supplies no roster or count method. U.S. Air Force Project RAND sponsorship establishes an analytical funding channel, not covert action or the report’s access to underground records."},{"id":"S1363","title":"TAPOL Bulletin No. 53: Spotlight on Two Tapols","creator":"TAPOL; British Campaign for the Defence of Political Prisoners and Human Rights in Indonesia","date":"1982-09","url":"https://vuir.vu.edu.au/26304/1/TAPOL53_compressed.pdf","kind":"Issue of a political-prisoner advocacy bulletin","access":"Full 24-page repository PDF opened; pp.19–20 read","note":"Contemporary advocacy account drawing on reports and correspondence. Its statements about Munir and Ruslan's cases and trials are not substitutes for court records; its descriptions of their SOBSI titles differ in wording/timing from later scholarship."},{"id":"S1394","title":"Contesting Victimhood in the Indonesian Anti-Communist Violence and Its Implications for Justice for the Victims of the 1968 South Blitar Trisula Operation in East Java","creator":"Vannessa Hearman; Journal of Genocide Research 19(4), 512–529","date":"Published online 2017-12-22","url":"https://espace.curtin.edu.au/bitstream/handle/20.500.11937/86868/86712.pdf?sequence=2","kind":"Peer-reviewed scholarly article combining oral histories, military records and memory analysis","access":"Full 2017 article PDF and notes read 2026-11-17; casualty and Trisula passages on printed p.519 rechecked against the accessible article record on 2026-11-19. DOI metadata checked.","note":"On printed p.519 the article states 2,000 killed and thousands detained/displaced, citing NYT 11 Aug 1968 at note 37; its discussion also uses the Army’s reported deployment of 5,000 soldiers and 3,000 militiamen. The original NYT report and underlying operation roster were not accessed. Distinguish the article’s wording from later Hearman summaries that describe the NYT figure as captured or killed."},{"id":"S1417","title":"Letter-writing and Transnational Activism on Behalf of Indonesian Political Prisoners: Gatot Lestario and his Legacy","creator":"Vannessa Hearman; Critical Asian Studies 48(2), pp.145–167","date":"2016; online 2016-03-30","url":"https://doi.org/10.1080/14672715.2016.1157954","kind":"Peer-reviewed historical article based on letters, archival materials and retrospective interviews","access":"Full article text opened through the author-uploaded Academia copy; biographical/South Blitar sections, relevant publication-provenance passage (printed pp.163–164 / web lines 140–146) and footnotes reviewed 2026-11-18.","note":"Hearman cites the 1969 Brawijaya military history for aliases, Project Committee office and capture details, and pseudonymous interviews for the intermediary role; those underlying records/interview originals were not independently opened. Her claim that copies of Lestario’s plea were smuggled out and retitled in Dutch is a retrospective account, not inspection of the 1985 booklet. Article arrest/trial details must be compared with contemporary Amnesty/TAPOL reporting and court records."},{"id":"S1425","title":"1968: A Crushing Defeat for the Indonesian Left","creator":"Vannessa Hearman; Verso Books","date":"2018-05-15","url":"https://www.versobooks.com/en-gb/blogs/news/3812-1968-a-crushing-defeat-for-the-indonesian-left","kind":"Author-written historical article / web essay","access":"Full article page opened; South Blitar military deployment, civilian-control and casualty-category passages, Rewang discussion, and Pudji Aswati/Gatot Lestario outcomes reviewed 2026-11-19.","note":"Same author as S1310 and S1394, drawing on the same research program; not independent corroboration of Hearman’s other accounts or the NYT-derived totals. The essay adds an explicit “captured or killed” reading of the August 1968 Army/NYT estimate and estimates fewer than 200 political fugitives, including children; those are the author’s synthesis, not a name-by-name loss list. Court and operation files were not inspected."},{"id":"S1477","title":"Cold War Polarization, Delegated Party Authority, and Diminishing Exilic Options: The Dilemma of Indonesian Political Exiles in China after 1965","creator":"David T. Hill; Bijdragen tot de Taal-, Land- en Volkenkunde / Journal of the Humanities and Social Sciences of Southeast Asia 176(2–3), pp.338–372","date":"2020","url":"https://doi.org/10.1163/22134379-bja10005 ; https://researchportal.murdoch.edu.au/esploro/outputs/journalArticle/Cold-war-polarization-delegated-party-authority/991005541461507891","kind":"Peer-reviewed historical article based on exile interviews, memoirs and cited archival papers","access":"Full text opened from a web-hosted author-version PDF; article metadata and abstract cross-checked against the official Murdoch repository record and DOI on 2026-11-19. Printed pp.338–367 and notes on Adjitorop, the Delegation, exile administration and the April 1978 document reviewed.","note":"Hill reports interviews with 50+ exiles in seven countries and seven returnees; the primary materials were in Indonesian and he states that he cannot read Chinese. IISH Adjitorop Papers cited for key decisions were not directly inspected. The 7 Aug 1966 declaration, Auto-criticism and domestic Emergency CC details are cited through other publications; do not count Hill as an independent witness for the latter or use exile administration as evidence of PRC direction of G30S."},{"id":"S1503","title":"Cold War Polarization, Delegated Party Authority, and Diminishing Exilic Options: The Dilemma of Indonesian Political Exiles in China after 1965","creator":"Vannessa Hearman; Bijdragen tot de Taal-, Land- en Volkenkunde 176(2–3), 2020, pp.338–372","date":"2020","url":"https://brill.com/view/journals/bki/176/2-3/article-p338_5.pdf ; https://doi.org/10.1163/22134379-bja10005","kind":"Peer-reviewed scholarly article using archival collections, interviews, memoirs and exile publications","access":"Full PDF read across pages 338–372; checked 1965 return/communication decisions, Adjitorop’s delegation, exile reorganization, PRC host mechanisms, party divisions, BPKK conflict and comparative Nanjing training note.","note":"Many details rely on 2007–09 interviews, published exile memoirs and sources the author explicitly identifies as retrospective or uncertain. It is not a direct substitute for IISH item files, PKI minutes or Chinese Party/state records; do not infer domestic PKI command from the exile Delegation."},{"id":"S1505","title":"Build the PKI Along the Marxist-Leninist Line to Lead the People’s Democratic Revolution in Indonesia: Five Important Documents of the Political Bureau of the CC PKI","creator":"Delegation of the Central Committee of the PKI; printed compilation","date":"1971-09","url":"https://www.marxists.org/history/indonesia/PKI1971BuildPKIalongtheMarxistLeninistLine.pdf","kind":"Primary party publication reprinting 1966–67 Political Bureau texts with a 1971 editorial introduction","access":"Full searchable PDF opened; 1971 introduction and the August 17 1966 statement / September 1966 self-criticism were read, especially pp.83–99. Texts criticize “adventurism,” reliance on Sukarno, the prior parliamentary line and call for armed peasant struggle and rural bases.","note":"This is a 1971 exile Delegation compilation, five years after the statements and within a sharpened Maoist political line. It reproduces party texts but is not the originals’ full manuscript chain; it cannot establish consensus, implementation, exact domestic command or the factual correctness of retrospective self-accusations."},{"id":"S1508","title":"Inertia of the Law of Slowness: Rewang remains in prison after sentence expiry","creator":"TAPOL Bulletin No. 99","date":"1990-06","url":"https://vuir.vu.edu.au/26186/1/TAPOL99_compressed.pdf","kind":"Contemporary human-rights advocacy bulletin reporting on an individual prisoner and family/official communications","access":"Full bulletin PDF opened; Rewang article, printed p.14 (PDF lines 551–565), read on 2026-11-19.","note":"Reports Rewang’s July 1968 arrest, 1971 special-court trial and life sentence, 1975 appeal, 1985 commutation to 20 years, expected January 1988 release and continued detention as of June 1990. It refers to family and Justice Department communications but supplies no judgment, commutation order or prison register; independent contemporaneous human-rights advocacy reporting."},{"id":"S1509","title":"Two PKI tapols released 3 years late","creator":"TAPOL Bulletin No. 106","date":"1991-08","url":"https://vuir.vu.edu.au/26109/1/TAPOL106_compressed.pdf","kind":"Contemporary human-rights advocacy bulletin reporting political-prisoner releases","access":"Full bulletin PDF opened; article on printed p.11 (PDF lines 1060–1105) read on 2026-11-19.","note":"Reports Rewang and Martosuwandi were released from Cipinang on 24 July 1991, after Rewang’s 1971 life sentence, 1975 appeal, 1985 commutation and scheduled January 1988 release. No court or prison documents are reproduced; TAPOL’s report is a near-contemporary human-rights account."},{"id":"S1510","title":"Indonesia: Seven Political Prisoners Freed — Hundreds Remain in Jail","creator":"Amnesty International, Weekly Update NWS 11/32/91 add","date":"1991-08-29","url":"https://www.amnesty.org/ar/wp-content/uploads/2021/06/nws110321991en.pdf","kind":"Contemporaneous international human-rights organization press update","access":"Complete 29 August 1991 update opened; Indonesia item, printed pp.8–10, read on 2026-11-19.","note":"Confirms that Rewang and Marto Suwandi, arrested in 1968, were among those released in July 1991 and were due for release in 1988 and 1987. Amnesty calls the trials unfair; it does not provide Rewang’s judgment or prison file."},{"id":"S1512","title":"The Indonesian killings of 1965–1966: the case of Central Java","creator":"Siddharth Chandra; Critical Asian Studies 51(3), pp.307–330","date":"2019; published online 24 Jul 2019","url":"https://www.tandfonline.com/doi/full/10.1080/14672715.2019.1626751 ; https://www.researchgate.net/publication/334663781_The_Indonesian_killings_of_1965-1966_the_case_of_Central_Java","kind":"Peer-reviewed regional demographic reconstruction; census and election data","access":"Author-uploaded ResearchGate text extraction reviewed at methods, results, political discussion, limitations and conclusion; publisher abstract opened. The ResearchGate PDF download returned 404. Original census tables, election returns, and referenced military/local records were not independently inspected.","note":"Uses administrative-level 1961, 1971, and 1980 census counts and 1955/1957 election results to estimate one-time population changes. The aggregate population gaps are not a victim census: they cannot distinguish deaths from migration or other demographic change, identify individual perpetrators, or yield ethnic victim shares. The paper itself treats refugee movement and local politics as interpretive factors; its political correlations do not prove causation."},{"id":"S138","title":"Agrarian movements and rural populism in Indonesia","creator":"Ben White, Colum Graham and Laksmi Savitri; Journal of Agrarian Change 23(1), 68-84","date":"Online 2 Aug 2022; issue 2023","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.12506","kind":"Open-access scholarly article","access":"Full article read; section 2 especially paras on 1953-64 BTI policy and numbers","note":"Membership numbers are organizational claims, not verified rolls; June 1964 ban and September speech rely on cited earlier works; original speeches/local enforcement records still needed."},{"id":"S199","title":"Indonesia and the Rule of Law: Twenty Years of New Order Government","creator":"International Commission of Jurists and Netherlands Institute of Human Rights, edited Hans Thoolen","date":"1987","url":"https://www.icj.org/wp-content/uploads/1987/01/Indonesia-rule-of-law-thematic-report-1987-eng.pdf","kind":"Scholarly legal and human-rights retrospective citing unions, enterprise councils and ILO","access":"Full text layer read pp119–121 on associations/enterprise councils and 1973 structure; screenshot cache miss","note":"1964 657 councils/2700 people and SOKSI 7.5m claims are secondary reported estimates; cites Panglaykim original and other scholarship, which need full examination. Sarbumusi 1971 complaint verified independently in ILO official index."}]);
