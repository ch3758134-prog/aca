window.HIST.claims.push(...[{"id":"C007","text":"During Japanese rule Sukarno cooperated with Japanese-sponsored bodies and mobilization, while using those platforms for nationalist organization; this entailed political responsibility in a coercive occupation economy that included romusha forced labor.","period":"1942–1945","type":"Scholarly and archival syntheses; disputed moral/political interpretation","source_ids":["S001","S016","S017"],"confidence":"Moderate for institutional participation; low-to-moderate for specific causal allocation","basis":"Participation is well established; the scale and mechanism of his role in forced labor and famine harm require source-by-source inquiry. Do not infer that collaboration means sole responsibility or that it was merely tactical.","next":"Read Japanese occupation primary records, memoirs, local records, wartime labour/famine data and Sukarno's 1965 remarks.","year":1942},{"id":"C018","text":"Presidential Decree No.150 of 5 July 1959 dissolved the Constituent Assembly and restored the 1945 Constitution, ending the 1950 provisional constitutional arrangement.","period":"5 Jul 1959","type":"Official legal text","source_ids":["S036"],"confidence":"High for decree text and institutional action","basis":"Historical legality, political consent and downstream authoritarian effects are analytical questions.","next":"Compare court/assembly records, contemporaneous debate and constitutional scholarship.","year":1959},{"id":"C019","text":"Indonesia enacted a sharecropping law (Law 2/1960), a national agrarian framework (Law 5/1960) and a landholding-limits instrument (Perpu 56/1960); their exact statutory provisions are now directly reviewed or checked against text reproductions, while local implementation remains open.","period":"1960–1961","type":"Official legal texts and records","source_ids":["S037","S038","S039","S083","S084","S085"],"confidence":"High for enactment and stated law text; unresolved for local implementation","basis":"UUPA and Perpu56 official BPK PDFs opened; Law2 text read in non-government transcription and cross-checked against official BPK metadata. Laws are not evidence of uniform enforcement or redistribution.","next":"Trace implementing regulations, district files, registration, compensation, beneficiaries and enforcement cases.","year":1960},{"id":"C039","text":"In May 1920, the ISDV congress resolved to join the Communist International and adopted a Malay-language communist-party label recorded as “Perserikatan Kommunist di India” (spelling varies across sources); the present Indonesian-language name “Partai Komunis Indonesia” was adopted in June 1924.","period":"1914–1924","type":"Party-name chronology; scholarly account and later editorial note","source_ids":["S837","S889"],"confidence":"High for the sequence reported by the sources; original congress resolutions not yet inspected","basis":"S837 editorial note 7 distinguishes the 1920 label from the current name adopted in June 1924; S889 describes the 1920 Malay-language naming and Comintern affiliation. Variant spellings occur, and the 1914 ISDV genealogy is not a party-name date.","next":"Inspect 1920 and 1924 party constitutions, congress minutes and contemporary party newspaper mastheads; compare Malay and Dutch forms.","year":1914},{"id":"C040","text":"Dutch colonial land/labor regimes included the Java-centered Cultivation System from about 1830 and the 1870 Agrarian Law's state claim over uncultivated 'waste' land and long-term plantation concessions; effects varied by island, locality and labor regime.","period":"1830 onward; especially 1870","type":"Historical synthesis","source_ids":["S063","S064","S065"],"confidence":"Moderate-high for broad legal/institutional summary","basis":"The synthesis is secondary; Java, Sumatra and Outer Island histories differ. The exact statutory text and local implementation were not reviewed.","next":"Read original Dutch regulations, land concessions and regional labor/land histories.","year":1830},{"id":"C051","text":"On 5 December 1957 the Indonesian Cabinet decided to place Dutch enterprises already taken over by workers under government control and management boards; Foreign Ministry Secretary General Suwito told the U.S. ambassador this was temporary 'protective custody,' not confiscation or nationalization, and explained that workers and property protection were competing concerns.","period":"Dec 1957","type":"Contemporary report of Indonesian government explanation","source_ids":["S079"],"confidence":"High that the telegram records Suwito's account; moderate for Cabinet decision; not an independent adjudication of motive or legal status","basis":"The U.S. ambassador reports a conversation, not the Cabinet minutes. The quoted distinction was Suwito's explanation and should be compared with Indonesian orders and company records.","next":"Find the 5 December Cabinet resolution, military orders, union records and Dutch company/employee testimony.","year":1957},{"id":"C053","text":"The 1960 Basic Agrarian Law framed land as having a social function, prohibited ownership/control beyond limits, generally required active cultivation by the holder, and directed that surplus holdings be taken with compensation and distributed to people needing land; it also repealed named colonial agrarian provisions.","period":"24 Sep 1960 onward","type":"Primary legal text","source_ids":["S083"],"confidence":"High for statutory wording; not evidence that redistribution occurred","basis":"Official legal text, PDF pages 0–5 and 23–24; legal reform was nationwide in form but land rights, customary status and implementation varied.","next":"Read drafting debates, implementing regulations, land-registration records and local outcomes by island/class.","year":1960},{"id":"C060","text":"A peer-reviewed synthesis argues that when implementation stalled, BTI undertook sporadic unilateral land occupations in 1963; Sukarno opposed those actions and prohibited them and related polemic in June 1964, then publicly welcomed BTI delegates and expressed support for peasants in September 1964.","period":"1963–1964","type":"Later scholarly account of policy conflict and political alignment","source_ids":["S041"],"confidence":"Moderate; article cites earlier scholarship and Sukarno's 1964 speech, but primary decrees/speech not yet inspected","basis":"The article's characterization is not a complete locality-by-locality count. This sequence shows policy conflict but does not by itself establish Sukarno's motive or the consequences for 1965.","next":"Locate the June 1964 directive and original speech transcript; compare BTI records and local action/repression by district.","year":1963},{"id":"C061","text":"Presidential Decrees 200 and 201 dated 17 August 1960 formally ordered dissolution of Masyumi and PSI respectively; BPK records the Masyumi decree, and an ANRI-attributed scan is available for the PSI decree.","period":"17 Aug 1960","type":"Primary legal/archival record","source_ids":["S078","S086","S087"],"confidence":"High for existence, title and date; detailed grounds and implementation need direct transcription","basis":"BPK PDF viewer did not expose OCR; the ANRI SIKN origin page for the PSI scan was inaccessible, so the Commons image is an access copy with stated provenance. The decree grounds are not assessed here.","next":"Transcribe both originals; read the 1959 Party Regulation, correspondence with party leaders, Supreme Court/administrative records and branch-level implementation.","year":1960},{"id":"C129","text":"Komnas HAM says its 2008-2012 ad hoc investigation heard 349 witnesses/victims and expressly lacked capacity to comprehensively investigate Indonesia-wide crimes.","period":"2008-2012","type":"Official institutional investigation report","source_ids":["S140"],"confidence":"High for declared investigative scope, not representative census","basis":"S140 printed pp1-2 screenshot for p1; report opening.","next":"Acquire underlying BAP interview IDs and detailed final report; compare regions and sampling.","year":2008},{"id":"C231","text":"A Dec27 Surabaya consular report states some state-enterprise applicants now needed Army-veteran or NU-SARBUMUSI association whereas earlier Army-veteran or SOBSI status was accepted; this is a local witness/account of hiring rules.","period":"1965-12-27","type":"Direct consular report of city-level employment practice","source_ids":["S152"],"confidence":"Moderate-high for observation; written company recruitment policy not seen","basis":"S152 OCR para3 'Growth in Power of SARBUMUSI'","next":"Obtain enterprise HR circular, hiring logs, trade union lists and NU/Army representative correspondence.","year":1965},{"id":"C250","text":"On 7 Dec 1957 SBI deputy chairman Ie Hok Gie announced takeover of Internatio Jakarta office, temporarily excluding Dutch managers while allowing a few Dutch staff to work, based on corporate archive reconstruction.","period":"7 Dec 1957","type":"Historian account of worker occupation","source_ids":["S211"],"confidence":"Moderate-high for detailed event, GAR inv.444 original unseen","basis":"S211 p201, notes76-78 GAR inv.428 and inv.444","next":"Obtain local union records, original Dutch documents and newspaper/employee testimony.","year":1957},{"id":"C251","text":"On 21 Dec 1957 Jakarta garrison Major Sutardjo took control of Internatio's Jakarta assets and senior Indonesian staffer Moh Yusuf was appointed military adviser's role; state/army seizure followed worker occupation, not simultaneous.","period":"21 Dec 1957","type":"Historian archival reconstruction of military takeover","source_ids":["S211"],"confidence":"Moderate-high, military original appointment/ownership order unavailable","basis":"S211 pp201–202, note79 GAR inv.444","next":"Find 21 Dec military order, asset custody and factory managerial roster.","year":1957},{"id":"C308","text":"KOTI inventory nos743–760 catalogue Gerwani internal instructions, Jakarta chapter organization, midwife activity, Kartini celebrations, family education, SOBSI union conference ties and September1965 Banten program; these are dated pre-G30S organizing record locators, not evidence of G30S guilt.","period":"1964–1965","type":"Archive folder locators only","source_ids":["S228"],"confidence":"High for existence of titles; organizational practices/participants unverified","basis":"KOTI nos743–760, especially 746,747,749,751,753,758","next":"Seek original Gerwani minutes, reports, nurse/midwifery programs and local independent correspondence.","year":1964},{"id":"C315","text":"Amnesty's September1977 named trade-unionist dossier explicitly separates membership in SOBSI-affiliated union from membership in PKI: many ordinary union members were not PKI party members.","period":"1950–1977; contemporaneous report","type":"Original NGO dossier general claim and documented distinction","source_ids":["S230"],"confidence":"High for Amnesty statement, verified party membership of individuals requires corroboration","basis":"Amnesty ASA21/09/77 p1","next":"Find named individual party and labor membership registers; distinguish party from affiliated group.","year":1950},{"id":"C328","text":"Boven Digoel original inventory no100 lists exiled persons during 1927–31, no108 names prisoners with families in 1932, no116 includes fingerprints/signatures in 1939, and no269 lists prisoner deaths 1927–34.","period":"1927–1939","type":"Document-level original roster catalogue only","source_ids":["S233"],"confidence":"High for survival of catalogued objects; individual count unknown","basis":"ANRI nos100,108,116,269","next":"Access names, origins, class/party affiliations, health and death cases; compare archival family oral histories.","year":1927},{"id":"C360","text":"Rocamora reconstructs a PNI national leadership divide: new Ali Sastroamidjojo/Surachman allied youth and peasant leaders pursued radical Marhaenist mass party organization while provincial PNI party networks protected local wealthy landholding interests.","period":"1963–65","type":"Academic study using contemporary internal party papers","source_ids":["S245"],"confidence":"Moderate-high historical reconstruction; no individual membership survey","basis":"Rocamora paper sections PNI leadership and landed interests","next":"Get Lembang congress resolutions and district faction records.","year":1963},{"id":"C453","text":"Rocamora documents 20 Aug1965 Banjudono and 22 Aug Subang meetings of PNI leaders opposing Ali-Surachman leadership and 13 Sep inter-regional consultation, while central apparatus purged dissenting leaders; factional dispute predated G30S.","period":"1965-08 to 09","type":"Historical reconstruction with original local typescript references","source_ids":["S283"],"confidence":"Moderate-high for dated meetings, motives require party sources","basis":"Cornell p179-180, notes91-94","next":"Retrieve Banjudono letter, West Java/PNI action documents, police local orders.","year":1965},{"id":"C572","text":"Ikaningtyas reports that the first 26 May Delanggu factory action was a two-hour on-site work stoppage rather than all workers leaving the premises; she describes a May mobilization of about 5000 workers from named localities, citing Sarjana Sigit Wahyudi (2001).","period":"1948-05","type":"Secondary historical reconstruction","source_ids":["S344"],"confidence":"Moderate for modality; participation count remains secondary","basis":"PDF printed pp6-7 / PDF index5-6","next":"Verify Wahyudi 2001 and May 1948 contemporary news; distinguish 5000 demonstration from 15000 June strike and 30000 other estimate.","year":1948},{"id":"C579","text":"ANRI official police inventory item 342 is an original one-sheet Surakarta Mobile Brigade report dated 22 July 1948 on guarding the Delanggu area.","period":"1948-07-22","type":"Primary archival finding aid metadata","source_ids":["S347"],"confidence":"High for inventory metadata; report contents not read","basis":"ANRI inventory entry 342; PDF extracted line 884","next":"Request original sheet 342; compare with 2013 article account of patrol after July 18.","year":1948},{"id":"C581","text":"A 2024 thesis reports that BP-KNIP's Delanggu inquiry committee was chaired by Sartono (PNI), visited the central peasant organization and Surakarta local government, and investigated the Delanggu sack factory.","period":"1948-05/08","type":"Secondary research report","source_ids":["S348"],"confidence":"Medium","basis":"Full thesis PDF pages 88-89 (PDF indices); cites later history rather than original committee minutes.","next":"Locate BP-KNIP 1948 inquiry appointment and report; verify whether committee was formed after first strike.","year":1948},{"id":"C582","text":"The thesis reports BP-KNIP discussions of the Delanggu inquiry on 9-11 July and 19-20 August 1948; Sartono motion urging renewed BTN-SOBSI negotiations in Yogyakarta with committee observers passed 15 to 2.","period":"1948-07/08","type":"Secondary research report","source_ids":["S348"],"confidence":"Medium","basis":"Thesis PDF page 89; exact voting numbers as transcribed; original session minutes not examined.","next":"Find BP-KNIP 9-11 July and 19-20 August minutes and voting list.","year":1948},{"id":"C585","text":"A 2019 Indonesian legal-history biography reports that Sartono was appointed in July 1948 to chair the BP-KNIP inquiry commission into the Delanggu strike and matters concerning the Badan Tekstil Negara.","period":"1948-07","type":"Secondary retrospective report","source_ids":["S349"],"confidence":"Medium","basis":"Hukumonline article lines 164-165; independent of 2024 thesis S348 but may share older biographies; original appointment order and minutes not opened.","next":"Locate BP-KNIP appointment order or proceedings; compare inquiry remit with S348 and state textile bureau records.","year":1948},{"id":"C588","text":"The 1985 Indonesian Education and Culture Department biography says Sartono chaired a BP-KNIP inquiry in July 1948 investigating the Delanggu strike and Badan Tekstil Negara; it also reports Hatta chaired a meeting to settle the strike with Mohammad Natsir present.","period":"1948-07","type":"Retrospective institutional historical account","source_ids":["S350"],"confidence":"Medium-high for 1985 account; medium for 1948 events","basis":"Full 1985 printed p108 (PDF text lines 4025-4032), appendix p115 (lines 4260-4263). Corroborates S348/S349 but remains later reconstruction; not independent original minutes.","next":"Find 1948 BP-KNIP inquiry commission appointment and Hatta meeting minutes; verify Natsir attendance.","year":1948},{"id":"C625","text":"Yamamoto's 2025 full-text study explains that after the 1926–27 uprisings the Netherlands Indies government built Boven Digoel to exile and surveil alleged subversives and used Malay-language newspaper coverage to project the camp as a warning; 13000 arrests and 1308 initial deportation figures are scholar's figures drawn from cited materials, not prisoner-register counts checked here.","period":"1926-1930s","type":"Scholarly historical argument and published secondary counts","source_ids":["S369","S233"],"confidence":"High for publication's argument and initial colonial archive leads; direct detainee totals not independently verified","basis":"Kyoto Southeast Asian Studies 14(1) 2025 intro; ANRI inventory S233 records 1927-31 exile rosters and later labor ledgers.","next":"Inspect ANRI Boven Digoel roster nos100 108 116 269 and compare with 1920s colonial gazette and Malay-language press.","year":1926},{"id":"C667","text":"Joint HRW-Amnesty June 1998 report identifies PRD-associated SMID PPBI STN; reports 1997 subversion sentences for Budiman Sudjatmiko (13 years), Petrus Haryanto (6 increased to 8 on appeal), Dita Indah Sari (6 reduced to 5 on appeal) and Coen Husein Pontoh (3.5), and documents March 9 1998 SBSI-linked labor protest arrests.","period":"1996-1998","type":"Contemporaneous NGO compilation of court outcomes and labor repression","source_ids":["S381"],"confidence":"High for report contents; moderate for individual sentencing absent court decisions","basis":"S381 HTML section I paragraphs 10-25; NGO advocacy report not independent court docket; no proven direct organizational continuity with pre-1965 PKI.","next":"Find 1997 court judgments and appeal texts; 1998-03-09 arrest docket and original SBSI/PPBI statements.","year":1996},{"id":"C735","text":"11 Jan2023 President Joko Widodo publicly acknowledged 1965-66 among twelve past events involving gross human-rights violations and expressed regret, promising victim restoration and non-recurrence on basis of presidential 2022 non-judicial investigation team; speech does not itself establish specific criminal responsibility, victim identities or compensation disbursement.","period":"2023-01-11","type":"Original head-of-state statement not judicial judgment","source_ids":["S419"],"confidence":"Very high for exact speech and official admission, exact remedy or judicial case unproven","basis":"Official Cabinet Secretariat full Indonesian transcript dated11Jan2023","next":"Obtain PPHAM 2022 published report, individual victim registration process, prosecutor investigations and evidence of delivered measures.","year":2023},{"id":"C742","text":"Komnas HAM reports issuing 725 official gross-rights victim recognition certificates Jan-Nov2024: 598 concerning 1965/66, 90 Rumoh Geudong/Pos Sattis, 32 Simpang KKA, 5 Petrus; certificates support victim status but are not 598 unique awarded reparations or an exhaustive 1965 population count.","period":"2024-01 to 2024-11","type":"First-party victim administrative certificate outputs","source_ids":["S422"],"confidence":"Very high for breakdown, any duplicate issuance and compensation need other records","basis":"Komnas HAM official 2024 year-end report lines253-258, SKKPHAM administrative program","next":"Find individual deidentified issuance/recipient attributes and comparison to LPSK protection eligibility, delivered remedies, underserved provinces.","year":2024},{"id":"C801","text":"The Gerwani central leadership published a program attributed to its 14-17 Dec 1961 fourth congress that demanded women's independent land title under the 1960 agrarian law; female cultivator representation in land-reform committees; equal-value pay; maternity leave and workplace childcare; the text admits several earlier demands remained unfulfilled.","period":"1961-12","type":"Contemporaneous organizational platform and self-assessment","source_ids":["S459"],"confidence":"High for wording of digitized platform; low for actual local execution","basis":"Program Gerwani sections I and program items 6-8 and 13-15; transcription has conflicting Law 68 year and is not an implementation register.","next":"Check printed 1961 program and local district land committees factory payroll and nursery registers.","year":1961},{"id":"C810","text":"US Embassy telegram 1290 dated 1 Nov 1965 explicitly locates the Labor Attaché visit in Palembang South Sumatra Oct 28-29 and reports approximately 600 detainees and arrests of PERBUM and SOBSI leaders at Stanvac, Shell and PUSRI; Shell managers deny army allegation that refinery fire was sabotage.","period":"1965-10-27/11-01","type":"Contemporaneous embassy reporting with conflicting attributed statements","source_ids":["S196"],"confidence":"High for telegram content; arrests estimates unverified","basis":"Full OCR opened; NSA curator incorrectly says North Sumatra; telegram says S Sumatra. The 600, 30, 24, 15 counts have potentially overlapping populations and cannot be summed. Sabotage claim expressly disputed by Shell management.","next":"Check original scan, Palembang police and employer rosters, refinery fire inquiry, oil transfer contracts.","year":1965},{"id":"C811","text":"In its 1997 freedom-of-association review ILO recorded Indonesian government claims that 28 workers arrested after April 1994 Medan events had served three-to-six-month sentences; ILO called for an independent inquiry into the unsolved 1993 murder of East Java worker Marsinah.","period":"1993-1997","type":"ILO oversight record with attributed government assertions","source_ids":["S467"],"confidence":"High for committee text; underlying arrests and individual trial outcomes unverified","basis":"GB.270/7 paras 425-442; ILO did not identify perpetrator and criticized impunity.","next":"Obtain 305th report annex of 28 names and court judgments; 1994 Medan labor union testimony; 1995/1999 Marsinah inquiry records.","year":1993},{"id":"C829","text":"At the 86th International Labour Conference in June 1998, an Indonesian Government representative said PER-05/MEN/1998 of 27 May cancelled PER-03/MEN/1993, allowed national and regional unions to seek registration at company level by submitting officers' names, constitution and members, and enabled SBSI to be recognized as an independent union.","period":"1998-05-27 to 1998-06","type":"Government statement on legal change","source_ids":["S484"],"confidence":"High that the statement was made; medium for full rule content pending the original regulation","basis":"Official conference minutes record the Government representative's statement at lines 524-529.","next":"The actual PER-05/MEN/1998 scan was not located. Do not silently treat the delegate's summary as the full legal text or independent proof of workplace registration.","year":1998},{"id":"C830","text":"In its 1999 reply to ILO Case 1773, the Indonesian Government reported that SBSI and twelve other unions were registered nationally and that SBSI had 22 registered branch offices in seven provinces; the Committee described the reform as a significant advance while saying full conformity with freedom-of-association principles remained an objective.","period":"1998-12 to 1999-06","type":"Institutional report of Government figures and Committee assessment","source_ids":["S485"],"confidence":"High for the content of the Government's report and Committee assessment; underlying registration ledger not inspected","basis":"GB.275/4/1E paras. 583-585, 601-604.","next":"These figures concern national organizations and reported branches; they do not establish that all individual workplaces accepted union activity or that a registry audit confirmed the counts.","year":1998},{"id":"C855","text":"Yamamoto's account of a 13 June 1927 Sin Jit Po list identifies newly exiled organizers including I. Makki/I. Mangki, Noeroet gelar Soetan Radja Endah, Pio, Ishak and Mohamad Sjahmin gelar Pandji Nagara, and describes merchant, survey, publishing, journalism and labor-union backgrounds. The individuals' profiles and exact organizational descriptions are mediated through Yamamoto; the newspaper issue was not read directly.","period":"1927-06-13","type":"Scholarly summary of contemporary press roster / prosopography","source_ids":["S497"],"confidence":"Medium for the article's summary; original roster, identities and affiliations require confirmation","basis":"Yamamoto 2025, section on Sin Jit Po 1927.","next":"Retrieve the June 13 newspaper issue; cross-check names/aliases against ANRI individual registers, court files and union/party records.","year":1927},{"id":"C857","text":"In letters dated 7 and 9 March 1935 from Tanah Merah, Sjahrir described a ditch separating the government quarter from the exile settlement, an exile-run quasi-village administration, paid camp jobs and day labor at 40 cents/day, and shortages of food, clothing and supplies. He said official promises made work and a reputation for reform relevant to release. This is one detainee's firsthand perception, not a camp-wide census.","period":"1935-03-07 to 1935-03-09","type":"First-person account","source_ids":["S499"],"confidence":"High that Sjahrir made these observations in the published letters; medium for prevalence or representativeness across inmates","basis":"Sjahrazad/Sjahrir, Indonesische overpeinzingen, III, Boven-Digoel, DBNL text.","next":"Compare with quarterly camp reports, wage books, food budgets, medical registers and other detainee letters.","year":1935},{"id":"C860","text":"During the 21 October 1930 Hillen-report interpellation, Cramer described 412 internees as proposed for release and cited Hillen's comparison of 823 persons subject to the measure by 1 April 1928 with 1,308 interned in Hillen's later table. Minister de Graaff disputed Cramer's reading that Hillen had established hundreds of innocent internees and said regional inquiries and interrogations passed through the public prosecutor, Justice Department, Raad van Indië and government. The transcript establishes the competing arguments, not the completeness or reliability of every file in that administrative chain.","period":"1928-04 to 1930-10","type":"Official parliamentary dispute about a later inspection report","source_ids":["S504"],"confidence":"High for the positions and numbers quoted in the transcript; actual case-by-case status requires Hillen's original report and files","basis":"Handelingen der Staten-Generaal, Tweede Kamer, 8ste vergadering, 21 October 1930, Cramer interpellation and Minister de Graaff's reply.","next":"Obtain Hillen report (ANRI Binnenlandsbestuur no.1308, 37 sheets) and government implementation list; reconcile 412 proposal with later release totals.","year":1928},{"id":"C862","text":"The 1931 government report says Hillen's 1930 inquiry led first to revoking internment for 219 people and then to release of the 186-person B-group on 18 June 1931; it separately says 516 people left during Q1 1931, mostly due to prior revocations. The 1930 parliamentary debate refers to 412 proposed releases. The arithmetic 219+186=405 leaves seven versus 412, but timing, group definitions or later changes may differ; the original Hillen list is missing.","period":"1930-12 to 1931-06-18","type":"Government-reported review and release counts; comparison across documents","source_ids":["S502","S504"],"confidence":"High for the different numbers each document reports; unresolved whether the seven-person difference is substantive or a scope/date issue","basis":"Indisch Verslag 1931, printed p.56; Handelingen 21 October 1930.","next":"Retrieve Hillen's original table, B-group/A-group lists, individual revocation orders, travel lists and family departure registers.","year":1930},{"id":"C864","text":"ANRI's finding aid and sourcebook describe original Boven-Digoel birth and death lists and rolls for field labor, attendance, non-workers and forced-work/pay entries, including records dated 1927-1941. These are concrete retrieval targets for population, mortality and labor history; catalogue descriptions alone do not establish the counts, coercion or conditions inside the records.","period":"1927-1941","type":"Archival availability / research lead","source_ids":["S493","S495"],"confidence":"High that the catalog describes such record series; no original rolls read","basis":"ANRI Boven Digoel finding aid nos.267,269,271-296 and Citra Papua sourcebook.","next":"Request and transcribe original series; link identities to ship lists, family records, wages, medical entries and release orders.","year":1927},{"id":"C868","text":"The thesis describes resident and assistant-resident officials compiling suspect lists based on alleged PKI ties or participation in the 1926-1927 uprisings before people were interned; the underlying lists have not been inspected.","period":"1926-1927","type":"Secondary account of local administrative selection","source_ids":["S505"],"confidence":"Moderate as a research lead; individual lists and nominations unverified","basis":"Kaulingfreks, p.26 and note 96, citing Smit, Landvoogd tussen twee vuren, p.58.","next":"Find each residency's nomination lists, evidence notes, review record and governor-general order; compare names with transport and release rolls.","year":1926},{"id":"C881","text":"At the 5 January 1938 meeting, Thamrin reported the government's position that after arrival all compulsion should end and internees had the same rights and duties as free residents; he challenged that account, citing early compulsory work, pressure in medical treatment and correspondence censorship, and said official independent information had not followed Hillen. These are opposing positions in a debate.","period":"1938-01-05","type":"Officially recorded parliamentary statements by government and Thamrin","source_ids":["S506","S507"],"confidence":"High that the transcript records the positions; underlying events and scope of coercion remain unverified","basis":"College of Delegates proceedings, printed pp.163-164; Schoonheyt, pp.155 and 267-268, provides one independently authored admission of specific monitoring and labor-policy change.","next":"College of Delegates proceedings, printed pp.163-164; Schoonheyt, p.155, records one 1933 ship search and intercepted letters while also describing smuggling.","year":1938},{"id":"C1459","text":"Gerwis congress account dates formal change of name to Gerwani to 30 March 1954, after the 25-31 March second congress in Jakarta; says 143 of 201 branches attended and around 350 delegates and observers came from multiple islands.","period":"1954-03-25 to 1954-03-31","type":"Contemporaneous organization self-report","source_ids":["S828"],"confidence":"High that the organization published these claims; attendance not independently verified","basis":"S828 OCR lines 286-306 and 819-840; name-change day explicitly 30 March; distinguish organization self-report from independently verified attendance.","next":"Check printed PDF page images, delegate roll and independent newspapers; reconcile congress title and subsequent legal registration.","year":1954},{"id":"C1460","text":"Gerwani 1954 adopted statutes article 1 describe it as a non-party educational and campaigning organization, formed from Gerwis after merging railway workers' wives organizations and PERWIN of Manado; articles 3-5 specify voluntary membership from age 16, elections, dues and meetings.","period":"1954-03","type":"Organization constitutional provisions","source_ids":["S828"],"confidence":"High for text of published adopted statute; actual implementation unverified","basis":"S828 OCR lines 1057-1103; text is prescriptive and cannot establish actual autonomy from PKI or local compliance.","next":"Verify original facsimile and regional member records, party correspondence and local meeting minutes.","year":1954},{"id":"C1461","text":"Gerwani 1954 statutes article 62 specify entrance fee Rp1 and dues Rp0.25; article 63 allocates 90 percent of receipts at regional level and 10 percent to central leadership.","period":"1954-03","type":"Organization constitutional finance rules","source_ids":["S828"],"confidence":"High for stated statute; actual payments and remittances not verified","basis":"S828 OCR lines 1494-1514; OCR renders fee amount clearly but payment interval for dues must be checked on original image.","next":"Find branch account books, dues ledgers, treasury reports and verify periodicity and allocation in facsimile.","year":1954},{"id":"C1462","text":"Gerwani 1954 congress resolution called for a democratic marriage law guaranteeing equal rights in marriage divorce and family relations and endorsed preparations for 1955 elections.","period":"1954-03","type":"Contemporaneous organizational political resolutions","source_ids":["S828"],"confidence":"High for the congress published resolution; enactment and subsequent campaigning unverified","basis":"S828 OCR lines 1525-1536; a demand is not evidence of government implementation.","next":"Check contemporary parliamentary debates, women organization responses and actual campaign records.","year":1954},{"id":"C1468","text":"1965-11-01 Jakarta telegram 1290 locates the 28–29 October refinery visit in Palembang South Sumatra; reports about 600 people already detained locally and separately records roughly 30 Stanvac employees, 24 Shell PERBUM members and 15 PUSRI SOBSI leaders arrested; figures are contemporaneous reporting, not verified detainee registers.","period":"1965-10-28/1965-11-01","type":"Contemporaneous US diplomatic reporting","source_ids":["S196"],"confidence":"Medium for report content; unverified for underlying detention totals","basis":"NSA OCR telegram 1290 https://nsarchive.gwu.edu/media/15705/ocr; editorial description wrongly says North Sumatra; no signed Indonesian detention list.","next":"Locate RG84 P339 Box14 Folder4 facsimile, regional army detention orders and company personnel registers; do not sum 600 with employee subsets.","year":1965},{"id":"C1476","text":"Semaun in his early-1920s report described the VSTP railway union as founded by European workers in 1909 and later oriented toward Indonesian workers; he described PPKB federation formation in 1919 and a split in 1921 between a revolutionary federation and a Sarekat Islam-associated wing.","period":"1909-1922","type":"Participant historical account translated 1966","source_ids":["S837"],"confidence":"High that Semaun made the claims; moderate/low for independently verified organizational dates and composition","basis":"1966 Cornell Indonesia 1 pp. 59-61; translation from 1922 Russian publication with possible intermediary languages; author participant; no original union minutes checked","next":"Check VSTP 1909 statutes; 1919 PPKB founding minutes; 1921 congress decisions; Dutch and Malay union newspapers.","year":1909},{"id":"C1488","text":"Ingleson argues that many 1950 harbor disputes arose from workers’ wage and working-condition grievances and were not usually initiated by PKI/SOBSI leaders, while SOBSI and affiliated unions supplied ideological coordination and bargaining networks.","period":"1950","type":"Attributed scholarly interpretation","source_ids":["S358"],"confidence":"High that this is the author’s argument; it remains a scholarly interpretation","basis":"Full sections on labor historiography, worker agency and industrial disputes read; the article does not establish that party organizers never initiated particular actions.","next":"Compare individual strike files with union/PKI directives, workplace testimony and employer records.","year":1950},{"id":"C1500","text":"A 1958 near-contemporary account describes a 1945 split between the Partai Buruh Indonesia political project and the restored Barisan Buruh Indonesia union organization; it traces separate federation models GASBI and GSBV in 1946 and the formation of SOBSI on 29 November 1946.","period":"1945-11 to 1946-11-29","type":"Near-contemporary union history and political-organizational survey","source_ids":["S846","S845"],"confidence":"Moderate-to-high for the sequence as described by the author; original congress minutes and all founding documents were not inspected","basis":"Tedjasukmana's 1958 monograph, pp. 20–22, says BBI continued separately after the party was created; it describes GASBI, GSBV and their replacement by SOBSI. Hearman 2024 independently gives SOBSI's founding date.","next":"Compare Soeara Boeroeh, Kedaulatan Rakjat and Merdeka issues, BBI/PBI/SOBSI statutes, founding congress minutes and party records.","year":1945},{"id":"C1575","text":"The Indies Social-Democratic Association (ISDV), founded in Surabaya in 1914, began as a small socialist organization with a largely Dutch membership; links through railway labor and Sarekat Islam brought Indonesian organizers into its networks.","period":"1914–1921","type":"Scholarly reconstruction from organizational history and cited period materials","source_ids":["S889"],"confidence":"High for what the article states; original membership lists not checked","basis":"Crawford full text, pp.707–708, directly states Surabaya/1914, initial membership, Dutch socialist links, railway union and Semaun recruitment. It is a later reconstruction, not the original register.","next":"Inspect ISDV/VSTP membership, meeting minutes, press and colonial police records.","year":1914},{"id":"C1576","text":"At its 1920 congress, the ISDV decided to affiliate with the Communist International and adopt a Malay-language communist party name; in 1921 the central Sarekat Islam congress imposed party discipline and expelled PKI members, while local pro-PKI branches followed different paths.","period":"1920–1923","type":"Scholarly reconstruction from party and press materials","source_ids":["S889"],"confidence":"High for the article’s account; local branch variation requires primary records","basis":"Crawford full text, pp.707–708; his account cites McVey and contemporary organization publications. The article describes a sequence, not a uniform simultaneous split across all branches.","next":"Read congress proceedings, Sarekat Islam and PKI statutes, local branch lists and contemporary press.","year":1920},{"id":"C1579","text":"The 10 April 1920 issue of Soeara Ra'jat identifies itself as the organ of the Indies Social-Democratic Association (ISDV) and names Darsono and J. A. Dengah as editors.","period":"1920-04-10","type":"Contemporary periodical masthead","source_ids":["S890"],"confidence":"High for the printed masthead as transcribed; image inspection pending","basis":"Web text extraction reads issue number/date, masthead, ISDV affiliation and editors. Direct scan screenshot failed; source is a third-party digital reproduction.","next":"Compare with Perpusnas, Monumen Pers or IISH holdings/microfilm and verify the page image.","year":1920},{"id":"C1583","text":"The 30 April 1921 Soeara Ra'jat no.8, pp.4–5 prints the article ‘Pertimbangan S.I. Semarang tentang partij discipline dalam S.I.’, ending with the sole visible byline BOEDISOETJITRO; it opposes a party-discipline rule excluding SI–PKI political cooperation. The separate SI Semarang school-fundraising appeal on pp.5–6 has different signatories (see C2891).","period":"1921-04-30","type":"Contemporary signed local SI political commentary (distinct from adjacent school appeal)","source_ids":["S891"],"confidence":"High for the article boundary, printed byline, issue and date; interpretation of older-spelling Malay subject to translation review.","basis":"S891 original eight-page issue, pp.4–5: article concludes with BOEDISOETJITRO. The separate p.5–6 school appeal is signed by two SI Semarang officers. These two texts must not be conflated; the article alone does not prove other SI branches obeyed or opposed a national decision.","next":"Check full historic Malay transcription against independent early SI records and contemporary central congress discipline resolutions; compare each other branch's response.","year":1921},{"id":"C1585","text":"A reproduced front page of Soeara Ra'jat visibly identifies year 4 no.9, 16 May 1921, and the first installment of Tan Malaka's “Sovjet atau Parlement?”; the page carries an internal “Deli, Juni 1920” date.","period":"1921-05-16; article internally dated 1920-06","type":"Contemporary periodical page reproduced in a later scholarly book","source_ids":["S894"],"confidence":"High for visible page metadata and article heading; moderate for exact reading of small, old-spelling text","basis":"One high-resolution reproduction credited to Poeze 1976 p.135; not the full issue or institutional original. “Deli, Juni 1920” is the page’s printed dating, not an independently verified composition date.","next":"Acquire the full issue no.9 from IISH, Perpusnas or Monumen Pers; compare the original page and transcribe the first installment.","year":1921},{"id":"C1586","text":"Poeze reports that the first six chapters of Tan Malaka’s “Sovjet atau Parlement?” were serialized in Soeara Ra’jat nos.9, 10–11, 13–15 between May and August 1921; no further installments appeared in the paper, and a 107-page booklet was printed in October in a stated run of 1,000 copies.","period":"1921-05 to 1921-10","type":"Scholarly reconstruction based on periodical citations and later bibliography","source_ids":["S895"],"confidence":"Moderate-high for Poeze’s documented bibliographic reconstruction; moderate for the reported print-run absent a print ledger","basis":"Poeze cites issue numbers and dates and notes he could not locate the original booklet. The full newspaper issues and printing records were not opened in this pass.","next":"Retrieve cited issues nos.9–15 and the October 1921 booklet; compare pagination, installment endings and printing/advertising records.","year":1921},{"id":"C1588","text":"Poeze reports that the Semarang Sarekat Islam school opened on 21 June 1921 in the branch meeting hall with about 50 pupils and grew rapidly; his chapter says 80 within a month and 123 in August, while note 13 separately gives 64 pupils on 30 June.","period":"1921-06 to 1921-08","type":"Scholarly reconstruction with internal enrollment-count discrepancy","source_ids":["S895"],"confidence":"Moderate for opening and general growth; low-to-moderate for exact enrollment counts because the chapter and note differ","basis":"Poeze cites contemporary press and colonial records, but the original issues and cited mail report have not been examined. Do not silently harmonize 50/64/80/123.","next":"Retrieve Soeara Ra’jat nos.10–12, the 27 October 1921 Semarang resident summary (mail report 1077x/21), and the cited school records; establish dates and whether counts refer to enrolled, present or cumulative pupils.","year":1921},{"id":"C1589","text":"Poeze reports that Tan Malaka’s SI school program combined practical subjects (arithmetic, writing, geography, Dutch, Malay and Javanese), student associations and self-directed activity with a stated duty toward poor Indonesians; the school also used Javanese song, wayang and other arts.","period":"1921–1922","type":"Later scholarly account of a contemporary education program","source_ids":["S895"],"confidence":"Moderate-high for what Poeze attributes to Malaka’s pamphlet; the original pamphlet has not been directly read","basis":"Poeze quotes and summarizes “S.I. Semarang dan Onderwijs” and the December 1921 brochure; this record is not an independent transcript of the brochure.","next":"Locate and compare the 1921 brochure and the corresponding Soeara Ra’jat installments; verify original Malay wording and the school’s curriculum records.","year":1921},{"id":"C1591","text":"Poeze reports that the colonial assistant-resident refused a requested fundraising bazaar permit, officials considered whether singing the Internationale could be prosecuted, and SI Semarang organized supervised pupil groups to collect donations in nearby kampungs.","period":"1921-07 to 1921-09","type":"Scholarly reconstruction from period press and cited colonial correspondence","source_ids":["S895"],"confidence":"Moderate-high for the actions as reconstructed; original correspondence and newspaper issues not opened","basis":"Poeze cites the Semarang resident’s school summary and contemporary press. A report of officials’ reasoning is not proof of every official’s private motive.","next":"Obtain mail report 1077x/21, Semarang resident/assistant-resident correspondence and Soeara Ra’jat nos.10–16; compare the stated grounds for permit refusal and legality review.","year":1921},{"id":"C1610","text":"VSTP leader Semaun was arrested on 8 May 1923; the railway strike spread across multiple Javanese lines beginning the next day.","period":"1923","type":"peer-reviewed historical reconstruction","source_ids":["S913","S846"],"confidence":"High for the chronology reported in the article; medium for exact workforce totals","basis":"Ingleson relies on contemporary press and Dutch archival references that were not all independently opened.","next":"Inspect Semarang resident letters, VSTP circulars and railway-company records.","year":1923},{"id":"C1628","text":"Darmini, identifying herself as Gerwani assistant general secretary, wrote in September 1954 that Monica Felton represented WIDF at the Gerwani congress and delegates from Dutch, Australian and Soviet women's organizations visited several Indonesian localities, where reception committees and public meetings were organized.","period":"1954","type":"Contemporaneous participant organizational account","source_ids":["S932"],"confidence":"High for published assertion; moderate-low for independently confirming itinerary and participation","basis":"Full modern transcription of Women of the Whole World No.9 p18 read; original issue scan, guest lists, travel documents and meeting notices not inspected. No inference of state command or funding.","next":"Retrieve original Women of the Whole World Sept 1954 p18, Gerwani 1954 congress minutes, WIDF/Union of Australian Women travel correspondence and local newspaper reports.","year":1954},{"id":"C2159","text":"Stutje cites IISH Archief Komintern–Partai Komunis Indonesia, inventory 10, as containing 1924 letters from Semaoen to the Comintern; he uses them to discuss Semaoen’s political networks and his efforts to recruit Indonesian students for Moscow study.","period":"1924 letters; dissertation published 2016","type":"Scholarly archival citation and interpretation","source_ids":["S1212"],"confidence":"High that the dissertation identifies this archival file group; moderate for its interpretation pending the letters","basis":"The IISH letters themselves were not opened; Stutje also cites colonial-security files which may have their own informant bias.","next":"Request IISH ARCH01744, inventory/folder 10 and compare Semaoen’s letters with recipients’ replies, travel and university enrolment records.","year":1924},{"id":"C2186","text":"Kankan Xie reconstructs that Musso and Alimin left Java after the 1926 Prambanan meeting and reached Moscow in July 1926 for Comintern consultations; the precise departure itinerary rests on Xie’s archival reconstruction.","period":"1926-07","type":"Travel and Comintern contact","source_ids":["S1254","S1213"],"confidence":"Source reliability: high for a full scholarly dissertation; fact confidence: medium; causal confidence: low for any inference from consultation to operational command.","basis":"Xie cites Comintern minutes and retrospective materials, but the underlying Moscow/Comintern files were not read in this tranche.","next":"Request IISH ARCH01744 and RGASPI meeting minutes; compare travel, border, party and police records.","year":1926},{"id":"C2187","text":"Xie dates the arrest of Alimin and Musso in Singapore to 18 December 1926, after British authorities intercepted their travel from Johor.","period":"1926-12-18","type":"Arrest and colonial policing","source_ids":["S1254"],"confidence":"Source reliability: high for the dissertation; fact confidence: medium-high; causal confidence: n/a.","basis":"The dissertation cites contemporary press and British records, but those underlying records were not directly inspected here.","next":"Read the cited Bataviaasch Nieuwsblad report, Singapore police/court files and British Colonial Office correspondence.","year":1926},{"id":"C2188","text":"Xie reports that a Singapore court rejected the Netherlands East Indies extradition request on 19 March 1927 and that Alimin and Musso were subsequently released to continue to Hong Kong.","period":"1927-03","type":"Court action and release","source_ids":["S1254"],"confidence":"Source reliability: high for Xie’s archival reconstruction; fact confidence: medium; causal confidence: n/a.","basis":"Court record, release order and passenger record were not directly accessed; “released” and actual onward travel need distinct proof.","next":"Obtain Singapore court judgment, detention register, British Colonial Office files and passenger/immigration records.","year":1927},{"id":"C2189","text":"Morriën reports that Musso returned clandestinely to Indonesia on 16 June 1935, probably using an Australian passport, after preparations involving the Dutch Communist Party/Comintern network.","period":"1933–1935","type":"Clandestine travel / foreign-party support","source_ids":["S1244"],"confidence":"Source reliability: medium-high as an archival-based study; fact confidence: medium; causal confidence: medium for logistical support, not for command over subsequent actions.","basis":"Morriën explicitly qualifies the passport identification as probable and cites earlier work and party/Comintern records; originals were not read.","next":"Inspect CPN trip-support papers, Comintern travel/finance files, passport or border records and Dutch PID surveillance files.","year":1933},{"id":"C2190","text":"Morriën describes Musso’s 1935 Surabaya base, contacts around the magazine Indonesia Berdjoang, a small clandestine PKI network and Comintern money for the publication.","period":"1935–1936","type":"Underground organization and funding","source_ids":["S1244"],"confidence":"Source reliability: medium-high for the author’s archival-based account; fact confidence: medium; causal confidence: medium for the described support mechanism, unresolved for operational effects.","basis":"Morriën cites Comintern and CPN material, but does not reproduce the full source set in the paper; exact amounts and payers remain unknown.","next":"Find publication accounts, CPN/Comintern remittance records, print runs, correspondence, couriers and local police seizure reports.","year":1935},{"id":"C2191","text":"Morriën reports that Musso and Tamzil communicated with Dutch CPN contacts through covering addresses and couriers, with information relayed through Anton Struik in Moscow to Comintern offices.","period":"1935–1936","type":"Foreign communication channel","source_ids":["S1244"],"confidence":"Source reliability: medium-high for the cited archival reconstruction; fact confidence: medium; causal confidence: medium for the channel’s existence, low for its influence on particular Indonesian decisions.","basis":"Underlying letters, courier identities and coded-name key were not read; the paper says some names and places used numeric codes.","next":"Retrieve the cited Comintern/CPN correspondence and key; trace each courier, covering address, date, recipient and response.","year":1935},{"id":"C2192","text":"Morriën reports that Musso left Indonesia on 11 May 1936 via Bali, Hong Kong and Shanghai for Moscow after the PID learned of his presence; the paper does not establish a formal arrest or deportation.","period":"1936-05-11","type":"Departure and colonial surveillance","source_ids":["S1244"],"confidence":"Source reliability: medium-high for the archival-based study; fact confidence: medium; causal confidence: medium for PID discovery preceding departure, not for who decided the exit.","basis":"Morriën’s text reports PID knowledge and Musso’s departure; no original surveillance report or passenger list was inspected.","next":"Request PID surveillance and port records; trace travel documents and Musso’s post-return Comintern report.","year":1936},{"id":"C2194","text":"Efimova reports that Musso met PKI member and Republican representative Suripno and Dutch Communist Party leader Paul de Groot in Prague in May 1948 and sent Moscow a report with a document titled Fundamental Tasks of the Communists in Indonesia.","period":"1948-05","type":"International communist meeting and document","source_ids":["S1240","S1243"],"confidence":"Source reliability: high for Efimova as summarized in a full scholarly review; fact confidence: medium-high for the reported document/meeting; causal confidence: medium for its role in later party policy.","basis":"The report and attachment are described through Efimova’s archival research; originals and Dutch/Chinese meeting records were not inspected here.","next":"Obtain Musso’s May correspondence, de Groot papers, Suripno files and Soviet Embassy/Foreign Relations Department copies.","year":1948},{"id":"C2196","text":"Sidel reports Efimova’s conclusion that Musso’s Prague plans were to a significant extent his own initiative rather than Moscow instructions; this conclusion concerns the Prague program and does not show that Musso lacked Soviet contacts or that no broader Soviet guidance existed.","period":"1948","type":"Historiographical interpretation / agency","source_ids":["S1240","S1243","S1238","S013"],"confidence":"Source reliability: high that Sidel accurately presents Efimova’s argument; fact confidence: medium for the underlying documentary interpretation; causal confidence: medium and limited to the program under discussion.","basis":"Poeze argues for international-communist links; McVey’s account relied on a sparse record. No direct operational order for the Madiun local action was opened here.","next":"Read the cited Soviet documents, Dutch and Chinese records, plus local Indonesian command/communications records; distinguish guidance, strategy, decision and execution.","year":1948},{"id":"C2199","text":"Anderson reconstructs the 18 September Madiun seizure as beginning with local FDR-linked groups and military actors; Musso, Amir Sjarifuddin and Suripno were away from the city at the outset and learned of developments through radio before travelling there.","period":"1948-09-18 and following days","type":"Local action chronology / military history","source_ids":["S1245","S1255"],"confidence":"Source reliability: high for a detailed scholarly study plus a separate interested-party testimony; fact confidence: medium-high for leaders’ absence at initial seizure, subject to source review; causal confidence: medium that local conflict shaped escalation.","basis":"Anderson’s synthesis draws on regional/military materials. Aidit’s 1955 statement is a defense, not neutral corroboration. The exact sequence and local chain of command need original radio, order and unit records.","next":"Obtain Madiun radio logs, local military orders, telegrams, district-government records and dated testimony from all factions.","year":1948},{"id":"C2200","text":"In his 24 February 1955 courtroom defense, Aidit asserted that Musso, Amir Sjarifuddin and other national leaders were not in Madiun during the initial disarmament and provisional appointment, and that Musso’s group reached Madiun late on 18 September 1948.","period":"1948 events as recounted 1955-02-24","type":"Interested-party testimony","source_ids":["S1255"],"confidence":"Source reliability: high that this is Aidit’s recorded defense text; fact confidence: medium for the claimed arrival sequence; causal confidence: low for his broad conclusion that PKI/FDR had no seizure plan.","basis":"Aidit was defending the PKI before a court and contesting government charges. The statement establishes what he argued, not the full truth of the command question.","next":"Compare court transcript, radio logs, travel and meeting records, and independent local accounts.","year":1948},{"id":"C2235","text":"1953 East Java history says Madiun action began about 3 a.m. on 18 September, ended by 7 a.m., and at 10 a.m. a radio report announced a Front Nasional government with Soemarsono as military governor.","period":"1948-09-18; Madiun","type":"Retrospective official account","source_ids":["S1269"],"confidence":"Medium for what publication states; logs/orders needed.","basis":"Find RRI and administrative records.","next":"Obtain 18 September Madiun radio logs, Front Nasional notices, and unit orders; compare the 1953 retrospective wording.","year":1948},{"id":"C2236","text":"Poeze/Schulte Nordholt describe Soemarsono as leader of the Madiun Action Committee and the Front Nasional government as regional, not a national countergovernment.","period":"1948-09; Madiun","type":"Scholarly reconstruction","source_ids":["S058","S1266"],"confidence":"High for authors’ interpretation; local minutes still needed.","basis":"Find local decrees and appointment lists.","next":"Trace the chapter’s underlying sources for the Action Committee and regional-government characterization.","year":1948},{"id":"C2237","text":"The 1949 report attributed to Soemarsono says he met FDR leaders around 10–11 September and was instructed by Musso, Amir, Setiadjit, Wikana and Harjono to disarm Military Police and Siliwangi units.","period":"1948-09; Madiun","type":"Participant account through later scholarship","source_ids":["S1266","S058","S1287"],"confidence":"High that scholars attribute this to the report; unresolved as historical command fact.","basis":"Report written under Dutch custody and later narratives changed.","next":"Retrieve the 11 November 1949 report, Dutch interrogation file, and its chain of custody.","year":1948},{"id":"C2348","text":"Aidit’s 1963 report says the 1951 reconstruction used Central Committee-appointed provincial commissariats because local organizations were confused, while inter-island communications and transport remained a serious problem.","period":"1951–1963","type":"Party organizational self-description","source_ids":["S1329"],"confidence":"High for the report’s statement; moderate for nationwide implementation and scale","basis":"The text explains the party’s chosen central-supervision structure and explicitly notes the archipelago communications problem; no provincial reports were independently checked.","next":"Retrieve appointment, courier, travel, transport, membership and provincial committee records for multiple islands.","year":1951},{"id":"C2449","text":"TAPOL reported in 1982 that Munir was SOBSI General Secretary and Ruslan deputy General Secretary at the time the federation was banned, while describing Munir as deputy General Secretary from 1952.","period":"1950–1965","type":"Advocacy-bulletin biographical account","source_ids":["S1363"],"confidence":"High that TAPOL printed these titles and career dates; medium for the exact office chronology","basis":"Hearman 2016 and 2024 use different translated titles and describe different dates/offices. The discrepancy may reflect rank changes over time or terminology; it should not be silently harmonized.","next":"Check SOBSI congress proceedings, executive rosters, Indonesian union newspapers and WFTU records.","year":1950},{"id":"C2451","text":"TAPOL reported that Munir began full-time SOBSI work in 1950 and became a deputy General Secretary in 1952.","period":"1950–1952","type":"Biographical/organizational claim","source_ids":["S1363"],"confidence":"High that TAPOL reports these dates; medium for exact appointment chronology","basis":"TAPOL is an advocacy bulletin; later scholarly sources use different titles but corroborate a senior SOBSI/WFTU role.","next":"Check SOBSI congress and executive records.","year":1950},{"id":"C2452","text":"Hearman reports that Munir was a WFTU General Council member and Ruslan a SOBSI deputy secretary-general/WFTU General Council member; her 2016 article uses a different SOBSI rank for Ruslan than her 2024 article.","period":"1953 and later career chronology","type":"Scholarship and office-title comparison","source_ids":["S337","S845"],"confidence":"High that the articles report these distinctions; medium for exact rank-and-date reconciliation","basis":"These are two articles by the same scholar and are not independent sources; translated titles may vary across time or publication.","next":"Check WFTU congress minutes, SOBSI leadership lists and the original language used in organizational publications.","year":1953},{"id":"C2453","text":"TAPOL reported that Ruslan had fought Dutch forces after the 1945 independence proclamation, commanded Pesindo troops, and entered SOBSI leadership after the transfer of sovereignty.","period":"1945–1965","type":"Biographical claim from advocacy bulletin","source_ids":["S1363"],"confidence":"High that TAPOL reports these details; medium for exact unit and command title","basis":"No military service file or Pesindo roster was consulted.","next":"Find Pesindo rosters, veteran registration, SOBSI files and family records.","year":1945},{"id":"C2640","text":"Hearman reports Pudji as third chair of the Surabaya Gerwani branch and a leader of the PKI-established People’s University in Surabaya.","period":"1950s–1965","type":"Secondary biographical reconstruction","source_ids":["S1417"],"confidence":"High that the article states these roles; moderate pending cited records.","basis":"These are Pudji’s offices and should not be attributed to Gatot; article cites McVey and letter materials not independently examined here.","next":"Check Gerwani branch rosters, People’s University staff lists and local education records.","year":1950},{"id":"C2696","text":"The December 1968 CIA study reconstructs the first planning meeting on 6 September 1965 at Captain Wahjudi’s home: it says Sjam introduced the Generals’ Council threat and proposed a new government/Revolutionary Council, while the officers asked how the Council would be formed and who would lead it.","period":"1965-09-04 to 1965-09-06; Jakarta","type":"Retrospective intelligence reconstruction based on participant interrogations","source_ids":["S251"],"confidence":"High that the CIA report gives this account; low-to-moderate for the actual meeting details and their completeness.","basis":"CIA study printed pp.109–113, especially its account of 4 Sep contact and 6 Sep meeting. The foreword states that its account of the conspiracy derives entirely from interrogations of participants; no authenticated meeting notes, participant’s contemporary diary or complete uncoerced transcript was checked. The CIA’s account does not establish that the full Politburo or PKI Central Committee authorized the operation.","next":"Obtain the cited Latief/Untung/Wahjudi interrogation and trial records, compare their wording and timing, search Sjam/Pono and military correspondence, and seek any surviving Central Committee or Special Bureau minutes.","year":1965},{"id":"C2792","text":"Hill quotes Adjitorop's autobiography as saying that on 22 February 1966 he received a Politburo decision authorizing him to lead the PKI Central Committee Delegation abroad.","period":"1966-02-22","type":"Retrospective autobiographical statement transmitted by scholarship","source_ids":["S1477"],"confidence":"High that Hill reports this statement; moderate-to-low that the quoted decision occurred in precisely this form until the cited paper is inspected.","basis":"Hill, printed p.350, note 31 cites Jusuf Adjitorop Papers, Indonesian Exiles of the Left collection, IISH, Bundle IV, Item 23, p.12; the original is not directly inspected.","next":"Retrieve the autobiography, any written Politburo decision, Delegation appointment notice, and early 1966 communications to party branches.","year":1966},{"id":"C2849","text":"Hill reports Ibrahim Isa served as Indonesia’s resident representative at AAPSO in Cairo (1960–1965), led a pro-Sukarno Indonesian delegation to the January 1966 Tricontinental Conference in Havana and joined the Beijing CC-PKI Delegation staff after arriving from Havana.","period":"1960–1966; Cairo / Havana / Beijing","type":"Scholarly biography linking international solidarity and PKI exile organizations","source_ids":["S1503"],"confidence":"High that the article reports these posts; moderate-high pending travel, appointment and organizational files.","basis":"Hill cites McGregor/Hearman, Manap and Hearman; OISRAA, AAPSO, Tricontinental delegation and CC-PKI role are distinct bodies.","next":"Retrieve AAPSO appointment files, Havana delegate list, travel/passport record, OISRAA bulletins and Beijing Delegation roster.","year":1960},{"id":"C2850","text":"Jusuf Adjitorop’s autobiography, as cited by Hill, says he was sent to China for medical treatment in June 1964 and received a Politburo decision on 22 February 1966 authorizing him to lead the PKI Central Committee Delegation abroad.","period":"1964-06 to 1966-02-22; China","type":"Later participant autobiography cited in peer-reviewed research","source_ids":["S1503"],"confidence":"High that the autobiography as cited gives this account; moderate for its complete institutional authorization because the manuscript/minutes were not directly inspected.","basis":"Hill cites IISH Jusuf Adjitorop Papers, Bundle IV, Item 23, pp.12; the archive item is not directly retrieved.","next":"Request the IISH item, medical/travel record, original Politburo decision and Delegation roster.","year":1964},{"id":"C2851","text":"Hill reports Beijing recognized the CC-PKI Delegation as the sole legitimate PKI representation abroad and that it coordinated exile regrouping, publications and overseas party contacts.","period":"1966 onward; Beijing and exile networks","type":"Scholarly account of an external political-organizational channel","source_ids":["S1503"],"confidence":"High that Hill reports the recognition and activities; moderate for the scope of external authority; it does not establish control over domestic underground cells.","basis":"Article combines archival and exile sources; distinguish representation abroad from domestic command.","next":"Find Chinese recognition/liaison records, Delegation mandates, publication files and communication with specific Indonesian regional groups.","year":1966},{"id":"C2852","text":"Hill reports that the Chinese Communist Party host determined major conditions of Indonesian exiles’ residence, work and funding, while communications with Chinese authorities generally passed through the CC-PKI Delegation.","period":"1966 onward; China","type":"Scholarly interpretation of host-state administration and party gatekeeping","source_ids":["S1503"],"confidence":"High that this is the article’s documented interpretation; moderate for consistency across all exiles and years. It supports material/communications leverage but not by itself Chinese control of PKI doctrine or Indonesian operations.","basis":"Hill draws on interviews, memoirs and archives and also notes that exiles themselves ran much of their criticism/re-education.","next":"Seek Chinese liaison, residence, assignment and funding records alongside exiles who opposed or bypassed the Delegation.","year":1966},{"id":"C2860","text":"The September 1966 Political Bureau self-criticism reprinted by the PKI Delegation in 1971 says the leadership committed “adventurism” by violating party organization principles and involving itself in the September 30 Movement without high mass consciousness, thereby isolating the Party from the masses.","period":"1966-09 retrospective account of 1965; Central Java / national party","type":"PKI Political Bureau self-criticism as republished by the exile Delegation","source_ids":["S1505"],"confidence":"High that the text makes this internal accusation; low-to-moderate as a complete factual description of G30S decision-making because it is retrospective, factional and not supported here by underlying minutes.","basis":"1971 compilation reproduces a text dated Central Java, September 1966; it frames the account within a post-defeat Maoist line.","next":"Compare with the August 1966 statement, Supardjo postmortem, Sjam/Untung/Aidit records, party minutes and regional command evidence.","year":1966},{"id":"C2861","text":"The September 1966 self-criticism says that after the September 30 Movement’s defeat the Party leadership adopted “Right opportunism” by entrusting the fate of the Party and revolutionary movement to President Sukarno’s policy.","period":"After 1965-10-01; PKI leadership","type":"PKI Political Bureau’s retrospective self-criticism","source_ids":["S1505"],"confidence":"High that the text makes this diagnosis; it is not an independently tested explanation of all PKI decisions or Sukarno’s actual capacity.","basis":"Text printed in the Delegation’s 1971 compilation, original 1966 text not directly inspected.","next":"Compare Sukarno–Aidit correspondence, Politburo instructions, public appeals, military orders and surviving regional reports.","year":1965},{"id":"C2862","text":"The September 1966 self-criticism interprets the PKI’s earlier goal of achieving people’s democracy through parliamentary elections/peaceful means as a Rightist deviation, and its later political programme calls for armed peasant struggle and rural revolutionary bases.","period":"1951–1966 retrospective doctrinal review; Indonesia","type":"PKI post-defeat party line and political self-interpretation","source_ids":["S1505"],"confidence":"High that the compilation’s texts present this diagnosis and future programme; low as proof that pre-1965 practice was simply peaceful or that the new programme was implemented nationwide.","basis":"The compilation is a factional 1971 presentation; doctrinal self-description must be compared with pre-1965 party speeches, organizational practice and regional military evidence.","next":"Compare complete 1954/1959/1962/1965 resolutions, Aidit’s 1960 speech, volunteer training, Biro Chusus records and post-1966 domestic underground evidence.","year":1951},{"id":"C2863","text":"The September 1966 self-criticism itself says the terror prevailing at the time made it difficult to produce a complete criticism and asks members to continue examining the party’s ideological, political and organizational errors.","period":"1966-09; Central Java","type":"Contemporaneous self-description of limits under repression, reprinted later","source_ids":["S1505"],"confidence":"High that the text states this; it flags incompleteness of the document’s own account.","basis":"Text appears in the 1971 compilation; original distribution and readership are not established.","next":"Locate original text copies, discussion notes and evidence of how the claimed criticism was circulated inside Indonesia.","year":1966},{"id":"C2880","text":"Pauker’s 1969 RAND report says Rewang was killed during the 1968 South Blitar campaign; Hearman’s interview-based biography and 1990–91 TAPOL and Amnesty reports identify the same leader as arrested in 1968, tried and imprisoned, then released on 24 July 1991. The report’s fate statement is wrong.","period":"1968-07 to 1991-07; South Blitar, Semarang/Jakarta","type":"Contemporaneous analytical report contradicted by participant and near-contemporary human-rights reporting","source_ids":["S1358","S1310","S1508","S1509","S1510"],"confidence":"High that Pauker printed the erroneous fate and that Rewang survived imprisonment to 1991; exact capture day remains disputed.","basis":"Pauker printed p.62 says Rewang was killed. Hearman (2010) reports an interview with Rewang on 14 Feb 2009 and a 1971 life sentence; TAPOL 1990 records trial/appeal/commutation and continued detention; TAPOL 1991 and Amnesty confirm the 1991 release. No original trial judgment or prison register has yet been obtained. This establishes a specific report error, not that every RAND estimate is false.","next":"Obtain Rewang’s Semarang trial docket and judgment, 1975 appeal, 1985 commutation, Cipinang intake/release registers, family correspondence and the Brawijaya capture log; resolve the 13/14/20/21 July date variants.","year":1968},{"id":"C2882","text":"Hearman’s 2017 account reports that Trisula deployed about 5,000 soldiers from six battalions and 3,000 militiamen across three operation zones in an area of roughly 3,000 km²; it describes army caretaker administration, population registration, village evacuation and screening, crop removal, forced village patrols, burial of the dead and detained villagers’ compulsory roadbuilding labour.","period":"1968-05 to 1968-09; South Blitar, East Java","type":"Peer-reviewed historical reconstruction of counterinsurgency scale and civilian control, partly attributed to Army reporting and oral histories","source_ids":["S1394","S1425","S1310"],"confidence":"High that Hearman reports these mechanisms and force figures; moderate for exact force totals and individual coercion patterns absent original orders and unit logs.","basis":"The article distinguishes reported TNI numbers, oral histories and later Army narrative. These figures are deployment estimates, not a verified unit muster. Forced work, crop removal, evacuation and detention are distinct from combatant deaths and cannot be folded into casualty totals.","next":"Obtain six-battalion operational orders, muster/payroll and militia rolls, village caretaker and screening registers, evacuation/camp lists, food supply records, patrol tasking, road work records, and family interviews from each operation zone.","year":1968},{"id":"C2884","text":"Hearman reports Pudji Aswati, a former teacher and Gerwani member, was detained for about ten years before a 1978 trial, sentenced to 15 years without credit for that detention, and released in 1989 while gravely ill.","period":"1967 to 1989; South Blitar and Malang","type":"Retrospective scholarly account of an individual political-prisoner case","source_ids":["S1425","S1394"],"confidence":"High that Hearman reports these facts; moderate for exact sentence computation and dates pending the court and prison file.","basis":"The accessible author-written account is not the judgment, custody log or release order; it does not allow a generalization to all Trisula detainees.","next":"Obtain Pudji Aswati’s arrest/custody chronology, 1978 indictment and judgment, sentence calculation, prison medical file and 1989 release register; seek family and former-prisoner testimony.","year":1967},{"id":"C2885","text":"Hearman reports Gatot Lestario, described as a secretary of the South Blitar base and husband of Pudji Aswati, was sentenced to death and executed in July 1985; the couple’s two children had been cared for by relatives after the parents went underground in 1967.","period":"1967 to 1985; South Blitar, East Java","type":"Retrospective scholarly account of an individual execution and family separation","source_ids":["S1425","S1394"],"confidence":"High that Hearman’s account reports this sequence; moderate until the conviction, execution and family records are obtained.","basis":"The reported role/title is not an independently verified command position; the article is not a trial or execution record. The case indicates long-term punishment of the 1968 network but does not establish a count of executions.","next":"Locate the court judgment, clemency decision, execution order and civil death record; seek prison correspondence and family-care documentation.","year":1967},{"id":"C2890","text":"Chandra reports that between the 1955 national and 1957 local elections in Central Java, PKI votes increased by 800,340 while PNI votes fell by 335,944; he calculates a district-level correlation of about −0.53 between changes in their vote shares.","period":"1955–1957; Central Java","type":"Aggregate electoral change reported by a secondary study","source_ids":["S1512"],"confidence":"High that the paper reports these values; underlying official election returns and the causal interpretation were not independently checked.","basis":"The paper cites Hindley’s 1966 table for vote totals and presents the cross-area relationship as evidence of rapid PKI gains and PNI losses. Aggregate change cannot show that specific individuals switched parties or prove that electoral competition caused later violence.","next":"Inspect Hindley’s cited table and official election returns; compare local party organization records and contemporary PNI/PKI correspondence.","year":1955},{"id":"C1504","text":"Vannessa Hearman's article identifies SOBSI metalworker Adam Soepardjan as a WFTU-affiliated representative who traveled to the German Democratic Republic and Czechoslovakia in 1959 and later wrote travel notebooks in prison in 1975–1976.","period":"1959; 1975-1976","type":"Later scholarly reading of personal notebooks and memoir","source_ids":["S845"],"confidence":"High for the article's account; original notebooks, prison records and full custody history were not inspected","basis":"Hearman 2024, pp. 1–7, uses Soepardjan's travel accounts and handwritten prison notebooks as a personal archive; his later account should be read as memory written under New Order imprisonment.","next":"Locate the notebooks, 2004 memoir, WFTU/FDGB invitation and travel documentation, Indonesian passport/visa files and detention/release records.","year":1959},{"id":"C2911","text":"Hearman's study describes Hadi Soedardjo as a vice-president of the Indonesian oil workers' union Perbum who joined metalworker Adam Soepardjan in a 1959 labor delegation to the German Democratic Republic.","period":"1959","type":"Scholarly reconstruction of named worker delegation and industry union role","source_ids":["S845"],"confidence":"High for published scholarly account and identification; original travel papers and union elected-officer register not yet inspected.","basis":"S845 discusses worker delegation and 1959 photographs/notes. A person from Perbum does not establish that Perbum membership is identical to SOBSI or PKI membership.","next":"Get 1959 Perbum officer list, Indonesian delegation travel approval and WFTU meeting roster.","year":1959},{"id":"C2910","text":"White, Graham and Savitri call Indonesia's share-tenancy law a 1959 law in their retrospective agrarian-movement article, whereas the government JDIH record identifies it as Law No. 2/1960 enacted on 7 January 1960; Law No. 5/1960 is separately dated 24 September 1960.","period":"1959–1960; discrepancy reviewed 2026-11-24","type":"Explicit scholarly-secondary versus primary legal-date conflict","source_ids":["S041","S038","S037"],"confidence":"High for conflicting source wording and official law numbers/dates; no evidence that 1959 means an enacted law or necessarily a draft.","basis":"S041 text uses 1959; S038 official law record and S037 official basic agrarian text. This is a date-of-enactment correction, not evidence of how village contracts were implemented.","next":"Examine 1959 legislative drafting debates and county-level 1960 implementation documents before interpreting authors' reasons for the year mismatch.","year":1959},{"id":"C316","text":"Amnesty recorded in 1977 political prisoner Sri Ambar, the SOBSI women's section head, as arrested 1966 and sentenced after a 1975 trial to 15 years at
