window.HIST.events.push(...[{"id":"event-1960-share-tenancy-law","title":"1960年1月7日：分成佃作合同法实施","description":"1950年代的印尼农村存在土地所有者、佃作者和季节性农业劳动者之间不同的收成分配与契约关系。1960年第2号法律《分成佃作合同法》（Undang-Undang Nomor 2 Tahun 1960 tentang Perjanjian Bagi Hasil）于1月7日公布并生效，确立国家对相关分成合同关系的法律安排。它不等于同年9月第5号土地基本法，也不等于每一个农村家庭即时获得个人地契。BTI及其他农民组织随后可以借法律提出执行和协调要求，如何签约、谁分粮、哪些人实际获益则需要地方合同、土地委员和法院材料。White等2023年论文曾将该法称为‘1959 Law on Share Tenancy’，这一书写与BPK官方法规编号及公布时间矛盾：应优先使用正式法律元数据，但不能擅自猜测作者是否指早期草案。","period":"1960-01-07","people":[],"orgs":["bti"],"process_id":"pr-027","evidence_urls":[{"label":"BPK官方法规：UU 2/1960","url":"https://peraturan.bpk.go.id/Details/51300/uu-no-2-tahun-1960"},{"label":"White等2023农村运动研究","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.12506"}],"limitations":"官方法律编号和公布日期可直接查阅；村落实际签约、履约和分配并未逐户核实。","claims":["C019","C2910"]},{"id":"event-1960-basic-agrarian-law","title":"1960年9月24日：《基本土地法》公布","description":"共和国在殖民地继承下的土地所有、习惯权利、私人占有和国家规划之间面临多重冲突。1960年第5号法律《基本土地法》（Undang-Undang Pokok Agraria，UUPA）于9月24日生效，构成其后土地权利与农业改革的重要法律框架。它不等于1月的佃作分成合同法，且法律生效、各省土地委员会设立、村级丈量、持地人登记以及农业互助发生在不同时间。Gerwani要求妇女独立享有土地权与参加村务会议，也必须由地方实际登记和职位来检验。不能因曾参加一次妇女大会，就推断特定妇女确实取得地契。","period":"1960-09-24","people":[],"orgs":["bti","gerwani"],"process_id":"pr-027","evidence_urls":[{"label":"BPK官方法规：UU 5/1960","url":"https://peraturan.bpk.go.id/Details/51310/uu-no-5-tahun-1960"}],"limitations":"已定位正式法规及法律日期，缺各地区具体土地执行记录。","claims":["C019"]},{"id":"event-adam-1959-wftu-travel","title":"1959年春夏：泗水厂级工会代表参加东欧工会交流","description":"泗水Ngagel机器厂职工阿丹·苏帕尔詹（Adam Soepardjan）是SBIM金属工会厂分会负责人，1959年以SOBSI代表身份前往东德和捷克斯洛伐克参加工会活动；同行的哈迪·苏达尔佐来自石油工会Perbum，两人的产业与组织身份并不相同。活动的讨论对象涉及国际工运、工业生产及政治交流；当年公开宣传与阿丹在1975—1976年被拘押期间留下的回忆之间也有差异。正式派遣令、个人护照及企业原始会费记录尚未取得，不能因为一个人出访就说整个工厂参加跨国政治活动。","period":"1959-04—1959-07","people":["person-adam-soepardjan","person-hadi-soedardjo-1959"],"orgs":["sbim-ngagel","sobsi","perbum-1959","wftu"],"process_id":"pr-025a","evidence_urls":[{"label":"Hearman，International Review of Social History，Adam工运生涯与旅行","url":"https://www.cambridge.org/core/journals/international-review-of-social-history/article/from-travel-to-imprisonment-remembering-cold-war-trade-unionism-and-the-world-federation-of-trade-unions-wftu-in-adam-soepardjans-prison-notebooks/5D2B6B5169AABB43099B9D1267190C86"}],"limitations":"1959活动据回忆/照片和学者核读，非所有派遣原件均已获得。","claims":["C1504","C2911"]},{"id":"event-adam-1965-arrest","title":"1965年10月20日：工人阿丹·苏帕尔詹被拘押","description":"曾在泗水Braat/Barata机器厂任SBIM分会主席的阿丹·苏帕尔詹于1965年10月20日被捕。学者根据他的回忆、家人和手稿资料记其后来在东爪哇包括卡利索索克在内的监狱未经审判被关押约13年。此前参与SOBSI的合法工会及1959年国际活动，并不能直接证明他参加了1965年9月底至10月初的军官行动。阿丹在狱中写英语教材是其谋生打算的一部分；1978获释后转依靠亲友和私人教学，1980年再次在泗水谋生。这条历史将职工身份、监狱生活和出狱后的生计连贯起来，但原拘押令、逐次监狱调转和解除限制文书仍待寻找。","period":"1965-10-20—1980","people":["person-adam-soepardjan"],"orgs":["sbim-ngagel","sobsi"],"process_id":"pr-035a","evidence_urls":[{"label":"Hearman：狱中手稿与工会个人经历","url":"https://www.cambridge.org/core/journals/international-review-of-social-history/article/from-travel-to-imprisonment-remembering-cold-war-trade-unionism-and-the-world-federation-of-trade-unions-wftu-in-adam-soepardjans-prison-notebooks/5D2B6B5169AABB43099B9D1267190C86"}],"limitations":"学术整理与当事回忆支持这一轨迹；官方监狱出入登记尚未逐件核。","claims":["C1504"]},{"id":"event-hkti-1973-formation","title":"1973年：BKST与HKTI的农村代表体系重新组织","description":"1965年以后原来的农民组织与乡村政治网络面临禁止、拘押和新的行政关系。1973年前后，新秩序当局支持农民组织再编组，军队—农民合作机构BKST成为这一进程中的协调节点，HKTI（Himpunan Kerukunan Tani Indonesia）形成新的全国农民代表体制。相同村社的种地者没有因此自然成为原BTI组织的继承成员；新机构的章程与领导人员，以及土地、信贷、农药和灌溉管理需要分开核查。White等的学术综合能够提供国家制度变化，但尚不足以告诉我们哪个村的谁转入HKTI、谁被排除。","period":"1973","people":[],"orgs":["bkst-1973","hkti-1973","bti","golkar"],"process_id":"pr-036a","evidence_urls":[{"label":"White等：农业运动在新秩序下的重组","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/joac.12506"}],"limitations":"国家级组织历史据后出学术研究；1973年原章程、地方名单和财政账未取得。","claims":["C124","C239"]},{"id":"event-amnesty-1977-union-detainees","title":"1977年9月23日：国际特赦组织发布逐名工会拘押者报告","description":"1977年9月23日，国际特赦组织国际秘书处公布《Political Prisoners in Indonesia — Trade Unionists》（ASA 21/09/77），记录当时掌握的工会相关政治拘押者信息。名单列SOBSI妇女部门负责人Sri Ambar、同时活跃于BTI与Gerwani的Kartina Kurdi、雅加达联合利华厂工会会员Kusnah、航空职工工会会员Sri Suharti、邮电职工Satijah、教师工会会员Sedijami等，并指明各自被捕年份和当时拘押地点。Sri Ambar据报1975年已受审，不能把名单所有人都统一称作未受审者；受访和救援组织公开的名单也不能直接当作官方完整监狱名册。这份材料有助于恢复具体工作、工会、家庭与拘押关系，而不能因为同在名单就将她们倒推为一个中央秘密组织的行动者。","period":"1977-09-23","people":["person-sri-ambar-sobsi-1977","person-kartina-kurdi-1977","person-kusnah-unilever-1977","person-sri-suharti-aviation-1977","person-satijah-post-1977","person-sedijami-teacher-1977"],"orgs":["sobsi","sobsi-women-division","gerwani","bti","serbaud-aviation"],"process_id":"pr-035b","evidence_urls":[{"label":"Amnesty International，ASA 21/09/77，五页扫描原件","url":"https://www.indonesia1965.org/content/uploads/2023/08/ASA-21-09-77-Occupational-list-of-Prisoners-trade-unionists.pdf"}],"limitations":"确已审阅1977年影印公开文本；个人职务、司法及之后去向仍须同原雇主、法院和监狱文书交叉核实。","claims":["C316","C317","C2905","C2906","C2907","C2908","C2909"]},{"id":"event-pertanu-1962-tegal-letter","title":"1962年11月6日：Pertanu中爪哇地区机关要求整顿直葛分会","period":"1962-11-06","description":"中爪哇Pertanu负责人Imam Churmen及秘书Slamet Sardho在给地方组织的信函中，批评直葛（Tegal）分会没有充分向中央汇报和参加执行分成佃作合同法及土地改革的工作，要求进行分会领导层调整。这份后被Luthfi 2017引述的ANRI藏卷1548，能够展示伊斯兰教士联合会相关农民团体内部也存在监督、政策选择和执行不力争论。发出重组要求不能证明真的完成改选，地方农民更不能自动被写成集体赞成或反对某党。","people":["person-imam-churmen-pertanu","person-slamet-sardho-pertanu"],"orgs":["pertanu","pertanu-tegal-1962","nu"],"process_id":"pr-027f","claims":["C2913","C2918"],"evidence_urls":[{"label":"S1541 Luthfi 2017 Bhumi pp147–149，引用ANRI 1548","url":"https://www.jurnalbhumi.stpn.ac.id/index.php/JB/article/view/121"}],"limitations":"已核学术刊物公布的信函文字和档号；尚未独立核ANRI信件全文、收文或地方执行结果。"},{"id":"event-pertanu-petani-1966-land-defense","title":"1966年6—11月：外南梦Pertanu与Petani保护土地受益人的交涉信","period":"1966-06-23—1966-11-25","description":"6月23日，Pertanu外南梦分会主席Soehaimi向国家橡胶种植园申诉，要求停止驱赶长期耕作Wadoeng West土地的农户、停止破坏农作物，并提议与伊斯兰工会Sarbumusi一同协商。11月13日，Pertanu与民族主义农会Petani在Bangorejo针对农地重新被占和43名农户土地证件被警方收走的情况发函。11月25日，Petani第一主席Djoehdi与第二秘书Achmad Sanimin另行署名投诉。各函属于相互联系但不完全相同的行政行动；它们支持农会成员在1965后仍为具体农民争取权利的叙述，却不能证明官方最终完全照单执行。","people":["person-soehaimi-pertanu-banyuwangi","person-djoehdi-petani-banyuwangi","person-achmad-sanimin-petani"],"orgs":["pertanu-banyuwangi-1966","petani-pni-banyuwangi-1966","sarbumusi"],"process_id":"pr-033e","claims":["C2914","C2915","C2916","C2920"],"evidence_urls":[{"label":"S1541 Luthfi 2017 Bhumi pp150—152，书信与土地决定线索","url":"https://www.jurnalbhumi.stpn.ac.id/index.php/JB/article/view/121"}],"limitations":"2017论文引1966当期档案与1968农地行政决定，本研究未取得全部原始签名、法院、土地证书和逐户后来结果。"},{"id":"event-pertanu-hkti-1973-transition","title":"1973年4月26—27日：HKTI形成与Pertanu法律身份争议","period":"1973-04-26—1973-04-27","description":"一份已入库的机构史把1973年4月26日记为国家支持的农民组织HKTI成立日；Luthfi 2017记Pertanu与其他组织进入新体系的日期为4月27日。两天可能分别对应建会与组织并入程序，现阶段不能擅自把不同记载合为同一事件。原Pertanu领导人Imam Churmen后来说组织并未经过正式代表大会解散，提醒我们‘进入新官方体系’和‘原团体已合法注销’要分别考察。更不能从中央机构变化推算地方农户全体改变组织和土地关系。","people":["person-imam-churmen-pertanu","person-mohammad-munasir-pertanu"],"orgs":["pertanu","hkti-1973","bkst-1973"],"process_id":"pr-036c","claims":["C239","C2917"],"evidence_urls":[{"label":"S1541 Luthfi 2017 Bhumi p155及引述的Pertanu前任领导意见","url":"https://www.jurnalbhumi.stpn.ac.id/index.php/JB/article/view/121"}],"limitations":"需要1973年两天各自的正式大会纪要、签名、章程和Pertanu是否解散的法律记录；后出领导人陈述不等于裁决。"}]);

window.HIST.organizations.push(...[{"id":"isdv","name":"荷属东印度社会民主联盟","aliases":["Indische Sociaal-Democratische Vereeniging","ISDV","社会民主联盟"],"kind":"政治组织","period":"1914—1920","description":"1914年由斯内夫利特等社会主义者建立；通过VSTP铁路工会及SI地方网络与印尼活动者建立联系。1920年改组为共产主义政党；不能把1914年的会员自动当作1920年的党员。"},{"id":"si","name":"伊斯兰联盟","aliases":["Sarekat Islam","SI","Sarekat Dagang Islam","伊斯兰商人联盟"],"kind":"政治与群众组织","period":"1911—1920年代","description":"从商业和地方宗教社会网络发展为跨地区群众组织；中央与地方支部并不完全一致。共产党人的双重成员资格成为1921年前后组织纪律争论的具体问题。"},{"id":"vstp","name":"铁路与电车职工协会","aliases":["VSTP","Vereeniging van Spoor- en Tramwegpersoneel","铁路工会"],"kind":"产业工会","period":"1908—1920年代","description":"铁路与电车行业工会，初期欧洲职工占重要地位，随后吸纳大量印尼职工；是塞马温等人早期工会活动与1910—1920年代罢工的重要组织。"},{"id":"ppkb","name":"工人运动联合会","aliases":["PPKB","Persatuan Pergerakan Kaum Buruh"],"kind":"工会联合组织","period":"1919—1920年代","description":"多行业工会合作网络；1921年前后在政治方向和组织领导上出现分化。应具体区别各产业工会的成员、代表与实际决定。"},{"id":"rvc","name":"革命工会联合会","aliases":["RVC","Revolutionaire Vakcentrale","Revolutionaire Vak Centrale"],"kind":"工会联合组织","period":"1921—1920年代","description":"1921年从原有工会联合网络分出的一支，塞马温等人为负责人；不等同于PKI的正式中央委员会。"},{"id":"pki","name":"印度尼西亚共产党","aliases":["PKI","Partai Komunis Indonesia","Perserikatan Komunis di Hindia","Perserikatan Kommunist","印尼共产党","共产党"],"kind":"政党","period":"1920—1966被禁","description":"1920年由ISDV改组，1924年前后采用Partai Komunis Indonesia名称；在殖民镇压、独立革命和共和国时期经历多次组织重建。正式党员、同情者、群众组织会员和秘密联络员必须分别认定。"},{"id":"sr","name":"人民联盟","aliases":["Sarekat Rakyat","SR","人民同盟"],"kind":"群众政治组织","period":"1920年代","description":"由部分亲共的SI地方组织发展而来，与共产党存在政治和人员联系；不能把SR会员人数直接算为PKI党员人数。"},{"id":"pari","name":"印度尼西亚共和国党","aliases":["PARI","Partai Republik Indonesia"],"kind":"政治组织","period":"1927年起","description":"1927年丹·马拉卡、苏巴卡特与贾马鲁丁·塔明在曼谷建立的政治组织，有自己的秘密网络，不等于被镇压PKI的中央机关迁址。"},{"id":"pni","name":"印度尼西亚民族党","aliases":["PNI","Partai Nasional Indonesia","Perserikatan Nasional Indonesia","印度尼西亚民族主义党"],"kind":"政党","period":"1927年起","description":"最初1927年建立，名称和组织经历多次重建；不同地方组织、党员和中央派系并非一个固定统一的政治阵营。"},{"id":"masyumi","name":"马斯友美党","aliases":["Masyumi","Partai Masyumi"],"kind":"政党","period":"1945—1960被禁","description":"现代主义伊斯兰政治及社会网络的重要党派；需区别现代主义宗教组织及其社会联系与正式党机关。"},{"id":"nu","name":"伊斯兰教士联合会","aliases":["NU","Nahdlatul Ulama","伊联"],"kind":"宗教社会与政治组织","period":"1926年起","description":"依靠宗教学者、宗教学校和地方社会网络运行；1952年以后作为独立政党活动，并关联青年等组织；不是一个所有地方成员统一行动的单一主体。"},{"id":"psi","name":"印度尼西亚社会党","aliases":["PSI","Partai Sosialis Indonesia"],"kind":"政党","period":"1948—1960被禁","description":"与夏赫里尔等社会主义人士有关的党；与PKI及其他左翼组织在组织路线和国家政策上有不同立场。"},{"id":"bbi","name":"印度尼西亚劳动阵线","aliases":["BBI","Barisan Buruh Indonesia"],"kind":"劳动群众组织","period":"1945—1946","description":"独立革命期间出现的劳动组织网络，必须与同期劳动党及随后全国工会联合会区别。"},{"id":"pbi","name":"印度尼西亚劳动党","aliases":["PBI","Partai Buruh Indonesia"],"kind":"政党","period":"1945年起","description":"独立革命期间的劳动政治组织；与BBI劳动阵线有关联，但政党与工会机构不能互相等同。"},{"id":"sobsi","name":"全印尼工会中央组织","aliases":["SOBSI","Sentral Organisasi Buruh Seluruh Indonesia","全印尼工会联合会"],"kind":"工会联合组织","period":"1946—1965以后遭破坏","description":"1946年11月29日成立；联合铁路、种植园及其他产业工会。领导层与PKI关系密切，但普通工会会员未必具有PKI党籍。"},{"id":"sarbu","name":"种植园工人工会","aliases":["SARBUPRI","SARBUPRI plantation union","种植园工会"],"kind":"产业工会","period":"1940年代以后","description":"隶属SOBSI的种植园工会之一；具体行业会员、会费、劳动合同和厂场支部须按地点研究。"},{"id":"bti","name":"印度尼西亚农民阵线","aliases":["BTI","Barisan Tani Indonesia","印尼农民阵线"],"kind":"农民群众组织","period":"1945年以后","description":"围绕土地、租佃和乡村生产关系开展活动，同PKI存在密切政治联系；地方分支与国家土地改革机构的关系依各地条件不同。"},{"id":"gerwis","name":"觉悟妇女运动","aliases":["Gerwis","Gerakan Wanita Sedar","Gerakan Wanita Sadar"],"kind":"妇女组织","period":"1950—1954","description":"1950年成立；1954年第二次代表大会后改称Gerwani，其早期组织成员与活动须根据大会材料及地方社团记录区分。"},{"id":"gerwani","name":"印度尼西亚妇女运动","aliases":["Gerwani","Gerakan Wanita Indonesia"],"kind":"妇女组织","period":"1954—1965以后遭破坏","description":"由Gerwis改组，开展识字、托幼、婚姻权益、妇女劳动等活动；1954年章程将其定义为非政党妇女组织，不能把所有会员视为PKI党员。"},{"id":"lekra","name":"人民文化协会","aliases":["Lekra","LEKRA","Lembaga Kebudayaan Rakyat"],"kind":"文化组织","period": tion是报告用语。"},{"id":"pki-sawahlunto-1926","name":"沙哇伦多共产党地方小组（1926）","aliases":[],"kind":"PKI地方小组（待原始文书核实）","period":"1926年初","description":"殖民调查报告称1926年初与Solok和Silungkang人员一同质疑Sutan Said Ali转达命令；这是被调查报告描述的联合行动，不意味着整个城镇一致同意。"},{"id":"pki-silungkang-1926","name":"锡伦康共产党地方小组（1926）","aliases":[],"kind":"PKI地方小组（待原始文书核实）","period":"1926年初","description":"殖民调查报告称1926年初与Solok、Sawahlunto地方人员联合越级派使者求证中央命令。实际干部名单、成员数量与具体派遣文书未取。"},{"id":"aceh-military-1966","name":"亚齐省军方指挥机关（1965—1966）","aliases":[],"kind":"地方军事机关","period":"1965—1966","description":"以Ishak Djuarsa为指挥负责人；1965年10月政治组织禁令与1966年5月驱逐命令由不同具体文件规定，应按军令与行政管理机构逐案研究。"},{"id":"northaceh-military-1966","name":"北亚齐地方军事指挥机关（1966）","aliases":[],"kind":"地方军事机关","period":"1965—1966","description":"Melvin引述《Perkembangan 1966》描述304人被移交给当地军事指挥官，也描述LtCol Mohd. Sjakur在Lhokseumawe处理示威的行动。拘押、命令及人员编制尚无原件。"},{"id":"northaceh-pantja-1966","name":"北亚齐Pantja Tunggal联合机关","aliases":[],"kind":"地方军政协调机构","period":"1965—1966","description":"1966年4月与KAPPI学生代表彻夜商谈，报告称允许将被标为‘RRT Chinese’的人集中并交军方。该机关与军方、县政府不是同一法律实体；完整成员名册及原始会议记录未取。"},{"id":"aceh-kappi-1966","name":"亚齐KAPPI学生行动网络（1966）","aliases":[],"kind":"学生与政治行动网络","period":"1965—1966","description":"Melvin引述当时文件记录Bireuen/Lhokseumawe的部分学生行动、示威与集中拘人；KAPPI整体组织成员不等于参与该行动的每一个学生，不能将KAMI、KAPPI和其他群体视为同一组织。"},{"id":"aceh-baperki-1965","name":"亚齐Baperki地方组织网络（1965）","aliases":[],"kind":"地方社会政治团体","period":"1965—1966","description":"亚齐华人公民团体Baperki的地方人员与场所，在1965年秋遭行政禁令和政治迫害。与PKI部分人员/政治活动有联系，但全体成员绝不是PKI正式党员，也不代表亚齐全部华人。"},{"id":"gasbi","name":"印尼工会联合体（GASBI）","aliases":["Gabungan Serikat Buruh Indonesia"],"period":"1946年5月—11月","kind":"工会或国际工会组织","description":"由BBI相关组织与代表在1946年形成的工会联合架构之一；部分产业/职业工会不满其结构，另成GSBV。1946-11-29尝试同GSBV合并组成SOBSI。不得将GASBI、GSBV、SOBSI当成一个始终连续不变的会员名册。"},{"id":"gsbv","name":"垂直工会联合体（GSBV）","aliases":["Gabungan Serikat Buruh Vertikal","GASBEV"],"period":"1946年6月—11月","kind":"工会或国际工会组织","description":"因对GASBI的职工按行业／企业组织方式存在不同意见而形成；包含邮电、教育、交通/电力等职能部门代表的后出记录。1946年11月参与成立SOBSI，但代表名册及原合并协议仍待查。"},{"id":"sobri","name":"印度尼西亚共和国工会中央组织（SOBRI）","aliases":["Sentral Organisasi Buruh Republik Indonesia"],"period":"1951年起","kind":"工会或国际工会组织","description":"与穆尔巴党（Murba）有关的工会联合组织；不应混同1946年SOBSI或1948年GASBRI，二者名称相似但历史角色/起始时间不同。现有学术研究记载其1951年成立。"},{"id":"wftu","name":"世界工会联合会（WFTU）","aliases":["World Federation of Trade Unions"],"period":"1945年起","kind":"工会或国际工会组织","description":"1947年SOBSI首届大会决定加入的国际工会网络，1949年冷战时期发生分裂。国际会议、培训和差旅邀请是需要逐人核对的劳动者跨国活动，不等于全部印尼工会或党员享有统一授权。"},{"id":"sbii","name":"印尼伊斯兰工会（SBII）","aliases":["Serikat Buruh Islam Indonesia"],"period":"1947年起","kind":"工会或国际工会组织","description":"共和国初期与马斯友美党社会网络相关的工会组织之一；不是1955年出现的NU相关SARBUMUSI。成立及地方支部情况应逐会费、产业与成员档案核实。"},{"id":"rupindo-semarang","name":"三宝垄Rukun Putri Indonesia（Rupindo）","kind":"地方妇女政治组织","period":"1940年代—1950年6月","description":"后出研究列为Gerwis六个发起组织之一；三宝垄本地成员、实际代表及原组织财产/会费安排需查。","aliases":[]},{"id":"pws-surabaya","name":"泗水Persatuan Wanita Sedar","kind":"地方妇女政治组织","period":"1940年代—1950年6月","description":"以泗水为活动地点的妇女团体，后出资料列参与Gerwis建立；不能因为名称中有Sedar就与万隆Isteri Sedar合并。","aliases":[]},{"id":"isteri-sedar-bandung","name":"万隆Isteri Sedar","kind":"地方妇女政治组织","period":"1930年代—1950年6月","description":"左翼/民族主义妇女权利组织网络的一支，后出资料列为Gerwis六个合并前身之一；各时期地方组织与创始政治人物须分开审查。","aliases":[]},{"id":"gerwindo-kediri","name":"谏义里Gerakan Wanita Indonesia（Gerwindo）","kind":"地方妇女政治组织","period":"1940年代—1950年6月","description":"1940年代末活动的谏义里地方妇女组织；1950年被后出史籍列为Gerwis前身之一；名字与1954年后的Gerwani并不相同。","aliases":[]},{"id":"wanita-madura","name":"马都拉Wanita Madura","kind":"地方妇女政治组织","period":"1940年代—1950年6月","description":"后出资料列为Gerwis发起组织；有文献称Wanita Murba Madura，两种名称须核原章程与会议身份，不能擅定为同一团体全称。","aliases":[]},{"id":"pp-ri-pasuruan","name":"巴苏鲁安Perjuangan Putri Republik Indonesia","kind":"地方妇女政治组织","period":"1940年代—1950年6月","description":"据后出妇女运动研究列为六个前身组织之一，活动地点巴苏鲁安；原代表姓名、参与方式和组织延续尚无当期名册。","aliases":[]},{"id":"widf","name":"国际民主妇女联合会（WIDF）","kind":"国际妇女组织","period":"1945年以后","description":"与Gerwis/Gerwani存在国际会议及代表往来，具体代表团需要逐人旅行、出版物与会议决议核对；国际女性运动网络不能化约为印尼某一个政党的正式机关。","aliases":[]},{"id":"rti","name":"印度尼西亚农民协会（Rukun Tani Indonesia）","kind":"农民组织／独立后PKI相关政治网络","period":"1953年前后—并入BTI","aliases":["RTI","Rukun Tani Indonesia"],"description":"据White等2023年研究，PKI在1953年建立RTI，随后其成员投票同原本具有独立组织历史的BTI合并。RTI成员与1945年BTI创始会员不能从1953年政治关系向前倒填，需查各自会章及合并会议。"},{"id":"sti","name":"印度尼西亚农民联盟（Sarekat Tani Indonesia）","kind":"独立的农民团体／合并关系待核","period":"1950年代，研究称1955年并入BTI","aliases":["STI","Sarekat Tani Indonesia","Sakti（名称关系待核）"],"description":"White等2023年研究称STI于1955年并入BTI；文化部历史百科把‘Sakti’和RTI列在1953年合并叙述中。不能只凭简称相近即视作同一届会议或同一法律组织，原始合并文书待查。"},{"id":"bti-kuningan-1953","name":"BTI库宁岸地方分会（1953年）","kind":"BTI县域地方分会","period":"1953年","aliases":["BTI Kuningan"],"description":"印尼国家历史百科列出库宁岸Kuningan地方代表反对1953年农民组织合并的说法；具体姓名、人数、决议执行和后续组织归属未取原件。"},{"id":"bti-cirebon-1953","name":"BTI井里汶地方分会（1953年）","kind":"BTI县域地方分会","period":"1953年","aliases":["BTI Cirebon"],"description":"文化部百科列出Cirebon地方代表反对1953年合并；不能因此断言当地所有农民都反对、也无法确认其后是否退出。"},{"id":"bti-majalengka-1953","name":"BTI马贾伦卡地方分会（1953年）","kind":"BTI县域地方分会","period":"1953年","aliases":["BTI Majalengka"],"description":"后出资料记Majalengka地方代表在1953年合并表决中反对；当地实际会员名册/会费/会议文件尚缺。"},{"id":"bti-sumedang-1953","name":"BTI苏默当地方分会（1953年）","kind":"BTI县域地方分会","period":"1953年","aliases":["BTI Sumedang"],"description":"后出资料列Sumedang分会代表反对合并；不据中央投票推断所有村级成员的行为。"},{"id":"bti-lampung-tengah-1953","name":"BTI中楠榜地方分会（1953年）","kind":"BTI县域地方分会","period":"1953年","aliases":["BTI Lampung Tengah"],"description":"后出资料列中楠榜代表反对1953年合并，应与爪哇4地区的不同土地、种植园、地方政治条件分别研究。"},{"id":"regu-saling-bantu","name":"农民互助工作组（Regu Saling Bantu）","kind":"基层农业互助组织形式","period":"1950年代—1965年前后","aliases":["Mutual Help Teams","RSG","Regu Saling Bantu"],"description":"White、Graham、Savitri研究描述BTI在地方组织互助工作组，进行灭鼠、农田水利、肥料投入及农业建议，既是生产合作也可维系成员联系。该形式不是一个统一全国法人或正式党支部，具体村组名单、经费与实际成果尚缺。"},{"id":"pki-sudisman-jakarta-1966","name":"1966年雅加达苏迪斯曼联系网络","aliases":["Sudisman Jakarta circle"],"kind":"遭镇压后的政治联系网络（研究对象，非独立政党）","period":"1965年底—1966年12月","description":"Hearman据后出调查与当事人资料称1966年雅加达仍有以政治局成员Sudisman为中心的残存联络；并不意味着他能统领全部地下人员，具体不同对外表态及成员资格应依当时文件区分。"},{"id":"pki-bakri-bandung-1966","name":"1966年万隆伊斯梅尔·巴克里联系网络","aliases":["Ismail Bakri Bandung circle"],"kind":"遭镇压后的政治联系网络（非正式中央机关）","period":"1966—1967","description":"Hearman记述与Ismail Bakri有关的万隆干部联络，Rewang支持该支线并对旧合法路线持异议；个人支持与当选正式中央委员不同。"},{"id":"pki-emergency-cc-1967","name":"PKI临时中央委员会（1966年末后）","aliases":["Emergency CC","临时中央","PKI Emergency Central Committee"],"kind":"地下重组领导机关（存续与授权待核）","period":"1966年12月以后—1968","description":"据Hearman等研究，苏迪斯曼被捕之后形成临时中央，Ruslan Widjajasastra被记为负责人；其合法性、人员名册和对所有省份的实际指挥权并非同一问题。与国外中央委员会代表团必须分开。"},{"id":"pki-kompro-blitar-1967","name":"南勿里达地下基地工程委员会（Kompro）","aliases":["Kompro","Komite Proyek","South Blitar Project Committee"],"kind":"地区地下重组/避难工作机构","period":"1967—1968","description":"干部组织的南勿里达基地项目委员会，涉及人员转移、住房、食物、交通、教育与有限军事准备。实际指挥和武装程度在军方报告、当事人回忆、不同学者之间有分歧。"},{"id":"pki-blitar-cells","name":"南勿里达基层三人联络小组","aliases":["South Blitar three-person cells","tiga orang cells"],"kind":"地方地下联络组织形式","period":"1967—1968","description":"Hearman报告部分逃亡干部形成三人小组，职责侧重联系、组织、教育或有限武装工作；不应推论每个村有统一行动的军队或同样编组。"},{"id":"kowani-1948","name":"印尼妇女大会联合体（KOWANI）","aliases":["KOWANI","Kongres Wanita Indonesia","Federation of Indonesian Women's Congress"],"kind":"跨组织妇女联合与协调机关","period":"1948—1950年代","description":"Sulami在1959年回顾1948年Solo大会内部表决程序之争，认为三个穆斯林妇女团体要求全体一致决议并退出；此为后出带党派立场的叙述，原1948章程及双方会议记录尚待查。不要将整个联合体当成某政党的分支。"},{"id":"muslimat-1948","name":"穆斯林妇女团体Muslimat（1948年KOWANI争论）","aliases":["Muslimat"],"kind":"宗教社会妇女组织（1948年参与版本待核）","period":"1948年","description":"Sulami 1959记该团体参与1948 KOWANI程序争论；具体属于哪一届/哪一级Muslimat、派遣代表姓名和立场须查该组织当年档案，不以名称推定所有成员同意。"},{"id":"gpii-women-1948","name":"GPII相关妇女代表群体（1948）","aliases":["GPII","GPII women delegates"],"kind":"青年／宗教政治网络中的妇女代表（待确证层级）","period":"1948年","description":"Sulami 1959称GPII与Muslimat、Aisjah一起提出KOWANI所有决议一致同意要求；GPII确切机构全称、是否独立妇女支部及代表名单均未从同期记录核实。"},{"id":"aisjah-1948","name":"“Aisjah”妇女组织署名（1948，待身份消歧）","aliases":["Aisjah","possible Aisyiyah"],"kind":"妇女组织后出来源拼写（待核）","period":"1948年","description":"1959年Sulami公开文章记作Aisjah；可能指Aisyiyah，但未核1948 KOWANI当期代表委任及正式组织名称，先保留为独立待核的文本对象，而非认定为所有Aisyiyah成员共同政治立场。"},{"id":"stii-1948","name":"印尼伊斯兰农民联盟（STII，1948年）","aliases":["Sarekat Tani Islam Indonesia","STII","Sarekat Tani Islam"],"kind":"伊斯兰政治/农村组织（1948年德朗古争议）","period":"1948年及其前后（详细任期待核）","description":"澳大利亚外交史料出版编者后加脚注引Anthony Reid 1974，称马斯友美党关联的STII在1948年德朗古罢工中组织替工地活动。此为后出研究经脚注转引，未取得该组织当年章程与县支部名册；STII绝非1953年BTI合并争议中的STI（Serikat Tani Indonesia）的同义词。两者党派背景、机关与成员资格分别核查。"},{"id":"muhammadiyah","name":"穆罕默迪亚（Muhammadiyah）","kind":"伊斯兰社会、教育与慈善组织","period":"1912年至今","description":"该组织既有独立于1945年Masyumi政党的学校、宗教教育、医院与社会服务网络，也曾以特别成员团体参与该党。1962年《Kepribadian Muhammadiyah》强调自身社会宗教运动定位。成员不自动等于Masyumi个人党籍。","aliases":["Muhammadiyah"]},{"id":"masyumi-syuro","name":"Masyumi宗教咨询委员会（Majelis Syuro）","kind":"党内宗教咨询机关","period":"1945—1960","description":"学者研究认为1949年党章变化弱化这一机构的决定权，改变NU宗教领袖同党执行机关之间的协调。具体权限须用1945/1949党章直接核条，不能只依据1952年退出倒推。","aliases":["Majelis Syuro","Masyumi Advisory Council"]},{"id":"masyumi-executive","name":"Masyumi全国执行理事会（Pengurus Besar）","kind":"政党中央执行机关","period":"1945—1960","description":"与宗教咨询委员会分立；1949年以后实际政策/内阁协商权的分配在后出学术论文中被列为NU退出原因之一。此机关与1943日占的同名宗教统合架构不可自动视为同一法律主体。","aliases":["Pengurus Besar Masyumi"]},{"id":"psii-post1947","name":"印尼伊斯兰联盟党（PSII，1947年退出Masyumi后）","kind":"伊斯兰政党与独立组织网络","period":"1947年以后","description":"文化部Masyumi百科记PSII于1947年脱离政治联合；PSII应与1948年的STII农民组织及1953年STI农民组织严格区分，不凭相近名字推定层级、共同行动或党籍。","aliases":["Partai Sarekat Islam Indonesia","PSII"]},{"id":"lmi-1952","name":"印尼穆斯林联盟（Liga Muslimin Indonesia，LMI）","aliases":["Liga Muslimin Indonesia","LMI"],"kind":"多个独立伊斯兰政党/团体的联合协调机关","period":"1952年8月30日以后","description":"NU历史记1952年8月30日由NU、PSII、Perti共同建立。LMI不是一个将三个政党统一为同一党籍的法定全国党机关；其后参与DDI及PTII的范围与初始签署者名单需按不同日期核实。领导初列Wahid Hasyim、Anwar Tjokroaminoto与KH Siraadjuddin Abbas。"},{"id":"perti-1952","name":"伊斯兰教育联合组织及政党网络（Perti，1952）","aliases":["Persatuan Tarbiyah Islamiyah","Perti"],"kind":"独立宗教教育与政党网络","period":"1940—1950年代","description":"1952年与NU、PSII共同建立LMI的另一伊斯兰政党，具有自身宗教教育机构；不能因共同联盟就被合并到NU或PSII党员名单。"},{"id":"pki-padang-1926","name":"共产党巴东地方机关（Padang，1923—1926）","aliases":["PKI Padang section"],"kind":"西苏门答腊具体地区党组织","period":"1923—1926","description":"以巴东城市为主要活动场所；Sutan Said Ali等地方干部及1926年10月改组需分别核任职。Kahin所述1925年末会员数量是引用党记录的特定支部口径，不能作为全部苏门答腊党员数。"},{"id":"pki-padangpanjang-1926","name":"共产党巴东班让地方机关（Padang Panjang，1920年代）","aliases":["PKI Padang Panjang section"],"kind":"西苏门答腊具体地区党组织","period":"1920年代—1927","description":"教师、学生、宗教改革网络与党/人民联盟地方组织交叠；1926年Djamaluddin Tamin、Mahmud外出后由Arif Fadlillah担任领导（Kahin后出重建）。不可因该地干部反对行动就归纳所有邻近小组反对。"},{"id":"sarikat-usaha-padang-1914","name":"巴东商人联盟（Sarikat Usaha，1914年）","aliases":["Sarikat Usaha","Entrepreneurs’ League Padang"],"kind":"本地商人、教育与社团协调组织","period":"1914年—1920年代","description":"Kahin引哈达、Tamin及社团研究记1914年成立，Taher Marah Sutan为书记，Sutan Said Ali任执行成员；联系商人、学校、报刊与后来政治活动，但它并非依法已证明等同PKI支部，成员姓名、入退社和账簿需原件。"},{"id":"silungkang-weavers-coop-1919","name":"锡伦康妇女纺织产销合作网络（1919年记载）","aliases":["Silungkang women textile cooperative","Siloengkang weaving cooperative"],"kind":"在地女性劳动、原料采购和织品销售合作；具体注册组织名待查","period":"1910年代（1919年已有记述）","description":"1919年殖民《荷属东印度百科全书》Siloengkang条经Kahin 1996脚注36转录称当地妇女与帮助她们的欧洲妇女形成收购原料及按固定价格代售织品的合作组织。此描述是组织形式的文献线索，尚无章程、逐人会费、法律注册和1927政治身份资料；不能将妇女合作社贴成共产党妇女外围组织。"},{"id":"press-suara-tambang-1924","name":"《矿山之声》（Suara Tambang，沙哇伦多）","aliases":["Suara Tambang"],"kind":"矿区劳动与社会新闻刊物","period":"1920年代—1924年前后","description":"Kahin与Mestika Zed研究记该刊报道矿工与监工关系、劳动纠纷，Nawawi Arief为编辑，1924年2月被捕。需当期原版与发行账核实发行数量和精确政治归属，不能由刊物报道矿工事迹就认定所有矿工是PKI党员。"},{"id":"braat-barata-ngagel","name":"泗水Ngagel的Braat／Barata机械厂（1950年代）","aliases":["Braat","Barata","Braat machine factory"],"kind":"劳动与国家企业的厂场，不是政治组织","period":"1950年代—1960年代","description":"Adam Soepardjan在该机械制造厂工作并任厂级金属工会干部。学术研究记1957年荷兰企业接收国有化时该厂从Braat改称Barata。厂名、工厂工会、SOBSI全国联合会是三种不同机构，不等于国有化后职工自动成为党干部。"},{"id":"sbim-ngagel","name":"SBIM金属工业工会Ngagel厂分会","aliases":["Serikat Buruh Industri Metal","SBIM"],"kind":"厂级产业工会基层组织","period":"1950年代—1965年前后","description":"据Soepardjan回忆及后出工运研究，Adam曾任泗水Braat/Barata厂SBIM分会主席，该工会加入SOBSI。分会会员人数、投票名册和工会经费仍未取得，不等于全厂员工或全国党员。"},{"id":"perbum-1959","name":"印尼石油工人工会（Perbum，1959年）","aliases":["Perbum","Indonesian Oil Workers Union"],"kind":"石油产业工会／国际代表来源","period":"1950年代","description":"Cambridge研究记1959年副主席Hadi Soedardjo参加国际劳工交流。工会本身的国内职场劳资议题、全国领导班子和与SOBSI的正式章程关系尚待原档，不能仅由一名代表同SOBSI旅伴认定组织隶属。"},{"id":"hkti-1973","name":"印尼农民和谐协会（HKTI，1973年）","aliases":["Himpunan Kerukunan Tani Indonesia","HKTI"],"kind":"新秩序时期国家支持的农民代表组织","period":"1973年以后","description":"White等2023年研究将其形成置于军方与农民合作机关BKST改组农村代表体系的背景，首任主席Martono与Golkar政治网络相联。不是BTI改名，不可因此自动继承BTI会员；具体各地方组织的实际人员、资金、政策执行需查原记录。"},{"id":"bkst-1973","name":"军队—农民合作机关（BKST）","aliases":["Badan Kerjasama Tani-militer","BKST"],"kind":"新秩序时期军方参与的农民组织协调机构","period":"1970年代早期","description":"后出农村政治研究描述BKST参与将残存农业团体纳入HKTI，需查1973会议、行政命令与地方名册。其存在不能证明所有BTI或其他农村社团均依同一程序并入。"},{"id":"sobsi-women-division","name":"SOBSI妇女部门（1950—1960年代）","aliases":["SOBSI Women's Section"],"kind":"工会联合机关内部妇女工作部门","period":"1950年代—1965","description":"1977年国际特赦组织资料称Sri Ambar曾任负责人，自1950年代初工运活跃。为SOBSI内部部门，不是另一个独立妇女政党，也不能凭部门名称推定全体女工党籍。"},{"id":"serbaud-aviation","name":"民航雇员工会（Serbaud）","aliases":["Serbaud","Trade Union of Civil Aviation Employees"],"kind":"民用航空行业工会","period":"1960年代","description":"1977年国际特赦组织报告将律师Sri Suharti列为Serbaud活跃会员，称它属于SOBSI体系。机场管理机关、其丈夫雇主、行业工会与她个人法律职业不能归为同一组织。"},{"id":"sb-postel-1977","name":"邮政与电信职工工会（SB Postel）","aliases":["SB Postel","Postal and Telecommunications Workers Union"],"kind":"邮政通信行业工会","period":"1950年代—1965年及前成员报告","description":"1977年国际特赦组织名单分别记邮局员工、邮电女工在1960年代遭拘押。会员与企业岗位、全职工会干部、后来被拘押身份分开记录。"},{"id":"pgri-nv-teachers","name":"PGRI-NV教师工会（1965年以前）","aliases":["PGRI-NV"],"kind":"教师行业工会／PGRI分化背景待核","period":"1960年代","description":"1977年国际特赦组织报告将Sedijami记为该教师工会成员。其与其他PGRI组织名称、法律地位和师资会员名单需独立核，不可认作所有教师工会。"},{"id":"unilever-workers-jakarta","name":"雅加达联合利华厂工人工会（1960年代）","aliases":["Unilever Workers' Union"],"kind":"厂级劳工组织","period":"1960年代","description":"1977年国际特赦组织名单称Kusnah是该工会的活跃成员并称与SOBSI相关；厂工会不能与企业全体员工或SOBSI全国机关混为同一成员表。"},{"id":"pertanu","name":"伊斯兰教士联合会农民组织（Pertanu）","aliases":["Pertanian Nahdlatul Ulama","PERTANU"],"kind":"宗教社会网络中的独立农民组织，非共产党农会","period":"1950年代—1973及后续身份争议","description":"Luthfi 2017使用ANRI档案复原Pertanu 1954中央理事、1955—59多地分支、1962参与土地改革与1966维护农户；1973以全国农业组织合并的方式进入HKTI的后出叙述不等于全体会员自动继承，也有原领导人称未通过大会正式解散。国家最高宗教机构1961的规范判断与各县执行并非单一政治命令。"},{"id":"pertanu-tegal-1962","name":"Pertanu直葛（Tegal）地方分会","aliases":["PC Pertanu Tegal"],"kind":"县级农民组织/内部整顿争论","period":"1962年","description":"1962-11-06中爪哇Pertanu省级人员称该分会报告不足、未积极参与农业政策，因此主张重组领导。学者引ANRI No1548；没有分会会议签到或完整普通会员名单。"},{"id":"pertanu-banyuwangi-1966","name":"Pertanu外南梦县级分会（1966）","aliases":["PC Pertanu Banyuwangi"],"kind":"县级宗教农民组织","period":"1964—1968","description":"1966年致信Wadoeng West国家橡胶种植园，反对驱离耕作者；与Sarbumusi提议共同商议，随后参与保护土地改革受益人。须按信件和行政决定核实每个村庄，而不认为该县Pertanu所有成员同意同一种行动。"},{"id":"petani-pni-banyuwangi-1966","name":"Petani外南梦民族主义农民组织（1966）","aliases":["Petani PNI Banyuwangi","DPC Petani Banyuwangi"],"kind":"PNI相关农民组织，独立于BTI与Pertanu","period":"1964—1966","description":"1964年与Pertanu反对采取单方面农业行动的组织方法争论，1966年11月又与Pertanu为遭遇重新夺地的农户发出共同抗议。县级主席Djoehdi、秘书Achmad Sanimin在11月25日另信署名；部分地块争议与实际农户登记待核。"}]);

te":"1969-05被捕前","role":"邮电工会成员","person":"萨蒂娅（Satijah）","person_id":"person-satijah-post-1977","organization":"sb-postel-1977","type":"通信行业工会会员","evidence":"AI ASA21/09/77印刷p2","claims":["C2908"]},{"date":"1965被捕前","role":"教师及PGRI-NV工会会员","person":"塞迪亚米（Sedijami）","person_id":"person-sedijami-teacher-1977","organization":"pgri-nv-teachers","type":"教育行业工会身份，不等于所有PGRI工会统一会员","evidence":"AI ASA21/09/77印刷p2","claims":["C2909"]},{"date":"1965以前","role":"SOBSI高级干部与议会代表","person":"费迪南德·伦图兰比（Ferdinand Runturambi）","person_id":"person-ferdinand-runturambi-1977","organization":"sobsi","type":"后出个案所记国内职位、区别于WFTU岗位","evidence":"AI ASA21/09/77印刷p2；仍缺原当选表","claims":[]},{"date":"1950年代—1960年代（待核）","role":"国际工会总理事会相关任职者","person":"费迪南德·伦图兰比（Ferdinand Runturambi）","person_id":"person-ferdinand-runturambi-1977","organization":"wftu","type":"国际职务的学术史述，非AI名单对会议逐次现场证明","evidence":"Hearman 2024《International Review of Social History》工会组织段落；具体任期未核","claims":[]},{"date":"1962-11-06","role":"中爪哇Pertanu省级主席（当期信函署名）","person":"Imam Churmen","person_id":"person-imam-churmen-pertanu","organization":"pertanu","type":"区域农会治理，非全国NU统一思想","evidence":"S1541 学者录ANRI档案No1548，直葛整顿信","claims":["C2913"]},{"date":"1962-11-06","role":"中爪哇Pertanu省级秘书（当期信函署名）","person":"Slamet Sardho","person_id":"person-slamet-sardho-pertanu","organization":"pertanu","type":"地区组织正式信函署名","evidence":"S1541 Luthfi 2017 pp147; ANRI Pertanu No1548未独立取得","claims":["C2913"]},{"date":"1964-09及1970年通信","role":"Pertanu中央负责人及农民节发言者","person":"H. Mohammad Munasir","person_id":"person-mohammad-munasir-pertanu","organization":"pertanu","type":"公开农业政策主张，不等于政府落实","evidence":"S1541 1965 Landreform杂志转引与1970通信","claims":["C2919"]},{"date":"1966-06-23","role":"外南梦Pertanu县级分会主席，种植园交涉信署名","person":"Soehaimi","person_id":"person-soehaimi-pertanu-banyuwangi","organization":"pertanu-banyuwangi-1966","type":"明确的地方代表行动，未证明谈判已完成","evidence":"S1541 pp150–151及其原文件收藏线索","claims":["C2914"]},{"date":"1966-11-25","role":"外南梦Petani县级第一主席，保护农户地权抗议信署名","person
