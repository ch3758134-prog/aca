on land reform committees, sharecropping implementation and price controls. Its own 1957–61 progress claims are organizational assertions; neither adoption nor implementation proven.","path":"S459;S1516;S462; obtain DPP 1961 original pamphlet and 1957 program; UU 5/1960 Article 9; UU 2/1960 sharecropping; plantation/union collective agreements; district land reform committee rosters; female land title files","priority":"Very high"},{"id":"CV651","period":"1960–1965","topic":"Land-reform distribution rules and Gerwani women’s land claims","status":"Partial; regulation transcription inspected, implementation open","note":"PP 224/1961 Articles 1-9 establish eligible land categories, district committee allocation priorities, residence and cultivation-duration conditions. 1961 Gerwani program S459 demanded individual land rights and women committee representation. Neither demonstrates named women received title or sat on committees.","path":"S1519;S459; 1961 official promulgation facsimile; district Panitia Landreform Dati II minutes, recipient registers, land certificates by sex; 1961 joint instruction Sekra 9/1/2","priority":"Very high"},{"id":"CV652","period":"1961–1965","topic":"1964 amendment to land redistribution and absentee land ownership","status":"Partial; official amended legal text verified; district execution open","note":"PP 41/1964 inserts PP 224/1961 Articles 3a-3e; fixes absentee transfer deadlines and exceptions; raises landreform bond interest and reduces administration costs. This does not establish actual land distribution or female ownership.","path":"S1520;S1519; district Panitia Landreform minutes; Agraria implementing circulars; village land registers; BTI/Gerwani petitions and contrary landowner records","priority":"Very high"},{"id":"CV653","period":"1977–1980 South Sulawesi","topic":"Moncongloe release processing and post-release surveillance","status":"Partial","note":"Ahmad 2013 records 18–20 Dec 1977 registration and release ceremony and Dec 1979/Jan 1980 political courses; original Kopkamtib SKEP-25 and archive Reg.41/935 missing; administrative release does not establish full freedom.","path":"S1521; Komnas HAM BAP 266–269; SKEP-25/KOPKAM/XII/1977; SPRIN/802/TPD/XII/1977; Arsip Muhammad Saleh Lahade Reg.41; Arsip Kotamadya Ujung Pandang Reg.935","priority":"Very high"},{"id":"CV654","period":"1965–1980 South Sulawesi","topic":"Named prisoners and occupational/organizational backgrounds from retrospective interviews","status":"Partial; original journalist narrative read; contemporaneous files missing","note":"Eko Rusdianto interviews Jufri Buape (Lekra/Pemuda Rakyat Parepare; Sidrap arrest Dec 1965); P.L. Payung (schoolteacher detained Toraja 28 Oct 1965); Waris Thahir (Parepare municipal employee detained Dec 1965); Rasjidi Amrah (civil engineering/technical camp work). The reported identities and trajectories are witness accounts, not verified prison files; article camp counts borrow Ahmad.","path":"S1522;S1521; Toraja and Sidrap Kodim detention registers; Parepare prison transfers; Rasjidi technical drawings and named interview recordings","priority":"Very high"},{"id":"CV655","period":"1925–1954 Java sugar industry","topic":"Women's night labor statistics: legal exception and archival provenance","status":"Partial; historical study text opened; original law and factory returns missing","note":"Levert printed p.119 (flipbook 132) states women's actual factory-work statistics collected from 1926 pursuant to Staatsblad 1925 No.648; annual night-work returns to Labor Office; p.196 (flipbook 209) describes sugar campaign exception and hours/wages returns. Neither original statute nor returns opened.","path":"S1523; Staatsblad 1925 No.648 original; Kantoor van Arbeid annual reports 1926–1931; Tjomal 2.20.39 inventory numbers; worker testimony","priority":"Very high"},{"id":"CV656","period":"2024–2026 West Java industrial labor","topic":"Sectoral minimum wage litigation and replacement decree chain","status":"Partial; signed administrative original read; underlying appellate judgments and employer implementation open","note":"2026-11-11 decision 561.7/Kep.675-Kesra/2026 explicitly revokes 876/2025, cites four PTTUN Jakarta decisions, permits documented bipartite talks subject to reporting, and starts on signing date; 2025 government bulletin refers to earlier 863/2025; metadata date conflict 10 vs 11 Nov resolved provisionally in favor of signed original.","path":"West Java JDIH signed 675/2026 PDF; obtain 863/2025 and 876/2025 original texts; PTTUN 174/196/205/211 appeals; Bandung 50/G/2026; company KBLI/PKB/payroll","priority":"Very high"},{"id":"CV657","period":"1963–1964 Gerwani and land reform","topic":"Gerwani DPP plenary, SOBSI linkage, training, price protests and Sukarno-era agrarian policy rhetoric","status":"Partial; magazine transcriptions opened; independent action evidence missing","note":"Ratna reports Gerwani DPP 6–10 Jan 1963 plenary, Umi Sardjono report, 60 trainees, 3000-woman East Java delegation and references to SOBSI; 1964 Api Kartini prints TAVIP land reform passage. Organizational rhetoric not proof of local implementation.","path":"S1524;S1525; original Api Kartini page images; Gerwani training registers; East Java local newspaper petitions; official TAVIP transcript and land-reform administrative files","priority":"Very high"},{"id":"CV658","period":"1964 Gerwani women household organization","topic":"Jakarta 4–6 November household women's seminar and publication dating conflict","status":"Partial; contemporaneous issue scan opened; independent attendance records absent","note":"Issue advertised as 1963 No.11–12 but internally covers 10 Nov 1964 and seminar 4–6 Nov 1964; page 2 names Suharti Suwarto and reports delegates from 20 provincial areas; separate worker and peasant women categories in definition.","path":"S1526; compare cover and other catalogues; Gerwani meeting minutes and delegate registers; contemporary press/Perwari reports; verify regional attendance","priority":"Very high"},{"id":"CV659","period":"1964-11","topic":"Gerwani housewives seminar: three commission resolutions; links to agrarian reform, child education, women workers and cultural policy","status":"Partial; contemporary full issue directly opened","note":"The issue carries committee conclusions (p.29 onward) in addition to earlier reported meeting; proposals concerning UUPA/UUPBH, land reform committees, literacy groups and kindergartens must be distinguished from actual execution.","path":"S1526; obtain Gerwani minutes and provincial delegates; verify regional agrarian/education actions and Perwari/Muslimat NU coverage; compare 1964 dismissal law No.12 with legal original","priority":"Very high"},{"id":"CV660","period":"1964-1968 private-sector employment law and political dismissals","topic":"UU 12/1964 negotiated dismissal and P4D/P4P permit system against 1965-68 factory purge","status":"Partial; enacted original opened; actual local enforcement unverified","note":"S1527 law Article 2 requires union or individual negotiation; Articles 3-5 require P4D for individual and P4P for mass dismissal after failed negotiation; 10 in one month or serial intent; Article 4 probation exception; Article 8 appeal within 14 days; Article 10 unauthorized dismissal legally void; Article 12 private employees >3 months. Normative legal structure cannot establish whether political firings complied.","path":" S1527; UU 22/1957; 1965-68 P4D/P4P permit/appeal registers; Shell Stanvac PUSRI personnel records; union survivor testimony; BPK/DPR status vs MA outdated metadata","priority":"Very high"},{"id":"CV661","period":"1947–1948","topic":"Delanggu LBT original government archival dossier and 1947 PKI programme","status":"Partial: primary document location identified; originals unopened","note":"ANRI Ministry of Labour and Social Affairs 1946–1950 official inventory item 91 identifies one folder of LBT demands in Delanggu dated 14–19 June 1948. Item 74 identifies a PKI work programme with CCPKI cover letter dated 15 April 1947. These are retrieval targets only; neither content nor decisions verified.","path":"S1529; ANRI item 91 and 74 facsimiles; LBT/BTN correspondence; Merdeka No.785 1948-07-19 p.2; SOBSI return-to-work circular","priority":"Very high"},{"id":"CV662","period":"1948-04—07","topic":"Delanggu strike and state police press/surveillance documentation","status":"Partial; ANRI police inventory opened; actual record sheets not obtained","note":"Official 1995 ANRI inventory item 1215 identifies a 1 July 1948 Delanggu press-bureau report (one copy sheet), item 569 Feb–Oct police PAM SOBSI correspondence, 1201 BTI demands leaflet 1 Apr, 1205 Buruh 24 Apr, 1211 22/25 May press extracts. These provide parallel contemporary paths to LBT/BTN item 91 and Merdeka July 19; content not yet verified.","path":"S1530;S1529; ANRI Police 1947–49 items 569 1201 1205 1211 1215; ANRI Labour item 91; Merdeka No.785 p.2","priority":"Very high"},{"id":"CV663","period":"1998–2012","topic":"Hero Supermarket union and transnational mediation","status":"Partial; original union and company documents missing","note":"ASETUC retrospective describes November 2000 settlement and 2009/2011 agreements; counts of outlets differ across years and cannot imply union coverage","path":"UNI Apro 2009 original; SPHS registration; 2000 settlement; 2009 bonus agreement; 2011 collective agreement; worker counter-evidence","priority":"High"},{"id":"CV664","period":"1948-05—07","topic":"Delanggu textile entitlement and union return-to-work mechanism","status":"Partial; scholarly full transcription opened; 1948 originals missing","note":"S1535 quotes Suara Ibu Kota 1948-05-21 on SARBUPRI/BTI joint labour-peasant participation and Merdeka No.785 1948-07-19 p.2 on cloth/rice/wage categories; describes SOBSI instruction for 1948-07-18 07:00 return. Internal June 17 vs July 18 inconsistency requires original records.","path":"S1535;S1530; Merdeka No.785 p.2; Suara Ibu Kota 1948-05-21; BTN June 19 response; SOBSI circular; attendance register","priority":"Very high"}]);

window.HIST=window.HIST||{claims:[],sources:[],coverage:[],people:[],events:[],organizations:[],roles:[]};
window.HIST.people.push(...[{"id":"person-sukarno","title":"苏加诺（Sukarno）","description":"苏加诺（1901—1970）是印度尼西亚民族主义运动领袖、共和国首任总统。他从荷兰语学校和万隆技术教育进入政治，创办PNI并推动反殖民动员；独立后主持多党共和国，1959年后建立“指导民主”，试图把军队、民族主义者、宗教力量与PKI纳入同一政治安排。1965年危机后，他的实际权力持续被削弱，1967年总统权力转交苏哈托。","legacy_url":"../people-events-reference-1830-2026.html#person-sukarno"},{"id":"person-soekemi","title":"拉登·苏克米·苏苏罗哈迪约（Raden Soekemi Sosrodihardjo）","description":"拉登·苏克米·苏苏罗哈迪约是苏加诺的父亲，在泗水任小学教师。苏加诺通过殖民学校接受荷兰语教育，家庭的教师职业与教育机会是理解其早年社会位置的重要背景。","legacy_url":"../people-events-reference-1830-2026.html#person-soekemi"},{"id":"person-nyoman-rai","title":"伊达·阿尤·尼奥曼·莱（Ida Ayu Nyoman Rai）","description":"伊达·阿尤·尼奥曼·莱是苏加诺的母亲，来自巴厘岛。苏加诺家庭横跨爪哇与巴厘的文化背景；有关其具体出生地点的传记记载并不一致。","legacy_url":"../people-events-reference-1830-2026.html#person-nyoman-rai"},{"id":"person-tjokroaminoto","title":"乔克罗阿米诺托（H.O.S. Tjokroaminoto）","description":"乔克罗阿米诺托（H.O.S. Tjokroaminoto）是伊斯兰联盟的重要领袖，也是苏加诺求学时期的导师和房东。泗水家中的演讲、报刊和政治往来让苏加诺接触民族主义、伊斯兰政治与社会主义活动者。","legacy_url":"../people-events-reference-1830-2026.html#person-tjokroaminoto"},{"id":"person-oetari","title":"西蒂·奥塔里（Siti Oetari）","description":"西蒂·奥塔里是乔克罗阿米诺托的女儿，也是苏加诺早年的妻子。两人婚姻年份在资料中有差异；现有叙述能确认这段关系与苏加诺寄居乔克罗阿米诺托家中的政治生活相连。","legacy_url":"../people-events-reference-1830-2026.html#person-oetari"},{"id":"person-inggit","title":"英吉特·加纳西（Inggit Garnasih）","description":"英吉特·加纳西是苏加诺在万隆时期的妻子和政治生活伙伴。她经营家庭、承担生计，并在苏加诺演讲、入狱和流放期间支持其活动；婚姻与离婚的确切日期仍应以家庭和民事档案核定。","legacy_url":"../people-events-reference-1830-2026.html#person-inggit"},{"id":"person-sneevliet","title":"亨克·斯内夫利特（Henk Sneevliet）","description":"亨克·斯内夫利特是荷兰社会主义活动者，参与建立荷属东印度社会民主联盟（ISDV）。他及其同伴在铁路工会、工人报刊和夜校中招募本地职工，推动欧洲社会主义者与印尼工人组织相接触。","legacy_url":"../people-events-reference-1830-2026.html#person-sneevliet"},{"id":"person-semaun","title":"塞马温（Semaun）","description":"塞马温是铁路工人、工会组织者和早期共产主义领导人。他在三宝垄伊斯兰联盟与铁路电车职工协会（VSTP）活动，参与罢工和工人教育，后来成为印度群岛共产党（PKI）的核心领导者；1923年被捕后遭殖民政府驱逐。","legacy_url":"../people-events-reference-1830-2026.html#person-semaun"},{"id":"person-darsono","title":"达尔索诺（Darsono）","description":"达尔索诺是早期共产主义组织者和报刊活动者，与塞马温一同在伊斯兰联盟地方支部、VSTP和马来语报刊中发展社会主义政治。他代表了从工会、地方支部和出版活动建立左翼群众网络的一代干部。","legacy_url":"../people-events-reference-1830-2026.html#person-darsono"},{"id":"person-tan-malaka","title":"丹·马拉卡（Tan Malaka）","description":"丹·马拉卡是共产主义革命者、教育者和跨国流亡活动者。他在三宝垄伊斯兰联盟学校任教，以识字、实用课程和学生自治开展工人教育；后来反对准备不足的1926年起事，并与PKI领导层在革命策略上发生分歧。","legacy_url":"../people-events-reference-1830-2026.html#person-tan-malaka"},{"id":"person-soetardjo","title":"苏达佐·卡托哈迪库苏莫（Soetardjo Kartohadikusumo）","description":"苏达佐·卡托哈迪库苏莫是人民议会（Volksraad）议员。1936年他提出请愿，要求印尼与荷兰代表平等协商自治方案；议会通过请愿后，荷兰王室仍于1938年拒绝，显示殖民议会参与无法直接转化为自治权。","legacy_url":"../people-events-reference-1830-2026.html#person-soetardjo"},{"id":"person-thamrin","title":"穆罕默德·胡斯尼·塔姆林（Mohammad Husni Thamrin）","description":"穆罕默德·胡斯尼·塔姆林是巴达维亚出身的民族主义政治家、人民议会议员和GAPI重要领导人。他参与推动“印度尼西亚要议会”运动，将议会责任、印尼语和民族象征带入殖民体制内外的政治活动。","legacy_url":"../people-events-reference-1830-2026.html#person-thamrin"},{"id":"person-ki-hadjar","title":"基·哈查尔·德宛达拉（Ki Hadjar Dewantara）","description":"基·哈查尔·德宛达拉是民族主义教育家，创办塔曼西斯瓦教育网络。日本占领时期，他与苏加诺、哈达、基·马斯·曼苏尔共同领导Putera；战后继续作为共和国教育思想的重要代表。","legacy_url":"../people-events-reference-1830-2026.html#person-ki-hadjar"},{"id":"person-hatta","title":"穆罕默德·哈达（Mohammad Hatta）","description":"穆罕默德·哈达是民族主义者、经济思想家和共和国领导人。他与夏赫里尔参与PNI Baru，主张以政治教育和长期组织建设培养干部；1945年与苏加诺共同发表独立宣言，后任副总统，并参与革命外交、联邦谈判和共和国制度建设。","legacy_url":"../people-events-reference-1830-2026.html#person-hatta"},{"id":"person-sjahrir","title":"苏丹·夏赫里尔（Sutan Sjahrir）","description":"苏丹·夏赫里尔是社会主义民族主义者、PNI Baru领导人和共和国首任政府首脑之一。他主张反法西斯和议会政治，在独立革命期间担任总理并参与对荷谈判；1946年被带走和七三事件反映共和国政府、军队与激进政治力量之间的权力冲突。","legacy_url":"../people-events-reference-1830-2026.html#person-sjahrir"},{"id":"person-mallaby","title":"奥伯廷·马拉比（Aubertin W. S. Mallaby）","description":"奥伯廷·马拉比是英国准将，1945年10月率英印第49旅在泗水登陆，执行接收日军投降、解除武装和撤出盟军被拘人员的任务。他于10月30日在红桥附近死亡，英印与印尼记录对枪击、爆炸和责任的叙述不同；其死亡后英国扩大军事行动。","legacy_url":"../people-events-reference-1830-2026.html#person-mallaby"},{"id":"person-fatmawati","title":"法特马瓦蒂（Fatmawati）","description":"法特马瓦蒂是苏加诺的妻子、共和国第一夫人，也是苏加诺子女的母亲。她在日本占领末期与苏加诺结婚，1945年独立宣言前缝制红白旗；她的家庭角色与共和国公共象征相连。","legacy_url":"../people-events-reference-1830-2026.html#person-fatmawati"},{"id":"person-sudarsono","title":"苏达尔索诺（Sudarsono）","description":"苏达尔索诺是1946年七三事件中的军政人员之一。7月3日，他带人进入总统府递交改组方案，要求解散夏赫里尔内阁并调整国防指挥；苏加诺拒绝签署并下令拘押来人，其个人动机和行动授权仍有争议。","legacy_url":"../people-events-reference-1830-2026.html#person-sudarsono"},{"id":"person-yamin","title":"穆罕默德·亚明（Mohammad Yamin）","description":"穆罕默德·亚明是民族主义政治家、作家和宪制思想参与者。七三事件中，他起草了递交苏加诺的政府改组方案；他提出的制度构想与当时总统、内阁和军队之间的权限冲突相连。","legacy_url":"../people-events-reference-1830-2026.html#person-yamin"},{"id":"person-sudirman","title":"苏迪尔曼（Sudirman）","description":"苏迪尔曼是共和国军队首任总司令和独立革命时期的主要军事领袖。日惹沦陷后，他坚持通过游击战维持共和国军事存在；1949年日惹总攻的筹划与指挥叙述涉及苏迪尔曼体系，但不同回忆对具体授权链有不同强调。","legacy_url":"../people-events-reference-1830-2026.html#person-sudirman"},{"id":"person-musso","title":"穆索（Musso）","description":"穆索是共产党领导人，曾在莫斯科流亡，1948年回到印度尼西亚推动PKI重组和左翼联合。他在茉莉芬冲突期间成为共和国政府的主要政治对手，10月31日在追捕中被杀；其是否事前策划全国夺权仍是历史争论。","legacy_url":"../people-events-reference-1830-2026.html#person-musso"},{"id":"person-amir","title":"阿米尔·谢里夫丁（Amir Sjarifuddin）","description":"阿米尔·谢里夫丁是社会主义者、革命时期共和国总理和国防部长，后来参与左翼人民民主阵线（FDR）。1948年茉莉芬冲突后，他被捕并于同年12月遭处决；其政治责任需与地方部队冲突、整军政策和事件具体指挥分别考察。","legacy_url":"../people-events-reference-1830-2026.html#person-amir"},{"id":"person-sjafruddin","title":"沙弗鲁丁·普拉维拉内加拉（Sjafruddin Prawiranegara）","description":"沙弗鲁丁·普拉维拉内加拉是共和国经济官员和紧急政府领导人。荷兰第二次军事行动、苏加诺和哈达被捕后，他依据此前授权于1948年12月在西苏门答腊建立PDRI，通过电台和地方官员维持共和国政府运作，1949年7月交还职权。","legacy_url":"../people-events-reference-1830-2026.html#person-sjafruddin"},{"id":"person-kartosuwiryo","title":"卡尔托苏维约（Kartosuwiryo）","description":"卡尔托苏维约是西爪哇伊斯兰政治领袖，1949年宣布成立印度尼西亚伊斯兰国（NII）。其运动与达鲁伊斯兰网络及共和国整合地方武装的战争相连；各地加入运动的时间和原因不同，不能视为单一、完全统一的叛乱。","legacy_url":"../people-events-reference-1830-2026.html#person-kartosuwiryo"},{"id":"person-kahar","title":"卡哈尔·穆扎卡尔（Kahar Muzakkar）","description":"卡哈尔·穆扎卡尔是南苏拉威西军事和政治领袖。自1950年起，他围绕革命军人并编、安置和指挥权同中央军队冲突，1953年加入达鲁伊斯兰运动；地方军事整编和中央—地区权力关系是冲突的重要背景。","legacy_url":"../people-events-reference-1830-2026.html#person-kahar"},{"id":"person-daud-beureueh","title":"达乌德·贝乌雷（Daud Beureueh）","description":"达乌德·贝乌雷是亚齐乌理玛领袖和地区政治人物。中央政府取消亚齐省建制并入北苏门答腊后，他于1953年宣布亚齐加入NII；1959年特别地区安排承诺宗教、习惯法和教育自治，冲突随后缓和。","legacy_url":"../people-events-reference-1830-2026.html#person-daud-beureueh"},{"id":"person-nasution","title":"纳苏蒂安（A. H. Nasution）","description":"阿卜杜尔·哈里斯·纳苏蒂安是陆军将领和国防部长，是独立后军队建设及军方参与政治的关键人物。1952年军政危机中，他与陆军军官推动解散议会而遭苏加诺拒绝；1965年袭击中他逃脱，女儿阿德·伊尔玛中弹身亡。","legacy_url":"../people-events-reference-1830-2026.html#person-nasution"},{"id":"person-aidit","title":"艾地（D. N. Aidit）","description":"艾地（D. N. Aidit）是PKI中央领导人，1951年后参与重建党的中央组织、地方支部和干部训练。PKI在其领导下通过选举、工会、农会、青年和文化组织发展影响；1965年运动中他与部分军官的接触和知情范围仍有争议。","legacy_url":"../people-events-reference-1830-2026.html#person-aidit"},{"id":"person-lukman","title":"卢克曼（M. H. Lukman）","description":"卢克曼是艾地一代PKI中央领导人，参与1950年代党的组织重建和群众工作。他与艾地共同推动党通过选举、议会及工会、农民和文化组织扩大影响；这些群众组织有各自成员和组织结构，不能把其会员身份等同于PKI党籍。","legacy_url":"../people-events-reference-1830-2026.html#person-lukman"},{"id":"person-hartini","title":"哈蒂妮（Hartini）","description":"哈蒂妮是苏加诺的妻子，1953年与苏加诺结婚。她进入总统家庭后参与国家礼仪和家庭生活；有关她与法特马瓦蒂、苏加诺其他配偶的关系，应结合当事人回忆和同期记录分别理解。","legacy_url":"../people-events-reference-1830-2026.html#person-hartini"},{"id":"person-dewi","title":"黛薇（Ratna Sari Dewi；根本七保子／Naoko Nemoto）","description":"黛薇（根本七保子）是日本出生的苏加诺配偶，1962年与苏加诺结婚并进入总统家庭。她的私人通信、公开礼仪和日本关系为研究苏加诺家庭与印尼对外关系提供材料，但个人往来不能自动等同正式国家政策。","legacy_url":"../people-events-reference-1830-2026.html#person-dewi"},{"id":"person-allen-pope","title":"艾伦·波普（Allen Pope）","description":"艾伦·波普是美国飞行员，参与CIA支持的印尼地区叛乱空中行动。1958年5月，他驾驶B-26在安汶附近被击落并俘获；案件成为美国秘密援助与印尼政府公开关系的证据和争论焦点。","legacy_url":"../people-events-reference-1830-2026.html#person-allen-pope"},{"id":"person-green","title":"马歇尔·格林（Marshall Green）","description":"马歇尔·格林是美国驻印尼大使，任期涵盖1965年政局危机。他向华盛顿报告陆军、苏加诺和PKI局势，也签署回顾A-398名单转交的电报；使馆记录能证明美方观察和操作，不能单独说明印尼军方所有行动由谁指挥。","legacy_url":"../people-events-reference-1830-2026.html#person-green"},{"id":"person-martens","title":"罗伯特·马滕斯（Robert J. Martens）","description":"罗伯特·马滕斯是美国驻雅加达使馆政治官员，参与整理PKI中央干部名单。后来的个人陈述称他把名单交给印尼“非共产党力量”，同期电报则记载名单去除美国来源标记后移交；关于授权层级和名单用途，应对照两类材料。","legacy_url":"../people-events-reference-1830-2026.html#person-martens"},{"id":"person-ahmad-yani","title":"艾哈迈德·亚尼（Ahmad Yani）","description":"艾哈迈德·亚尼是印尼陆军司令，1965年9月30日夜间在雅加达住宅遭绑架并被杀。他的遇害成为陆军反击行动和全国权力变化的重要节点；关于袭击组织者的完整策划链，资料仍有争议。","legacy_url":"../people-events-reference-1830-2026.html#person-ahmad-yani"},{"id":"person-suprapto","title":"拉登·苏普拉普托（R. Suprapto）","description":"拉登·苏普拉普托是陆军高级将领，1965年九三〇运动行动中被绑架并杀害。他与其他被杀军官一起被纳入后来官方“七名英雄”纪念；其具体职务和行动经过见正文所引军方、法庭与同期材料。","legacy_url":"../people-events-reference-1830-2026.html#person-suprapto"},{"id":"person-haryono","title":"M.T.哈里约诺（M.T. Haryono）","description":"M. T. 哈里约诺是陆军高级军官和总参谋部成员，1965年袭击中被绑架并杀害。他的遇害被纳入军方事后叙述和国家纪念；这些纪念叙述与行动当天的独立证据需要区分。","legacy_url":"../people-events-reference-1830-2026.html#person-haryono"},{"id":"person-parman","title":"西斯翁多·帕尔曼（S. Parman）","description":"西斯翁多·帕尔曼是陆军将领，任陆军情报职务，1965年九三〇行动中被带往卢邦布亚后遇害。后来的调查和诉讼材料围绕行动队的目标、命令和各单位反应展开，对其遇害经过的描述应以具体来源为限。","legacy_url":"../people-events-reference-1830-2026.html#person-parman"},{"id":"person-panjaitan","title":"唐纳德·伊萨克·潘贾伊坦（D.I. Panjaitan）","description":"唐纳德·伊萨克·潘贾伊坦是陆军将领，1965年在雅加达住宅遭袭并被杀。他是后来被列入国家纪念的六名陆军将领之一；正文将其个案置于绑架行动和军方随后的政治动员中说明。","legacy_url":"../people-events-reference-1830-2026.html#person-panjaitan"},{"id":"person-sutoyo","title":"苏托约·西斯沃米哈尔佐（Sutoyo Siswomiharjo）","description":"苏托约·西斯沃米哈尔佐是陆军将领，曾从事军事司法工作，1965年九三〇行动中被绑架并杀害。其个案与其他将领遇害共同成为军方反击及后续公共纪念的核心内容。","legacy_url":"../people-events-reference-1830-2026.html#person-sutoyo"},{"id":"person-tendean","title":"皮埃尔·滕代安（Pierre Tendean）","description":"皮埃尔·滕代安是陆军中尉、纳苏蒂安将军的副官。1965年袭击中他被误认为纳苏蒂安而遭捕并杀害；其死亡进入“七名英雄”的国家纪念叙事。","legacy_url":"../people-events-reference-1830-2026.html#person-tendean"},{"id":"person-untung","title":"翁东（Untung）","description":"翁东是总统卫队中校，1965年九三〇运动公开广播由他署名。他声称行动旨在阻止所谓“将军委员会”政变，但不同单位对命令的响应并不一致；后来军事法庭的责任认定与史家对策划链的研究应分别看待。","legacy_url":"../people-events-reference-1830-2026.html#person-untung"},{"id":"person-supardjo","title":"苏帕尔佐（Supardjo）","description":"苏帕尔佐是参与九三〇运动的陆军准将，行动期间曾参与部队部署和联络。他后来的分析材料讨论行动准备和指挥失误，成为研究者理解运动内部协调的重要来源；个人陈述不能单独解决所有策划和责任问题。","legacy_url":"../people-events-reference-1830-2026.html#person-supardjo"},{"id":"person-sjam","title":"夏姆·卡马鲁扎曼（Sjam Kamaruzaman）","description":"夏姆·卡马鲁扎曼是PKI特别局负责人，军方和军事法庭称他参与九三〇行动组织。其供述形成于军方审讯和审判环境，历史学者对特别局作用、PKI领导层知情程度及其证词可信度仍有争论。","legacy_url":"../people-events-reference-1830-2026.html#person-sjam"},{"id":"person-suharto","title":"苏哈托（Suharto）","description":"苏哈托是陆军将领，1965年时指挥陆军战略预备队（Kostrad）。九三〇运动后，他迅速掌握雅加达陆军指挥并推动全国反共行动；此后逐步取代苏加诺，1967年取得总统权力并建立新秩序政权。1949年日惹总攻中他也担任当地部队指挥官，具体军令链仍需原件核对。","legacy_url":"../people-events-reference-1830-2026.html#person-suharto"},{"id":"person-sarwo-edhie","title":"萨尔沃·埃迪·维博沃（Sarwo Edhie Wibowo）","description":"萨尔沃·埃迪·维博沃是陆军伞兵突击团（RPKAD）指挥官，1965年率部进入中爪哇多个城市。中爪哇联合安全机构成立后，他参与军方协调；地方拘捕和杀戮由军队、警察、情报机关及民间组织以不同方式执行，不能将所有地区行动简化为单一命令。","legacy_url":"../people-events-reference-1830-2026.html#person-sarwo-edhie"},{"id":"person-hariman-siregar","title":"哈里曼·西雷加尔（Hariman Siregar）","description":"哈里曼·西雷加尔是1974年学生抗议中的领导人物。田中角荣访印期间，他参与批评腐败、物价和外国资本影响的学生行动，随后被捕；马拉里事件同时包含学生政治诉求、街头骚乱和军政高层竞争。","legacy_url":"../people-events-reference-1830-2026.html#person-hariman-siregar"},{"id":"person-pakpahan","title":"穆赫塔尔·帕克帕汉（Muchtar Pakpahan）","description":"穆赫塔尔·帕克帕汉是独立工会组织者，1992年建立印度尼西亚繁荣工人联合会（SBSI）。他推动在官方SPSI体系外组织工人，围绕最低工资、工厂安全和结社权开展行动，也因此面对登记限制、安全机关压力和刑事诉讼。","legacy_url":"../people-events-reference-1830-2026.html#person-pakpahan"},{"id":"person-marsinah","title":"马西娜（Marsinah）","description":"马西娜是东爪哇钟表厂工人和劳工活动者。1993年5月她参与最低工资罢工，随后失踪并被发现死亡；法院后来撤销对被告的定罪，政府调查没有查明凶手和完整案情，她因此成为劳工权利和未解决国家暴力案件的象征。","legacy_url":"../people-events-reference-1830-2026.html#person-marsinah"},{"id":"person-budiman","title":"布迪曼·苏贾特马科（Budiman Sudjatmiko）","description":"布迪曼·苏贾特马科是人民民主党（PRD）领导人。政府指控PRD策划1996年骚乱，并依据颠覆罪起诉他；其定罪和刑期变化属于新秩序对学生、工人和民主组织的镇压史，不能单凭判决推定骚乱的真实策划责任。","legacy_url":"../people-events-reference-1830-2026.html#person-budiman"},{"id":"person-dita-sari","title":"迪塔·英达·萨丽（Dita Indah Sari）","description":"迪塔·英达·萨丽是工会活动者和工人政治组织者，参与印度尼西亚工人斗争中心（PPBI）及民主运动。她因独立工会和反政府活动被判刑，1999年获释；改革时期她继续参与劳工权益和政治组织工作。","legacy_url":"../people-events-reference-1830-2026.html#person-dita-sari"},{"id":"person-widodo","title":"佐科·维多多（Joko Widodo）","description":"佐科·维多多（Joko Widodo）是2014—2024年印度尼西亚总统。2023年1月，他代表政府承认包括1965—1966年事件在内的十二类严重人权侵害；随后政府发布跨部门非司法处理指示，承认、救济执行和刑事追责仍是不同程序。","legacy_url":"../people-events-reference-1830-2026.html#person-widodo"},{"id":"person-maraden-panggabean","title":"马拉登·庞加贝安（Maraden Panggabean）","description":"马拉登·庞加贝安是印尼军方高级将领，曾任国防与安全部长、武装部队司令等职。2026年他被追授国家英雄称号；这一授勋把印马对抗时期军政人物纳入当代国家纪念，也引出对授勋标准和历史记忆的讨论。","legacy_url":"../people-events-reference-1830-2026.html#person-maraden-panggabean"},{"id":"person-soengkono","title":"苏恩科诺（Soengkono）","description":"苏恩科诺是泗水战役中的共和国军事指挥者。1945年11月英军发动大规模进攻时，他参与组织当地防御；其后来的国家英雄授勋将革命军事记忆带入2026年公共纪念。","legacy_url":"../people-events-reference-1830-2026.html#person-soengkono"},{"id":"person-ki-mas-mansyur","title":"基·马斯·曼苏尔（Ki Mas Mansyur）","description":"基·马斯·曼苏尔是穆罕默迪亚宗教与教育领袖，参与民族主义活动。日本占领期间，他与苏加诺、哈达和基·哈查尔·德宛达拉共同领导Putera；该机构既提供民族主义动员平台，也服务于日本占领政权的战争动员。","legacy_url":"../people-events-reference-1830-2026.html#person-ki-mas-mansyur"},{"id":"person-schoonheyt","title":"斯洪海特（L. J. A. Schoonheyt）","description":"L. J. A. 斯洪海特是博文迪古尔营地医生和记录者。他描述流放者劳动、工资、点名、健康和生活安排，为研究营地日常提供同时代观察；医生记录反映特定时期和岗位，不能代表每名被拘者的相同经历。","legacy_url":"../people-events-reference-1830-2026.html#person-schoonheyt"},{"id":"person-suryo","title":"苏尔约（Suryo）","description":"苏尔约是共和国任命的梭罗驻地代表。1946年共和国建立市政和地方行政时，他成为中央政府接入梭罗地方政治的代表之一；王室辖区、市政机关、特别区和地方防务委员会依不同规则逐步纳入共和国体制。","legacy_url":"../people-events-reference-1830-2026.html#person-suryo"},{"id":"person-soetarto","title":"苏塔托（Soetarto）","description":"苏塔托是梭罗地方防务委员会负责人。1946年委员会成员包括民族委员会、工党和马斯友美党代表，参与共和国在梭罗建立行政与防务安排；这类地方机构显示独立革命不只发生在中央政府和正规军之间。","legacy_url":"../people-events-reference-1830-2026.html#person-soetarto"},{"id":"person-mansergh","title":"罗伯特·曼塞尔格（Robert Mansergh）","description":"罗伯特·曼塞尔格是英国少将，指挥1945年增派到泗水的英印第5师。英军在11月9日发出缴械通牒，次日由陆海空部队发动进攻；其军事行动服务于盟军接收任务，同时伴随荷兰殖民机关重返。","legacy_url":"../people-events-reference-1830-2026.html#person-mansergh"},{"id":"person-sultan-hb-ix","title":"哈孟库布沃诺九世（Sri Sultan Hamengku Buwono IX）","description":"哈孟库布沃诺九世是日惹苏丹和共和国重要支持者。日惹被荷兰占领后，他与共和国军政领导人的联络和支持进入1949年3月1日总攻的筹划史；关于倡议、批准和具体命令链，不同回忆材料强调各异。","legacy_url":"../people-events-reference-1830-2026.html#person-sultan-hb-ix"},{"id":"person-bambang-sugeng","title":"班邦·苏根（Bambang Sugeng）","description":"班邦·苏根是共和国陆军第三师指挥官。1949年日惹总攻的策划和执行叙述将他、哈孟库布沃诺九世、苏哈托及苏迪尔曼指挥体系联系起来；他在行动中的具体批准和命令权限仍须原始军令核定。","legacy_url":"../people-events-reference-1830-2026.html#person-bambang-sugeng"},{"id":"person-roem","title":"穆罕默德·鲁姆（Mohammad Roem）","description":"穆罕默德·鲁姆是共和国外交官和谈判代表。1949年5月，他代表印尼与荷兰代表范罗延达成声明，推动苏加诺、哈达等领导人获释、返回日惹并恢复谈判；声明内容与之后的主权移交协商相关。","legacy_url":"../people-events-reference-1830-2026.html#person-roem"},{"id":"person-van-roijen","title":"范罗延（Jan Herman van Roijen）","description":"扬·赫尔曼·范罗延是荷兰外交官和谈判代表。1949年他代表荷兰与穆罕默德·鲁姆达成鲁姆—范罗延声明，涉及共和国领导人释放、返回日惹和停止军事行动，是印尼革命外交进程中的关键节点。","legacy_url":"../people-events-reference-1830-2026.html#person-van-roijen"},{"id":"person-ade-irma","title":"阿德·伊尔玛（Ade Irma Suryani）","description":"阿德·伊尔玛·苏尔亚妮是纳苏蒂安年幼的女儿。1965年九三〇行动袭击纳苏蒂安住宅时，她遭枪击后死亡；她的死亡成为官方纪念叙述的一部分，也应与军事行动整体责任和后来宣传分别分析。","legacy_url":"../people-events-reference-1830-2026.html#person-ade-irma"},{"id":"person-pranoto","title":"普拉诺托（Pranoto Reksosamodra)","description":"普拉诺托·雷克索萨莫德拉是印尼陆军高级参谋军官。1965年10月，他发出军方清查和调查相关命令，KOTI与内阁随后也发布人员审查指示；这些文书显示权力由不同机关交错行使，不能仅凭职务名称推定其拥有完整行动指挥权。","legacy_url":"../people-events-reference-1830-2026.html#person-pranoto"}]);

window.HIST.people.push(...[{"id":"person-sartono","title":"萨尔托诺（Sartono）","description":"民族主义政党政治家和共和国议会活动者。1948年担任BP-KNIP有关德朗古劳资争议的调查委员会主席；应区分他个人PNI党籍与委员会的法定职权。","legacy_url":"","origin":"有来源线索的新增索引，完整传记需继续核对"},{"id":"person-darmini","title":"达尔米尼（Darmini）","description":"1954年以Gerwani副总书记名义发表关于该组织大会及国际妇女联系的文章。职务见同期自署，原始任命表需进一步核查。","legacy_url":"","origin":"有来源线索的新增索引，完整传记需继续核对"},{"id":"person-pudji-aswati","title":"普吉·阿斯瓦蒂（Pudji Aswati）","description":"东爪哇妇女组织活动者，研究记其担任过泗水Gerwani分会第三任主席、参与地方人民大学；后遭拘押、审判，1989年获释。","legacy_url":"","origin":"有来源线索的新增索引，完整传记需继续核对"},{"id":"person-jusuf-adjitorop","title":"优素福·阿吉托罗普（Jusuf Adjitorop）","description":"PKI历史干部。其自传称1966年获得政治局授权领导国外中央委员会代表团，仍需原始决议与同期人事材料核对。","legacy_url":"","origin":"有来源线索的新增索引，完整传记需继续核对"},{"id":"person-ibrahim-isa","title":"易卜拉欣·伊萨（Ibrahim Isa）","description":"亚非人民团结国际活动者，曾任印尼驻开罗相关国际机构代表，1966年后进入国外PKI代表团联系网络，跨组织身份须分别核查。","legacy_url":"","origin":"有来源线索的新增索引，完整传记需继续核对"},{"id":"person-gatot-lestario","title":"加托特·莱斯塔里约（Gatot Lestario）","description":"1960年代后期南勿里达地下网络相关人员，其与普吉·阿斯瓦蒂的家庭及政治活动应分别记录。","legacy_url":"","origin":"有来源线索的新增索引，完整传记需继续核对"},{"id":"person-adam-soepardjan","title":"阿丹·苏帕尔詹（Adam Soepardjan）","description":"1927年生于松巴哇，1950年在泗水机器制造业工作，成为Braat/Barata厂SBIM金属工会分会主席。1959年以SOBSI代表参加东德/捷克工会活动；1965-10-20被捕后在东爪哇遭13年未经审判拘押，1975—1976用化名Bintang Karim在狱中写英文教材，1978获释，1980年在泗水重新谋生。主要据本人回忆、保存的手稿及后出同行评审研究；各项职务、拘押和恢复职业需分别核原档，不能据工会身份推定其参与1965年军官行动。","legacy_url":"","origin":"《International Review of Social History》学术论文及其说明的IISH Adam Soepardjan Papers；原囚犯账册和工会选举本未读"},{"id":"person-partondo","title":"帕尔通多（Partondo）","description":"1921年4月30日《Soeara Ra'jat》刊头列名的编辑（Redactie）；早期1930年前的公开报道还涉及马来文政治小册子翻译工作。原刊能够证明该署名承担编辑职责，但现有研究尚未证实其法定姓名、任命日期、党籍或个人生平；不能将刊物的政治立场自动归作个人全体活动。","legacy_url":"","origin":"S891同期刊头署名、S889学术研究；待人物同名消歧"},{"id":"person-soekin","title":"苏金（Soekin，署名待消歧）","description":"1921年《Sinar Hindia》署名Soekin的文章《Kommunisme tingkat pertama》讨论如何用荷兰文和马来文表达马克思主义科学与社会变化等观念。当前仅能按该报刊署名建立人物研究入口；真实姓名、具体党籍和与同名活动者的关系尚未核实。","legacy_url":"","origin":"学术论文Crawford依同期《Sinar Hindia》引文；原刊与身份档待核"},{"id":"person-idrus-solok","title":"伊德鲁斯（Idrus，1926年索洛克干部）","description":"1928年荷兰殖民西苏门答腊调查报告（1960英译p117）称Idrus为1926年初Solok地方共产党负责人：他在Sutan Said Ali传达上级命令后，于1926-01-21致信共产党中央询问地方组织的越级沟通。可证实的是殖民调查报告如此记载；原函、其完整姓名与后续遭遇未取得，不能把同名者自动合并。","legacy_url":"","origin":"1928殖民调查报告、1960 Cornell英译p116—117；需原始命令与姓名消歧"},{"id":"person-sarun-1926","title":"萨伦（Sarun，1926年地方使者）","description":"同一殖民调查报告称Solok、Sawah Lunto与Silungkang地方小组疑虑中央命令真伪，联合委派Sarun前往爪哇询问。报告称未获中央正式接见；职务和任务据后出殖民调查转述，原委任函、法定姓名与路线未核。","legacy_url":"","origin":"1928殖民调查报告、1960 Cornell英译p116—117；需原始命令与姓名消歧"},{"id":"person-dahlan-1926","title":"达兰（Dahlan，1926年私下传话者）","description":"同一殖民调查报告称Sarun赴爪哇后虽未获正式接见，但Dahlan私下向其通报信息。仅可确认殖民报告载有该姓名、行动归属；不等于已核他有中央委员会职务，也不能同名人物自动合并。","legacy_url":"","origin":"1928殖民调查报告、1960 Cornell英译p116—117；需原始命令与姓名消歧"},{"id":"person-ishak-djuarsa","title":"伊沙克·朱阿尔萨（Ishak Djuarsa）","description":"1965—1966年亚齐军事指挥官；Melvin引述当时军政文书，称他在1966年4月23日赴Bireuen/Lhokseumawe、24日要求调查学生与军民冲突，5月8日下达针对所谓‘外国华人’的离境命令。签署军令及地方实际执行还须直接核查。","legacy_url":"","origin":"Jess Melvin 2013全文S612与其引述的《Perkembangan 1966》、2011口述；原始身份待核"},{"id":"person-mohd-sjakur","title":"穆罕默德·沙库尔（Mohd. Sjakur）","description":"1966年4月Melvin所引《Perkembangan 1966》称其为北亚齐军事指挥官，曾参与处理Lhokseumawe反华示威与军民冲突。其具体指挥命令、开枪责任和军事调查原件未读，不能以该文叙述直接完成责任认定。","legacy_url":"","origin":"Jess Melvin 2013全文S612与其引述的《Perkembangan 1966》、2011口述；原始身份待核"},{"id":"person-mokoginta-aceh","title":"莫科金塔（Mokoginta，1966年军方负责人）","description":"1966年在苏门答腊军方权力结构中活动。Melvin引述其4月21日公开讲话，主张避免种族主义行动；其讲话与亚齐军方随后5月8日的驱逐命令不一致。须用其本人原发言和部队辖区文书区分法定职权及实际行为。","legacy_url":"","origin":"Jess Melvin 2013全文S612与其引述的《Perkembangan 1966》、2011口述；原始身份待核"},{"id":"person-ho-fui-yen","title":"Ho Fui Yen（中文汉字姓名未核）","description":"亚齐华人社区的历史口述证人之一；2011年向研究者叙述1966年家庭受威胁、迁离及途经棉兰的车队经历。不据拉丁字母姓名自行补写汉字姓名，现存证据是文章所引英文拼写及访谈记录，不能以个人经历代替整批迁出者共同经历。","legacy_url":"","origin":"Jess Melvin 2013全文S612与其引述的《Perkembangan 1966》、2011口述；原始身份待核"},{"id":"person-xie-jie-fang","title":"Xie Jie Fang（中文汉字姓名未核）","description":"2011年以拉丁字母姓名接受口述、回忆亚齐1965—1966年的家庭暴力、地方政治标签和外逃经历；2013年学术论文引述其口述，个人完整身份与相关档案应在授权范围内核对，不推断其有特定政党党籍。","legacy_url":"","origin":"Jess Melvin 2013全文S612与其引述的《Perkembangan 1966》、2011口述；原始身份待核"},{"id":"person-iskandar-lhokseumawe-1966","title":"伊斯坎达尔（Iskandar，1966年Lhokseumawe遇害学生）","description":"Melvin引述军方《Perkembangan 1966》称1966年4月Lhokseumawe军方与示威学生冲突中，一名名叫Iskandar的中学生中枪死亡；仅知此名和事件，未取得医院/死亡登记或全名，不能与其他同名历史人物合并。","legacy_url":"","origin":"Jess Melvin 2013全文S612与其引述的《Perkembangan 1966》、2011口述；原始身份待核"},{"id":"person-harjono-labor","title":"哈约诺（Harjono，SOBSI创立期）","description":"1946年11月29日SOBSI成立时，国家历史百科的后出研究称Harjono当选主席；在1948年危机中遭拘押与处决（后出叙述死亡日期有歧异）。具体人事档、监禁/判决及死亡记录未取得，不得由同名自动识别其他Harjono。","legacy_url":"","origin":"印尼国家历史百科所引劳动史/Tedjasukmana与Hearman论文；原始人事名册待核"},{"id":"person-setiadjit","title":"塞蒂亚吉特（Setiadjit）","description":"1946年11月29日SOBSI初期领导班子中的副主席，据印尼国家历史百科引用的工会史研究。需核大会选举程序、姓名拼写和后续政党身份；不是据任职反推所有工会正式党员政治派别。","legacy_url":"","origin":"印尼国家历史百科所引劳动史/Tedjasukmana与Hearman论文；原始人事名册待核"},{"id":"person-soerjono-gsbv","title":"苏尔约诺（Soerjono，GSBV创立期）","description":"1946年6月GSBV成立时的领导人之一，印尼国家历史百科引用Tedjasukmana等劳动史。其是否就是其他资料写作Surjono的人需姓名、职务和履历核对，不作未经证实的合并。","legacy_url":"","origin":"印尼国家历史百科所引劳动史/Tedjasukmana与Hearman论文；原始人事名册待核"},{"id":"person-oey-gee-hwat","title":"Oey Gee Hwat（汉字姓名未核）","description":"历史研究所列1940年代末SOBSI相关领导之一；‘黄义华’仅为占位转写不作为本百科经核汉字姓名，应使用原拉丁字母Oey Gee Hwat，原名与具体职责待组织文件核。","legacy_url":"","origin":"印尼国家历史百科所引劳动史/Tedjasukmana与Hearman论文；原始人事名册待核"},{"id":"person-tris-metty","title":"特丽丝·梅蒂（Tris Metty）","description":"1950年Gerwis创立期活跃妇女组织者。后出报道将她列为首任或最早主席，另有报道称初届主席团实行多名主席。没有查到1950年大会原始选举文书，不提前确定其正式职务持续期。","legacy_url":"","origin":"S1537后出妇女史；创立名册与个人职务原件待核"},{"id":"person-umi-sardjono","title":"乌米·萨尔佐诺（Umi Sardjono）","description":"Gerwis/Gerwani早期领导人员，后出研究列名参与1950年发起并随后担任重要领导职务。具体1950任职排名、1954主席选举与个人党籍须分别核验；不能由同姓Sardjono推定同1920年代男性政治家有血缘或是同一人。","legacy_url":"","origin":"S1537后出妇女史；创立名册与个人职务原件待核"},{"id":"person-sk-trimurti","title":"S. K. 特里穆尔蒂（S. K. Trimurti）","description":"女性记者、劳工政治活动者和共和国初期劳动部长；后出史料记参与1950年Gerwis创立并在组织是否扩大为大众会员体制等问题上持有不同意见。要分别核定1950年她的职务、其后退出或不再任职的时间，不倒填后来的政治观点。","legacy_url":"","origin":"S1537后出妇女史；创立名册与个人职务原件待核"},{"id":"person-sri-kusnapsiyah","title":"斯里·库斯纳普西雅（Sri Kusnapsiyah）","description":"Gerwis1950年创立期被后出报道列为书记或发起人员之一；缺完整履历及首届会议正式书记任免原件，保持音译暂定。","legacy_url":"","origin":"S1537后出妇女史；创立名册与个人职务原件待核"},{"id":"person-djenab-pabuaran","title":"珍娜布（Djenab，Pabuaran农村妇女）","description":"1961年《Api Kartini》第2期第8—9页人物报道中的西爪哇Pabuaran贫农妇女。报道说她带幼儿赴雅加达全国农妇研讨会、使用会场托儿安排并希望村庄也有托幼设施；子女、家庭土地与收入数据为刊物所记，尚未独立核对访谈录音、土地簿和会议签到。不是因为出席Gerwani主办研讨会就能证明她具PKI党籍。","legacy_url":"","origin":"1961年《Api Kartini》同期报道S460/C802"},{"id":"person-mochammad-tauchid","title":"穆罕默德·陶希德（Mochammad Tauchid）","description":"文化部历史百科列其为1945年BTI早期组织者，1953年中央干部反对BTI与RTI等合并。原1945会场代表、1953书面异议和其后党派活动仍需逐项核。","legacy_url":"","origin":"S1540/C2901—C2902印尼文化部历史百科; 当期原始会议材料待核"},{"id":"person-wijono-suryokusumo","title":"维约诺·苏尔约库苏莫（Wijono Suryokusumo）","description":"文化部历史百科据后出著述列为1945年Surakarta农民及工人会议倡议BTI的参与者，原签名、实际代表地方及后续职务待核。","legacy_url":"","origin":"S1540/C2901—C2902印尼文化部历史百科; 当期原始会议材料待核"},{"id":"person-tandiono-manu","title":"坦迪约诺·马努（Tandiono Manu）","description":"后出文化部BTI条目称其为1953年反对合并的中央管理人员，个人正式职务、组织政治取向、后续活动尚无同期印证。","legacy_url":"","origin":"S1540/C2901—C2902印尼文化部历史百科; 当期原始会议材料待核"},{"id":"person-muntalif-1953","title":"蒙塔利夫（Muntalif，1953年BTI干部）","description":"文化部历史百科所列反对1953年合并的BTI中央干部之一，身份仅凭后出姓名且未取得完整个人生平，不得与同音译人物合并。","legacy_url":"","origin":"S1540/C2901—C2902印尼文化部历史百科; 当期原始会议材料待核"},{"id":"person-ismail-bti-1953","title":"伊斯梅尔（Ismail，1953年BTI干部）","description":"文化部历史百科记其为1953年BTI合并异议者；Ismail为常见姓名，在未找到完整履历前必须建立与其他同名Ismail分开的临时实体。","legacy_url":"","origin":"S1540/C2901—C2902印尼文化部历史百科; 当期原始会议材料待核"},{"id":"person-asmoe-tjiptosoedarsono","title":"阿斯穆·吉普托苏达尔索诺（Asmoe Tjiptosoedarsono）","description":"文化部历史百科列为1945年BTI形成讨论中的人物，1945和1953会议角色不能仅凭共同提及推定；原代表册待核。","legacy_url":"","origin":"S1540/C2901—C2902印尼文化部历史百科; 当期原始会议材料待核"},{"id":"person-sajoga-bti-1945","title":"萨约加（Sajoga，1945年BTI参与者）","description":"文化部历史百科列为1945年BTI初期组织者；同名在1950年《Suara Tani》当期刊物中出现，尚未完成姓名/职务关联印证，不自动合并其他Sajoga。","legacy_url":"","origin":"S1540/C2901—C2902印尼文化部历史百科; 当期原始会议材料待核"},{"id":"person-sukatno-1967","title":"苏卡特诺（Sukatno，人民青年干部）","description":"Hearman记载前人民青年相关负责人Sukatno在1967—1968年参与Rewang联系网络并在南勿里达被捕；不是自动确认他指挥所有青年地下活动，正式任免、被捕日期待原件。","legacy_url":"","origin":"S1310学术采访与C2296/C2491/C2517/C2703，原时任命与羁押原档缺"},{"id":"person-tjugito-1967","title":"朱吉托（Tjugito）","description":"历史研究列其为PKI中央成员及1967—1968年临时中央、南勿里达网络参与者；具体参与1965年哪些会议与军方指控需要另查当期文件，不把党职等同军事指挥。","legacy_url":"","origin":"S1310学术采访与C2296/C2491/C2517/C2703，原时任命与羁押原档缺"},{"id":"person-suwandi-eastjava-1968","title":"苏万迪（Suwandi，东爪哇PKI干部）","description":"据Hearman及KontraS研究，1967年参与南勿里达工程委员会联络，1968年6月12日被军方拘捕；其后军方展示与审讯另有照片/新闻线索，实际职务起止应查原始省级委员会记录。","legacy_url":"","origin":"S1310学术采访与C2296/C2491/C2517/C2703，原时任命与羁押原档缺"},{"id":"person-tuti-courier-1967","title":"图蒂（Tuti，1967年地下交通员）","description":"Hearman访谈称一位曾在东爪哇Gerwani活动的Tuti在1966—1968年流亡期间承担秘密联络、掩护和交通，寻找食宿困难；只有这一姓名称谓，不能认定她代表所有Gerwani会员，也不得凭同名合并他人。","legacy_url":"","origin":"S1310学术采访与C2296/C2491/C2517/C2703，原时任命与羁押原档缺"},{"id":"person-sulami-women-1959","title":"苏拉米（Sulami，1959年文章作者）","description":"1959年在《Women of the Whole World》第3期撰写印尼妇女运动组织历史，记1948年KOWANI争议、Gerwis/ Gerwani大会、1957分会和会员数字、培训与托幼工作。直接可证的是文章作者的署名及其组织政治观点，1948年实际会议纪要、与其他同名Sulami身份的完整消歧尚未完成。","legacy_url":"","origin":"1959年妇女运动公开文献S462/C804，文献作者身份较明确，个人完整组织履历待核"},{"id":"person-natsir-1952","title":"穆罕默德·纳齐尔（Mohammad Natsir）","description":"1940—1960年代印尼伊斯兰政治家、Masyumi领导人。其在党执行机关和共和国政府任职的范围须与Muhammadiyah等宗教团体的自身组织角色分开；1952年NU退出与1959—1960解散过程的个人政治立场不等于所有宗教社会团体的共同决议。","legacy_url":"","origin":"文化部Masyumi历史百科、Munhanif 2012研究与Muhammadiyah/NU自身后出文献；原大会／公报待核"},{"id":"person-wahid-hasyim-1952","title":"瓦希德·哈希姆（Wahid Hasyim）","description":"来自NU传统伊斯兰教士家庭的政治和教育活动者，参与1945年Masyumi建党与宗教咨询网络，曾任宗教部长；1952年NU退出背景中有关宗教部长岗位、人事和咨询机关权力的记述须分别核对，不能直接以个人经历代表NU全国会员。 他于1953年4月19日因交通事故去世；因此不能在1955年选举或1959—1960年党政决策中作为活跃在场者。该日期可按NU自己的纪念史及相关人物年谱追查。","legacy_url":"","origin":"文化部Masyumi历史百科、Munhanif 2012研究与Muhammadiyah/NU自身后出文献；原大会／公报待核"},{"id":"person-soekiman-1945","title":"苏基曼·维尔约桑佐约（Soekiman Wirjosandjojo）","description":"印尼伊斯兰政治家；后出政府历史百科记1945年11月Masyumi新政党成立初期担任重要执行职务。须查11月7—8日日惹大会原签到和任命文本，不将1943年军政时期同名组织成员资格自动前移。","legacy_url":"","origin":"文化部Masyumi历史百科、Munhanif 2012研究与Muhammadiyah/NU自身后出文献；原大会／公报待核"},{"id":"person-faqih-usman-1952","title":"法基赫·乌斯曼（Faqih Usman）","description":"Muhammadiyah相关政治与宗教教育人士，后曾担任共和国宗教部长；NU与Masyumi在1952年前后的人事争议涉及其任命，但具体任免公报、不同地区意见以及其本人的参与范围须独立核实。","legacy_url":"","origin":"文化部Masyumi历史百科、Munhanif 2012研究与Muhammadiyah/NU自身后出文献；原大会／公报待核"},{"id":"person-anwar-tjokroaminoto-1952","title":"安瓦尔·乔克罗阿米诺托（Anwar Tjokroaminoto）","description":"NU的后出组织史列为1952年8月30日印尼穆斯林联盟LMI第一副主席，代表PSII政治组织。不能自动等同于H.O.S. Tjokroaminoto本人或凭姓氏连接旧Sarekat Islam人事；原当期大会票选与完整姓名待核。","legacy_url":"","origin":"NU组织历史1952年LMI回顾及引用的1952-09-01同期报刊线索；原大会签到未取"},{"id":"person-siraadjuddin-abbas-1952","title":"西拉朱丁·阿巴斯（KH Siraadjuddin Abbas）","description":"NU后出历史记为1952-08-30 LMI第二副主席，来自Perti传统伊斯兰宗教政治网络。该职位须同Perti本组织内的正式职位、其他年份不同同名活动者分开核查。","legacy_url":"","origin":"NU组织历史1952年LMI回顾及引用的1952-09-01同期报刊线索；原大会签到未取"},{"id":"person-sulaiman-labai-1926","title":"苏莱曼·拉拜（Sulaiman Labai）","description":"西苏门答腊锡伦康（Silungkang）的地方政治与宗教演讲者。Kahin据地方回忆、报刊及殖民资料记其早期活跃于伊斯兰联盟/人民联盟；1926年10月13日遭殖民政府逮捕。这种地方领导关系不能简单推为党中央委员身份；早期粮食活动和组织职务仍需同时期文书核对。","legacy_url":"","origin":"Kahin 1996《Indonesia》62:19–36，印刷pp.27–31；后出研究，未取得完整当期成员簿"},{"id":"person-arif-fadlillah-1926","title":"阿里夫·法德利拉（Arif Fadlillah）","description":"1926年中接管巴东班让（Padang Panjang）共产党地方机关的活动者。Kahin记其同年9月参加丹·马拉卡主持的新加坡讨论，返乡后反对贸然起事，且其立场与爪哇来使及其他西苏门答腊地方小组的判断不同。其个人主张不等于全部地方成员意见。","legacy_url":"","origin":"Kahin 1996，印刷pp.29–31；作者引当期报刊和后出资料"},{"id":"person-baharuddin-saleh-1926","title":"巴哈鲁丁·萨莱赫（Baharuddin Saleh）","description":"Kahin记1926年10月初由爪哇党中央派到西苏门答腊宣传新的行动计划。‘被派出的人员’与‘实控地方机关’是两种不同证据对象；授权原令、地方接待名单及通信日期尚待核实。","legacy_url":"","origin":"Kahin 1996，印刷p.31，后出研究对派遣的重建"},{"id":"person-muhammad-nur-ibrahim-1926","title":"穆罕默德·努尔·易卜拉欣（Muhammad Nur Ibrahim）","description":"1926年10月20日巴东地方机关改组后被Kahin记为负责人；11月14日被殖民当局逮捕，其笔记被扣押并用于进一步拘押活动者。该后果据学者引述的殖民资料，需核当期逮捕记录与缴获清单。","legacy_url":"","origin":"Kahin 1996，印刷pp.31–32，证据包含殖民机关记载"},{"id":"person-kamaruddin-manggulung-1926","title":"卡马鲁丁（称号Manggulung，Kamaruddin gelar Manggulung）","description":"1926年12月20日锡伦康会议参与者。Kahin并列殖民行政对其的贬损性称呼与印尼叙述对其的英雄化称呼；关于是否以武器迫使会议形成决定，必须保持‘有关来源如此记述’，不能不加辨别地当成一致证实事实。","legacy_url":"","origin":"Kahin 1996，印刷pp.31–32；相互冲突的政治叙述未作最终裁决"},{"id":"person-limin-messenger-1926","title":"利敏（Limin／Alimin，同名交通员，1926）","description":"1926年西苏门答腊地方党组织联络者；Kahin 1996所引Benda/McVey译本称他自1926年5月起是巴东班让Arif Fadlillah与锡伦康人员之间的联系者。1926年12月底受当地人委托打探Fadlillah的情况，发现对方被捕后据报未向锡伦康报告而离开。**此Limin不是后来著名PKI领导人Alimin Prawirodirdjo**；只有较短称谓，准确法定姓名待核。","legacy_url":"","origin":"Kahin 1996，印刷p.31脚注66；引Benda/McVey 1960 pp.121、171，后出重建非当期原通讯"},{"id":"person-abdul-muluk-nasution-1927","title":"阿卜杜勒·穆卢克·纳苏蒂安（Abdul Muluk Nasution）","description":"锡伦康1927年地方参与人及后来的回忆录作者，著有1981年《Pemberontakan Sarikat Rakyat Silungkang Sumatera Barat 1926–1927》。Kahin记他带领向沙哇伦多行进的一支队伍，随后遭殖民机关逮捕，并引其回忆涉及当地宗教与经济生活。这与军人A. H. Nasution完全不同，不能因同姓‘纳苏蒂安’归并。","legacy_url":"","origin":"Kahin 1996，pp.27、32—33；兼引1981本人回忆与1927殖民文件"},{"id":"person-abdul-munap-1927","title":"阿卜杜勒·穆纳普（Abdul Munap，1927锡伦康地区）","description":"1927年初巴东西布苏克附近地方武装参与人，Kahin转引其为Tanjung Ampalu公立学校教师和Sarekat Rakyat成员，并记其领导一支在道路上袭击殖民军增援队伍的地方队伍。来源引语将他冠以‘General’，目前**不能作为殖民军或共和国正规军授予的正式军衔**；其死亡及不同来源日期、地区需查警方原件。","legacy_url":"","origin":"Kahin 1996，印刷p.33脚注72，引1927电报及Abdul Muluk Nasution回忆"},{"id":"person-taher-marah-sutan","title":"穆罕默德·塔赫尔·马拉·苏丹（Mohd. Taher Marah Sutan）","description":"巴东港口航运文员和商人社团组织者。Kahin引哈达自传记其于1914年巴东Sarikat Usaha担任书记，关心青年教育和理性科学知识。作为商人团体干部不自动等于后来PKI正式党员；须查同期会议和社团注册。","legacy_url":"","origin":"Kahin 1996 pp.28—29脚注41；引Mohammad Hatta 1981自传"},{"id":"person-abdullah-basa-bandaro","title":"阿卜杜拉·巴萨·班达罗（Abdullah Basa Bandaro）","description":"巴东商人与教育及报刊资助者。Kahin据学术重建记他帮助Abdullah Ahmad筹办Adabiah学校，并在1920年代初资助《Djago-Djago》《Pemandangan Islam》等报纸，参与丹·马拉卡文章和小册子的跨地区传播。既与荷兰官员维持交往又支持反殖民出版；不能用单一阵营标签代替其商业与政治往来。资助账簿和具体款项未得。","legacy_url":"","origin":"Kahin 1996 p.28脚注43—45；引Taufik Abdullah、Tamin手稿"},{"id":"person-magas-abdul-madjid","title":"马加斯·阿卜杜勒·马吉德（Magas Abdul Madjid）","description":"据Kahin，曾在新加坡学习、后在三宝垄接触塞马温等人，获介绍/任命到西苏门答腊进行党与人民联盟组织工作。1923年巴东地区组织发展初期是实际地方负责人之一，1924年前后被捕、判刑；殖民记录中的任职与党内任命原件需核，不能据其被捕直接推定地区整个组织停止。","legacy_url":"","origin":"Kahin 1996 pp.28—29，转引1923报纸及殖民资料"},{"id":"person-nawawi-arief","title":"纳瓦维·阿里夫（Nawawi Arief）","description":"沙哇伦多煤矿工人社会网络中的报刊编辑。据Kahin所引Mestika Zed研究、当期报刊线索，他编辑《Suara Tambang》，该刊报道矿工遭遇及劳动争议；1924年2月遭逮捕。编辑身份和矿工工会会员身份不能自动合一。","legacy_url":"","origin":"Kahin 1996 p.27脚注39，依据后出研究及1924《Doenia Achirat》"},{"id":"person-hadi-soedardjo-1959","title":"哈迪·苏达尔佐（Hadi Soedardjo，1959年工会代表）","description":"国际劳工组织网络中的印尼石油工会Perbum副主席，1959年与泗水机械工人阿丹·苏帕尔詹同行前往东德及有关国际工会会议。后出学者整理及团体合照可定位其代表身份；原护照、石油工会副主席正式选任和是否拥有PKI党籍尚未核实。","legacy_url":"","origin":"《International Review of Social History》关于Adam Soepardjan论文，工会代表记述与1959年图注；未取得任命原件"},{"id":"person-setiati-surasto-wftu","title":"塞蒂亚蒂·苏拉斯托（Setiati Surasto）","description":"SOBSI全国理事会副主席和女性工会活动者。后出工运研究称她在普拉格接任Sugiri担任世界工会联合会秘书岗位；具体上任年月、工资关系、组织会费与个人政治党籍须以任职档和本人通信核实。不能把她只作为Gerwani成员处理。","legacy_url":"","origin":"《International Review of Social History》工运人物和国际工会岗位回顾；精确任期仍待核"},{"id":"person-sri-ambar-sobsi-1977","title":"斯丽·安巴尔（Sri Ambar，SOBSI妇女部门负责人）","description":"国际特赦组织1977-09-23名单列其为SOBSI妇女部门负责人，自1950年代初参加工会工作，1966年被捕，1975年经审判被判15年，报告时在雅加达Bukit Duri监狱。名单关于审讯酷刑为该组织当时收集的指称，非本项目已获取的审讯记录；不能将全体女性工会会员推定为PKI党员。","legacy_url":"","origin":"Amnesty International ASA 21/09/77，1977-09-23原始公开名单印刷p.1；尚需核人事和法院裁判"},{"id":"person-dahliar-bti-1977","title":"达利亚尔（Dahliar，BTI议会代表）","description":"1977年国际特赦组织名单将她记为代表BTI的国会议员，称1965年10月被捕，1977年报告时在Plantungan女子拘押营；报告没有足够资料说明她个人全部议会任期、起诉材料和后续获释日期。","legacy_url":"","origin":"Amnesty International ASA 21/09/77，印刷p.1；属当时团体报告非官方羁押名册"},{"id":"person-kartina-kurdi-1977","title":"卡蒂娜·库尔迪（Kartina Kurdi）","description":"1977年国际特赦组织名册列为BTI政治组织者兼议会代表，称其也是Gerwani领导人员，1965年被捕、1977年仍在雅加达Bukit Duri监狱。既有的农会和妇女运动联系应该分别记入，不以‘两个组织’推导秘密军事命令或全国统一党籍。","legacy_url":"","origin":"Amnesty International ASA 21/09/77，印刷p.1，后来同名人物独立核对待办"},{"id":"person-kusnah-unilever-1977","title":"库斯娜（Kusnah，雅加达联合利华工厂工会）","description":"国际特赦组织1977年名单称她曾在雅加达联合利华工厂工作，加入同SOBSI有关联的工会，1969年被捕，报告时在三宝垄Bulu监狱。原厂录用文件、1969年羁押令和个人是否有正式PKI党籍没有核实，不能凭工会身份补造。","legacy_url":"","origin":"Amnesty International ASA 21/09/77，印刷p.2；名称仅Kusnah，不与同名人物自动合并"},{"id":"person-otjik-textile-1977","title":"奥吉克（Otjik，雅加达纺织女工）","description":"1977年国际特赦组织名单记她为雅加达一家纺织厂的工人、SOBSI系统纺织工会成员，1967或1968年被捕，1977年在Plantungan女子拘押营。工厂名称、正式入会名册和抓捕月份缺原始证据。","legacy_url":"","origin":"Amnesty International ASA 21/09/77，印刷p.2；原名仅Otjik，保留身份消歧限制"},{"id":"person-sri-suharti-aviation-1977","title":"斯丽·苏哈蒂（Sri Suharti，民航职工工会与律师）","description":"1977年国际特赦组织名单记其为律师兼民航职工工会Serbaud活跃会员，1969年在雅加达被捕，时被关押于Bukit Duri；报道还说任民航机场经理的丈夫遭拘捕、有五个孩子。家庭关系及任职来源是当时人权组织获得的报告，不能凭配偶关系推断共同政治行动。","legacy_url":"","origin":"Amnesty International ASA 21/09/77，印刷p.3；未得律师执业、人事和羁押原档"},{"id":"person-satijah-post-1977","title":"萨蒂娅（Satijah，邮电工会成员）","description":"1977年国际特赦组织名单记Satijah参加邮政及电信工人工会，1969年5月在雅加达被捕，1977年在Plantungan女子拘押营。报告记其约三十岁并育有一个儿子；工会正式会员号、家庭后续及司法程序尚未核实。","legacy_url":"","origin":"Amnesty International ASA 21/09/77，印刷p.2；属于选择性拘押人名单而非完整工会会员名录"},{"id":"person-sedijami-teacher-1977","title":"塞迪亚米（Sedijami，PGRI-NV教师工会）","description":"国际特赦组织1977年名单称她为教师、PGRI-NV左翼教师工会成员，1965年被捕，1977年关押在Plantungan。该个案说明被拘者还包括教育行业工会成员，不应将所有工会活动归作工厂、种植园或中央党机关行动。","legacy_url":"","origin":"Amnesty International ASA 21/09/77，印刷p.2；同名身份和校职务待核"},{"id":"person-ferdinand-runturambi-1977","title":"费迪南德·伦图兰比（Ferdinand Runturambi）","description":"SOBSI资深工会干部、议会代表及国际劳工组织联系人员。1977年国际特赦组织名单记其仍拘押于布鲁岛；Hearman关于国际工会网络的同行评审研究还提及其在WFTU相关机构任职。两种材料性质不同；其原始当选书、拘押和国际职务期限尚缺。","legacy_url":"","origin":"Amnesty International ASA 21/09/77印刷p.2；Hearman 2024 WFTU论文列岗位"},{"id":"person-pudjijati-union-1977","title":"普吉亚蒂（Pudjijati，工厂工资抗争者）","description":"1977年国际特赦组织名单称她是参加工资增长、反物价上涨行动的工厂工会活动者，并曾在苏加诺时期因示威被短暂逮捕；1965或1966年后再次被捕，1977年在三宝垄Bulu监狱。报告未给出工厂、工会正式名称与个别逮捕记录，不能强配SOBSI或与名近的Pudji Aswati合并。","legacy_url":"","origin":"Amnesty International ASA 21/09/77印刷p.2；身份与其他Pudji姓名禁止模糊合并"},{"id":"person-imam-churmen-pertanu","title":"伊玛目·楚尔门（Imam Churmen）","description":"1962年11月6日署名中爪哇Pertanu省级农民组织主席，批评Tegal地方分会在土地改革和分成佃作法执行方面缺少活动，要求调整领导班子。学者Luthfi引用ANRI目录号1548的当期信函；本研究已阅论文转录而未逐张阅原档。其后来作为Pertanu领导者对1973并入HKTI一事是否构成正式解散亦有后出争论，不宜因组织改名就推断个人换党。","legacy_url":"","origin":"S1541 Luthfi 2017 pp147,155; 1962 ANRI No1548 letter; original scanned file not independently obtained"},{"id":"person-slamet-sardho-pertanu","title":"斯拉梅特·萨尔多（Slamet Sardho）","description":"1962年11月6日作为中爪哇Pertanu省级组织秘书，同主席Imam Churmen联合签署要求整顿Tegal地方农民组织的信函。其正式任期、个人村庄和农户会员名单仍待取得ANRI当期档案。","legacy_url":"","origin":"S1541 Luthfi 2017 pp147; ANRI Pertanu collection No1548 via scholar transcription"},{"id":"person-mohammad-munasir-pertanu","title":"穆罕默德·穆纳西尔（Haji Mohammad Munasir）","description":"1964年农民节公开代表Pertanu中央，呼吁按真实耕作者受益原则执行基本土地法和分成佃作法，反对以表面农民名义领取土地。1970年组织信函另称其为中央负责人。上述语句引自2017学者转录1965《Landreform》杂志资料，尚未独立阅览1964完整发言及1970信件原件。","legacy_url":"","origin":"S1541 Luthfi 2017 pp147–148,155; Landreform 1965 p6 cited by author"},{"id":"person-soehaimi-pertanu-banyuwangi","title":"苏海米（Soehaimi，1966年外南梦Pertanu领导）","description":"1966年6月23日以Pertanu外南梦分会主席身份致信国家橡胶种植园PPN Karet XVI，要求停止驱离长期耕作Wadoeng West土地的农户、停止破坏农作物的挖洞行为并协商赔偿。论文与另外出版物提供该信内容与档案线索，但本研究尚未独立验看全部署名原件；不能推断会谈达成。","legacy_url":"","origin":"S1541 Luthfi 2017 pp150–151; transcribed 1966 Pertanu letter, originally in EHO collection"},{"id":"person-djoehdi-petani-banyuwangi","title":"朱赫迪（Djoehdi，Petani外南梦第一主席）","description":"1966年11月25日后出的农地研究引用外南梦民族主义农会Petani县级机关的申诉，列Djoehdi为第一主席签署人，要求保护遭夺回风险的农民地籍和土地改革受益人，尤其与1966年11月13日Pertanu/Petani联合抗议有关。原签名信件及本人身份未在本研究中独立看过。","legacy_url":"","origin":"S1541 Luthfi 2017 pp151–152; 1966 Petani complaint letter quoted"},{"id":"person-achmad-sanimin-petani","title":"艾哈迈德·萨尼明（Achmad Sanimin）","description":"1966年11月25日外南梦Petani农民组织县级抗议信署名秘书二，配合Djoehdi维护已被分配土地的农户权益；不应误将其归入PKI/BTI正式人事，原党籍、职务任命及签名待核。","legacy_url":"","origin":"S1541 Luthfi 2017 p151; 1966 Petani letter cited from regional archive"}]);
</script>

window.HIST.events.push(...[{"id":"event-colonial","title":"强制种植、土地租赁与劳动迁移","description":"1830年爪哇战争结束后，荷兰总督府在爪哇推行强制种植制度（Cultivation System）。殖民官员通过村长和地方贵族，把村庄土地、劳力和作物生产纳入咖啡、糖等出口生产；村民仍须种粮、纳税并承担地方徭役。制度纸面规定以部分土地或劳动承担义务，实际负担随村庄作物、土地、官员征派和家庭劳力而变。1830—1870年代，出口作物将殖民财政与国际商品市场直接接入乡村日常生活。 [殖民土地与劳动] [爪哇强制劳动与人口史]\n荷兰殖民政权沿不同的地方进程扩张。爪哇较早形成密集的行政、港口和交通网络；19世纪后期至20世纪初，荷兰军队和官员继续以战争与行政扩张控制亚齐、巴厘、龙目、苏拉威西等地。外岛的土地权利由地方社群习惯、王权和殖民租约共同塑造。东苏门答腊烟草和橡胶园、锡矿与港口建立了不同于爪哇小农农业的劳动市场；企业跨岛招工，以短期合同、工头管理和债务关系约束劳工。铁路、轮船和城市人口增长把各区连入出口经济，也加深了地区间土地制度和劳动条件的差别。 [殖民土地与劳动] [种植园与劳动关系]\n1870年《农业法》（Agrarische Wet）为荷兰企业取得长期租地建立法律框架；同年颁布的《农业法令》（Agrarisch Besluit）第一条规定，爪哇和马都拉岛上无法依殖民法律证明为个人所有的土地，原则上归入国家领域（domein）。殖民政府据此向企业发放最长可达75年的土地租约。法律把无法登记为个人所有的土地划入国家领域，村民的耕作、共同使用和习惯权利仍延续，企业租地、村庄使用和地方王权主张因而会在同一片土地上交叠。不同岛屿的权利制度各异，土地争端牵涉农民、佃户、种植园工人、村级权力和行政机关。 [1870年《农业法》与国家领域条款] [土地占有结构与地区差异]","legacy_url":"../people-events-reference-1830-2026.html#event-colonial"},{"id":"event-formation","title":"学校、报刊、协会与民族主义网络","description":"20世纪初，殖民政府实施所谓“伦理政策”，有限扩大荷兰语教育、交通和行政体系；教育机会仍按族群、家庭资源和社会身份分配。学校、印尼语与荷兰语报刊以及跨岛城市网络，使受教育者、商人、宗教人士和工人更容易建立协会。1908年，巴达维亚医学院学生建立布迪·乌托莫（Budi Utomo，常译“至善社”），以教育和爪哇社会改革为主要议题。梭罗的穆斯林商人约在1911年建立伊斯兰商人联盟（Sarekat Dagang Islam）；乔克罗阿米诺托等人于1912年前后推动其扩展为伊斯兰联盟（Sarekat Islam），会员进入职员、宗教人士和乡村网络。布迪·乌托莫以受教育者和爪哇文化改革为中心，伊斯兰联盟则从商贸团体成长为跨地区群众组织，各地支部形成自己的成员基础和行动方式。 [革命前的伊斯兰政治] [印度尼西亚近代政治史]\n苏加诺（Sukarno） 1901年6月6日出生。父亲 拉登·苏克米·苏苏罗哈迪约（Raden Soekemi Sosrodihardjo） 是爪哇小学教师，母亲 伊达·阿尤·尼奥曼·莱（Ida Ayu Nyoman Rai） 来自巴厘岛。关于他的出生地，后来的传记记有泗水和勿里达两说。苏加诺童年在泗水长大，进入欧洲小学（ELS）就读；在殖民教育按族群、身份和家庭条件分层的制度中，能够接受荷兰语教育者仍是少数。 [苏加诺家庭与早年教育]","legacy_url":"../people-events-reference-1830-2026.html#event-formation"},{"id":"event-uprising","title":"1926—1927年起事与殖民镇压","description":"1926年11月，起事在西爪哇和巴达维亚等地展开，参与者包括PKI地方组织成员、工人和乡村支持者；中央领导人与各地组织的准备、联络和行动并不同步。1927年初，西苏门答腊的起事由当地党员和地方支持网络推动，与爪哇行动分头发展。丹·马拉卡在海外反对准备不足时发动起事，党内干部围绕行动时机和革命路线发生分裂。荷兰殖民机关调动警察、军队和地方行政力量搜捕，随后进行军事审判、处决、监禁、驱逐和行政流放；首批被流放者于1927年送往博文迪古尔，之后的运输也把家属、口粮和通信纳入殖民行政管理。 [1926—1927年殖民政府报告] [起事后的流放和报刊记录]","legacy_url":"../people-events-reference-1830-2026.html#event-uprising"},{"id":"event-bovendigoel","title":"博文迪古尔：法律、运输与营地生活","description":"1926—1927年起事镇压后，殖民政府把部分政治活动者送往新几内亚南部的博文迪古尔（Boven-Digoel）。殖民政府运用总督的行政流放权，把政治活动者未经普通刑事审判送到偏远地区；殖民政府以安全和治安理由说明这套权力，殖民议会和受流放者则质疑其法律依据与程序。被流放者须接受守卫、点名、出入限制和地方官员报告。殖民政府称营地不实行强迫劳动，但口粮供应、工作安排、通信和释放审查都由行政机关控制；居民的营地生活因此持续受当局支配。 [1928年殖民政府报告] [流放法律与议会争论]\n被流放者和家属分批运抵营地。首批45名被拘者和43名家属于1927年2月1日从丹戎不碌港出发，经安汶前往丹那美拉（Tanah Merah）；此后，更多政治流放者和家属从三宝垄、泗水及安汶出发。配偶和子女随行，殖民行政因而把家庭住处、探访、口粮和迁移一并纳入管理；营地人口也随着运输、疾病、出生、死亡和释放而变化。 [博文迪古尔运输与档案目录] [人数、家庭与释放审查]","legacy_url":"../people-events-reference-1830-2026.html#event-bovendigoel"},{"id":"event-sukarno-exile","title":"政党分化、逮捕与流放后的政治生活","description":"苏加诺1929年被捕，1930年在审判中发表《印度尼西亚控诉》（Indonesia Menggugat），1931年底获释后又参与民族主义活动。殖民政府持续逮捕PNI领导人，党内决定解散原有组织，活动者随后建立路线不同的新组织：印度尼西亚党（Partindo）侧重公开群众动员，国民教育协会（Pendidikan Nasional Indonesia，PNI Baru）强调政治教育、纪律和长期干部培养。苏加诺加入Partindo； 穆罕默德·哈达（Mohammad Hatta） 和 苏丹·夏赫里尔（Sutan Sjahrir） 参加PNI Baru。政党机关受限后，教育、出版、私人通信和小规模干部网络成为不同派别维持政治活动的方式。 [苏加诺履历与组织关系] [苏加诺信件和组织分化]\n1933年苏加诺再次被捕，随后被流放到弗洛勒斯岛恩德（Ende），1938年转往明古鲁（Bengkulu）；他在两地继续写作并与地方社会接触。穆罕默德·哈达（Mohammad Hatta）和苏丹·夏赫里尔（Sutan Sjahrir）于1934年被捕，1935年被送往博文迪古尔，1936年迁至班达海的班达尼拉（Banda Neira）。殖民政府把领导人分送到不同岛屿和营地，家属探访、通信和迁移都受行政程序约束；夏赫里尔在博文迪古尔的信件记录营区分隔、劳动、物资和释放条件。 [苏加诺与哈达的流放履历] [夏赫里尔1935年营地书信]\n博文迪古尔的劳动和生活安排随时间改变。营地医生 斯洪海特（L. J. A. Schoonheyt） 1936年的记录称，早期实行强制劳动和晨间点名，1927年中殖民政府要求停止强迫劳动；居民随后分为受雇劳工、自营者、病残者和拒绝工作的群体。医生记录了农务工资和工作时间；夏赫里尔则写到劳动、生活供应与官员对被拘者是否“改变态度”及能否获释之间的联系。工作安排、口粮、家属照料和健康状况因个人和时期而异。 [营地医生的现场记述] [夏赫里尔的营地书信]\n流放也把通信变成一种受监控的政治行动。被拘者借船员传递信件和刊物，殖民行政机关要求检查海上邮件；家庭探访、个人请愿和议会发言成为公开政党活动收缩后的渠道。1934年底，丹那丁吉（Tanah Tinggi）的45名被拘者向殖民议会请愿，反对住宅区管理和卫生规定处罚，并质疑总督指定流放地点的权限。1938年议会讨论将他们的申诉与殖民政府“到达后享有与自由居民相同权利”的答复并列记录。流放地由此不仅是关押地点，也成为殖民法律、行政管制、劳动安排和政治申诉发生冲突的地方。 [1934年请愿与1938年议会记录] [营地通信检查记录]\n到1930年代，民族主义政治由不同路线构成。苏加诺以“马尔哈恩”（Marhaen）概念动员普通劳动者和小生产者，推动反殖民力量合作；哈达和夏赫里尔重视政治教育、纪律和干部培养；丹·马拉卡继续主张革命组织和基层行动。政党机关受限后，政治活动沿着营地学校、报刊、家庭通信、人民议会（Volksraad）和城市小组等不同路径继续。 [民族主义路线与师友网络] [民族主义与左翼思想网络]","legacy_url":"../people-events-reference-1830-2026.html#event-sukarno-exile"},{"id":"event-prewar-parliament","title":"1936—1941年：自治请愿与“印度尼西亚要议会”运动","description":"1936年7月15日，人民议会（Volksraad）议员 苏达佐·卡托哈迪库苏莫（Soetardjo Kartohadikusumo） 提出请愿，要求由荷兰和印度尼西亚代表平等参加会议，为印度尼西亚在荷兰王国内逐步取得自治拟定方案。人民议会于9月17日至29日辩论，并以26票对20票通过；荷兰王室于1938年11月16日拒绝请愿。 [苏达佐请愿与战前议会运动]\n1939年5月21日，印度尼西亚政治联合会（Gabungan Politik Indonesia，GAPI）成立，汇集民族主义、伊斯兰和地区政党。7月4日，GAPI提出“印度尼西亚要议会”（Indonesia Berparlemen），要求由印尼人选出议会并由政府向议会负责。1939年12月23日至25日，第一次印度尼西亚人民大会（Kongres Rakyat Indonesia，KRI）把印尼语、红白旗和《印度尼西亚伟大》纳入民族象征运动； 穆罕默德·胡斯尼·塔姆林（Mohammad Husni Thamrin） 是人民议会（Volksraad）议员和GAPI的重要领导人。 [GAPI、“印度尼西亚要议会”与KRI]\n1940年，GAPI再次要求把人民议会改为民选议会，殖民政府则设立维斯曼委员会调查政治改革；GAPI代表参加接触，但认为委员会没有提出实质性的权力转移。1941年9月，KRI改组为印度尼西亚人民运动（MRI），纳入政治组织、宗教团体和工会代表。与此同时，欧洲战争导致贸易与运输受阻，殖民政府扩大价格、贸易和资源管制；日本南进后，战争动员和印尼政治代表权诉求同时加剧。请愿、政党联合、议会要求和战时经济管制彼此关联，却由不同组织和机关推进。 [GAPI、维斯曼委员会与MRI] [1939—1942年经济转变]","legacy_url":"../people-events-reference-1830-2026.html#event-prewar-parliament"},{"id":"event-occupation","title":"入侵、占领分区与殖民行政瓦解","description":"1942年初，日本军队沿着石油产区、港口和海上交通推进。1月11日，日军在塔拉根登陆；1月24日，日军在巴厘巴板登陆。2月14日，日军空降并夺取苏门答腊巨港油区。3月1日，日军在爪哇多处登陆，3月8日荷兰殖民军投降。日军接管荷属东印度后，原有殖民机关被解散或改组，土地、粮食、劳动力、交通和新闻出版均被纳入战时管理。 [入侵经过与军政分区]\n日军把群岛划入不同军种的占领区：陆军第16军负责爪哇和马都拉，第25军负责苏门答腊；婆罗洲、苏拉威西、马鲁古及东部岛屿由海军管理。各占领区有自己的行政机关、地方警察、军事司令部和军需部门，征粮、征工和资源调配因而各有安排。日本保留部分殖民时期的本地官僚，同时提拔印尼语行政人员并建立宣传和动员机关；苏加诺、哈达等人的公开演讲被日军用于战争动员，夏赫里尔则拒绝公开合作，维持地下反法西斯联系。日军借本地政治领袖扩大群众动员，也通过军令、征粮和强制劳动支配当地社会。 [日本占领行政与军种分区]","legacy_url":"../people-events-reference-1830-2026.html#event-occupation"},{"id":"event-wartime-mobilization","title":"宣传机构、青年军训与强制劳动","description":"1943年，日本在爪哇成立“人民力量中心”（Putera，Pusat Tenaga Rakyat），由苏加诺、哈达、 基·哈查尔·德宛达拉（Ki Hadjar Dewantara） 和 基·马斯·曼苏尔（Ki Mas Mansyur） 领导。Putera借民族主义演讲动员群众，也把动员活动接入日本战争体制。1944年，日军以“爪哇奉公会”（Jawa Hokokai）取代Putera，把宣传、征粮、捐献和劳动力动员直接交由军方控制。 [民族主义领袖与日本动员机构]\n1943年日本建立祖国防卫军（PETA），训练印尼青年担任地方防卫部队；另有大量印尼人被编入日本军辅助队（Heiho）。苏加诺同年与 法特马瓦蒂（Fatmawati） 结婚；她后来成为共和国第一夫人，并在1945年独立宣言仪式前缝制红白国旗。这些组织服从日本军方，日军决定武器、训练和部署，但成员因此获得军事训练、指挥经验和地方人际网络。共和国成立后，部分前PETA军官和兵员进入新军队，另一些人参加地方武装、青年团体或退出军事组织；占领时期的部队没有整体转为共和国军队。 [PETA、Heiho与共和国军队干部]\n征粮和劳工动员把战争负担转移给普通家庭。日军以村庄配额收取稻米，要求农户种植军需作物；强制劳工（romusha）被送去修路、筑机场、采矿和搬运军需。征募通过强迫、诱骗和地方官员征派等方式进行，许多人被送往远离家乡的工地，口粮、工资和返乡交通常无法保障。爪哇1944—1945年的饥荒由征粮、交通封锁、通货膨胀、旱情和强制劳动等因素共同造成。人口学研究估计爪哇出现数百万的人口损失，其中包括过剩死亡和出生减少。 [romusha与爪哇饥荒]","legacy_url":"../people-events-reference-1830-2026.html#event-wartime-mobilization"},{"id":"event-preparation","title":"建国讨论、宣言与共和国的最初制度","description":"1945年3月，日本设立独立准备调查委员会（BPUPKI），第一次会议于5月29日至6月1日讨论国家基础和宪法原则。苏加诺6月1日提出潘查希拉（Pancasila）；6月22日，九人委员会把折衷文本写入《雅加达宪章》，其中包括穆斯林履行伊斯兰教义的文字。7月第二次会议审议宪法草案和国家结构。日本8月7日宣布设立独立准备委员会（PPKI），原定处理独立后的制度安排。 [BPUPKI与雅加达宪章]\n日本于8月15日宣布投降后，青年活动者要求苏加诺和哈达立即宣布独立。8月16日，他们把两人带到冷格斯当（Rengasdengklok），希望切断与日本军政机关的协商；当晚两人返回雅加达，与青年代表和日军海军军官讨论宣言文本。8月17日上午，苏加诺和哈达宣读独立宣言。青年压力、民族主义领导层的决定与日本占领机构留下的行政和军事架构共同进入此后共和国的建立过程。 [独立宣言与革命外交]","legacy_url":"../people-events-reference-1830-2026.html#event-preparation"},{"id":"event-proclamation","title":"宣言之后：共和国如何建立权力","description":"1945年8月18日，印度尼西亚独立准备委员会（PPKI）通过《1945年宪法》，选举苏加诺为总统、哈达为副总统，并决定设立中央印度尼西亚国民委员会（KNIP）协助总统。宪法草案中的《雅加达宪章》曾写入穆斯林履行伊斯兰教法的表述；最终文本改为“信仰唯一神”（Ketuhanan Yang Maha Esa）。东部非穆斯林地区军官提出异议、哈达与伊斯兰领袖协商的经过，见于哈达后来回忆。8月22日，政府决定设立人民安全机构（BKR）；各地分会由地方组织、旧殖民军人、日本训练过的印尼军人和青年武装组成，指挥权分散在地方网络。8月29日KNIP委员宣誓，10月5日BKR改组为人民安全军（TKR），地方武装与正规军围绕编制和命令权持续协商。10月16日，哈达以副总统第十号命令赋予KNIP立法和参与国家方针的职能；11月14日夏赫里尔出任政府首脑，内阁开始向KNIP负责。 [宪法、KNIP与第十号命令] [共和国制度与革命军队]","legacy_url":"../people-events-reference-1830-2026.html#event-proclamation"},{"id":"event-surakarta","title":"1945—1946年：梭罗的王权、群众组织与共和国政府","description":"独立后，梭罗的权力并未立即由王宫转到共和国机关。共和国最初承认苏苏胡南王朝（Kasunanan）和芒库尼加兰公国（Mangkunegaran）两套王室辖区的自治地位；同时，地方国民委员会、青年团体、政党和部队推动把王宫行政纳入共和国制度。双方围绕地方官员任命、警察和武装指挥、土地与王室特权展开竞争，政治行动者也把废除世袭权力与农民、工人诉求连在一起。1945年秋的梭罗社会革命包括群众集会、官员撤换、逮捕与地方冲突，不同辖区、王室机构和群众团体的经历并不相同。 [梭罗权力转换与社会革命]\n1945年11月，梭罗的工人和农民代表大会讨论革命政府的社会政策，并争论印度尼西亚工人阵线（BBI）应作为工会联合组织继续存在，还是另建代表工人阶级的政党。印度尼西亚工人党（PBI）沿政党路线发展；农民代表随后在日惹组织全国性的印度尼西亚农民阵线（BTI）。工会、政党和农民组织分别建立自己的代表机构，并在共和国的劳动与土地政策中提出诉求。 [工农代表大会与组织分化]\n1946年，共和国逐步以任命的行政机关和地方防务委员会取代两套王室的独立管辖。中央政府5月任命 苏尔约（Suryo） 为驻地代表；梭罗市政机关6月16日开始运作，7月15日的第16/SD号政府决定确认市政建制。6月28日公布的地方文件列出由 苏塔托（Soetarto） 主持的地方防务委员会，成员包括民族委员会、工党和马斯友美党代表。梭罗特别区紧急状态、地方委员会权限和全爪哇行政安排分别由不同决定规定，市政机关、特别区和王室辖区按各自程序转入共和国行政体系。 [梭罗地方行政与紧急状态]","legacy_url":"../people-events-reference-1830-2026.html#event-surakarta"},{"id":"event-surabaya","title":"1945年10—11月：泗水冲突与英国进攻","description":"1945年10月25日，英国第49印度步兵旅约四千人由准将 奥伯廷·马拉比（Aubertin W. S. Mallaby） 率领，在泗水登陆。部队负责接收日军投降、解除日军武装并撤出盟国被拘人员。英军进入城市并占据关键建筑后，印尼青年和共和国武装要求其承认当地共和国机关与武装力量。10月27日起冲突扩大；10月29日，苏加诺、哈达和夏赫里尔抵达斡旋，双方达成停火。10月30日，马拉比在红桥附近死亡；英印和印尼记录对枪击、车辆爆炸及其死亡责任的叙述不一。英国随后增派第5印度师，由少将 罗伯特·曼塞尔格（Robert Mansergh） 指挥。11月9日，英军要求印尼武装次日清晨前缴械；11月10日，陆、海、空部队发动进攻。泗水居民、共和国部队和青年武装在城内抵抗，英军于11月下旬控制主要城区，战斗、疏散、拘捕和破坏仍在当地延续。英军执行盟军接收任务，荷兰民政署（NICA）随其返回并准备恢复殖民行政；印尼居民面对的是英军进攻和荷兰殖民机关重返两种力量。 [泗水冲突、马拉比之死与英军进攻] [盟军任务与荷兰复归]","legacy_url":"../people-events-reference-1830-2026.html#event-surabaya"},{"id":"event-labor-revolution","title":"革命时期的工会与劳工组织","description":"1945年9月，雅加达工人代表建立印度尼西亚工人阵线（BBI），试图把铁路、港口、印刷和其他行业工人组织起来。BBI内部干部分别推动工会联合与工人政党路线；地方工会继续处理工资和粮食问题，部分干部11月推动成立印度尼西亚工人党（PBI），BBI则继续以劳工联合组织形式活动。1946年11月29日，铁路、港口、印刷、种植园等行业工会成立印度尼西亚工人中央组织（SOBSI），并于1947年加入世界工会联合会（WFTU）。SOBSI与PKI及其他左翼力量建立政治合作，同时保有行业工会和会员组织结构。 [BBI、PBI与革命时期的劳工政治] [SOBSI与国际工会联系]","legacy_url":"../people-events-reference-1830-2026.html#event-labor-revolution"},{"id":"event-three-july","title":"1946年6月27日—7月6日：夏赫里尔被带走与七三事件","description":"总理苏丹·夏赫里尔主张通过谈判争取国际承认；丹·马拉卡推动的“斗争联盟”（Persatuan Perjuangan）则以“百分之百独立”为最低要求，集合政治立场不同的政党和武装团体。1946年6月27日夜，军方人员在梭罗带走夏赫里尔；苏加诺随后暂时接管政府权力，夏赫里尔于7月1日回到日惹。冲突牵涉谈判政策、军队指挥和内阁权力，不只是一次个人绑架。 [斗争联盟与七三事件]\n7月3日， 苏达尔索诺（Sudarsono） 带领军政人员和先前被拘留者进入总统府，递交由 穆罕默德·亚明（Mohammad Yamin） 起草的改组方案，要求解散夏赫里尔内阁、调整国防指挥并另设政治经济委员会。苏加诺拒绝签署并下令拘押来人。 苏迪尔曼（Sudirman） 是否授权行动，当事人说法相互冲突；现存审讯、判决与参与者陈述也没有形成一致的指挥责任叙述。事件把总统、内阁、军队和地方武装的权力边界推到台前。 [七三事件研究] [国家档案馆审讯卷宗目录] [最高军事法院判决书目录]","legacy_url":"../people-events-reference-1830-2026.html#event-three-july"},{"id":"event-diplomacy-revolution","title":"1946—1947年：协议、荷兰军事行动与联合国调停","description":"1946年11月，荷兰和共和国签署《林牙椰蒂协定》，荷兰承认共和国对爪哇、马都拉和苏门答腊的事实管辖，并规划建立荷印联邦和荷兰—印度尼西亚联盟。共和国议会于1947年3月批准协定，双方对领土范围、联邦组成和主权移交时限仍有不同解释。荷兰于1947年7月21日发动第一次大规模军事行动，称其为“警察行动”；行动夺取种植园、铁路、港口和工业区，迫使共和国武装撤退。联合国安理会8月1日要求停火，美国提出斡旋，澳大利亚和比利时进入联合国斡旋委员会。 [林牙椰蒂协定与第一次军事行动] [联合国调停委员会]","legacy_url":"../people-events-reference-1830-2026.html#event-diplomacy-revolution"},{"id":"event-madiun","title":"1948年9月：茉莉芬事件","description":"1948年8月，曾在莫斯科流亡的共产党人 穆索（Musso） 回到印度尼西亚，推动PKI重组和左翼政党联合。此前，梭罗正规军与左翼部队已围绕缴械、指挥权和地方行政发生冲突；地方部队调动、军官遭捕和组织关系恶化，为茉莉芬的升级埋下条件。9月18日，与FDR和左翼部队有关的人员控制茉莉芬政府机关和通信设施，并通过广播宣布由人民阵线管理政务。9月19日，苏加诺广播要求民众在共和国政府与穆索领导的革命委员会之间作出选择；共和国军队从多条路线进攻，9月30日收复茉莉芬。穆索10月31日在追捕中被杀， 阿米尔·谢里夫丁（Amir Sjarifuddin） 12月被捕并遭处决。共和国政府称事件为FDR—PKI叛乱；FDR和PKI的后续叙述则强调裁军、地方军队冲突、哈达政府的整军政策以及其领导人不在现场等情况。史家对是否存在事前夺权计划、地方行动如何升级和各地指挥关系仍有争论；荷兰和共和国政府也都把事件用于对外争取支持。 [茉莉芬冲突的行动顺序与责任争议] [联合国调停与停战机制]","legacy_url":"../people-events-reference-1830-2026.html#event-madiun"},{"id":"event-dutch-offensive","title":"1948年12月—1949年：共和国政府转入游击战与PDRI","description":"1948年12月19日，荷兰发动第二次大规模军事行动，空降并占领日惹，拘捕苏加诺、哈达、夏赫里尔和多名共和国领导人。共和国军队此前准备过游击战，陆军总司令苏迪尔曼（Sudirman）离开日惹后继续巡回指挥；各地军区、县级行政与电台维持分散抵抗。苏加诺和哈达被流放到邦加岛，雅加达和荷兰军方宣称共和国政府已不存在。 [第二次荷兰攻势与共和国领导人被捕] [共和国领导层被捕后的国际反应]\n进攻前，苏加诺和哈达曾向苏门答腊的繁荣部长 沙弗鲁丁·普拉维拉内加拉（Sjafruddin Prawiranegara） 发送授权电报，要求在中央政府无法履职时成立紧急政府。12月22日，沙弗鲁丁在西苏门答腊哈拉班宣布成立印度尼西亚共和国紧急政府（PDRI），由他兼任政府主席和临时国防、外交、宣传负责人。PDRI通过电台和地方官员与军区及海外代表保持联系，令共和国政府在雅加达和日惹领导人被捕后仍持续运作。 [PDRI授权、成立与通信]\n1949年3月1日，共和国军队发动日惹总攻，一度进入主要城区并向外广播，展示游击部队仍能进入被荷兰占领的首都。日惹苏丹 哈孟库布沃诺九世（Sri Sultan Hamengku Buwono IX） 、第三师指挥官 班邦·苏根（Bambang Sugeng） 、日惹第三师第十区指挥官 苏哈托（Suharto） 以及苏迪尔曼的指挥体系都出现在行动筹划和执行叙述中；回忆录和后来的官方叙事对谁首先倡议、谁批准计划及总指挥职责强调不同。苏哈托指挥日惹突击是多种叙述中的共同部分，具体命令链仍须对照当时军令。攻势持续数小时，时间有限，但与PDRI的外交通信和联合国讨论同步发生。美国对荷兰施加停止军事行动、释放被捕领导人和恢复谈判的压力，联合国安理会要求荷兰撤出日惹。5月7日，印尼代表 穆罕默德·鲁姆（Mohammad Roem） 和荷兰代表 范罗延（Jan Herman van Roijen） 达成声明；苏加诺、哈达等人获释并于6月底返回日惹，7月13日沙弗鲁丁把PDRI职权交还苏加诺。 [3月1日总攻、鲁姆—范罗延声明与PDRI终结] [安理会和斡旋委员会行动]\n1949年8月至11月，荷兰与印度尼西亚在海牙举行圆桌会议，讨论主权移交、联邦宪制、荷印联盟、债务和武装力量整编。12月27日，荷兰将主权移交给印度尼西亚联邦共和国（RIS），但西新几内亚仍由荷兰控制，归属留待谈判。联邦内部由多个成员邦组成；1950年各邦相继并入共和国，8月17日恢复单一制共和国。主权移交结束荷兰对印度尼西亚大部分领土的正式统治，却没有解决军队整合、地区财政、土地关系和群众组织如何进入新国家的问题。 [圆桌会议、主权移交与联邦解体] [1949—1950年宪制变化]","legacy_url":"../people-events-reference-1830-2026.html#event-dutch-offensive"},{"id":"event-1952","title":"1952年10月17日：军政危机","description":"1952年10月17日， 纳苏蒂安（A. H. Nasution） 等陆军军官与支持者带着部队和装甲车辆前往议会与总统府一带，要求苏加诺解散议会，并反对议会调查军队重组。苏加诺拒绝解散议会。纳苏蒂安和陆军领导层随后离职，军队并未退出政治；军官的组织能力、地方指挥和对总统施压的方式由此成为全国政治公开议题。同期美国使馆电报记录了危机。 [1952年军政危机]\nPKI在1948年镇压后遭到严重削弱。1951年起， 艾地（D. N. Aidit） 、 卢克曼（M. H. Lukman） 等新领导人重建中央委员会、地方支部和干部教育，并在工会、农民、青年与文化组织中开展工作。党通过合法选举、议会和群众组织扩大影响，也与苏加诺及其他民族主义者合作。工会、农民和文化团体拥有各自的会员网络；PKI与群众组织之间存在组织联系，但群众组织会员并不因此自动成为PKI党员。 [PKI重建与1955年选举] [PKI的组织策略]\n1953年，苏加诺与 哈蒂妮（Hartini） 结婚，法特马瓦蒂随后离开总统府。苏加诺的婚姻与家庭生活进入国家礼仪、媒体报道和家族记忆。 [苏加诺家庭与婚姻]","legacy_url":"../people-events-reference-1830-2026.html#event-1952"},{"id":"event-election","title":"1954—1956年：Gerwis更名、全国选举与哈达辞职","description":"1954年，觉醒妇女运动（Gerwis）在第二次代表大会上更名为印度尼西亚妇女运动（Gerwani）。大会和刊物讨论就业、婚姻、教育、农村生活和妇女参政；它与PKI联系增加，但也发展自身妇女权利议题。SOBSI连接行业工会，印度尼西亚农民阵线（BTI）组织农村成员，人民文化协会（Lekra）组织作家、演员和艺术活动者，人民青年连接青年网络。这些团体与PKI存在联盟和人员交往，分别在工厂、村庄、文化和家庭问题上开展工作。 [政党与群众组织] [Gerwani大会与妇女议程] [PKI关联群众组织]\n1955年4月，印度尼西亚在万隆召开亚非会议，来自亚洲和非洲的政府代表讨论反殖民、主权平等和冷战压力。第一次全国选举分两次投票：9月29日选出众议院（DPR）议员，12月15日选出制宪议会议员。民族主义党（PNI）、马斯友美党、伊斯兰教师联合会（NU）和PKI得票领先，分别约占22%、21%、18%和16%，没有一党取得多数；PKI获得39个众议院席位。1956年哈达辞去副总统；外岛军政力量对财政分配和雅加达集权的不满继续扩大，制宪议会仍未能就新宪法达成一致。 [1955年选举与哈达辞职] [印度尼西亚近代政治史]","legacy_url":"../people-events-reference-1830-2026.html#event-election"},{"id":"event-takeover","title":"西新几内亚争端与荷兰企业接管","description":"荷兰将西新几内亚排除在1949年主权移交之外，印度尼西亚政府持续要求该地区并入共和国。1957年11月，联合国大会未通过印度尼西亚提出的决议后，工会和青年组织者于12月在雅加达、泗水等城市占领荷兰企业、种植园、港口和交通设施。政府随后宣布戒严，军方接管许多企业的监管与经营。1958年第86号法律授权将荷兰企业收归国有，1959年又设立国有化协调机关；占领行动、军事管理、行政经营和产权转移依次推进，企业工人也通过新管理机构与国家部门继续交涉。 [工人接管、军方监管与国有化]","legacy_url":"../people-events-reference-1830-2026.html#event-takeover"},{"id":"event-rebellion","title":"PRRI、Permesta与美国秘密援助","description":"西苏门答腊军官于1956年成立“班腾委员会”（Dewan Banteng），要求调整中央与地区的财政分配、军队指挥和地方行政权限。1957年3月，苏拉威西军官发表“全体人民斗争宪章”（Permesta），要求重组中央—地方关系。1958年2月15日，西苏门答腊军政领袖宣布成立印度尼西亚共和国革命政府（PRRI），Permesta领导层随后与之结盟。美国中央情报局（CIA）秘密提供武器、弹药、飞机、补给和政治支持，并由美国承包飞行员驾驶B-26轰炸机；5月18日，美籍飞行员 艾伦·波普（Allen Pope） 在安汶附近被击落并俘获。共和国军队于1958年夏秋夺回叛乱中心，此后各地抵抗经由军事追捕、谈判、特赦和部队整编陆续结束。 [美国对地区叛乱的秘密支持]","legacy_url":"../people-events-reference-1830-2026.html#event-rebellion"},{"id":"event-guided","title":"1959—1963年：指导民主与军方扩权","description":"1957年的军政危机、地区叛乱、军事戒严和制宪议会僵局共同改变国家制度。制宪议会未能取得通过新宪法所需的多数，1959年7月5日苏加诺发布总统令，解散制宪议会并恢复《1945年宪法》。在“指导民主”制度下，总统成为国家政治中心；“纳沙贡”（Nasakom，即民族主义、宗教与共产主义）把不同政治力量纳入共同政府框架。1955年选出的众议院（DPR）于1960年3月因拒绝政府预算而被解散，苏加诺随后任命互助众议院（DPR-GR），并安排政党和军方席位。1960年8月，马斯友美党和印度尼西亚社会党（PSI）因部分领导人与地区叛乱有关而被禁。军方掌握戒严、地方行政和企业管理职权；PKI及其群众组织在这一制度框架中扩大工会、农会、妇女和文化活动。 [指导民主的制度转变]\n1962年，苏加诺与日本出生的 黛薇（Ratna Sari Dewi；原名根本七保子，Naoko Nemoto） 结婚。她进入总统家庭并参与公开礼仪生活；两人的私人关系和国家外交各有其政治脉络。 [苏加诺家庭与婚姻] [印尼对外关系与地区外交]","legacy_url":"../people-events-reference-1830-2026.html#event-guided"},{"id":"event-westpapua","title":"1957—1969年：西新几内亚争端与巴布亚人的政治要求","description":"1949年主权移交时，西新几内亚仍由荷兰控制，双方同意以后谈判解决归属。1957年，印度尼西亚提出的联合国决议未获通过，国内随即出现占领荷兰企业和要求收回该地区的群众行动。与此同时，荷兰政府推动本地自治制度：1961年成立的新几内亚议会（New Guinea Council）有由当地选出的巴布亚成员。议会成员支持以西巴布亚为名的政治共同体，并于1961年12月1日举行仪式，升起晨星旗、演唱巴布亚国歌。仪式表达当地政治精英的自决要求；荷兰当局仍控制行政。 [西新几内亚争端与巴布亚政治行动]\n1961年12月19日，苏加诺宣布“三项人民命令”（Trikora），要求阻止荷兰建立独立国家并将西伊里安并入印度尼西亚。印尼军方随后加强渗透、伞兵行动和海上军事部署，荷兰也增派兵力。美国通过国务院、雅加达与海牙使馆、罗伯特·肯尼迪的直接接触和埃尔斯沃思·邦克的调停推动谈判。华盛顿的目标包括避免印尼与荷兰开战、保持冷战影响，并推动由联合国过渡管理后移交印尼的方案；这条外交渠道不同于1958年美国对地区叛乱的秘密援助，也不同于1965年的秘密政治行动。 [美国调停与1962年谈判机制]\n1962年8月15日，印度尼西亚与荷兰在联合国签署《纽约协定》。协定规定先由联合国临时行政机构（UNTEA）接管，再把行政权移交印度尼西亚；第十八条要求在1969年底前举行“自由选择行动”。1969年7月至8月，印尼政府组织约1,026名经选定的代表分批投票，各地代表团均表态留在印度尼西亚。这不是全体成年居民参加的一人一票直接公投，而是依《纽约协定》第十八条所设代表会议与协商程序（musyawarah）表达选择。联合国代表报告了投票程序以及当地行政和军事压力下的条件；联合国大会辩论中，加纳、圭亚那等国代表质疑参与范围与自由表达程度。11月，大会以84票赞成、0票反对、30票弃权通过第2504号决议，决议文字“注意到”秘书长报告和协定履行情况。 [《纽约协定》、UNTEA与1969年选择程序]","legacy_url":"../people-events-reference-1830-2026.html#event-westpapua"},{"id":"event-land","title":"土地法、行政执行与农民行动","description":"1960年第5号《基本农业法》试图以统一的国家土地制度取代殖民时期按族群身份区分的法律，确认土地具有社会功能，并确立土地改革原则。同年第2号《分益法》规定地主与佃农怎样分收成、分担种子和生产成本，第56号紧急条例设定土地占有上限。法律规定的可分配土地包括超过上限的土地、缺席地主土地、部分传统王室土地和国家控制土地；每一类都需要确认权属与受益资格。行政机关必须调查地界、登记土地、列出受益户、估算补偿并办理移交，法律通过并没有自动改变村庄土地关系。地籍缺失、地主拆分或转让土地、村长和农民对地块及耕作者的不同认定，都可能使分地程序停滞。 [土地改革法与执行] [地区土地结构]\n印度尼西亚农民阵线（BTI）把土地改革作为农村组织工作的核心，推动土地清查、减租、佃耕法执行和占有上限；农民干部还组织生产合作、灌溉、灭鼠和农资互助。各地干部与农户围绕合法耕作者、超额地块、合作社土地登记和受益户资格展开交涉。BTI通过地方支部、会议、互助劳动和具体地块纠纷开展农村工作，各村会员和行动参加者随地区组织与土地关系而变化。 [土地争议与地方劳动] [BTI与土地行动] [农民运动与农村政治]\n地籍调查和分配程序迟缓，加上地主转让或拆分土地、村级名册争议和租佃冲突，使部分地区在1963年前后出现“单方面行动”（aksi sepihak）。无地农民和租佃者进入他们认为依法应分配的土地，要求委员会执行法律；有些行动由印度尼西亚农民阵线（BTI）干部组织，有些则来自农户对土地和劳动关系的直接诉求。地方官员、军人、地主和农会对哪些土地属于法定分配范围并无一致认定。苏加诺在纳沙贡框架内支持土地改革，也要求停止部分强制占地和乡村冲突；总统、农会、地方行政和军方对如何执行法律没有统一路线。 [单方面行动与中央政策]","legacy_url":"../people-events-reference-1830-2026.html#event-land"},{"id":"event-land-court","title":"1964年：土地改革法院与村庄执行","description":"1964年第21号法律设立土地改革法院，开始审理与土地改革有关的争议。法院合议庭包括由农民群众组织推荐、再经国家程序任命的成员，地主、农民和行政机关可就地权登记、受益资格和土地分配提出申诉。裁决之后，地籍测量、补偿和地方机关办理构成土地实际移交的后续程序。 [土地改革法院与执行记录]\n其他群众组织把国家政治带入工厂、村庄和家庭。SOBSI行业工会谈判工资、福利和国营企业管理；Gerwani推动女性参加村会、担任村级职务和独立持有土地，要求提高农业工资并改善女工保障，还组织扫盲、托幼和教育活动；人民文化协会（Lekra）组织文学、戏剧和艺术工作，人民青年和农民组织开展学习与集体行动。这些组织同PKI存在联盟、人员交叉和政治合作，也各自围绕工作场所、性别关系、土地和文化提出诉求。 [政党与群众组织] [Gerwani与妇女权利议程] [PKI关联群众组织]","legacy_url":"../people-events-reference-1830-2026.html#event-land-court"},{"id":"event-wangunwati","title":"1965年6月：万贡瓦蒂的土地分配与合作社","description":"中爪哇万贡瓦蒂（Wangunwati）显示土地改革如何经过工人组织、地方协商和国家机关落地。当地原橡胶园合同工于1946年占据旧殖民种植园；1950年，政府允许他们定居并经营园地，农业部1951年的决定给予临时土地权利。1952年，工人把管理机构改组为合作社，分配家庭耕地并共同经营橡胶园。1965年6月4日，西爪哇省土地事务监察机关以第LR.249/D/VIII/60/1965号决定，将468.15公顷土地分给240户，并把280.2公顷保留为合作社经营的橡胶园。地方农民组织GTI帮助社群与政府及军方联系，使土地分配经由协商、行政决定与合作经营推进。 [万贡瓦蒂村土地分配与合作社]","legacy_url":"../people-events-reference-1830-2026.html#event-wangunwati"},{"id":"event-konfrontasi","title":"对抗马来西亚与婆罗洲边境战争","description":"1961年5月27日，马来亚总理东姑·阿都拉曼提出把马来亚、新加坡、砂拉越、北婆罗洲和文莱合并为新联邦。文莱于1962年12月爆发北加里曼丹国民军起事，英国军队迅速镇压，文莱最终没有加入。马来西亚协定于1963年7月9日签署，9月16日生效，成员为马来亚、新加坡、砂拉越和北婆罗洲。新加坡于1965年8月9日脱离联邦，成为独立共和国。 [马来西亚成立、文莱起事与新加坡分离]\n苏加诺政府把新联邦视为英国在北婆罗洲延续势力的安排，发动“对抗”（Konfrontasi），通过外交、广播、群众动员和渗透行动反对其成立。印尼军队把部队和渗透小组派往加里曼丹边境；英国则秘密授权部队越境打击印尼基地，行动代号“克莱特”（Operation Claret），并对外否认越境作战。澳大利亚依据马来西亚防务协定派兵参与防务。1964年曼谷会谈、东京和雅加达间的接触及美国斡旋一度推动停火谈判，双方对马来西亚的组成和印尼军事行动仍未达成解决。外交谈判、边境军事行动和国内政治宣传并行。 [英澳日政策渠道] [澳大利亚广播指导]\n苏加诺把对抗马来西亚置于反殖民外交和国家动员中心；印尼陆军同时处理边境部署、外岛戒备和与英军交战风险。PKI及其关联群众组织支持反马来西亚集会和宣传，军方与政党分别沿各自的组织体系开展动员和争取政治影响。通货膨胀、外汇短缺、进口限制和财政开支也压迫政府，苏加诺政府继续寻求军备、贷款、粮食和外交支持。 [印马对抗时期的美国政策] [国际关系与国内政治]","legacy_url":"../people-events-reference-1830-2026.html#event-konfrontasi"},{"id":"event-foreign-channels","title":"美国、英国、澳大利亚、日本、中国与苏联的不同渠道","description":"美国对印尼的政策由国务院、雅加达使馆、国防部门、军事援助机构、美国新闻署和中央情报局分别执行。军方训练、警务援助、武器供给和外交接触使用公开或半公开渠道；贷款与经济援助经使馆谈判、国会授权和对印尼预算政策的讨论推进。1965年2月23日提交给303委员会的备忘录回顾，自1964年夏季起进行的秘密政治活动，包括与反共力量联络、支持政治接触、向政治机构渗透以及散发匿名传单和黑色、灰色宣传。备忘录随后提出削弱PKI与北京联系、为苏加诺离任后的非共产党继任者创造条件；303委员会于3月4日批准该方案。备忘录把已进行的活动、获批计划和未来建议分别列明。 [美国303委员会政治行动计划] [美国军事与警务援助]\n英国以军事支持、外交和情报行动参与对抗。克莱特行动由军方秘密规划并经政府授权，地面部队在加里曼丹边境执行越境行动；外交官对外避免承认。英国外交部信息研究部（IRD）在1965年准备匿名反共宣传材料，经新加坡联络和外国媒体散发。澳大利亚派兵参加马来西亚防务，部署情报人员，并由广播主管机关向印尼语广播传递内容指导；广播机关也把印尼陆军的反应反馈给政府。日本通过贸易、紧急贷款、债务协商和特使接触苏加诺政府、印尼陆军与地区调停方；中国和苏联则通过外交支持、贷款、军售和军事培训与印尼往来。上述行动由不同政府机关、审批渠道和受援对象推进。 [英国、澳大利亚与日本] [中国、苏联与军购交付] [英国IRD宣传行动] [澳大利亚广播指导] [日本使馆与东京渠道]\n到1965年9月，印马对抗、国家经济危机和国内政治联盟已经交织。苏加诺仍试图让民族主义者、宗教力量、军方和PKI留在同一政治框架中；军队和政党对群众组织扩张、土地改革、军队在国家中的地位以及外交方向各有判断。共同出现在政府和政治联盟内，没有解除各方围绕指挥权、企业、土地与组织空间的竞争。 [1963—1965年美国政策与印尼政治] [国际关系与国内政治]","legacy_url":"../people-events-reference-1830-2026.html#event-foreign-channels"},{"id":"event-movement","title":"绑架行动、广播与陆军反应","description":"1965年9月30日深夜至10月1日凌晨，一支自称“九三〇运动”（Gerakan 30 September）的武装队伍在雅加达试图绑架陆军高级将领。三名将领在住宅遭枪杀，另一些将领被带往哈利姆空军基地附近的卢邦布亚（Lubang Buaya）后遇害；尸体被投入一口废井。六名遇害将领为陆军司令 艾哈迈德·亚尼（Ahmad Yani） 、 拉登·苏普拉普托（R. Suprapto） 、 M.T.哈里约诺（M.T. Haryono） 、 西斯翁多·帕尔曼（S. Parman） 、 唐纳德·伊萨克·潘贾伊坦（D.I. Panjaitan） 和 苏托约·西斯沃米哈尔佐（Sutoyo Siswomiharjo） 。总统卫队副官 皮埃尔·滕代安（Pierre Tendean） 也被捕杀。后来官方纪念把七人合称“七名英雄”。 [九三〇运动原始文书和研究]\n国防与安全部长纳苏蒂安逃脱，女儿 阿德·伊尔玛（Ade Irma Suryani） 遭枪击后死亡；滕代安被误认为纳苏蒂安而遭捕。行动者在广播中称要阻止所谓“将军委员会”政变，并试图控制广播电台和首都战略地点。各行动单位对广播命令的响应不一，广播宣布的革命委员会没有建立稳定的全国指挥。 [九三〇运动原始文书和研究]\n苏哈托（Suharto）当时是陆军战略后备司令部（KOSTRAD）司令，10月1日召集仍在首都的陆军单位，调动部队夺回广播电台和战略地点。陆军公告把运动定性为PKI发动的政变；军事通信和新闻系统把这一说法传向各军区。苏加诺留在首都外围并试图掌握部队指挥、任命临时陆军领导人，苏哈托的指挥系统却迅速取得首都军力和公共广播的实际控制。总统与陆军之间的命令权竞争随即从雅加达传向全国各地。 [苏加诺与苏哈托的指挥权变化] [陆军指挥与地方行动研究]\n公开广播由总统卫队中校 翁东（Untung） 署名；行动中还有陆军准将 苏帕尔佐（Supardjo） 和PKI特别局负责人 夏姆·卡马鲁扎曼（Sjam Kamaruzaman） 等人。PKI领导层与部分军官之间的接触、行动组织者的身份和指挥范围，后来成为军事法庭、党内文件及历史研究争论的中心。军方把行动定性为PKI发动的政变，苏加诺则反对未经调查便把责任归给一个政党，并要求恢复其总统指挥权。 [事件材料与责任争议] [首都指挥链与地方军令]","legacy_url":"../people-events-reference-1830-2026.html#event-movement"},{"id":"event-purge","title":"杀戮、拘押与群众组织清除","description":"10月初，陆军各级单位开始拘捕PKI干部和被认定与左翼组织有关的人。10月10日，陆军参谋长 普拉诺托（Pranoto Reksosamodra） 发出第Kep-1146/10/1965号命令；最高作战司令部（KOTI）同日发出第T-0265/G-5/1965号文件，要求中央和地方成立调查队。10月12日，KOTI第T-0269 A/G.5/1965号文件要求对9月30日后缺勤的公务人员暂予停职并每日点名。10月20日，内阁主席团以第47a/D/Instr/1965号和第48a/D/Instr/1965号指令要求设立特别小组、清查资产并审查政府人员和组织的忠诚。11月20日，苏加诺批评职权重叠，主张普通文官由内阁处理、国防与安全部门由军方主管。军令、总统内阁指示和地区拘捕随不同机关的部署向外展开。 [10月的KOTI与内阁清查指令] [镇压的区域差异]\n地方军区、警察、情报机关以及反共青年团体和宗教组织随后以不同方式参与拘捕和杀戮。中爪哇跨军种联合安全参谋组于10月23日成立，由陆军上校 萨尔沃·埃迪·维博沃（Sarwo Edhie Wibowo） 指挥；他率领陆军伞兵突击团（RPKAD）。10月19日，RPKAD进入三宝垄；10月22日，空军配合RPKAD进入梭罗并实施武力展示。地方部队、警察、政治组织与宗教团体分别参与名单收集、逮捕、运输和拘押。亚齐、中爪哇、东爪哇、巴厘、南苏门答腊、南苏拉威西和弗洛勒斯的暴力时间与方式各有地方脉络，旧有乡村冲突和社会关系也影响追捕、庇护与拒绝参与。 [镇压的区域差异] [军方协调与地方执行]\n遇害、拘捕和失踪者不只包括PKI党员。SOBSI、BTI、Gerwani、Lekra和青年组织成员，以及被当局视为组织关联者的人，都可能遭到逮捕和清除。临时监所、军营和监狱用于集中拘押，之后有人被转移、失踪或死于狱中。妇女组织成员遭受性化宣传和审讯暴力，配偶、子女也可能因家庭关系失业、迁居或被列入身份审查；一些地区的华人商铺和社区受到攻击并被迫迁离。这些行动针对党籍、工会和群众组织联系，也扩展到家庭成员、配偶、子女与被当局按政治关系分类的人。 [Gerwani与性化宣传] [Gerwani幸存者与政治恢复] [西加里曼丹驱逐与土地变化]\n对1965—1966年被杀者人数的研究估计从数十万到约一百万；“约50万”是常见概数。研究所覆盖的地区、时段和材料各有不同，拘押、失踪、死亡和被迫迁离分别记录。美国驻棉兰使馆1965年12月关于古突士、巴蒂等地的电报，转述当地军方和地方人士报告；地区研究和幸存者证言另有自己的时间、地点和统计来源。 [古突士与巴蒂地方报告] [死亡估算与统计范围]","legacy_url":"../people-events-reference-1830-2026.html#event-purge"},{"id":"event-foreign-1965","title":"美国名单、资金、药品与通信设备","description":"1965年12月，美国驻雅加达使馆人员向华盛顿发出PKI中央领导干部名单。1966年8月， 马歇尔·格林（Marshall Green） 大使签署的电报回顾，一份删去美国使馆来源标记的A-398名单副本已交给印尼政府，安全机关似乎正在使用。使馆人员 罗伯特·马滕斯（Robert J. Martens） 后来称，他把PKI高层名单交给“非共产党力量”，没有先征得大使同意。名单编制、去除来源标记和转交对象分别出现在同期电报与后来的个人陈述中；两者对授权程序的叙述不完全相同。 [A-398名单及交接记录]\n1965年末，美国大使馆为反共组织“九三〇行动委员会”（KAP-Gestapu）安排5,000万印尼盾活动资金。外交电报记载格林大使同意方案、经费渠道和受款联络。印尼陆军另向美国提出药品、便携通信设备和远距离电台需求；美国官员分别讨论政策审批、采购、隐去来源和秘密运送，部分最初提出的通信设备没有按原方案交付。宣传经费、医疗物资和通信器材分别通过不同项目处理。 [A-398名单与交接记录] [美国通信器材和交付阶段] [药品、资金与陆军援助]\n英国外交部信息研究部（IRD）于1965年10月准备匿名反共宣传材料，经新加坡联络并借外国媒体渠道散发；澳大利亚政府机关指导对印尼广播的内容，广播主管机关并将印尼陆军的反应反馈给政府。英军在婆罗洲的克莱特行动沿边境军事指挥链推进；日本政府和大使馆通过贷款、贸易、特使与苏加诺政府、印尼陆军及地区调停方接触。英国宣传、澳大利亚广播、日本外交和美国名单、资金及军方援助由不同机关审批，面向不同对象。 [英国IRD宣传行动] [澳大利亚广播指导] [日本使馆与东京渠道]\n1965年末至1967年，美国及其他债权国把大米、药品、棉花、贷款和债务重组纳入对印尼新领导层的接触。印尼军方提出紧急粮食需求，美国政府讨论援助授权、国会审批、PL-480粮食销售和运送；援助国在东京和巴黎会议上协商债务安排和对印尼的财政支持。政府宣布承诺、批准采购、货物发运、到港与地方分配是不同环节；现存美国文件对美方审批和谈判记录较多，对物资在印尼各地的实际分配记录较少。 [粮食与药品援助] [紧急大米融资渠道] [东京—巴黎债务安排] [政府间援助协调机制]","legacy_url":"../people-events-reference-1830-2026.html#event-foreign-1965"},{"id":"event-sukarno-dewi-letters","title":"苏加诺与德维：私人通信与外交往来","description":"印度尼西亚国家档案馆公布的1965年10月通信包括九封标注当月日期的苏加诺英文信和两封未标日期的信，记录总统与日本出生的妻子黛薇（Ratna Sari Dewi）的私人往来。同月，日本政府继续与雅加达交涉贸易、贷款和地区外交。 [苏加诺—德维通信档案] [日本政府与雅加达的外交渠道]","legacy_url":"../people-events-reference-1830-2026.html#event-sukarno-dewi-letters"},{"id":"event-supersemar","title":"“三月十一日命令”与总统权力转移","description":"1966年3月11日，苏加诺签署“三月十一日命令”（Supersemar），授权苏哈托采取恢复秩序的措施。现存抄本不止一种，文本形成、传递方式和授权范围仍有档案争议。苏哈托随后宣布取缔PKI、改组政府并扩大治安控制；军方行政命令、议会决议和地方人事变更持续压缩苏加诺的实际权力。1967年临时人民协商会议撤销苏加诺总统职权并任命苏哈托为代总统；1968年苏哈托正式就任总统。权力转移通过军队控制、法律措施和政治机关的决定逐步完成。 [Supersemar与禁党令] [1967年总统权力变化]","legacy_url":"../people-events-reference-1830-2026.html#event-supersemar"},{"id":"event-new-order-economy","title":"1967—1970年：外资、森林管理与土地机构重组","description":"1967年《外国投资法》为外国企业进入矿业、种植园和制造业设立制度渠道；同年《基本林业法》把森林划分和开发许可纳入中央国家管理，同时规定习惯权利须受国家规划限制。新政府逐步恢复对外贷款和投资关系，国家机关、军方经营网络与外资企业进入采矿、林业、农业和基础设施领域。法律改变资源管理的审批结构，实际地权变化仍随地区机关、企业和村社的交涉而异。 [新秩序经济与资源法制]\n1967年西加里曼丹的驱逐发生在印尼军方清剿砂拉越人民游击队／北加里曼丹人民军（PGRS/Paraku）的边境战争背景下。武装组织中有从砂拉越进入印度尼西亚的华人和左翼人员，迁离对象还包括没有参加武装行动的边境华人村民。1967年秋，军方、地方官员和达雅克政治组织发动边境清剿与迁移，数万名华人村民被迫离开原居地，前往山口洋等城镇和集中安置点；沿途发生死亡，村庄、农田和橡胶园被弃置。研究对迁离人数和死亡规模有不同估算；一项回顾估计超过五万五千人被迁离、约三百人死亡。当地达雅克社群有的参与攻击和接收土地，有的保护邻居、协助藏匿财物或拒绝接收土地。Bagak一带调查记录约150公顷原由华人家庭经营的橡胶园和农地后来重新分配。 [1967年西加里曼丹驱逐、安置与土地变化]","legacy_url":"../people-events-reference-1830-2026.html#event-new-order-economy"},{"id":"event-buru","title":"1969—1979年：布鲁岛政治拘押与强制劳动","description":"1969年2月，安全行动司令部以第009/KOPKAM/2/1969号决定把一批被列为B类政治拘押者的人送往马鲁古群岛的布鲁岛，交由总检察机关管理和“使用”。B类是国家安全机关的行政分类，不是法院判决。营地居民被编组开垦土地、修路、建房和种植粮食，住处、口粮、通信、探视与迁移受营地管理者控制；配偶和子女经许可探访或随行后，承担生活、照料与教育压力。1970年代末拘押者陆续获释，但回乡并未自动恢复就业、迁居、选举和公共职务权利。 [布鲁岛拘押令、营地劳动与家属生活] [布鲁岛与拘押家庭]","legacy_url":"../people-events-reference-1830-2026.html#event-buru"},{"id":"event-landafter","title":"1970年：土地改革法院废止","description":"1970年第7号法律废止1964年设立的土地改革法院，并把未结案件转交普通法院。原有特别法院允许农民群众组织推荐部分审判成员；废止理由明确指向其组织构成和“纳沙贡”政治基础。土地争议此后由普通法院、土地行政机关和地方官员处理，农民组织通过法律取得的参与位置随之缩小。 [土地改革法院废止与案件移交]","legacy_url":"../people-events-reference-1830-2026.html#event-landafter"},{"id":"event-new-order-politics","title":"1971—1973年：选举、政党合并与行政控制","description":"1971年大选有九个政党和政府支持的功能团体戈尔卡（Golkar）参选。1973年，政府推动九个政党合并为两党：四个伊斯兰政党组建设团结党（PPP），五个民族主义、基督教及其他非伊斯兰政党组印度尼西亚民主党（PDI）；戈尔卡继续以功能团体参选。1975年第3号法律确立两个政党和一个戈尔卡的选举制度。行政机关和安全机构控制候选名单、文官组织、新闻媒体、地方行政和群众组织；公职人员经常被动员支持戈尔卡，军官则继续担任政府、议会和地方职务。 [新秩序政党体系与选举]","legacy_url":"../people-events-reference-1830-2026.html#event-new-order-politics"},{"id":"event-union-structure","title":"1973—1985年：全国工会合并与产业劳动","description":"1973年，政府推动多个行业工会合并为印尼全体工人联合会（FBSI）；劳动部登记工会、认可谈判代表并规范劳动争议程序。工会没有因此停止工作场所组织：基层工人围绕工资、欠薪、工伤、工时、住宿和工头管理继续谈判、请愿和停工。1985年，FBSI改组为印尼工人联合会（SPSI），中央组织改以单一全国工会体系代表劳动者；政府与安全机关对独立组织的登记和活动设限，出口制造业、建筑业和城市就业扩张则使更多工人进入新的生产单位。 [官方工会体系与产业劳动]","legacy_url":"../people-events-reference-1830-2026.html#event-union-structure"},{"id":"event-malari","title":"1974年1月：马拉里事件（1月15日灾难）","description":"1974年1月14日至17日，日本首相田中角荣访问雅加达。1月15日，学生游行批评腐败、物价上涨、总统顾问集团权力和外国资本影响；当日和次日，示威与城市骚乱交织，商店、汽车和办公场所遭到破坏、焚烧和抢掠。军方逮捕 哈里曼·西雷加尔（Hariman Siregar） 等学生领袖，并关闭多家报刊。马拉里（Malari，印尼语“1月15日灾难”）涉及学生的政治问责与反腐要求、民众对日本投资的抗议，以及军政高层间的权力竞争；参与者、指挥关系和各项诉求在事后报告与研究中各有叙述。 [1974年马拉里事件]","legacy_url":"../people-events-reference-1830-2026.html#event-malari"},{"id":"event-surveillance","title":"1975—1992年：前政治拘押者与家庭身份审查","description":"1975年第28号总统令规定对九三〇／PKI案件中列为“C类”的人员进行行政甄别，允许符合条件者释放并分列C1、C2、C3；这套国家安全分类与后续公务员处分、释放和待遇程序相连。1976年第20号总统令另规定部分C类人员的选举权审查。地方安全机关随后把政治身份审查用于工作、升学、迁居和公共职务；各地使用“ET”（前政治犯）身份证标记的做法有具体记录。 [1975年C类分类令与后续审查]","legacy_url":"../people-events-reference-1830-2026.html#event-surveillance"},{"id":"event-malari-nkk","title":"1977—1979年：学生运动与校园管制","description":"1977—1978年，大学生发表《学生斗争白皮书》，要求总统承担政治责任、召开人民协商会议特别会议，并批评腐败与军方政治地位。1978年4月，教育部长第0156/U/1978号决定规定“校园生活正常化”（NKK），限制校园政治活动；同年5月，教育部高等教育总局发出第002/DJ/Inst/1978号指示，把学生事务交由大学副校长和院系副院长管理，并设立学生事务协调机构（BKK）。1979年第037/U/1979号决定进一步规定高校学生组织形式，取代具有独立政治代表功能的大学学生会。教育部和大学行政体系执行校园制度，军方另以逮捕和封校限制学生行动。校外读书会、法律援助和人权团体随后成为学生参与社会政治的组织渠道。 [1978—1979年白皮书与校园管制] [校园管制与政治行动研究]","legacy_url":"../people-events-reference-1830-2026.html#event-malari-nkk"},{"id":"event-offcampus","title":"1980年代：校外学生网络与地方抗争","description":"校园组织受到限制后，日惹帕拉甘研究会（Palagan Study Club）等读书会与法律援助团体同工人、农民和人权活动者建立联系。1988年前后，帕拉甘成员因政治活动被捕并按颠覆罪起诉；另一些学生参与反对克东翁博水库建设造成的农户迁移。1990年代的民主团体、独立工会和农民组织中有校外活动者参与，议题与人际联系延续到新的组织网络。 [校外学生网络与克东翁博行动]","legacy_url":"../people-events-reference-1830-2026.html#event-offcampus"},{"id":"event-sbsi","title":"1992年：独立工会与SBSI","description":"1992年，工会活动者 穆赫塔尔·帕克帕汉（Muchtar Pakpahan） 与多省工人建立印度尼西亚繁荣工人联合会（SBSI），在SPSI体系外组织独立工会。SBSI围绕最低工资、结社权、工厂安全和工会登记发动集会、谈判和罢工；政府动用安全机关、行政登记程序和刑事案件回应其活动。 [SBSI与独立工会]","legacy_url":"../people-events-reference-1830-2026.html#event-sbsi"},{"id":"event-marsinah","title":"1993年5月：马西娜案","description":"1993年5月3日至4日，东爪哇西多阿佐（Sidoarjo）的Catur Putera Surya（CPS）钟表厂工人罢工，要求支付法定最低工资并承认工人代表。5月5日，部分工人被军方人员叫去，工会和人权组织后来指称他们被要求签署辞职文件；活动者 马西娜（Marsinah） 随后失踪，5月8日，她的遗体在恩甘朱（Nganjuk）被发现。初审判决曾判数人有罪，1995年最高法院撤销有关定罪；国际劳工组织后来记录，政府调查没有查明杀害经过。关于绑架和杀害的具体责任，工会及人权调查提出过军方涉入的指控，但法院没有确认凶手或完整案情。 [马西娜案与国际劳工组织记录]","legacy_url":"../people-events-reference-1830-2026.html#event-marsinah"},{"id":"event-prd-1996","title":"1994—1998年：PRD、民主党总部袭击与新秩序危机","description":"1990年代，学生、工人、农民和人权组织围绕工资、土地征用、政治拘押、选举和新闻自由建立公开或半公开网络。民主学生团结组织（SMID）、印度尼西亚工人斗争中心（PPBI）和全国农民联盟（STN）与人民民主联盟（PRD）建立组织联盟；1996年，PRD以人民民主党名义公开提出多党政治、独立工会、结束军方政治特权和反垄断等要求。政府把这些团体称作“新共产党”，以颠覆罪逮捕活动者。 [PRD及其关联组织]\n1996年7月27日，一批亲政府支持者冲击雅加达民主党（PDI）总部，将支持梅加瓦蒂·苏加诺普特丽的人赶出；警察和军队在现场的处置及是否预先纵容冲击，成为后续调查和争议焦点。随后雅加达发生骚乱。军方称人民民主党（PRD）策划了骚乱；1997年PRD主席 布迪曼·苏贾特马科（Budiman Sudjatmiko） 被判十三年，1998年上诉后刑期增至十五年。工会活动者 迪塔·英达·萨丽（Dita Indah Sari） 等人也因独立工会与反政府活动被判刑。审判中的定罪与事后对暴乱起因的调查结论必须分别记录。 [PDI总部袭击与PRD审判]\n1997年亚洲金融危机使印尼盾急剧贬值，企业融资、就业和家庭购买力受到冲击；国际货币基金组织的救助协议要求政府关闭部分银行并削减补贴，物价和权贵资本主义问题进入抗议。1998年5月12日，雅加达三一一大学（Trisakti）示威中四名学生遭枪击身亡。5月13日至15日，雅加达和其他城市发生大规模骚乱，商店、住宅遭纵火和抢掠，华人社区受到集中攻击。联合事实调查组（TGPF）报告将调查材料分列为85名性暴力受害者：52宗强奸、14宗伴有殴打的强奸、10宗性攻击或殴打、9宗性骚扰。报告记载，多数已报告强奸受害者是华裔女性；骚乱中的袭击对象还包括其他族群。5月21日，苏哈托辞职，哈比比接任总统。 [1997—1998年危机、骚乱与政权更替]","legacy_url":"../people-events-reference-1830-2026.html#event-prd-1996"},{"id":"event-reformasi","title":"1998—2004年：政治开放、工会复归与法律权利","description":"苏哈托辞职后，工会、新闻媒体、农民组织、学生团体和新政党重新进入公开活动空间。1999年举行多党选举，宪法随后经四轮修订，确立总统任期限制、直接选举总统和副总统、建立宪法法院，并扩大地方自治。总统选举仍由人民协商会议选出，直到2004年首次举行全民直接总统选举。行政权力下放改变了地方政府处理土地、投资和劳动争议的方式，中央政治控制减弱后，地方军政网络与地方资本仍能影响资源分配。 [1999—2004年宪制改革与选举]\n1998年6月，哈比比政府批准国际劳工组织第87号《结社自由和保护组织权公约》；2000年第21号《工会法》允许工人建立多个独立工会。1999年，工会活动者迪塔·英达·萨丽获释。工会由秘密联络、街头抗议扩展到工厂组织、集体谈判、劳动法诉讼和国际劳工组织申诉。2003年《劳动法》设定新的劳动关系和雇佣规则，围绕临时合同、外包、解雇和工资的争议持续进入工厂行动和议会政治。 [结社自由公约与工会法] [迪塔·英达·萨丽获释]\n前政治拘押者和家属通过选举与宪法诉讼挑战政治资格限制。2003年选举法第60(g)条限制与九三〇事件及被禁组织相关的若干群体竞选众议院（DPR）、地区代表理事会（DPD）和地方众议院（DPRD）；2004年宪法法院裁定该条违宪并失去法律效力。2008年总统选举法另设总统候选人限制，2017年选举法也保留相关条款；总统候选人与立法机关候选人的资格规则分别由不同法律规定。 [前政治拘押者的身份诉讼与选举资格]","legacy_url":"../people-events-reference-1830-2026.html#event-reformasi"},{"id":"event-komnas","title":"2008—2012年：国家人权委员会调查","description":"幸存者和家属通过口述史、地方调查、纪念活动、身份诉讼和民间档案重新进入公共记录。国家人权委员会（Komnas HAM）于2008—2012年调查1965—1966年事件，并把材料作为严重人权侵害案件提交总检察机关。调查报告提交、总检察机关审查、刑事起诉、赔偿与行政救济分属不同程序；报告提交本身没有启动审判。 [国家调查与法律程序]","legacy_url":"../people-events-reference-1830-2026.html#event-komnas"},{"id":"event-memory","title":"2015—2022年：公共记忆与国家调查","description":"2015年以后，幸存者、家属、历史学者和民间团体公开举行纪念活动、发布口述史，并推动恢复被禁政治身份者的公民权利。2016年4月18日至19日，“剖析1965年悲剧”全国研讨会由总统顾问委员会、国家人权委员会、新闻委员会、数所大学、和平与民主研究所和民族联谊论坛共同举办。国家人权委员会2012年提交的调查材料仍在总检察机关审查程序中；公共纪念、调查报告和刑事起诉沿各自制度渠道推进。禁书、校园教学和纪念活动继续引发公开争论。2022年第17号总统决定设立非司法处理工作组；2023年第4号决定设立执行监测组，3月第2号总统指示要求跨部门落实建议。 [2016年全国研讨会及国家调查] [2022—2023年非司法处理机制]","legacy_url":"../people-events-reference-1830-2026.html#event-memory"},{"id":"event-recognition","title":"2023—2025年：政府承认与非司法救济","description":"2023年1月11日， 佐科·维多多（Joko Widodo） 总统代表政府承认包括1965—1966年事件在内的十二类严重人权侵害，并表达遗憾。3月发布的第2号总统指示要求十九名部长及同级官员协调落实非司法处理建议，包括核对受害者名册、提供社会与医疗服务、教育和住房支持，并采取预防再发生措施；指示同时保留司法处理的可能。 [2023年总统承认与部门执行指示]\n国家保护证人和受害者机构（LPSK）2025年度报告于2026年2月发布，记载重大人权侵害案件中有1,521名受保护人，其中1,424人关联1965—1966年事件。报告按服务项目另列医疗、心理社会、丧葬和心理援助。国家人权委员会2024年签发受害者身份确认书，属于另一项行政程序。 [受害者身份确认与行政服务数据]","legacy_url":"../people-events-reference-1830-2026.html#event-recognition"},{"id":"event-election-2024","title":"2024年：工党参加全国选举","description":"改革后成立的工党（Partai Buruh）由工会、农民组织、劳动者团体和其他社会组织联合组建，参加2024年众议院（DPR）选举。印度尼西亚选举委员会（KPU）第1204号决定记载，工党获得972,898张全国有效票，占约0.64%，未达到4%的议席门槛，没有取得众议院席位。 [2024年工党选举结果]","legacy_url":"../people-events-reference-1830-2026.html#event-election-2024"},{"id":"event-marsinah-suharto-heroes","title":"2025—2026年：国家英雄授勋与公共记忆","description":"2025年11月10日，政府向十人追授国家英雄称号，其中包括前总统苏哈托、工人活动者马西娜和萨尔沃·埃迪。总统令第116/TK/2025号于11月6日签署；政府把苏哈托列入“斗争事业”类别，把马西娜列入“社会与人道主义斗争”类别，把萨尔沃·埃迪列入“武装斗争”类别。国家妇女委员会同日表示，授予苏哈托称号可能伤害人权侵害受害者和印度尼西亚妇女运动；这一评价与政府授勋说明并列，显示国家纪念叙事仍有公开争议。 [2025年国家英雄授勋与公共回应]\n2026年11月10日，政府再向19人授予国家英雄称号，其中包括曾任印马对抗时期国防参谋长的 马拉登·庞加贝安 和泗水战役指挥者 苏恩科诺 。官方授勋把不同年代的军政人物纳入同一国家纪念体系。 [2026年国家英雄授勋]","legacy_url":"../people-events-reference-1830-2026.html#event-marsinah-suharto-heroes"},{"id":"event-criminal-code-2026","title":"2026年：新刑法生效","description":"2023年第1号《刑法典》于2026年1月2日生效。第188条规定，公开传播或发展共产主义、马克思列宁主义及其他被认定与潘查希拉相冲突的思想可处刑罚，同条明确将科学研究排除在处罚之外。第189条规定，以传播上述思想为宗旨建立组织，以及为改变国家基础或推翻政府而同相关组织联系、提供或接受援助的刑罚。 [2026年《刑法典》第188—189条]","legacy_url":"../people-events-reference-1830-2026.html#event-criminal-code-2026"},{"id":"event-victim-protection-2026","title":"2026年：证人和受害者保护法更新","description":"2026年5月20日，第3号《证人和受害者保护法》生效，取代2006年第13号法及其2014年修正案。新法把证人、受害者、作为证人的犯罪参与者、举报人、线人和专家纳入保护范围，并规定受害者长期基金、返还、赔偿及中央和地方政府职责。 [2026年证人和受害者保护法]","legacy_url":"../people-events-reference-1830-2026.html#event-victim-protection-2026"}]);

</script>
